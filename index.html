// Construit le contenu du mode Réalisation Par VIN.
function renderByVinV5(active) {
  if (!active.some(vehicle => vehicle.id === state.realVin)) state.realVin = active[0].id;
  if (!state.realPerson && state.people[0]) state.realPerson = personName(state.people[0]);
  state.realFilter = state.realFilter || 'Tous';
  const vehicleOptions = active.map(vehicle => `<option value="${vehicle.id}" ${state.realVin === vehicle.id ? 'selected' : ''}>${escHtml(vehicle.vin)} • ${escHtml(vehicle.brand || '')}</option>`).join('');
  const personOptions = state.people.map(person => `<option ${state.realPerson === personName(person) ? 'selected' : ''}>${escHtml(personName(person))}</option>`).join('');
  const filters = ['Tous', 'En cours', 'Fabrication', 'Prémontage', 'Pose', 'Essais', 'Autre', 'Bloqué'];

    <label>Filtre <select id="realFilter" onchange="state.realFilter=this.value;save()">${filterOptions}</select></label>
  </div></div><br>${realVinTableV5(vehicle, list)}`;
}

function renderByOFV5() {

    <label>Afficher <select id="ofStatusV5" onchange="renderOFListV5()"><option ${state.ofStatusV5 === 'À valider' ? 'selected' : ''}>À valider</option><option ${state.ofStatusV5 === 'Tous' ? 'selected' : ''}>Tous</option><option ${state.ofStatusV5 === 'En cours' ? 'selected' : ''}>En cours</option><option ${state.ofStatusV5 === 'Terminés' ? 'selected' : ''}>Terminés</option></select></label>
  </div></div><br><div id="ofListV5"></div>`;
}

// Affiche la page Réalisation dans le mode sélectionné par l'utilisateur.
function real() {
  normalizeAll();
  setHead('Réalisation');

  const active = activeNormalVehicles();
  const activeSAV = activeVehicles().filter(vehicle => isSAV(vehicle) && !vehicle.savDone);

  if (!active.length && !activeSAV.length) {
    document.getElementById('view').innerHTML = '<div class="card">Aucun véhicule ou SAV actif à réaliser.</div>';
    return;
  }

  state.realModeV3 = state.realModeV3 || (active.length ? 'of' : 'sav');

  if (!active.length && (state.realModeV3 === 'of' || state.realModeV3 === 'vin')) {
    state.realModeV3 = 'sav';
  }

  const tabs = `<div class="realModeTabs" style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
    <button class="${state.realModeV3 === 'vin' ? 'active' : ''}" onclick="setRealModeV5('vin')" ${!active.length ? 'disabled' : ''}>Par VIN</button>
    <button class="${state.realModeV3 === 'of' ? 'active' : ''}" onclick="setRealModeV5('of')" ${!active.length ? 'disabled' : ''}>Par OF</button>
    <button class="${state.realModeV3 === 'sav' ? 'active' : ''}" onclick="setRealModeV5('sav')">SAV (${activeSAV.length})</button>
  </div>`;

  let content = '';
  if (state.realModeV3 === 'sav') content = renderSAVRealizationV1114();
  else if (state.realModeV3 === 'of') content = renderByOFV5();
  else content = renderByVinV5(active);

  document.getElementById('view').innerHTML = tabs + content;

  if (state.realModeV3 === 'of') renderOFListV5();
}

// Retourne le groupe Par OF actuellement ouvert dans la fenêtre de validation multiple.
function currentBulkGroupV5() {
  return groupedOFsV5().find(group => group.key === window._bulkV5Key);
}

// Retourne tous les VIN qui contiennent l'OF sélectionné pour la validation multiple.
function rowsBulkV5(key) {
  return activeNormalVehicles().map(vehicle => ({ vehicle, of: ofForVehicleV5(vehicle, key) })).filter(item => item.of);
}

// Génère un bouton VIN dans la fenêtre de validation multiple avec son avancement quantité.
function vinButtonV5(vehicle, of) {
  normalizeQtyOFV5(of);
  const total = qtyTotalV5(of), done = qtyDoneV5(of), remaining = total - done;
  const session = activeWorkSessionV1111(of);
  const complete = remaining === 0, blocked = of.status === 'Bloqué', selected = window._bulkV5Selected?.has(vehicle.id);
  const percent = total ? Math.round(done / total * 100) : 0;
  const info = complete
    ? `✓ Terminé ${done}/${total}`
    : blocked
      ? `Bloqué • ${done}/${total} • ${of.blockReason || ''}`
      : session
        ? `En cours par ${session.person} depuis ${workStartTimeLabelV1111(session.startedAt)}`
        : `${done}/${total} faits • ${remaining} restant${remaining > 1 ? 's' : ''}`;
  return `<button type="button" class="vinChoiceV3 ${complete ? 'done' : ''} ${blocked ? 'blocked' : ''} ${session ? 'blocked' : ''} ${selected ? 'selected' : ''}" ${complete || session ? 'disabled' : ''} onclick="toggleBulkVinV5('${vehicle.id}')"><b>${complete ? '✓ ' : selected ? '✓ ' : ''}${escHtml(vehicle.vin)}</b><small style="margin-left:8px">${escHtml(info)}</small><div class="progress" style="height:4px;margin-top:5px"><div class="bar" style="width:${percent}%"></div></div></button>`;
}

// Rafraîchit la grille des VIN et le compteur dans la fenêtre de validation multiple.
function refreshBulkV5() {
  const group = currentBulkGroupV5();
  if (!group) return;
  const rows = rowsBulkV5(group.key);
  const box = document.getElementById('vinChoiceGridV5');
  if (box) box.innerHTML = rows.map(item => vinButtonV5(item.vehicle, item.of)).join('');
  const count = window._bulkV5Selected?.size || 0;
  const amount = Math.max(1, Math.floor(Number(document.getElementById('bulkQtyAmountV5')?.value) || 1));
  const countElement = document.getElementById('bulkCountV5');
  const button = document.getElementById('bulkValidateV5');
  if (countElement) countElement.textContent = count + ' VIN sélectionné' + (count > 1 ? 's' : '');
  if (button) button.textContent = `✅ Valider +${amount} sur ${count} VIN${count > 1 ? 's' : ''}`;
}

// Sélectionne ou désélectionne un VIN dans la fenêtre de validation multiple.
function toggleBulkVinV5(id) {
  window._bulkV5Selected = window._bulkV5Selected || new Set();
  if (window._bulkV5Selected.has(id)) window._bulkV5Selected.delete(id);
  else window._bulkV5Selected.add(id);
  refreshBulkV5();
}

// Applique une sélection rapide à la fenêtre de validation multiple : tous, à faire uniquement ou aucun.
function bulkSelectModeV5(mode) {
  const group = currentBulkGroupV5();
  if (!group) return;
  const selected = new Set();
  if (mode !== 'none') {
    rowsBulkV5(group.key).forEach(({ vehicle, of }) => {
      if (qtyRemainingV5(of) <= 0) return;
      if (activeWorkSessionV1111(of)) return;
      if (mode === 'todo' && of.status === 'Bloqué') return;
      selected.add(vehicle.id);
    });
  }
  window._bulkV5Selected = selected;
  refreshBulkV5();
}

// Ouvre la fenêtre permettant de valider une même quantité d'un OF sur plusieurs VIN.
function openBulkOFV5(encodedKey) {
  let key;
  try { key = decodeURIComponent(encodedKey); } catch (e) { key = encodedKey; }
  window._bulkV5Key = key;
  window._bulkV5Selected = new Set();
  const group = currentBulkGroupV5();
  if (!group) return;
  if (!state.realPerson && state.people[0]) state.realPerson = personName(state.people[0]);
  const peopleOptions = (state.people || []).map(person => `<option value="${escHtml(personName(person))}" ${state.realPerson === personName(person) ? 'selected' : ''}>${escHtml(personName(person))}</option>`).join('');
  openModal('Validation sur plusieurs VIN', `<div class="bulkSummaryV3"><h3>${escHtml(group.name)}</h3><div class="muted">${escHtml(group.desc || '')} • ${escHtml(group.category)} • ${fmt(group.time)} par réalisation</div><div class="muted" style="margin-top:6px"><b>${group.doneUnits}/${group.totalUnits} réalisations faites</b> • ${group.totalUnits - group.doneUnits} restantes • ${group.finishedVehicles}/${group.vehicles} VIN terminés</div></div>
    <div class="bulkToolsV3" style="display:flex;flex-wrap:wrap;gap:10px"><button class="small alt" onclick="bulkSelectModeV5('all')">Tout sélectionner</button><button class="small alt" onclick="bulkSelectModeV5('todo')">Sélectionner les À faire</button><button class="small alt" onclick="bulkSelectModeV5('none')">Tout enlever</button></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px"><label>Personne<select id="bulkPersonV5">${peopleOptions}</select></label><label>Quantité faite par VIN<input type="number" id="bulkQtyAmountV5" min="1" step="1" value="1" oninput="refreshBulkV5()"></label></div>
    <div id="vinChoiceGridV5" class="vinChoiceGridV3" style="display:flex;flex-wrap:wrap;gap:10px;margin:12px 0"></div>
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px"><span id="bulkCountV5" class="count">0 VIN sélectionné</span><button class="alt" style="margin-left:15px" onclick="closeModal()">Annuler</button><button id="bulkValidateV5" class="good" style="margin-left:10px" onclick="validateBulkV5()">✅ Valider +1 sur 0 VIN</button></div>`);
  refreshBulkV5();
}

// Valide réellement la quantité choisie sur tous les VIN sélectionnés et crée les événements d'avancement correspondants.
function validateBulkV5() {
  const group = currentBulkGroupV5();
  const ids = Array.from(window._bulkV5Selected || []);
  const person = document.getElementById('bulkPersonV5')?.value || state.realPerson || '';
  const amount = Math.max(1, Math.floor(Number(document.getElementById('bulkQtyAmountV5')?.value) || 1));
  if (!group) return;
  if (!ids.length) { alert('Sélectionne au moins un VIN.'); return; }
  if (!person) { alert('Choisis une personne.'); return; }
  if (!confirm(`Ajouter jusqu'à ${amount} réalisation${amount > 1 ? 's' : ''} de ${group.name} sur ${ids.length} VIN pour ${person} ?`)) return;
  let units = 0, vehicles = 0;
  ids.forEach(id => {
    const vehicle = state.vehicles.find(item => item.id === id);
    const of = vehicle ? ofForVehicleV5(vehicle, group.key) : null;
    if (!vehicle || !of || qtyRemainingV5(of) <= 0 || activeWorkSessionV1111(of)) return;
    const beforeSnapshot = progressSnapshot(vehicle);
    const before = qtyDoneV5(of);
    const after = Math.min(qtyTotalV5(of), before + amount);
    const added = after - before;
    if (!added) return;
    of.completedQty = after;
    of.doneBy = person;
    of.doneAt = new Date().toISOString();
    of.blockReason = '';
    delete of.blockDetailsV8;
    of.status = after >= qtyTotalV5(of) ? 'Fait' : 'À faire';
    units += added;
    vehicles++;
    logAction('OF fait (multi-VIN quantité)', vehicle, of, `+${added} • ${after}/${qtyTotalV5(of)} • ${person}`);
    recordProgressEvent(vehicle, of, added, person, 'realisation', 'Validation multi-VIN', beforeSnapshot);
  });
  state.realPerson = person;
  logAction('Validation multi-VIN quantité terminée', null, null, `${group.name} • ${units} réalisation(s) • ${vehicles} VIN • ${person}`);
  closeModal();
  state.realModeV3 = 'of';
  save();
}

// Génère le tableau complet des OF visible lorsqu'on ouvre un VIN.

  const rows = (vehicle.ofs || []).slice().sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
  return `<div class="tablewrap"><table><thead><tr><th>Ordre</th><th>OF</th><th>Description</th><th>Temps X1</th><th>Quantité</th><th>Réalisé</th><th>Statut</th><th>Fait par</th><th>Actions</th></tr></thead><tbody>${rows.map(of => {
    const total = qtyTotalV5(of), done = qtyDoneV5(of);
    const session = activeWorkSessionV1111(of);
    const worker = session
      ? `${session.person} (${session.pausedAt ? 'en pause' : 'en cours'})`
      : (of.doneBy || '-');

    const workButtons = session
      ? session.pausedAt

// Retourne le libellé français correspondant au type d'événement d'avancement.
function progressKindLabel(event) {
  if (event.kind === 'blocage') return 'Bloqué';
  if (event.kind === 'deblocage') return 'Débloqué';
  if (event.kind === 'correction') return 'Correction';
  if (event.kind === 'baseline') return 'Reprise historique';
  if (event.kind === 'start') return 'Début';
  if (event.kind === 'pause') return 'Pause';
  if (event.kind === 'resume') return 'Reprise';
  if (event.kind === 'finish') return 'Terminé';
  if (event.kind === 'cancel') return 'Démarrage annulé';
  return 'Réalisation';
}

// Formate la date et l'heure d'un événement d'avancement.
function fmtProgressDate(value) {
  const date = new Date(value);
  return date.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// Retourne le pourcentage d'un événement pour le mode de courbe choisi.
function progressMetric(event, mode) {
  return mode === 'Global' ? Number(event.progress?.global) || 0 : Number(event.progress?.[mode]) || 0;
}

// Génère un graphique SVG simple de l'évolution du pourcentage dans le temps.
function timelineChartSvg(vehicle, mode) {
  const events = vehicleProgressEvents(vehicle.id);
  if (!events.length) return '<div class="card">Pas encore d’événement d’avancement pour ce véhicule.</div>';
  const width = 900, height = 260, left = 46, right = 18, top = 18, bottom = 42;
  const plotW = width - left - right, plotH = height - top - bottom;
  const points = events.map((event, index) => {
    const x = events.length === 1 ? left + plotW / 2 : left + (index / (events.length - 1)) * plotW;
    const y = top + plotH - progressMetric(event, mode) / 100 * plotH;
    return { x, y, event };
  });
  const polyline = points.map(point => `${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(' ');
  const grid = [0, 25, 50, 75, 100].map(value => {
    const y = top + plotH - value / 100 * plotH;
    return `<line x1="${left}" y1="${y}" x2="${left + plotW}" y2="${y}" stroke="#284262" stroke-width="1"/><text x="8" y="${y + 4}" fill="#9cb2d1" font-size="11">${value}%</text>`;
  }).join('');
  const dots = points.map(point => `<circle cx="${point.x}" cy="${point.y}" r="4" fill="#38bdf8"><title>${escHtml(fmtProgressDate(point.event.at))} • ${progressMetric(point.event, mode)}%</title></circle>`).join('');
  return `<div style="overflow:auto"><svg viewBox="0 0 ${width} ${height}" style="min-width:760px;width:100%;background:#081830;border:1px solid var(--line);border-radius:14px">${grid}<polyline points="${polyline}" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg></div>`;
}

// Résume le nombre de réalisations enregistrées par personne sur un véhicule.
function timelinePeopleSummary(vehicle) {
  const counts = new Map();
  vehicleProgressEvents(vehicle.id).forEach(event => {
    if (!event.person || event.qtyDelta <= 0) return;
    counts.set(event.person, (counts.get(event.person) || 0) + event.qtyDelta);
  });
  if (!counts.size) return '<span class="muted">Aucune réalisation détaillée enregistrée.</span>';
  return Array.from(counts.entries()).sort((a, b) => b[1] - a[1]).map(([person, quantity]) => `<span class="pill" style="margin:3px">${escHtml(person)} • ${quantity} réalisation${quantity > 1 ? 's' : ''}</span>`).join('');
}

// Génère le tableau détaillé de tous les événements d'avancement d'un véhicule.
function timelineHistoryTable(vehicle) {
  const events = vehicleProgressEvents(vehicle.id).slice().reverse();
  if (!events.length) return '<div class="muted">Aucun événement.</div>';
  return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>OF</th><th>Personne</th><th>Variation</th><th>Après</th><th>Détail</th></tr></thead><tbody>${events.map(event => `<tr><td>${escHtml(fmtProgressDate(event.at))}</td><td>${escHtml(progressKindLabel(event))}</td><td><b>${escHtml(event.ofName || '-')}</b><div class="muted">${escHtml(event.category || '')}</div></td><td>${escHtml(event.person || '-')}</td><td><b>${event.qtyDelta > 0 ? '+' : ''}${event.qtyDelta || 0}</b></td><td>${event.qtyTotal ? `${event.qtyAfter}/${event.qtyTotal}` : '-'}</td><td class="desc">${escHtml(event.note || '')}</td></tr>`).join('')}</tbody></table></div>`;
}

// Nettoie une clé de colonne Excel pour permettre plusieurs variantes d'orthographe et d'accents.
function cleanKey(key) {
  return String(key || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

// Récupère une valeur dans une ligne Excel en acceptant plusieurs noms possibles pour la même colonne.
function val(row, names) {
  const wanted = names.map(cleanKey);
  for (const key of Object.keys(row)) {
    if (wanted.includes(cleanKey(key))) return row[key];
  }
  return '';
}

// Convertit une valeur Excel en nombre en acceptant la virgule française.
function parseNum(value) {
  if (value === undefined || value === null || value === '') return 0;
  return Number(String(value).replace(',', '.').replace(/[^0-9.\-]/g, '')) || 0;
}

// Normalise le nom de phase lu dans un fichier Excel.
function normalizeCat(category) {
  const value = String(category || 'Autre').trim();
  const lower = value.toLowerCase();
  if (!value) return 'Autre';
  if (lower.includes('fabric')) return 'Fabrication';
  if (lower.includes('prem') || lower.includes('pré')) return 'Prémontage';
  if (lower.includes('pose')) return 'Pose';
  if (lower.includes('essai') || lower.includes('debug')) return 'Essais';
  return value;
}

// Attribue automatiquement une priorité d'OF cohérente avec sa phase.
function catPriority(category) {
  const value = String(category || 'Autre').toLowerCase();
  if (value.includes('fabric')) return 1;
  if (value.includes('prem') || value.includes('pré')) return 2;
  if (value.includes('pose')) return 3;
  if (value.includes('essai') || value.includes('debug')) return 4;
  return 5;
}

// Lit la première feuille d'un fichier Excel et la transforme en base OF avec quantité et règles d'options.
async function readExcelFile(file) {
  if (!file) return [];
  if (!window.XLSX) throw new Error('La lecture Excel nécessite SheetJS et une connexion Internet au moment du chargement de la bibliothèque.');
  const data = await file.arrayBuffer();
  const workbook = XLSX.read(data, { type: 'array' });
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
  return rows.map((row, index) => {
    const order = parseNum(val(row, ['Ordre', 'Order']));
    const name = String(val(row, ['Nom', 'N°OF', 'N OF', 'OF', 'N°DESSIN', 'N DESSIN']) || '').trim();
    const desc = String(val(row, ['Description', 'Desc']) || '').trim();
    const time = parseNum(val(row, ['Temps X1', 'Temps', 'Temps unitaire', 'Temps X 1']));
    const quantity = Math.max(1, Math.floor(parseNum(val(row, ['Quantité', 'Quantite', 'Qté', 'Qte', 'Qty'])) || 1));
    const category = normalizeCat(val(row, ['Filtre', 'Catégorie', 'Categorie', 'Phase']));
    const optionRaw = String(val(row, ['Options', 'Option']) || '').trim();
    const rule = String(val(row, ['Règle option', 'Regle option', 'Règle', 'Regle']) || '').trim();
    if (!name && !desc) return null;
    const of = {
      id: name || ('OF-' + (index + 1)), order: order || index + 1, name: name || ('OF-' + (index + 1)),
      desc, time, quantity, category, priority: catPriority(category), option: ''
    };
    if (optionRaw.toUpperCase().startsWith('OPTION')) of.option = optionRaw.toUpperCase();
    if (rule.toUpperCase().includes('SUPPRIMER SI')) {
      const match = rule.toUpperCase().match(/OPTION\s+.+/);
      of.removeIfOption = match ? match[0].trim() : rule.toUpperCase().replace('SUPPRIMER SI', '').trim();
    } else if (optionRaw.toUpperCase().includes('SUPPRIMER SI')) {
      const match = optionRaw.toUpperCase().match(/OPTION\s+.+/);
      of.removeIfOption = match ? match[0].trim() : optionRaw.toUpperCase().replace('SUPPRIMER SI', '').trim();
      of.option = '';
    }
    return of;
  }).filter(Boolean).sort((a, b) => a.order - b.order);
}

// Lit la feuille PIECES_OF d'un fichier Excel et retourne les références de pièces associées à chaque OF.
async function readPartsSheet(file) {
  if (!file || !window.XLSX) return [];
  const data = await file.arrayBuffer();
  const workbook = XLSX.read(data, { type: 'array' });
  const sheetName = workbook.SheetNames.find(name => cleanKey(name) === cleanKey('PIECES_OF'));
  if (!sheetName) return [];
  const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: '' });
  return rows.map(row => {
    const of = String(val(row, ['OF', 'Nom OF', 'N°OF', 'N OF']) || '').trim();
    const ref = String(val(row, ['Référence pièce', 'Reference piece', 'Référence', 'Reference', 'Ref', 'Code pièce', 'Code piece']) || '').trim();
    const name = String(val(row, ['Désignation', 'Designation', 'Pièce', 'Piece', 'Nom pièce', 'Nom piece']) || '').trim();
    const quantity = Math.max(1, Math.floor(parseNum(val(row, ['Quantité par OF', 'Quantite par OF', 'Quantité', 'Quantite', 'Qté', 'Qte', 'Qty'])) || 1));
    const comment = String(val(row, ['Commentaire', 'Comment', 'Note']) || '').trim();
    if (!of || (!ref && !name)) return null;
    return { of, ref, name, quantity, comment };
  }).filter(Boolean);
}

// Importe pour une marque la base OF et son catalogue de pièces depuis un seul fichier Excel.
async function importBrandFile(brand, file) {
  if (!file) return null;
  const ofs = await readExcelFile(file);
  const parts = await readPartsSheet(file);
  if (!ofs.length) throw new Error('Aucun OF trouvé dans ' + file.name);
  state.customTemplates[brand] = ofs;
  state.partsCatalogV8[brand] = parts;
  return { brand, ofs: ofs.length, parts: parts.length };
}

// Retourne les pièces associées à un OF pour une marque donnée.
function partsForOF(brand, ofName) {
  const key = String(ofName || '').trim().toUpperCase();
  return ((state.partsCatalogV8 || {})[brand] || []).filter(part => String(part.of || '').trim().toUpperCase() === key);
}

    alert('Import impossible : ' + e.message);
  }
}

// Retourne l'union des pièces disponibles pour un même OF présent sur plusieurs marques ou VIN.
function partsUnion(rows) {
  const map = new Map();
  rows.forEach(({ vehicle, of }) => partsForOF(vehicle.brand, of.name).forEach(part => {
    const key = String(part.ref || '').trim().toUpperCase() + '|||' + String(part.name || '').trim().toUpperCase();
    if (!map.has(key)) map.set(key, part);
  }));
  return Array.from(map.values());
}

// Construit le texte de raison de blocage à partir d'une pièce manquante ou d'un commentaire libre.
function blockReasonText(mode, part, missingQuantity, comment) {
  if (mode === 'piece' && part) {
    let text = `Pièce manquante : ${[part.ref, part.name].filter(Boolean).join(' — ')} • Qté manquante ${missingQuantity}`;
    if (comment) text += ' • ' + comment;
    return text;
  }
  return comment;
}

// Construit les données structurées du blocage pour conserver la référence et la quantité manquante.
function blockDetails(mode, part, missingQuantity, comment) {
  if (mode === 'piece' && part) {
    return {
      type: 'piece', partRef: part.ref || '', partName: part.name || '',
      partQtyPerOF: Math.max(1, Number(part.quantity) || 1),
      missingQty: Math.max(1, Math.floor(Number(missingQuantity) || 1)), comment: comment || ''
    };
  }
  return { type: 'other', comment: comment || '' };
}

// Génère la liste des pièces sélectionnables pour bloquer plusieurs références sur un même OF.
function singleBlockPartsHtml(parts) {
  if (!parts.length) return '<div class="muted">Aucune pièce renseignée pour cet OF.</div>';
  return `<div class="singlePartsList">${parts.map((part, index) => {
    const quantity = Math.max(1, Number(part.quantity) || 1);
    return `<div class="singlePartRow" id="singlePartRow_${index}">
      <input class="singlePartCheck" type="checkbox" id="blockPartCheck_${index}" onchange="refreshSingleBlockPartRow(${index})">
      <label for="blockPartCheck_${index}" class="singlePartMain" style="display:block;cursor:pointer">
        <b>${escHtml(part.ref || '-')}</b> — ${escHtml(part.name || '-')}
        <div class="muted" style="margin-top:4px">Qté / OF : ${quantity}${part.comment ? ' • ' + escHtml(part.comment) : ''}</div>
      </label>
      <label class="singlePartQtyBox">Qté manquante
        <input type="number" min="1" step="1" id="blockPartQty_${index}" value="${quantity}" disabled>
      </label>
    </div>`;
  }).join('')}</div>`;
}

// Active ou désactive la quantité d'une pièce selon que sa case est cochée et met la ligne en évidence.
function refreshSingleBlockPartRow(index) {
  const checked = !!document.getElementById('blockPartCheck_' + index)?.checked;
  const quantity = document.getElementById('blockPartQty_' + index);
  const row = document.getElementById('singlePartRow_' + index);
  if (quantity) quantity.disabled = !checked;
  if (row) row.classList.toggle('selected', checked);
}

// Retourne toutes les pièces cochées dans le blocage individuel avec une quantité propre à chaque référence.
function selectedSingleBlockParts() {
  const parts = window._singleBlock?.parts || [];
  return parts.map((part, index) => {
    const checked = !!document.getElementById('blockPartCheck_' + index)?.checked;
    if (!checked) return null;
    const missingQty = Math.max(1, Math.floor(Number(document.getElementById('blockPartQty_' + index)?.value) || 1));
    return { part, missingQty };
  }).filter(Boolean);
}

// Construit le texte lisible d'un blocage contenant plusieurs pièces manquantes.
function multiPartsBlockReason(selectedParts, comment) {
  let text = 'Pièces manquantes : ' + selectedParts.map(item => {
    const label = [item.part.ref, item.part.name].filter(Boolean).join(' — ');
    return `${label} • Qté manquante ${item.missingQty}`;
  }).join(' | ');
  if (comment) text += ' • ' + comment;
  return text;
}

// Construit les données structurées d'un blocage multi-pièces tout en gardant les anciens champs de compatibilité.
function multiPartsBlockDetails(selectedParts, comment) {
  const rows = selectedParts.map(item => ({
    partRef: item.part.ref || '',
    partName: item.part.name || '',
    partQtyPerOF: Math.max(1, Number(item.part.quantity) || 1),
    missingQty: Math.max(1, Math.floor(Number(item.missingQty) || 1))
  }));
  const first = rows[0] || {};
  return {
    type: rows.length > 1 ? 'pieces' : 'piece',
    parts: rows,
    partRef: first.partRef || '',
    partName: first.partName || '',
    partQtyPerOF: first.partQtyPerOF || 1,
    missingQty: first.missingQty || 1,
    comment: comment || ''
  };
}

// Ouvre la fenêtre de blocage d'un seul OF et permet de sélectionner une ou plusieurs pièces manquantes.
function blockOF(vehicleId, ofId, backToReal = false) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  const of = vehicle?.ofs.find(item => item.id === ofId);
  if (!vehicle || !of) return;
  if (backToReal && !state.realPerson) { alert('Choisis une personne avant de bloquer l’OF.'); return; }
  const parts = partsForOF(vehicle.brand, of.name);
  const peopleOptions = (state.people || []).map(person => {
    const name = personName(person);
    return `<option value="${escHtml(name)}" ${state.realPerson === name ? 'selected' : ''}>${escHtml(name)}</option>`;
  }).join('');
  window._singleBlock = { vehicleId, ofId, parts, backToReal };
  openModal('Bloquer OF — ' + of.name, `<div class="blockFormV9">
    <div class="full"><h3>${escHtml(vehicle.vin)} • ${escHtml(of.name)}</h3><div class="muted">${escHtml(of.desc || '')} • ${qtyDoneV5(of)}/${qtyTotalV5(of)} réalisé(s)</div>${piecesPreview(parts)}</div>
    <label>Personne<select id="blockPerson">${peopleOptions}</select></label>
    <label>Motif<select id="blockMode"><option value="piece" ${parts.length ? '' : 'disabled'}>Pièce manquante</option><option value="other" ${parts.length ? '' : 'selected'}>Autre motif</option></select></label>
    <div id="blockPartsMulti" class="full">
      <b>Pièces manquantes</b>
      <div class="muted" style="margin:5px 0 8px">Coche une ou plusieurs références et indique la quantité manquante pour chacune.</div>
      ${singleBlockPartsHtml(parts)}
    </div>
    <label class="full">Commentaire<textarea id="blockComment" placeholder="Ex : attente magasin, commande fournisseur, autre précision..."></textarea></label>
    <div class="full actions" style="margin-top:18px"><button class="alt" onclick="closeModal()">Annuler</button><button class="bad" onclick="confirmSingleBlock()">⛔ Bloquer l’OF</button></div>
  </div>`);
  const mode = document.getElementById('blockMode');
  const refreshMode = () => {
    const partMode = mode?.value === 'piece';
    const box = document.getElementById('blockPartsMulti');
    if (box) box.style.display = partMode ? 'block' : 'none';
  };
  mode?.addEventListener('change', refreshMode);
  refreshMode();
}

// Valide le blocage d'un OF avec une ou plusieurs pièces manquantes, ou avec un motif libre.
function confirmSingleBlock() {
  const context = window._singleBlock;
  const vehicle = state.vehicles.find(item => item.id === context?.vehicleId);
  const of = vehicle?.ofs.find(item => item.id === context?.ofId);
  if (!vehicle || !of) return;
  const person = document.getElementById('blockPerson')?.value || state.realPerson || '';
  const mode = document.getElementById('blockMode')?.value || 'other';
  const comment = (document.getElementById('blockComment')?.value || '').trim();
  const selectedParts = mode === 'piece' ? selectedSingleBlockParts() : [];
  if (!person) { alert('Choisis une personne.'); return; }
  if (mode === 'piece' && !selectedParts.length) { alert('Coche au moins une pièce manquante.'); return; }
  if (mode === 'other' && !comment) { alert('Écris le motif du blocage.'); return; }
  const beforeSnapshot = progressSnapshot(vehicle);
  const activeSession = activeWorkSessionV1111(of);
  const reason = mode === 'piece' ? multiPartsBlockReason(selectedParts, comment) : comment;
  if (activeSession) delete of.workSessionV1111;
  of.status = 'Bloqué';
  of.blockReason = reason;
  of.blockDetailsV8 = mode === 'piece' ? multiPartsBlockDetails(selectedParts, comment) : { type: 'other', comment };
  of.doneBy = person;
  of.doneAt = new Date().toISOString();
  state.realPerson = person;
  logAction('OF bloqué', vehicle, of, reason);
  recordProgressEvent(vehicle, of, 0, person, 'blocage', reason, beforeSnapshot);
  closeModal();
  save();
  if (context.backToReal) real();
}

// Retourne les VIN contenant l'OF actuellement sélectionné dans la fenêtre de blocage multiple.
function bulkBlockRows() {
  const key = window._bulkBlockKey;
  return activeNormalVehicles().map(vehicle => ({ vehicle, of: ofForVehicleV5(vehicle, key) })).filter(item => item.of);
}

// Génère un bouton VIN dans la fenêtre de blocage multiple.
function bulkBlockVinButton(vehicle, of) {
  const remaining = qtyRemainingV5(of), done = qtyDoneV5(of), total = qtyTotalV5(of);
  const complete = remaining === 0, blocked = of.status === 'Bloqué', selected = window._bulkBlockSelected?.has(vehicle.id);
  const selectable = !complete && !blocked;
  const info = complete ? `✓ Terminé ${done}/${total}` : blocked ? `Déjà bloqué • ${of.blockReason || 'sans raison'}` : `${done}/${total} faits • ${remaining} restant${remaining > 1 ? 's' : ''}`;
  return `<button type="button" class="vinBlockChoiceV7 ${complete ? 'done' : ''} ${blocked ? 'blocked' : ''} ${selected ? 'selected' : ''}" ${selectable ? '' : 'disabled'} onclick="toggleBulkBlockVin('${vehicle.id}')"><b>${selected ? '✓ ' : ''}${escHtml(vehicle.vin)}</b><small style="margin-left:8px">${escHtml(info)}</small></button>`;
}

// Rafraîchit la grille et le compteur de la fenêtre de blocage multiple.
function refreshBulkBlock() {
  const box = document.getElementById('vinBlockGridV9');
  if (box) box.innerHTML = bulkBlockRows().map(item => bulkBlockVinButton(item.vehicle, item.of)).join('');
  const count = window._bulkBlockSelected?.size || 0;
  const label = document.getElementById('bulkCountV9');
  const button = document.getElementById('bulkValidateV9');
  if (label) label.textContent = `${count} VIN sélectionné${count > 1 ? 's' : ''}`;
  if (button) {
    button.textContent = `⛔ Bloquer ${count} VIN`;
    button.disabled = count === 0;
  }
}

// Sélectionne ou désélectionne un VIN dans la fenêtre de blocage multiple.
function toggleBulkBlockVin(id) {
  const row = bulkBlockRows().find(item => item.vehicle.id === id);
  if (!row || qtyRemainingV5(row.of) <= 0 || row.of.status === 'Bloqué') return;
  window._bulkBlockSelected = window._bulkBlockSelected || new Set();
  if (window._bulkBlockSelected.has(id)) window._bulkBlockSelected.delete(id);
  else window._bulkBlockSelected.add(id);
  refreshBulkBlock();
}

// Sélectionne tous les VIN disponibles ou vide complètement la sélection de blocage multiple.
function selectBulkBlock(all) {
  const selected = new Set();
  if (all) bulkBlockRows().forEach(item => {
    if (qtyRemainingV5(item.of) > 0 && item.of.status !== 'Bloqué') selected.add(item.vehicle.id);
  });
  window._bulkBlockSelected = selected;
  refreshBulkBlock();
}

// Ouvre la fenêtre permettant de bloquer un même OF sur plusieurs VIN.
function openBulkBlockV7(encodedKey) {
  let key;
  try { key = decodeURIComponent(encodedKey); } catch (e) { key = encodedKey; }
  window._bulkBlockKey = key;
  window._bulkBlockSelected = new Set();
  const rows = bulkBlockRows();

  const sample = rows[0].of;
  const parts = partsUnion(rows);
  window._bulkBlockParts = parts;
  if (!state.realPerson && state.people[0]) state.realPerson = personName(state.people[0]);
  const peopleOptions = (state.people || []).map(person => {
    const name = personName(person);
    return `<option value="${escHtml(name)}" ${state.realPerson === name ? 'selected' : ''}>${escHtml(name)}</option>`;
  }).join('');
  const blocked = rows.filter(item => item.of.status === 'Bloqué').length;
  const defaultQuantity = parts.length ? Math.max(1, Number(parts[0].quantity) || 1) : 1;
  openModal('Blocage sur plusieurs VIN', `<div class="bulkBlockLayoutV9">
    <div><h3>⛔ ${escHtml(sample.name)} — blocage groupé</h3><div class="muted">${escHtml(sample.desc || '')} • ${escHtml(sample.category || '')} • ${blocked} VIN déjà bloqué${blocked > 1 ? 's' : ''}</div>${piecesPreview(parts)}</div>
    <div class="bulkBlockFormV9" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
      <label>Personne<select id="bulkPersonV9">${peopleOptions}</select></label>
      <label>Motif<select id="bulkModeV9"><option value="piece" ${parts.length ? '' : 'disabled'}>Pièce manquante</option><option value="other" ${parts.length ? '' : 'selected'}>Autre motif</option></select></label>
      <label id="bulkPartLabelV9">Pièce manquante<select id="bulkPartV9">${partOptions(parts)}</select></label>
      <label id="bulkQtyLabelV9">Qté manquante / VIN<input type="number" min="1" step="1" id="bulkQtyV9" value="${defaultQuantity}"></label>
      <div id="bulkSelectedPartInfoV9" style="grid-column:1/-1">${selectedPartHtml(parts[0])}</div>
      <label style="grid-column:1/-1">Commentaire<textarea id="bulkCommentV9" placeholder="Ex : attente magasin, commande fournisseur, autre précision..."></textarea></label>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin:12px 0"><button class="small alt" onclick="selectBulkBlock(true)">Sélectionner tous les disponibles</button><button class="small alt" onclick="selectBulkBlock(false)">Tout enlever</button></div>
    <div id="vinBlockGridV9" style="display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 18px"></div>
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:12px"><span id="bulkCountV9">0 VIN sélectionné</span><button class="alt" style="margin-left:15px" onclick="closeModal()">Annuler</button><button id="bulkValidateV9" class="bad" style="margin-left:10px" onclick="validateBulkBlock()" disabled>⛔ Bloquer 0 VIN</button></div>
  </div>`);
  const mode = document.getElementById('bulkModeV9');
  const partSelect = document.getElementById('bulkPartV9');
  const refreshMode = () => {
    const show = mode?.value === 'piece';
    ['bulkPartLabelV9', 'bulkQtyLabelV9', 'bulkSelectedPartInfoV9'].forEach(id => {
      const element = document.getElementById(id);
      if (element) element.style.display = show ? 'grid' : 'none';
    });
  };
  mode?.addEventListener('change', refreshMode);
  partSelect?.addEventListener('change', () => {
    const part = parts[Number(partSelect.value || 0)];
    const quantity = document.getElementById('bulkQtyV9');
    const info = document.getElementById('bulkSelectedPartInfoV9');
    if (part && quantity) quantity.value = Math.max(1, Number(part.quantity) || 1);
    if (info) info.innerHTML = selectedPartHtml(part);
  });
  refreshMode();
  refreshBulkBlock();
}

// Applique le même blocage à tous les VIN sélectionnés dans la fenêtre de blocage multiple.
function validateBulkBlock() {
  const ids = Array.from(window._bulkBlockSelected || []);
  const person = document.getElementById('bulkPersonV9')?.value || state.realPerson || '';
  const mode = document.getElementById('bulkModeV9')?.value || 'other';
  const part = window._bulkBlockParts?.[Number(document.getElementById('bulkPartV9')?.value || 0)] || null;
  const missing = Math.max(1, Math.floor(Number(document.getElementById('bulkQtyV9')?.value) || 1));
  const comment = (document.getElementById('bulkCommentV9')?.value || '').trim();
  if (!ids.length) { alert('Sélectionne au moins un VIN.'); return; }
  if (!person) { alert('Choisis une personne.'); return; }
  if (mode === 'piece' && !part) { alert('Choisis la pièce manquante.'); return; }
  if (mode === 'other' && !comment) { alert('Écris le motif du blocage.'); return; }
  const reason = blockReasonText(mode, part, missing, comment);
  if (!confirm(`Bloquer cet OF sur ${ids.length} VIN ?\n\n${reason}`)) return;
  let count = 0;
  const now = new Date().toISOString();
  ids.forEach(id => {
    const vehicle = state.vehicles.find(item => item.id === id);
    const of = vehicle ? ofForVehicleV5(vehicle, window._bulkBlockKey) : null;
    if (!vehicle || !of || qtyRemainingV5(of) <= 0 || of.status === 'Bloqué') return;
    const beforeSnapshot = progressSnapshot(vehicle);
    if (activeWorkSessionV1111(of)) delete of.workSessionV1111;
    of.status = 'Bloqué';
    of.blockReason = reason;
    of.blockDetailsV8 = blockDetails(mode, part, missing, comment);
    of.doneBy = person;
    of.doneAt = now;
    logAction('OF bloqué (multi-VIN)', vehicle, of, reason + ' • ' + person);
    recordProgressEvent(vehicle, of, 0, person, 'blocage', reason, beforeSnapshot, now);
    count++;
  });
  state.realPerson = person;
  logAction('Blocage multi-VIN terminé', null, null, `${count} VIN • ${person} • ${reason}`);
  closeModal();
  state.realModeV3 = 'of';
  save();
}

// Regroupe les OF bloqués identiques afin de n'afficher qu'une seule ligne par OF dans la page OF bloqués.
function groupedBlockedOFs() {
  const groups = new Map();
  activeNormalVehicles().forEach(vehicle => (vehicle.ofs || []).forEach(of => {
    if (of.status !== 'Bloqué') return;
    const key = ofKeyV5(of);
    if (!groups.has(key)) {
      groups.set(key, {
        key,
        name: of.name || '-',
        category: of.category || '',
        desc: of.desc || '',
        order: Number(of.order) || 99999,
        items: []
      });
    }
    const group = groups.get(key);
    group.order = Math.min(group.order, Number(of.order) || 99999);
    group.items.push({ vehicle, of });
  }));

  return Array.from(groups.values()).map(group => {
    group.items.sort((a, b) => new Date(b.of.doneAt || 0) - new Date(a.of.doneAt || 0));
    group.latestDate = group.items[0]?.of?.doneAt || '';
    return group;
  }).sort((a, b) => new Date(b.latestDate || 0) - new Date(a.latestDate || 0));
}

// Ouvre ou referme le détail des VIN concernés par un même OF bloqué.
function toggleBlockedGroup(groupId) {
  const rows = Array.from(document.querySelectorAll(`[data-block-group="${groupId}"]`));
  if (!rows.length) return;
  const open = rows[0].style.display === 'none';
  rows.forEach(row => { row.style.display = open ? 'table-row' : 'none'; });
  const button = document.getElementById('btn_' + groupId);
  if (button) button.textContent = open ? `▲ Masquer (${rows.length})` : `▼ Afficher (${rows.length})`;
}

// Affiche les OF bloqués regroupés par OF ; un clic sur une ligne déroule les VIN bloqués correspondants.
function blockedPage() {
  setHead('OF bloqués');
  const groups = groupedBlockedOFs();
  if (!groups.length) {
    document.getElementById('view').innerHTML = '<div class="card">Aucun OF bloqué sur les véhicules actifs.</div>';
    return;
  }

  const body = groups.map((group, index) => {
    const groupId = 'blockedGroup_' + index;
    const latestDate = group.latestDate ? new Date(group.latestDate).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
    const reasons = [...new Set(group.items.map(item => item.of.blockReason || '-'))];
    const people = [...new Set(group.items.map(item => item.of.doneBy || '-'))];
    const reasonSummary = reasons.length === 1 ? reasons[0] : `${reasons.length} motifs différents`;
    const peopleSummary = people.length === 1 ? people[0] : `${people.length} personnes`;
    const order = group.order === 99999 ? '-' : group.order;

    const summary = `<tr class="blockedGroupSummary" onclick="toggleBlockedGroup('${groupId}')">
      <td><b>${escHtml(latestDate)}</b><div class="muted">dernier blocage</div></td>
      <td><span class="pill blocked">${group.items.length} VIN</span></td>
      <td><b>${order}</b></td>
      <td><b>${escHtml(group.name)}</b><div class="muted">${escHtml(group.category)}</div></td>
      <td class="desc">${escHtml(group.desc)}</td>
      <td><b>${group.items.length} OF bloqué${group.items.length > 1 ? 's' : ''}</b><div class="muted">Cliquer pour voir les VIN</div></td>
      <td><span class="pill blocked">Bloqué</span><div class="blockedtxt">${escHtml(reasonSummary)}</div></td>
      <td><b>${escHtml(peopleSummary)}</b></td>
      <td class="actions"><button id="btn_${groupId}" class="small alt" onclick="event.stopPropagation();toggleBlockedGroup('${groupId}')">▼ Afficher (${group.items.length})</button></td>
    </tr>`;

    const details = group.items.map(({ vehicle, of }) => {
      const date = of.doneAt ? new Date(of.doneAt).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
      return `<tr class="blockedrow blockedGroupDetail" data-block-group="${groupId}" style="display:none">
        <td><b>${escHtml(date)}</b></td>
        <td><b>${escHtml(vehicle.vin)}</b></td>
        <td><b>${of.order || '-'}</b></td>
        <td><b>${escHtml(of.name)}</b><div class="muted">${escHtml(of.category || '')}</div></td>
        <td class="desc">${escHtml(of.desc || '')}</td>
        <td>${qtyVisualV5(of)}</td>
        <td><span class="pill blocked">Bloqué</span><div class="blockedtxt">${escHtml(of.blockReason || '-')}</div></td>
        <td><b>${escHtml(of.doneBy || '-')}</b></td>
        <td class="actions"><button class="small good" onclick="unblockOF('${vehicle.id}','${of.id}')">Débloquer</button></td>
      </tr>`;
    }).join('');

    return summary + details;
  }).join('');

  document.getElementById('view').innerHTML = `<div class="card" style="margin-bottom:14px"><b>${groups.length} OF bloqué${groups.length > 1 ? 's' : ''} différent${groups.length > 1 ? 's' : ''}</b><div class="muted" style="margin-top:5px">Les mêmes OF bloqués sur plusieurs camions sont regroupés. Clique sur une ligne ou sur Afficher pour voir les VIN concernés.</div></div><div class="tablewrap"><table><thead><tr><th>Dernier blocage</th><th>VIN concernés</th><th>Ordre</th><th>OF</th><th>Description</th><th>Blocages</th><th>Blocage / raison</th><th>Personne</th><th>Action</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

// Débloque un OF et le remet à faire sans modifier la quantité déjà réalisée.
function unblockOF(vehicleId, ofId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  const of = vehicle?.ofs.find(item => item.id === ofId);
  if (!vehicle || !of || !confirm('Débloquer cet OF et le remettre à faire ?')) return;
  const beforeSnapshot = progressSnapshot(vehicle);
  of.status = qtyDoneV5(of) >= qtyTotalV5(of) ? 'Fait' : 'À faire';
  of.blockReason = '';
  delete of.blockDetailsV8;
  of.doneAt = '';
  if (of.status !== 'Fait') of.doneBy = '';
  logAction('OF débloqué', vehicle, of, '');
  recordProgressEvent(vehicle, of, 0, state.realPerson || '', 'deblocage', 'OF débloqué', beforeSnapshot);
  save();
  page = 'blocked';
  render();
}

// Retourne le filtre d'archives actuellement sélectionné ou Tous par défaut.
function archiveFilterValue() {
  state.archiveFilter = state.archiveFilter || 'Tous';

}

// Génère les boutons Tous / Camions / SAV dans la page Archives.
function archiveFilterButtons() {
  const current = archiveFilterValue();

// Retourne les éléments archivés correspondant au filtre Tous / Camions / SAV.

}

}

// Archive un véhicule ou un SAV et le retire du tableau de bord principal.
function archiveVehicle(id) {
  const vehicle = state.vehicles.find(item => item.id === id);
  if (!vehicle) return;
  const message = isSAV(vehicle)
    ? 'Archiver ce SAV ? Il restera visible dans Archives avec le filtre SAV.'
    : remain(vehicle) > 0
      ? `Ce véhicule n’est pas terminé à 100% (${pct(vehicle)}%). L’archiver quand même ?`
      : 'Archiver ce véhicule terminé ?';
  if (!confirm(message)) return;
  vehicle.archived = true;
  vehicle.archivedAt = new Date().toISOString();
  logAction(isSAV(vehicle) ? 'SAV archivé' : 'Véhicule archivé', vehicle, null, '');
  if (state.realVin === id) state.realVin = '';
  save();
}

// Restaure un véhicule ou un SAV archivé dans le tableau de bord principal.
function restoreVehicle(id) {
  const vehicle = state.vehicles.find(item => item.id === id);
  if (!vehicle) return;
  if (!confirm(isSAV(vehicle) ? 'Restaurer ce SAV dans le tableau de bord ?' : 'Restaurer ce véhicule dans le tableau de bord ?')) return;
  vehicle.archived = false;
  vehicle.archivedAt = '';
  logAction(isSAV(vehicle) ? 'SAV restauré' : 'Véhicule restauré', vehicle, null, '');
  save();
}

// Génère les pastilles des congés enregistrés d'une personne.
function vacationsHtml(person) {
  const vacations = personVacations(person);
  if (!vacations.length) return '<span class="muted">Aucun congé</span>';
  return vacations.map(vacation => `<span class="pill vacationPill">${escHtml(new Date(vacation.start).toLocaleDateString('fr-FR'))} → ${escHtml(new Date(vacation.end).toLocaleDateString('fr-FR'))}<button class="small bad vacationDelete" title="Supprimer ce congé" onclick="removeVacation('${person.id}','${vacation.id}')">×</button></span>`).join('');
}

// Génère une ligne du tableau de gestion des personnes.
function personRow(person) {
  return `<tr><td><b>${escHtml(personName(person))}</b></td><td>${escHtml(person.mode || '39h')}</td><td>${fmt(hoursDaySchedule(person))}/semaine</td><td>${vacationsHtml(person)}</td><td class="actions"><button class="small alt" onclick="editPerson('${person.id}')">Créneaux</button><button class="small warn" onclick="openVacation('${person.id}')">Congés</button><button class="small bad" onclick="removePerson('${person.id}')">Suppr.</button></td></tr>`;
}

// Affiche la page de gestion des personnes, horaires et congés.
function people() {
  normalizeAll();
  setHead('Personnes');
  document.getElementById('view').innerHTML = `<div class="card"><div class="toolbar"><input id="pname" placeholder="Nom personne"><button onclick="addPerson()">Ajouter</button></div></div><br><div class="tablewrap"><table><thead><tr><th>Personne</th><th>Contrat</th><th>Heures</th><th>Congés</th><th>Actions</th></tr></thead><tbody>${state.people.map(personRow).join('')}</tbody></table></div>`;
}

// Ajoute une nouvelle personne avec un horaire 39 h par défaut.
function addPerson() {
  const input = document.getElementById('pname');
  const name = input?.value.trim() || '';
  if (!name || state.people.some(person => personName(person) === name)) return;
  state.people.push({ id: uid(), name, mode: '39h', schedule: defaultSchedule('39h'), vacations: [] });
  save();
}

// Supprime une personne après confirmation et bascule automatiquement la personne active vers une personne encore disponible.
function removePerson(id) {
  const person = state.people.find(item => item.id === id);
  if (!person || !confirm('Supprimer ' + personName(person) + ' ?')) return;

  const removedName = personName(person);
  state.people = state.people.filter(item => item.id !== id);

  if (state.realPerson === removedName) {
    state.realPerson = state.people[0] ? personName(state.people[0]) : '';
  }

  save();
}

// Ouvre la fenêtre permettant de modifier les créneaux horaires d'une personne.
function editPerson(id) {
  const person = state.people.find(item => item.id === id);
  if (!person) return;
  const days = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'];
  const rows = days.map(day => {
    const schedule = (person.schedule || defaultSchedule(person.mode))[day] || defaultSchedule(person.mode)[day];
    return `<tr><td><b>${day}</b></td><td><input type="checkbox" id="w_${day}" ${schedule.work !== false ? 'checked' : ''}></td><td><input type="time" id="as_${day}" value="${schedule.amStart}"></td><td><input type="time" id="ae_${day}" value="${schedule.amEnd}"></td><td><input type="time" id="ps_${day}" value="${schedule.pmStart}"></td><td><input type="time" id="pe_${day}" value="${schedule.pmEnd}"></td></tr>`;
  }).join('');
  openModal('Créneaux horaires - ' + personName(person), `<div class="form"><label>Nom<input id="editName" value="${escHtml(personName(person))}"></label><label>Contrat<select id="editMode" onchange="applyModeSchedule()"><option value="39h">39 heures</option><option value="35h">35 heures</option><option value="personnalise">Personnalisé</option></select></label></div><br><div class="tablewrap"><table><thead><tr><th>Jour</th><th>Travaille</th><th>Embauche</th><th>Débauche midi</th><th>Rembauche</th><th>Débauche soir</th></tr></thead><tbody>${rows}</tbody></table></div><br><div class="actions"><button onclick="savePersonSchedule('${id}')">Enregistrer</button><button class="alt" onclick="closeModal()">Annuler</button></div>`);
  setTimeout(() => { document.getElementById('editMode').value = person.mode || '39h'; }, 0);
}

// Applique automatiquement les horaires standards 35 h ou 39 h dans la fenêtre de modification d'une personne.
function applyModeSchedule() {
  const mode = document.getElementById('editMode').value;
  if (mode === 'personnalise') return;
  const schedule = defaultSchedule(mode);
  ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'].forEach(day => {
    document.getElementById('w_' + day).checked = schedule[day].work;
    document.getElementById('as_' + day).value = schedule[day].amStart;
    document.getElementById('ae_' + day).value = schedule[day].amEnd;
    document.getElementById('ps_' + day).value = schedule[day].pmStart;
    document.getElementById('pe_' + day).value = schedule[day].pmEnd;
  });
}

// Enregistre le nom, le contrat et les créneaux personnalisés d'une personne et met à jour la sélection active si son nom change.
function savePersonSchedule(id) {
  const person = state.people.find(item => item.id === id);
  if (!person) return;

  const days = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'];
  const oldName = personName(person);
  const newName = document.getElementById('editName').value.trim() || oldName;

  person.name = newName;
  person.mode = document.getElementById('editMode').value;
  person.schedule = {};

  days.forEach(day => {
    person.schedule[day] = {
      work: document.getElementById('w_' + day).checked,
      amStart: document.getElementById('as_' + day).value,
      amEnd: document.getElementById('ae_' + day).value,
      pmStart: document.getElementById('ps_' + day).value,
      pmEnd: document.getElementById('pe_' + day).value
    };
  });

  if (state.realPerson === oldName) state.realPerson = newName;

  closeModal();
  save();
}

// Ouvre la fenêtre permettant d'ajouter une période de congé à une personne.
function openVacation(id) {
  const person = state.people.find(item => item.id === id);
  if (!person) return;
  openModal('Congés - ' + personName(person), `<div class="form"><label>Début<input type="date" id="vacStart"></label><label>Fin<input type="date" id="vacEnd"></label><div class="full card" style="margin:0;padding:12px"><b>Congés enregistrés</b><br><br>${vacationsHtml(person)}</div><div class="full actions"><button onclick="addVacation('${id}')">Ajouter congé</button><button class="alt" onclick="closeModal()">Fermer</button></div></div>`);
}

// Ajoute une période de congé après vérification des dates.
function addVacation(id) {
  const person = state.people.find(item => item.id === id);
  if (!person) return;
  const start = document.getElementById('vacStart').value;
  const end = document.getElementById('vacEnd').value;
  if (!start || !end) { alert('Choisis une date de début et une date de fin.'); return; }
  if (end < start) { alert('La date de fin doit être après la date de début.'); return; }
  personVacations(person).push({ id: uid(), start, end });
  logAction('Congé ajouté', null, null, personName(person) + ' : ' + new Date(start).toLocaleDateString('fr-FR') + ' → ' + new Date(end).toLocaleDateString('fr-FR'));
  closeModal();
  page = 'people';
  save();
}

// Supprime une période de congé précise d'une personne.
function removeVacation(personId, vacationId) {
  const person = state.people.find(item => item.id === personId);
  if (!person) return;
  person.vacations = personVacations(person).filter(vacation => vacation.id !== vacationId);
  logAction('Congé supprimé', null, null, personName(person));
  closeModal();
  page = 'people';
  save();
}

// Crée une sauvegarde JSON complète comprenant l'état, les bases Excel et le catalogue de pièces.
function backupAllV37() {
  try {
    const payload = {
      app: 'ELITT Suivi OF',
      backupVersion: 11,
      schemaVersion: 10,
      exportedAt: new Date().toISOString(),
      state,
      basesExcel: JSON.parse(localStorage.getItem(BASES_LS) || '{}'),
      partsCatalog: state.partsCatalogV8 || {},
      storageKey: LS
    };
    const date = new Date().toISOString().slice(0, 10);
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'sauvegarde_suivi_of_' + date + '.json';
    document.body.appendChild(link);
    link.click();
    setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 500);
  } catch (e) {
    alert('Erreur sauvegarde : ' + e.message);
  }
}

// Ouvre un fichier de sauvegarde JSON et restaure toutes les données compatibles avec les anciennes versions.
function restoreAllV37() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = () => {
    const file = input.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const restored = data.state || data.appState || data;
        if (!restored || !Array.isArray(restored.vehicles)) throw new Error('Ce fichier ne ressemble pas à une sauvegarde Suivi OF.');
        if (!confirm('Restaurer cette sauvegarde ?\n\nAttention : cela remplace les données actuellement affichées.')) return;
        state = restored;
        if (data.basesExcel) localStorage.setItem(BASES_LS, JSON.stringify(data.basesExcel));
        if (data.partsCatalog) state.partsCatalogV8 = data.partsCatalog;
        loadPersistedBases();
        loadPartsCatalog();
        normalizeAll();
        localStorage.setItem(LS, JSON.stringify(state));
        savePersistedBases();
        savePartsCatalog();
        migrateStateV10();
        alert('Restauration terminée.');
        render();
        if (typeof window.requestFirebaseSave === 'function') window.requestFirebaseSave(true);
      } catch (e) {
        alert('Impossible de restaurer : ' + e.message);
      }
    };
    reader.readAsText(file, 'utf-8');
  };
  input.click();
}

// Alias conservé pour la compatibilité avec l'ancien code Firebase et les anciennes sauvegardes.
function exportData() {
  backupAllV37();
}

// Alias conservé pour la compatibilité avec l'ancien code Firebase et les anciennes sauvegardes.
function importData() {
  restoreAllV37();
}

// Migre en douceur les données anciennes vers le schéma quantité V10 et initialise le suivi graphique sans supprimer de données.
function migrateStateV10() {
  loadPartsCatalog();
  normalizeAll();
  ensureProgressBaselines();
  state.schemaVersion = 10;
  state.migratedAtV10 = state.migratedAtV10 || new Date().toISOString();
  try {
    localStorage.setItem(LS, JSON.stringify(state));
    savePartsCatalog();
  } catch (e) {
    console.warn('Migration V10 : sauvegarde locale impossible.', e);
  }
}

// Démarre l'application locale avant que Firebase ne charge éventuellement les données partagées.
function initApp() {
  loadPersistedBases();
  loadPartsCatalog();
  normalizeAll();
  migrateStateV10();
  initModalBackdrop();
  if (isPublicGlobalRequestV117()) {
    renderPublicGlobalLoadingV117();
    return;
  }
  if (isPublicVinRequestV116()) {
    renderPublicVinLoadingV116();
    return;
  }
  render();
  applyVehicleDeepLinkV115();
}

initApp();

</script>

<!-- Configuration et bibliothèques Firebase conservées comme sur la V10 fonctionnelle. -->
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
/*
  ============================================================================
  FIREBASE - synchronisation du site GitHub Pages avec Firestore
  ============================================================================
  Cette partie ne change pas l'organisation des données : elle conserve un seul
  document Firestore partagé, comme la V10 fonctionnelle.
  ============================================================================
*/

(function firebaseModule(){
  const FIREBASE_SAVE_DELAY = 650;
  const FIREBASE_DOC_COLLECTION = 'suivi_of';
  const FIREBASE_DOC_ID = 'donnees_principales';
  const FIREBASE_PUBLIC_VINS_COLLECTION = 'public_vins';
  const FIREBASE_PUBLIC_GLOBAL_DOC_ID = 'global_dashboard_v117';

  let fbReady = false;
  let db = null;
  let auth = null;
  let currentUser = null;
  let applyingRemote = false;
  let saveTimer = null;
  let unsubscribeSnapshot = null;
  let lastRemoteDataJSON = '';
  const lastPublicPayloadJSONV116 = new Map();
  let lastPublicGlobalJSONV117 = '';

  const css = document.createElement('style');
  css.textContent = `
    .fbTopbar{position:sticky;top:0;z-index:8;margin:-20px -20px 16px -20px;padding:10px 20px;background:#081830;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .fbStatus{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#cfe2ff;font-weight:800;font-size:13px}
    .fbDot{width:10px;height:10px;border-radius:50%;background:#f59e0b;display:inline-block}.fbDot.ok{background:#22c55e}.fbDot.bad{background:#ef4444}
    .fbLogin{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at top,#122743,#071426 60%);display:flex;align-items:center;justify-content:center;padding:20px}
    .fbLogin.hidden{display:none}.fbBox{width:min(420px,94vw);background:#0d1f38;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.45)}
    .fbBox img{max-width:210px;display:block;margin:0 auto 18px}.fbBox h2{margin:0 0 8px;text-align:center}.fbBox p{text-align:center;margin-bottom:18px}.fbBox label{margin:10px 0}.fbBox input{width:100%}
    .fbError{color:#fecaca;background:#7f1d1d;border-radius:12px;padding:10px;margin-top:12px;display:none;font-weight:800}.fbHelp{font-size:12px;color:#9cb2d1;margin-top:12px;line-height:1.45}
  `;
  document.head.appendChild(css);

  // Transforme l'identifiant court "admin" en adresse Firebase tout en acceptant aussi une adresse e-mail complète.
  function emailFromLogin(login){
    const value = (login || '').trim();
    if(value.includes('@')) return value;
    return value.toLowerCase() + '@suivi-of.local';
  }

  // Récupère les bases Excel conservées séparément dans le navigateur pour les inclure dans Firebase.
  function getBasesPayload(){
    try{
      return (typeof BASES_LS !== 'undefined') ? JSON.parse(localStorage.getItem(BASES_LS) || '{}') : {};
    }catch(e){
      return {};
    }
  }

  // Restaure les bases Excel reçues depuis Firebase et les recharge dans l'état courant.
  function setBasesPayload(bases){
    try{
      if(bases && typeof BASES_LS !== 'undefined'){
        localStorage.setItem(BASES_LS, JSON.stringify(bases));
        if(typeof loadPersistedBases === 'function') loadPersistedBases();
      }
    }catch(e){
      console.warn('Bases Excel non restaurées.', e);
    }
  }

  // Construit la partie stable des données utilisées pour savoir si une vraie modification doit être envoyée.
  function stableDataFromCurrent(){
    return {
      state,
      basesExcel: getBasesPayload()
    };
  }

  // Construit le document complet envoyé à Firestore avec sa date de dernière mise à jour.
  function payloadFromCurrent(){
    const stable = stableDataFromCurrent();
    return {
      app: 'ELITT Suivi OF Web Firebase',
      version: 11.141,
      updatedAt: new Date().toISOString(),
      state: stable.state,
      basesExcel: stable.basesExcel
    };
  }

  // Synchronise vers Firestore uniquement les fiches VIN pour lesquelles un QR public a déjà été créé.
  async function syncPublicVinDocumentsV116(){
    if(!db || !currentUser) return;
    const estimated = (typeof estimateVehiclesActive === 'function') ? estimateVehiclesActive() : {};
    const jobs = [];
    (state.vehicles || []).forEach(vehicle => {
      if(isSAV(vehicle) || !vehicle.publicIdV116) return;
      const payload = buildPublicVinPayloadV116(vehicle, estimated[vehicle.id] || null);
      const stablePayload = {...payload};
      delete stablePayload.updatedAt;
      const json = JSON.stringify(stablePayload);
      if(lastPublicPayloadJSONV116.get(vehicle.publicIdV116) === json) return;
      lastPublicPayloadJSONV116.set(vehicle.publicIdV116, json);
      payload.updatedAt = new Date().toISOString();
      jobs.push(db.collection(FIREBASE_PUBLIC_VINS_COLLECTION).doc(vehicle.publicIdV116).set(payload));
    });
    const globalPayload = buildPublicGlobalPayloadV117(estimated);
    const stableGlobalPayload = {...globalPayload};
    delete stableGlobalPayload.updatedAt;
    const globalJSON = JSON.stringify(stableGlobalPayload);
    if(lastPublicGlobalJSONV117 !== globalJSON){
      lastPublicGlobalJSONV117 = globalJSON;
      globalPayload.updatedAt = new Date().toISOString();
      jobs.push(db.collection(FIREBASE_PUBLIC_VINS_COLLECTION).doc(FIREBASE_PUBLIC_GLOBAL_DOC_ID).set(globalPayload));
    }
    if(jobs.length) await Promise.all(jobs);
  }

  // Supprime la fiche VIN publique lorsqu'un véhicule ayant un QR est supprimé du logiciel.
  window.deletePublicVinV116 = async function deletePublicVinV116(publicId){
    if(!publicId || !db || !currentUser) return;
    try{
      await db.collection(FIREBASE_PUBLIC_VINS_COLLECTION).doc(publicId).delete();
      lastPublicPayloadJSONV116.delete(publicId);
    }catch(e){
      console.warn('Suppression de la fiche VIN publique impossible.', e);
    }
  };

  // Charge en temps réel une fiche VIN publique sans demander de connexion au logiciel principal.
  function startPublicVinSnapshotV116(){
    const publicId = publicVinIdFromUrlV116();
    if(!publicId){ renderPublicVinErrorV116('Lien QR incomplet.'); return; }
    const reference = db.collection(FIREBASE_PUBLIC_VINS_COLLECTION).doc(publicId);
    unsubscribeSnapshot = reference.onSnapshot(snapshot => {
      if(snapshot.exists) renderPublicVinDataV116(snapshot.data());
      else renderPublicVinErrorV116('Cette fiche VIN n’existe pas encore. Ouvre le QR depuis le logiciel connecté une première fois afin de publier la fiche.');
    }, error => {
      console.error(error);
      renderPublicVinErrorV116('Lecture Firebase impossible : ' + error.message);
    });
  }

  // Charge en temps réel le tableau public global sans demander de connexion au logiciel principal.
  function startPublicGlobalSnapshotV117(){
    const reference = db.collection(FIREBASE_PUBLIC_VINS_COLLECTION).doc(FIREBASE_PUBLIC_GLOBAL_DOC_ID);
    unsubscribeSnapshot = reference.onSnapshot(snapshot => {
      if(snapshot.exists) renderPublicGlobalDataV117(snapshot.data());
      else renderPublicGlobalErrorV117('Le tableau public n’existe pas encore. Ouvre le logiciel connecté et force une sauvegarde une première fois.');
    }, error => {
      console.error(error);
      renderPublicGlobalErrorV117('Lecture Firebase impossible : ' + error.message);
    });
  }

  // Met à jour le texte et la couleur du voyant de synchronisation Firebase.
  function setStatus(text, kind){
    const label = document.getElementById('fbStatusText');
    const dot = document.getElementById('fbDot');
    if(label) label.textContent = text;
    if(dot) dot.className = 'fbDot ' + (kind || '');
  }

  // Programme une sauvegarde Firebase avec un petit délai afin de regrouper plusieurs changements rapprochés.
  function queueFirebaseSave(){
    if(!fbReady || !currentUser || applyingRemote || !db) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => pushFirebaseNow(false), FIREBASE_SAVE_DELAY);
  }

  // Envoie immédiatement les données vers Firestore ; force=true envoie même si le contenu n'a pas changé.
  async function pushFirebaseNow(force = false){
    if(!fbReady || !currentUser || !db) return;
    try{
      const stableJSON = JSON.stringify(stableDataFromCurrent());
      if(!force && stableJSON === lastRemoteDataJSON) return;
      setStatus('Sauvegarde...', '');
      const payload = payloadFromCurrent();
      await db.collection(FIREBASE_DOC_COLLECTION).doc(FIREBASE_DOC_ID).set(payload, {merge:true});
      await syncPublicVinDocumentsV116();
      lastRemoteDataJSON = stableJSON;
      setStatus('Sauvegardé Firebase', 'ok');
    }catch(e){
      console.error(e);
      setStatus('Erreur sauvegarde Firebase', 'bad');
      alert('Erreur sauvegarde Firebase : ' + e.message);
    }
  }

  // Expose une demande de sauvegarde afin qu'une restauration JSON puisse être envoyée seulement après sa réussite réelle.
  window.requestFirebaseSave = function requestFirebaseSave(force = false){
    if(force) pushFirebaseNow(true);
    else queueFirebaseSave();
  };

  // Construit la fenêtre de connexion affichée tant que l'utilisateur n'est pas authentifié.
  function buildLogin(){
    const overlay = document.createElement('div');
    overlay.id = 'fbLogin';
    overlay.className = 'fbLogin';
    overlay.innerHTML = `
      <div class="fbBox">
        <img src="logo_elitt.png" alt="Logo">
        <h2>Connexion Suivi OF</h2>
        <p>Connecte-toi pour charger les camions depuis Firebase.</p>
        <label>Identifiant<input id="fbLoginId" autocomplete="username" value="admin"></label>
        <label>Mot de passe<input id="fbLoginPass" type="password" autocomplete="current-password" placeholder="Mot de passe Firebase"></label>
        <button id="fbLoginBtn" style="width:100%;margin-top:10px">Se connecter</button>
        <div id="fbError" class="fbError"></div>
        <div class="fbHelp">L'identifiant <b>admin</b> correspond au compte Firebase <b>admin@suivi-of.local</b>.</div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#fbLoginBtn').onclick = doLogin;
    const password = overlay.querySelector('#fbLoginPass');
    password.addEventListener('keydown', event => { if(event.key === 'Enter') doLogin(); });
    setTimeout(() => password.focus(), 150);
  }

  // Affiche un message d'erreur dans la fenêtre de connexion Firebase.
  function showError(message){
    const element = document.getElementById('fbError');
    if(element){
      element.textContent = message;
      element.style.display = message ? 'block' : 'none';
    }
  }

  // Tente la connexion Firebase avec l'identifiant et le mot de passe saisis.
  async function doLogin(){
    try{
      const id = document.getElementById('fbLoginId').value;
      const password = document.getElementById('fbLoginPass').value;
      showError('');
      await auth.signInWithEmailAndPassword(emailFromLogin(id), password);
    }catch(e){
      console.error(e);
      showError('Connexion impossible : ' + e.message);
    }
  }

  // Ajoute en haut du site le voyant Firebase, le bouton de sauvegarde forcée et la déconnexion.
  function buildTopbar(){
    const main = document.querySelector('main');
    if(!main || document.getElementById('fbTopbar')) return;
    const bar = document.createElement('div');
    bar.id = 'fbTopbar';
    bar.className = 'fbTopbar';
    bar.innerHTML = `
      <div class="fbStatus"><span id="fbDot" class="fbDot"></span><span id="fbStatusText">Connexion Firebase...</span></div>
      <div class="fbTopbarActions">
        <button class="small alt" id="fbForceSave">Forcer sauvegarde</button>
        <button class="small alt" id="fbBackupData">Sauvegarder données</button>
        <button class="small alt" id="fbRestoreData">Restaurer données</button>
        <button class="small bad" id="fbLogout">Déconnexion</button>
      </div>`;
    main.prepend(bar);
    document.getElementById('fbForceSave').onclick = () => pushFirebaseNow(true);
    document.getElementById('fbBackupData').onclick = () => backupAllV37();
    document.getElementById('fbRestoreData').onclick = () => restoreAllV37();
    document.getElementById('fbLogout').onclick = () => auth.signOut();
  }

  // Applique au site les données reçues depuis Firestore puis exécute la migration de compatibilité.
  function applyRemotePayload(data){
    if(!data || !data.state || !Array.isArray(data.state.vehicles)) return;
    applyingRemote = true;
    try{
      state = data.state;
      setBasesPayload(data.basesExcel || {});
      if(typeof migrateStateV10 === 'function') migrateStateV10();
      else if(typeof normalizeAll === 'function') normalizeAll();
      localStorage.setItem(LS, JSON.stringify(state));
      lastRemoteDataJSON = JSON.stringify({state:data.state, basesExcel:data.basesExcel || {}});
      render();
      applyVehicleDeepLinkV115();
      setStatus('Données chargées Firebase', 'ok');
    }finally{
      applyingRemote = false;
    }
  }

  // Démarre l'écoute temps réel du document Firestore partagé.
  async function startSnapshot(){
    if(unsubscribeSnapshot) unsubscribeSnapshot();
    const reference = db.collection(FIREBASE_DOC_COLLECTION).doc(FIREBASE_DOC_ID);
    unsubscribeSnapshot = reference.onSnapshot(snapshot => {
      if(snapshot.exists){
        applyRemotePayload(snapshot.data());
      }else{
        setStatus('Aucune donnée Firebase : restauration ou création possible', '');
      }
    }, error => {
      console.error(error);
      setStatus('Erreur lecture Firebase', 'bad');
      alert('Erreur lecture Firebase : ' + error.message);
    });
  }

  // Remplace la sauvegarde locale simple par une sauvegarde locale + une synchronisation Firebase différée.
  function installSaveBridge(){
    if(typeof save !== 'function') return;
    // Nouvelle version de save : conserve la sauvegarde locale puis programme la synchronisation Firebase.
    save = function saveWithFirebase(){
      localStorage.setItem(LS, JSON.stringify(state));
      if(!applyingRemote) queueFirebaseSave();
      render();
    };
  }

  // Ajoute une synchronisation Firebase lorsqu'une nouvelle base Excel est conservée localement.
  function installBasesBridge(){
    if(typeof savePersistedBases !== 'function') return;
    const localSaveBases = savePersistedBases;
    // Nouvelle version de savePersistedBases : conserve la base locale puis programme la synchronisation Firebase.
    savePersistedBases = function savePersistedBasesWithFirebase(){
      localSaveBases();
      if(!applyingRemote) queueFirebaseSave();
    };
  }

  // Initialise Firebase, l'authentification et l'écoute Firestore lorsque la page est complètement chargée.
  function initFirebase(){
    if(!window.SUIVI_OF_FIREBASE_CONFIG || !window.SUIVI_OF_FIREBASE_CONFIG.apiKey || window.SUIVI_OF_FIREBASE_CONFIG.apiKey.includes('REMPLACER')){
      if(isPublicGlobalRequestV117()) renderPublicGlobalErrorV117('Configuration Firebase manquante.');
      else if(isPublicVinRequestV116()) renderPublicVinErrorV116('Configuration Firebase manquante.');
      else {
        buildLogin();
        buildTopbar();
        setStatus('Configuration Firebase manquante', 'bad');
        showError('Il faut remplir le fichier firebase-config.js avec la configuration de ton projet Firebase.');
      }
      return;
    }
    try{
      firebase.initializeApp(window.SUIVI_OF_FIREBASE_CONFIG);
      db = firebase.firestore();
      fbReady = true;
      if(isPublicGlobalRequestV117()){
        startPublicGlobalSnapshotV117();
        return;
      }
      if(isPublicVinRequestV116()){
        startPublicVinSnapshotV116();
        return;
      }
      buildLogin();
      buildTopbar();
      auth = firebase.auth();
      auth.onAuthStateChanged(user => {
        currentUser = user;
        const login = document.getElementById('fbLogin');
        if(user){
          login.classList.add('hidden');
          setStatus('Connecté : ' + (user.email || 'admin'), 'ok');
          startSnapshot();
        }else{
          if(unsubscribeSnapshot) unsubscribeSnapshot();
          login.classList.remove('hidden');
          setStatus('Déconnecté', '');
        }
      });
    }catch(e){
      console.error(e);
      setStatus('Firebase non initialisé', 'bad');
      showError('Firebase non initialisé : ' + e.message);
    }
  }

  installSaveBridge();
  installBasesBridge();
  window.addEventListener('load', initFirebase);
})();

</script>
</body>
</html>
