<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELITT - Suivi OF</title>
<style>
:root{--bg:#071426;--panel:#0e1e35;--panel2:#122743;--text:#eaf2ff;--muted:#9cb2d1;--line:#284262;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--pill:#18375f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;font-weight:800;color:#fff;background:var(--blue);cursor:pointer}button.alt{background:#28415f}button.good{background:var(--green)}button.warn{background:var(--orange);color:#071426}button.bad{background:var(--red)}button.small{padding:8px 10px;font-size:13px}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}aside{background:#081830;border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:170px;height:auto;border-radius:0;background:transparent;display:block;object-fit:contain}.brand{align-items:flex-start}.brandText{display:none}nav button{width:100%;text-align:left;background:transparent;margin:4px 0;color:var(--text)}nav button.active,nav button:hover{background:#1b2f51}main{padding:20px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}h1{margin:0 0 6px;font-size:28px}p{color:var(--muted);margin:0}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,minmax(150px,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,.18)}.kpi{font-size:30px;font-weight:900;margin-top:6px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--panel)}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1000px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#bcd2f2;background:#0b1b33}td.desc{white-space:normal;min-width:280px}.muted{color:var(--muted);font-size:12px}.pill{display:inline-flex;border-radius:999px;padding:6px 10px;background:var(--pill);font-weight:800;font-size:12px;color:#cfe2ff}.progress{height:10px;background:#203654;border-radius:999px;overflow:hidden;min-width:140px}.bar{height:100%;background:linear-gradient(90deg,#38bdf8,#22c55e)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.dialog{background:#0d1f38;border:1px solid var(--line);border-radius:20px;padding:18px;width:min(720px,96vw);max-height:92vh;overflow:auto}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:6px;font-weight:700;color:#dceaff}input,select,textarea{background:#081830;color:#fff;border:1px solid #385579;border-radius:12px;padding:10px}textarea{min-height:90px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;justify-content:flex-start}.actions.wrap{flex-wrap:wrap}td.actions{min-width:290px}.actions button{min-width:74px;text-align:center}.checkrow{display:flex!important;align-items:center;gap:10px;background:#081830;border:1px solid #385579;border-radius:12px;padding:10px}.checkrow input{width:18px;height:18px}.actions{align-items:center!important}.tablewrap td.actions{vertical-align:middle!important}td,th{line-height:1.25}.tablewrap table td{vertical-align:middle}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar label{display:flex;align-items:center;gap:8px;font-weight:800;color:#dceaff}.toolbar select{min-width:180px}.searchbox{width:min(520px,100%);font-size:16px}@media(max-width:900px){.app{grid-template-columns:1fr}aside{height:auto;position:relative}.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}

/* Correctif V5 : alignement propre des tableaux */
.tablewrap table{border-collapse:separate;border-spacing:0;table-layout:auto;}
.tablewrap th,.tablewrap td{vertical-align:middle!important;line-height:1.25;}
.tablewrap tbody tr{min-height:62px;}
.tablewrap td:nth-child(1){min-width:90px;}
.tablewrap td:nth-child(2){min-width:70px;text-align:left;}
.tablewrap td:nth-child(3){min-width:160px;}
.tablewrap td:nth-child(5){min-width:90px;}
.tablewrap td:nth-child(6){min-width:90px;}
.tablewrap td:nth-child(7){min-width:110px;}
.tablewrap td:nth-child(8){min-width:110px;}
td.actions{display:table-cell!important;min-width:470px!important;white-space:nowrap!important;vertical-align:middle!important;}
td.actions button{display:inline-flex!important;align-items:center!important;justify-content:center!important;height:38px;min-width:78px;margin:3px 5px 3px 0;vertical-align:middle!important;}
div.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-start;}


/* V7 : blocage et simplification réalisation */
.pill.blocked{background:#7f1d1d;color:#fecaca;}
.blockedtxt{margin-top:6px;color:#fecaca;font-size:12px;font-weight:700;white-space:normal;max-width:260px;}
.dangertext{color:#fecaca;background:#7f1d1d;border-radius:999px;padding:4px 10px;display:inline-block;min-width:24px;text-align:center;}
tr.blockedrow{background:rgba(239,68,68,.08);}
tr.blockedrow td{border-bottom-color:#7f1d1d;}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.filterbar label{display:flex;gap:6px;align-items:center}.historyline{display:grid;grid-template-columns:160px 1fr;gap:10px;padding:10px;border-bottom:1px solid var(--line)}


/* V14 : affichage options tableau de bord */
.optionchips{display:flex;gap:6px;flex-wrap:wrap;min-width:160px}
.optionchip{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;background:#1d3b64;color:#dbeafe;font-size:12px;font-weight:800;white-space:nowrap}
.optionchip.none{background:#26374f;color:#9cb2d1}
.vehiclecolor{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.55);box-shadow:0 0 0 3px rgba(255,255,255,.06);vertical-align:middle;margin-right:8px}
.vinbox{display:flex;align-items:center;gap:6px;white-space:nowrap}
tr.vehicleRow td:first-child{border-left:6px solid var(--vehColor,#3b82f6)}
.vehicleBanner{border-left:8px solid var(--vehColor,#3b82f6)!important}
.colorBadge{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:6px 10px;border-radius:999px;background:#102846;color:#dbeafe;font-size:12px;font-weight:800}



/* V31 : gestion SAV */
.savbadge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:#7c2d12;color:#ffedd5;font-size:12px;font-weight:900;white-space:nowrap}
.savcomment{white-space:pre-wrap;background:#081830;border:1px solid var(--line);border-radius:14px;padding:12px;color:#eaf2ff}
.savdone{background:#064e3b;color:#bbf7d0}

</style>

function ofTable(rows,realMode=false,readOnly=false,detailDelete=false){
  const top=(realMode||readOnly)?'':`<div class="toolbar"><button onclick="openOF()">+ Ajouter OF</button></div><br>`;
  const head = readOnly
    ? `<tr><th>VIN</th><th>Ordre</th><th>OF</th><th>Description</th><th>Temps</th><th>Priorité</th><th>Statut</th><th>Fait par</th>${detailDelete?'<th>Actions</th>':''}</tr>`
    : realMode
      ? `<tr><th>VIN</th><th>Ordre</th><th>OF</th><th>Description</th><th>Temps</th><th>Priorité</th><th>Statut</th><th>Actions</th></tr>`
      : `<tr><th>VIN</th><th>Ordre</th><th>OF</th><th>Description</th><th>Temps</th><th>Priorité</th><th>Statut</th><th>Fait par</th><th>Actions</th></tr>`;
  const body = rows.map(([v,o])=>{
    const st=o.status||'À faire';
    const pillClass = st==='Bloqué' ? 'pill blocked' : 'pill';
    const statusHtml = `<span class="${pillClass}">${st}</span>${o.blockReason?`<div class="blockedtxt">${o.blockReason}</div>`:''}`;

    const normalActions = `<button class="small alt" onclick="openOF('${v.id}','${o.id}')">Modifier</button><button class="small good" onclick="markDone('${v.id}','${o.id}')">Fait</button><button class="small warn" onclick="reopenOF('${v.id}','${o.id}')">Réouvrir</button><button class="small bad" onclick="delOF('${v.id}','${o.id}')">Suppr.</button>`;
    const faitPar = o.doneBy || '-';
    if(readOnly){
      const deleteAction = detailDelete ? `<td class="actions"><button class="small bad" onclick="delOF('${v.id}','${o.id}')">Suppr.</button></td>` : '';
      return `<tr class="${st==='Bloqué'?'blockedrow':''}"><td><b>${v.vin}</b></td><td><b>${o.order}</b></td><td><b>${o.name}</b><div class="muted">${o.category}${o.option ? ' • '+o.option.replace('OPTION ','') : ''}</div></td><td class="desc">${o.desc}</td><td><b>${fmt(o.time)}</b></td><td><b>${o.priority}</b></td><td>${statusHtml}</td><td><b>${faitPar}</b></td>${deleteAction}</tr>`;
    }
    return `<tr class="${st==='Bloqué'?'blockedrow':''}"><td><b>${v.vin}</b></td><td><b>${o.order}</b></td><td><b>${o.name}</b><div class="muted">${o.category}${o.option ? ' • '+o.option.replace('OPTION ','') : ''}</div></td><td class="desc">${o.desc}</td><td><b>${fmt(o.time)}</b></td><td><b>${o.priority}</b></td><td>${statusHtml}</td>${realMode?'':`<td>${faitPar}</td>`}<td class="actions">${realMode?realActions:normalActions}</td></tr>`;
  }).join('');
  return `${top}<div class="tablewrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`
}

function normalizeOrders(v){

function insertOrMoveOF(v,o,targetOrder,isNew){
  targetOrder=Math.max(1, Number(targetOrder)||1);
  if(!isNew){ v.ofs=v.ofs.filter(x=>x.id!==o.id); }
  if(targetOrder>v.ofs.length+1) targetOrder=v.ofs.length+1;
  v.ofs.forEach(x=>{ if((x.order||0)>=targetOrder) x.order=(x.order||0)+1; });

  v.ofs.push(o);
  normalizeOrders(v);
}

function normalizeCat(cat){

  if(c.toLowerCase().includes('prem')||c.toLowerCase().includes('pré')) return 'Prémontage';

async function readExcelFile(file){
  if(!file) return [];
  if(!window.XLSX){ alert('Lecture Excel indisponible : connecte Internet une fois ou dis-moi et je te ferai une version avec import CSV.'); return []; }
  const data=await file.arrayBuffer();
  const wb=XLSX.read(data,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
  return rows.map((r,i)=>{
    const order=parseNum(val(r,['Ordre','Order']));
    const name=String(val(r,['Nom','N°OF','N OF','OF','N°DESSIN','N DESSIN'])||'').trim();
    const desc=String(val(r,['Description','Desc'])||'').trim();
    const time=parseNum(val(r,['Temps X1','Temps','Temps unitaire','Temps X 1']));
    const cat=normalizeCat(val(r,['Filtre','Catégorie','Categorie','Phase']));
    const opt=String(val(r,['Options','Option'])||'').trim();
    const rule=String(val(r,['Règle option','Regle option','Règle','Regle'])||'').trim();
    if(!name && !desc) return null;
    const o={id:name||('OF-'+(i+1)), order:order||i+1, name:name||('OF-'+(i+1)), desc, time, category:cat, priority:catPriority(cat), option:''};
    if(opt.toUpperCase().startsWith('OPTION')) o.option=opt.toUpperCase();
    if(rule.toUpperCase().includes('SUPPRIMER SI')){
      const m=rule.toUpperCase().match(/OPTION\s+.+/);
      o.removeIfOption=m ? m[0].trim() : rule.toUpperCase().replace('SUPPRIMER SI','').trim();
    } else if(opt.toUpperCase().includes('SUPPRIMER SI')){
      const m=opt.toUpperCase().match(/OPTION\s+.+/);
      o.removeIfOption=m ? m[0].trim() : opt.toUpperCase().replace('SUPPRIMER SI','').trim();
      o.option='';
    }
    return o;
  }).filter(Boolean).sort((a,b)=>a.order-b.order);
}

function personName(p){ return typeof p==='string' ? p : (p?.name||''); }
function defaultSchedule(mode='39h'){
  const base={};
  ['Lundi','Mardi','Mercredi','Jeudi','Vendredi'].forEach((d,i)=>{
    base[d]={work:true,amStart:'07:30',amEnd:'12:30',pmStart:'13:30',pmEnd:(mode==='35h'?'15:30':(i===4?'15:30':'16:30'))};
  });
  return base;
}
function normalizePeople(){
  state.people = (state.people||[]).map((p,i)=>{

    p.id = p.id || uid(); p.name = p.name || ('Personne '+(i+1)); p.mode = p.mode || '39h'; p.schedule = p.schedule || defaultSchedule(p.mode); return p;
  });
  if(!state.realPerson && state.people[0]) state.realPerson=personName(state.people[0]);
}
function normalizeAll(){ state.vehicles=state.vehicles||[]; state.history=state.history||[]; state.vehicles.forEach((v,i)=>{ if(!v.color){ const colors=['#3b82f6','#22c55e','#f97316','#a855f7','#ef4444','#14b8a6','#eab308','#ec4899']; v.color=colors[i%colors.length]; } }); normalizePeople(); }
function timeToMin(t){ const [h,m]=(t||'00:00').split(':').map(Number); return (h||0)*60+(m||0); }
function minToDate(d,min){ const x=new Date(d); x.setHours(Math.floor(min/60),min%60,0,0); return x; }
function hoursDaySchedule(p){ const sc=p.schedule||defaultSchedule(p.mode); let total=0; Object.values(sc).forEach(d=>{ if(d.work!==false) total+=Math.max(0,timeToMin(d.amEnd)-timeToMin(d.amStart))+Math.max(0,timeToMin(d.pmEnd)-timeToMin(d.pmStart)); }); return total/60; }
function easterDate(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function frenchHolidays(y){ const e=easterDate(y); return new Set([`${y}-01-01`,`${y}-05-01`,`${y}-05-08`,`${y}-07-14`,`${y}-08-15`,`${y}-11-01`,`${y}-11-11`,`${y}-12-25`,ymd(addDays(e,1)),ymd(addDays(e,39)),ymd(addDays(e,50))]); }
function isHoliday(d){ return frenchHolidays(d.getFullYear()).has(ymd(d)); }
const dayNames=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
function intervalsForDay(p,d){ const name=dayNames[d.getDay()]; const s=(p.schedule||defaultSchedule(p.mode))[name]; if(!s || s.work===false || d.getDay()===0 || d.getDay()===6 || isHoliday(d)) return []; return [[timeToMin(s.amStart),timeToMin(s.amEnd)],[timeToMin(s.pmStart),timeToMin(s.pmEnd)]].filter(a=>a[1]>a[0]); }
function nextWorkStart(p,from){ let d=new Date(from); d.setSeconds(0,0); for(let guard=0;guard<800;guard++){ const ints=intervalsForDay(p,d); const now=d.getHours()*60+d.getMinutes(); for(const [a,b] of ints){ if(now<=a) return minToDate(d,a); if(now>=a && now<b) return d; } d.setDate(d.getDate()+1); d.setHours(0,0,0,0); } return null; }
function addWorkHours(p,start,hours){ let rem=Math.max(0,Number(hours)||0)*60; let d=nextWorkStart(p,start); if(!d) return null; for(let guard=0;guard<2000 && rem>0;guard++){ const ints=intervalsForDay(p,d); const now=d.getHours()*60+d.getMinutes(); let progressed=false; for(const [a,b] of ints){ let cur=Math.max(now,a); if(cur>=b) continue; const use=Math.min(rem,b-cur); rem-=use; d=minToDate(d,cur+use); progressed=true; if(rem<=0) return d; }
    if(!progressed || rem>0){ d.setDate(d.getDate()+1); d.setHours(0,0,0,0); d=nextWorkStart(p,d); if(!d) return null; }
  } return d; }
function estimateVehicles(){ normalizeAll(); const people=state.people.filter(p=>personName(p)); if(!people.length) return {}; const now=new Date(); const slots=people.map(p=>({p,free:nextWorkStart(p,now)||now})); const result={}; const vehicles=[...state.vehicles].sort((a,b)=>(Number(a.priority)||1)-(Number(b.priority)||1)||(a.vin||'').localeCompare(b.vin||'')); for(const v of vehicles){ const ofs=(v.ofs||[]).filter(o=>o.status!=='Fait').sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0)); let last=null; for(const o of ofs){ slots.sort((a,b)=>a.free-b.free); const slot=slots[0]; slot.free=addWorkHours(slot.p,slot.free,Number(o.time)||0) || slot.free; last=slot.free; } result[v.id]=last; } return result; }

function cleanKey(k){return String(k||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function val(row,names){
  const wanted=names.map(cleanKey);
  for(const k of Object.keys(row)){ if(wanted.includes(cleanKey(k))) return row[k]; }
  return '';
}
function parseNum(x){
  if(x===undefined||x===null||x==='') return 0;
  return Number(String(x).replace(',','.').replace(/[^0-9.\-]/g,'')) || 0;
}
function catPriority(cat){
  const c=String(cat||'Autre').toLowerCase();
  if(c.includes('fabric')) return 1;
  if(c.includes('prem')||c.includes('pré')) return 2;
  if(c.includes('pose')) return 3;
  if(c.includes('essai')||c.includes('debug')) return 4;
  return 5;
}
function normalizeCat(cat){
  const c=String(cat||'Autre').trim();
  if(!c) return 'Autre';
  if(c.toLowerCase().includes('fabric')) return 'Fabrication';
  if(c.toLowerCase().includes('prem')||c.toLowerCase().includes('pré')) return 'Prémontage';
  if(c.toLowerCase().includes('pose')) return 'Pose';
  if(c.toLowerCase().includes('essai')||c.toLowerCase().includes('debug')) return 'Essais';
  return c;
}
async function readExcelFile(file){
  if(!file) return [];
  if(!window.XLSX){ alert('Lecture Excel indisponible : connecte Internet une fois ou dis-moi et je te ferai une version avec import CSV.'); return []; }
  const data=await file.arrayBuffer();
  const wb=XLSX.read(data,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
  return rows.map((r,i)=>{
    const order=parseNum(val(r,['Ordre','Order']));
    const name=String(val(r,['Nom','N°OF','N OF','OF','N°DESSIN','N DESSIN'])||'').trim();
    const desc=String(val(r,['Description','Desc'])||'').trim();
    const time=parseNum(val(r,['Temps X1','Temps','Temps unitaire','Temps X 1']));
    const cat=normalizeCat(val(r,['Filtre','Catégorie','Categorie','Phase']));
    const opt=String(val(r,['Options','Option'])||'').trim();
    const rule=String(val(r,['Règle option','Regle option','Règle','Regle'])||'').trim();
    if(!name && !desc) return null;
    const o={id:name||('OF-'+(i+1)), order:order||i+1, name:name||('OF-'+(i+1)), desc, time, category:cat, priority:catPriority(cat), option:''};
    if(opt.toUpperCase().startsWith('OPTION')) o.option=opt.toUpperCase();
    if(rule.toUpperCase().includes('SUPPRIMER SI')){
      const m=rule.toUpperCase().match(/OPTION\s+.+/);
      o.removeIfOption=m ? m[0].trim() : rule.toUpperCase().replace('SUPPRIMER SI','').trim();
    } else if(opt.toUpperCase().includes('SUPPRIMER SI')){
      const m=opt.toUpperCase().match(/OPTION\s+.+/);
      o.removeIfOption=m ? m[0].trim() : opt.toUpperCase().replace('SUPPRIMER SI','').trim();
      o.option='';
    }
    return o;
  }).filter(Boolean).sort((a,b)=>a.order-b.order);
}
async function importExcelBases(){

  if(fm){ const rows=await readExcelFile(fm); if(rows.length){ state.customTemplates.Mercedes=rows; imported.push('Mercedes '+rows.length+' OF'); } }

  closeModal(); save(); alert('Import terminé : '+imported.join(' / '));
}

   les fichiers Excel du dossier sans sélection de l'utilisateur.

state.customTemplates = {Renault:[], Mercedes:[], MAN:[]};
window.excelBasesLoaded = {Renault:false, Mercedes:false, MAN:false};

function templateForBrand(brand){
  const rows = state.customTemplates && state.customTemplates[brand];
  return Array.isArray(rows) ? rows : [];
}
function optionsForBrand(brand){
  return [...new Set(templateForBrand(brand).map(o=>o.option).filter(Boolean))];
}
function buildOFsForVehicle(brand, includeBase, selectedOptions){
  const opts=new Set(selectedOptions||[]);
  return templateForBrand(brand).filter(o=>{
    if(o.removeIfOption && opts.has(o.removeIfOption)) return false;
    if(o.option) return opts.has(o.option);
    return includeBase;
  }).map(o=>({...o,id:uid(),status:'À faire',doneBy:'',doneAt:'',blockReason:''}));
}

async function importExcelBases(){
  const fr=document.getElementById('excelRenault')?.files?.[0];
  const fm=document.getElementById('excelMercedes')?.files?.[0];
  const fman=document.getElementById('excelMan')?.files?.[0];
  let imported=[];
  if(fr){
    const rows=await readExcelFile(fr);
    state.customTemplates.Renault=rows||[];
    window.excelBasesLoaded.Renault=!!rows.length;
    imported.push('Renault : '+rows.length+' OF');
  }
  if(fm){
    const rows=await readExcelFile(fm);
    state.customTemplates.Mercedes=rows||[];
    window.excelBasesLoaded.Mercedes=!!rows.length;
    imported.push('Mercedes : '+rows.length+' OF');
  }
  if(fman){
    const rows=await readExcelFile(fman);
    state.customTemplates.MAN=rows||[];
    window.excelBasesLoaded.MAN=!!rows.length;
    imported.push('MAN : '+rows.length+' OF');
  }
  if(!imported.length){ alert('Aucun fichier Excel sélectionné. Les bases restent vides.'); return; }
  logAction('Bases Excel chargées',null,null,imported.join(' / '));
  closeModal();
  // On sauvegarde les véhicules mis à jour, mais au prochain lancement les bases seront volontairement vides tant que tu ne recharges pas les Excel.
  localStorage.setItem(LS, JSON.stringify({...state, customTemplates:{Renault:[],Mercedes:[],MAN:[]}}));
  render();
  alert('Bases chargées pour les nouveaux véhicules uniquement :\n' + imported.join('\n'));
}

/* ===== V31 SAV : véhicule spécial sans OF ===== */
function isSAV(v){ return !!(v && v.isSAV); }
const _oldDoneOf = doneOf;
doneOf = function(v){
  if(isSAV(v)) return v.savDone ? 1 : 0;
  return (v.ofs||[]).filter(o=>o.status==='Fait').length;
}
const _oldPct = pct;
pct = function(v){
  if(isSAV(v)){
    const est=Number(v.savEstimated)||0, act=Number(v.savActual)||0;
    if(v.savDone) return 100;
    if(!est) return 0;
    return Math.min(100, Math.round((act/est)*100));
  }
  return (v.ofs||[]).length ? Math.round(doneOf(v)/(v.ofs||[]).length*100) : 0;
}
const _oldRemain = remain;
remain = function(v){
  if(isSAV(v)){
    if(v.savDone) return 0;
    return Math.max((Number(v.savEstimated)||0)-(Number(v.savActual)||0),0);
  }
  return (v.ofs||[]).filter(o=>o.status!=='Fait').reduce((s,o)=>s+(Number(o.time)||0),0);
}

  let v=id ? state.vehicles.find(x=>x.id===id) : {id:'',vin:'',brand:'SAV',client:'SDIS 33',type:'SAV',priority:1,color:'#ef4444',savEstimated:1,savActual:0,savComment:'',savDone:false,isSAV:true};
  openModal(id?'Modifier SAV':'Nouveau SAV',`<div class="form">
    <label>VIN / Référence<input id="savVin" value="${v.vin||''}" placeholder="Ex : VIN100 ou SAV-001"></label>
    <label>Client<input id="savClient" value="${v.client||'SDIS 33'}"></label>
    <label>Priorité<input type="number" id="savPrio" value="${v.priority||1}"></label>
    <label>Couleur<input type="color" id="savColor" value="${v.color||'#ef4444'}"></label>
    <label>Temps prévu SAV (h)<input type="number" step="0.01" id="savEstimated" value="${v.savEstimated||0}"></label>
    <label>Temps réel passé (h)<input type="number" step="0.01" id="savActual" value="${v.savActual||0}"></label>
    <label class="checkrow full"><input type="checkbox" id="savDone" ${v.savDone?'checked':''}> <span>SAV terminé</span></label>
    <label class="full">Commentaire / Travail réalisé<textarea id="savComment" placeholder="Explique ce qui a été fait sur le SAV...">${v.savComment||''}</textarea></label>
    <div class="full actions"><button onclick="saveSAV('${id||''}')">Enregistrer</button><button class="alt" onclick="closeModal()">Annuler</button></div>
  </div>`);
}
function saveSAV(id){
  let isNew=!id;
  let v=id?state.vehicles.find(x=>x.id===id):null;
  if(!v){ v={id:uid(),ofs:[],isSAV:true}; state.vehicles.push(v); }
  Object.assign(v,{
    isSAV:true,
    vin:savVin.value.trim() || ('SAV-'+(state.vehicles.length+1)),
    brand:'SAV',
    client:savClient.value || '',
    type:'SAV',
    priority:Number(savPrio.value)||1,
    color:savColor.value || '#ef4444',
    savEstimated:Number(savEstimated.value)||0,
    savActual:Number(savActual.value)||0,
    savComment:savComment.value.trim(),
    savDone:!!savDone.checked,
    ofs:[]
  });
  logAction(isNew?'SAV créé':'SAV modifié',v,null,`Prévu ${fmt(v.savEstimated)} • Réel ${fmt(v.savActual)}`);
  closeModal(); save();
}

  state.customTemplates = state.customTemplates || {Renault:[],Mercedes:[],MAN:[]};

  const fm=document.getElementById('excelMercedes')?.files?.[0];

function personVacations(p){ p.vacations = Array.isArray(p.vacations) ? p.vacations : []; return p.vacations; }
function isPersonOnVacation(p,d){
  const day=ymd(d);
  return personVacations(p).some(v=> day >= v.start && day <= v.end);
}
const _v33OldIntervalsForDay = intervalsForDay;
intervalsForDay = function(p,d){
  if(isPersonOnVacation(p,d)) return [];
  return _v33OldIntervalsForDay(p,d);
}
const _v33OldNormalizePeople = normalizePeople;
normalizePeople = function(){
  _v33OldNormalizePeople();
  state.people.forEach(p=>{ p.vacations = Array.isArray(p.vacations) ? p.vacations : []; });
}

function vacationsHtml(p){

function saveStatusOF(vid,oid){
  const v=state.vehicles.find(x=>x.id===vid); const o=v?.ofs?.find(x=>x.id===oid);
  if(!v || !o) return;
  const newStatus=document.getElementById('statusOF')?.value || 'À faire';
  const person=document.getElementById('statusPerson')?.value || '';
  const reason=(document.getElementById('statusReason')?.value || '').trim();
  o.status=newStatus;
  if(newStatus==='Fait'){
    o.doneBy=person || o.doneBy || '';
    o.doneAt=o.doneAt || new Date().toISOString();
    o.blockReason='';
  }else if(newStatus==='Bloqué'){
    if(!reason){ alert('Écris une raison de blocage.'); return; }
    o.doneBy=person || o.doneBy || '';
    o.doneAt=new Date().toISOString();
    o.blockReason=reason;
  }else{
    o.doneBy='';
    o.doneAt='';
    o.blockReason='';
  }
  logAction('Statut OF modifié',v,o,newStatus+(reason?' : '+reason:''));
  closeModal(); save(); page='detail'; state.detailVin=vid; render();
}

function sameOptionsV36(a,b){ a=[...(a||[])].sort(); b=[...(b||[])].sort(); return JSON.stringify(a)===JSON.stringify(b); }
function syncVehicleOFsV36(v, includeBase, opts){
  const desired=buildOFsForVehicle(v.brand, includeBase, opts);
  const old=v.ofs||[];
  const oldByKey=new Map(old.map(o=>[optKeyV36(o),o]));
  const desiredKeys=new Set(desired.map(optKeyV36));
  const merged=desired.map(n=>{
    const oldO=oldByKey.get(optKeyV36(n));
    if(oldO){
      return {...n, id:oldO.id||n.id, status:oldO.status||'À faire', doneBy:oldO.doneBy||'', doneAt:oldO.doneAt||'', blockReason:oldO.blockReason||''};
    }
    return n;
  });
  // On garde les OF ajoutés à la main, mais on enlève les anciens OF automatiques qui ne correspondent plus aux options.
  old.forEach(o=>{
    if(!desiredKeys.has(optKeyV36(o)) && o.manual===true){ merged.push(o); }
  });
  v.ofs=merged.sort((a,b)=>(a.order||0)-(b.order||0));
}
function saveVehicle(id){
  const isNew=!id;
  let v=id?state.vehicles.find(x=>x.id===id):null;
  if(!v){v={id:uid(),ofs:[]};state.vehicles.push(v)}
  const oldBrand=v.brand;
  const oldBase=v.selectedBase!==false;
  const oldOpts=Array.isArray(v.selectedOptions)?v.selectedOptions.slice():[];
  Object.assign(v,{vin:vin.value.trim(),brand:brand.value,client:client.value,type:type.value,priority:Number(prio.value)||1,color:color.value});
  const hasTemplate=templateForBrand(v.brand).length>0;
  if(hasTemplate){
    const includeBase=!!document.getElementById('createBase')?.checked;
    const opts=selectedOptionValues();
    const changed=isNew || oldBrand!==v.brand || oldBase!==includeBase || !sameOptionsV36(oldOpts,opts);
    v.selectedBase=includeBase;
    v.selectedOptions=opts;
    if(isNew){
      v.ofs=buildOFsForVehicle(v.brand, includeBase, opts);
    }else if(changed){
      const ok=confirm('Tu as modifié la marque / base / options.\n\nMettre à jour automatiquement la liste des OF du camion ?\n\nOK = ajoute/supprime les OF automatiques selon les options, en gardant les statuts des OF identiques.\nAnnuler = garde la liste OF actuelle et modifie seulement les infos/options affichées.');
      if(ok) syncVehicleOFsV36(v, includeBase, opts);
    }
  }else{
    v.selectedBase=false;
    v.selectedOptions=[];
  }
  logAction(isNew?'Véhicule créé':'Véhicule modifié',v,null,'');
  state.realVin=v.id;
  closeModal(); save();
}
// Les OF ajoutés depuis la fiche camion sont marqués comme manuels pour ne pas être supprimés lors d'un changement d'option.
const saveOF_V36_previous = saveOF;
saveOF = function(oid){
  let beforeIds=new Set();
  state.vehicles.forEach(v=>(v.ofs||[]).forEach(o=>beforeIds.add(o.id)));
  saveOF_V36_previous(oid);
  if(!oid){
    state.vehicles.forEach(v=>(v.ofs||[]).forEach(o=>{ if(!beforeIds.has(o.id)) o.manual=true; }));
    save();
  }
};



/* ===== V37 navigateur : sauvegarde / restauration complète pour migrer entre versions ===== */
function backupAllV37(){
  try{
    const payload={
      app:'Suivi OF Simple',
      backupVersion:37,
      exportedAt:new Date().toISOString(),
      state:state,
      basesExcel: (typeof BASES_LS!=='undefined') ? JSON.parse(localStorage.getItem(BASES_LS)||'{}') : {},
      storageKey: (typeof LS!=='undefined') ? LS : ''
    };
    const date=new Date().toISOString().slice(0,10);
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='sauvegarde_suivi_of_'+date+'.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }catch(e){
    alert('Erreur sauvegarde : '+e.message);
  }
}
function restoreAllV37(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='.json,application/json';
  input.onchange=()=>{
    const file=input.files&&input.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        let newState=data.state || data.appState || data;
        if(!newState || !Array.isArray(newState.vehicles)) throw new Error('Ce fichier ne ressemble pas à une sauvegarde Suivi OF.');
        if(!confirm('Restaurer cette sauvegarde ?\n\nAttention : ça remplace les données actuellement affichées par celles du fichier.')) return;
        state=newState;
        if(typeof normalizeAll==='function') normalizeAll();
        localStorage.setItem(LS, JSON.stringify(state));
        if(data.basesExcel && typeof BASES_LS!=='undefined'){
          localStorage.setItem(BASES_LS, JSON.stringify(data.basesExcel));
          if(typeof loadPersistedBases==='function') loadPersistedBases();
        }
        alert('Restauration terminée. Tes véhicules, OF, avancements, personnes, archives et blocages sont récupérés.');
        render();
      }catch(e){
        alert('Impossible de restaurer : '+e.message);
      }
    };
    reader.readAsText(file,'utf-8');
  };
  input.click();
}

<!-- ===== V10 WEB : fonctions validées en laboratoire local V9 ===== -->
<script>

(function(){
  function phaseStatsV2(v, category){
    const list=(v.ofs||[]).filter(o=>(o.category||'')===category);
    const total=list.length;
    const done=list.filter(o=>o.status==='Fait').length;
    return {total,done,pct:total?Math.round(done/total*100):0};
  }
  function phaseProgressHtmlV2(v){
    if(typeof isSAV==='function' && isSAV(v)){
      return `<div class="progress"><div class="bar" style="width:${pct(v)}%"></div></div><div class="muted">${fmt(v.savActual||0)} / ${fmt(v.savEstimated||0)}</div>`;
    }
    const phases=['Fabrication','Prémontage','Pose'];
    return `<div class="phaseProgress">${phases.map(cat=>{
      const s=phaseStatsV2(v,cat);
      return `<div class="phaseLine"><span class="phaseName">${cat}</span><div class="progress"><div class="bar" style="width:${s.pct}%"></div></div><span class="phasePct">${s.pct}%</span></div><div class="muted" style="margin:-4px 0 0 100px">${s.done}/${s.total} OF</div>`;
    }).join('')}</div>`;
  }

  vehicleTable = function(list,est=null,isArchive=false){
    normalizeAll(); est=est||estimateVehiclesActive();
    return `<div class="tablewrap"><table><thead><tr><th>VIN</th><th>Marque</th><th>Client</th><th>Options</th><th>Priorité</th><th>Avancement par phase</th><th>OF bloqués</th><th>Restant</th><th>${isArchive?'Archivé le':'Fin estimée'}</th><th>Actions</th></tr></thead><tbody>${list.map(v=>{
      const sav=isSAV(v);
      const b=sav?0:blockedCount(v);
      const archivedDate=v.archivedAt?new Date(v.archivedAt).toLocaleDateString('fr-FR'):'-';
      const actions=isArchive
        ? `<button class="small good" onclick="openVehicleDetail('${v.id}')">Ouvrir</button><button class="small alt" onclick="restoreVehicle('${v.id}')">Restaurer</button><button class="small bad" onclick="delVehicle('${v.id}')">Suppr.</button>`
        : sav
          ? `<button class="small good" onclick="openVehicleDetail('${v.id}')">Ouvrir</button><button class="small alt" onclick="openSAV('${v.id}')">Modifier SAV</button><button class="small warn" onclick="archiveVehicle('${v.id}')">Archiver</button><button class="small bad" onclick="delVehicle('${v.id}')">Suppr.</button>`
          : `<button class="small good" onclick="openVehicleDetail('${v.id}')">Ouvrir</button><button class="small alt" onclick="openVehicle('${v.id}')">Modifier</button><button class="small warn" onclick="archiveVehicle('${v.id}')">Archiver</button><button class="small bad" onclick="delVehicle('${v.id}')">Suppr.</button>`;
      const options=sav?`<span class="savbadge ${v.savDone?'savdone':''}">${v.savDone?'SAV terminé':'SAV'}</span>`:`<div class="optionchips">${vehicleOptionsHtml(v)}</div>`;
      const finLabel=isArchive?archivedDate:(sav?(v.savDone?'Terminé':'SAV en cours'):(remain(v)>0?fmtDate(est[v.id]):'Terminé'));
      const finSub=isArchive?'<div class="muted">hors tableau de bord</div>':(sav?'<div class="muted">temps réel / prévu</div>':'<div class="muted">hors week-end et fériés</div>');
      return `<tr class="vehicleRow ${b?'blockedrow':''}" style="--vehColor:${vehicleColor(v)}">
        <td><div class="vinbox">${colorDot(v)}<b>${v.vin}</b></div><div class="muted">${v.type||'CCF'}${v.archived?' • Archivé':''}</div></td>
        <td>${sav?'SAV':(v.brand||'-')}</td><td>${v.client||'-'}</td><td>${options}</td><td>${v.priority||1}</td>
        <td>${phaseProgressHtmlV2(v)}</td>
        <td><b class="${b?'dangertext':''}">${b}</b>${b?'<div class="muted">à traiter</div>':'<div class="muted">aucun</div>'}</td>
        <td><b>${fmt(remain(v))}</b></td><td><b>${finLabel}</b>${finSub}</td><td class="actions">${actions}</td></tr>`;
    }).join('')}</tbody></table></div>`;
  };

  function activeNormalVehiclesV2(){ return activeVehicles().filter(v=>!isSAV(v)); }
  function allBulkOFsV2(){
    const map=new Map();
    activeNormalVehiclesV2().forEach(v=>(v.ofs||[]).forEach(o=>{
      const name=String(o.name||'').trim();
      if(!name) return;
      if(!map.has(name)) map.set(name,{name,desc:o.desc||'',category:o.category||'',count:0});
      map.get(name).count++;
    }));
    return Array.from(map.values()).sort((a,b)=>{
      const an=Number(String(a.name).replace(/\D/g,'')), bn=Number(String(b.name).replace(/\D/g,''));
      if(Number.isFinite(an)&&Number.isFinite(bn)&&an!==bn) return an-bn;
      return a.name.localeCompare(b.name,'fr',{numeric:true,sensitivity:'base'});
    });
  }
  function bulkOFForVehicleV2(v,name){ return (v.ofs||[]).find(o=>String(o.name||'').trim()===name); }
  function escAttrV2(v){ return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  window.bulkChooseOFV2=function(){
    state.bulkOFName=document.getElementById('bulkOFSelect')?.value||'';
    try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
    real();
  };
  window.bulkSelectAllV2=function(checked){
    document.querySelectorAll('.bulkVinCheck:not(:disabled)').forEach(x=>x.checked=checked);
    bulkUpdateCountV2();
  };
  window.bulkUpdateCountV2=function(){
    const n=document.querySelectorAll('.bulkVinCheck:checked:not(:disabled)').length;
    const el=document.getElementById('bulkCountV2'); if(el) el.textContent=n+' VIN sélectionné'+(n>1?'s':'');
    const btn=document.getElementById('bulkValidateBtnV2'); if(btn) btn.textContent='Valider sur '+n+' VIN'+(n>1?'s':'');
  };
  window.bulkValidateSelectedV2=function(){
    const ofName=state.bulkOFName||'';
    const person=state.realPerson||'';
    const ids=Array.from(document.querySelectorAll('.bulkVinCheck:checked:not(:disabled)')).map(x=>x.value);
    if(!ofName){ alert('Choisis un OF.'); return; }
    if(!person){ alert('Choisis une personne.'); return; }
    if(!ids.length){ alert('Sélectionne au moins un VIN.'); return; }
    if(!confirm(`Marquer ${ofName} comme FAIT sur ${ids.length} VIN pour ${person} ?`)) return;
    let count=0;
    ids.forEach(id=>{
      const v=state.vehicles.find(x=>x.id===id); const o=v?bulkOFForVehicleV2(v,ofName):null;
      if(!v||!o||o.status==='Fait') return;
      o.status='Fait'; o.doneBy=person; o.doneAt=new Date().toISOString(); o.blockReason='';
      logAction('OF fait (validation multiple)',v,o,'Validation groupée'); count++;
    });
    logAction('Validation multiple terminée',null,null,ofName+' • '+count+' VIN • '+person);
    save();
    alert(count+' OF validé'+(count>1?'s':'')+'.');
    real();
  };

  function bulkPanelV2(act){
    const ofs=allBulkOFsV2();
    if(!ofs.length) return '<div class="card bulkCard">Aucun OF disponible pour la validation multiple.</div>';
    if(!state.bulkOFName || !ofs.some(x=>x.name===state.bulkOFName)) state.bulkOFName=ofs[0].name;
    const selected=ofs.find(x=>x.name===state.bulkOFName)||ofs[0];
    const options=ofs.map(x=>`<option value="${escAttrV2(x.name)}" ${x.name===selected.name?'selected':''}>${escAttrV2(x.name)} — ${escAttrV2(x.desc||x.category)} (${x.count} VIN)</option>`).join('');
    const vehicles=act.map(v=>({v,o:bulkOFForVehicleV2(v,selected.name)})).filter(x=>x.o);
    const vinHtml=vehicles.map(({v,o})=>{
      const done=o.status==='Fait';
      const info=done?`Déjà fait${o.doneBy?' par '+o.doneBy:''}`:(o.status==='Bloqué'?'Bloqué — sera passé en Fait':'À faire');
      return `<label class="bulkVin ${done?'done':''}"><input class="bulkVinCheck" type="checkbox" value="${escAttrV2(v.id)}" ${done?'checked disabled':''} onchange="bulkUpdateCountV2()"><span class="bulkVinText"><b>${escAttrV2(v.vin)}</b><small>${escAttrV2(info)}</small></span></label>`;
    }).join('');
    return `<div class="card bulkCard">
      <div class="bulkHead"><div><b style="font-size:18px">⚡ Validation multiple d'un OF</b><div class="muted" style="margin-top:5px">Choisis un OF, coche les VIN concernés, puis valide tout en une seule fois.</div></div><span class="pill">${vehicles.length} VIN avec cet OF</span></div>
      <div class="toolbar filterbar" style="margin-top:14px"><label>OF <select id="bulkOFSelect" onchange="bulkChooseOFV2()" style="min-width:330px">${options}</select></label><label>Personne <select onchange="state.realPerson=this.value;save();real()">${(state.people||[]).map(p=>`<option ${state.realPerson===personName(p)?'selected':''}>${escAttrV2(personName(p))}</option>`).join('')}</select></label></div>
      <div class="bulkVinGrid">${vinHtml||'<div class="muted">Aucun véhicule actif ne contient cet OF.</div>'}</div>
      <div class="bulkActions"><button class="small alt" onclick="bulkSelectAllV2(true)">Tout sélectionner</button><button class="small alt" onclick="bulkSelectAllV2(false)">Tout décocher</button><span id="bulkCountV2" class="bulkCount">0 VIN sélectionné</span><button id="bulkValidateBtnV2" class="good" onclick="bulkValidateSelectedV2()">Valider sur 0 VIN</button></div>
    </div>`;
  }

  real = function(){
    normalizeAll();
    setHead('Réalisation','');
    const act=activeNormalVehiclesV2();
    if(!act.length){ view.innerHTML='<div class="card">Aucun véhicule actif avec OF à réaliser.</div>'; return; }
    if(!act.some(v=>v.id===state.realVin)) state.realVin=act[0].id;
    if(!state.realPerson && state.people[0]) state.realPerson=personName(state.people[0]);
    state.realFilter=state.realFilter||'Tous';
    const vehicleOptions=act.map(v=>`<option value="${v.id}" ${state.realVin===v.id?'selected':''}>${v.vin} • ${v.brand||''}</option>`).join('');
    const personOptions=state.people.map(p=>`<option ${state.realPerson===personName(p)?'selected':''}>${personName(p)}</option>`).join('');
    const filters=['Tous','Fabrication','Prémontage','Pose','Essais','Autre','Bloqué'];
    const filterOptions=filters.map(f=>`<option ${state.realFilter===f?'selected':''}>${f}</option>`).join('');
    const v=act.find(x=>x.id===state.realVin);
    let list=v?(v.ofs||[]).filter(o=>o.status!=='Fait'):[];
    if(state.realFilter==='Bloqué') list=list.filter(o=>o.status==='Bloqué'); else if(state.realFilter!=='Tous') list=list.filter(o=>(o.category||'')===state.realFilter);
    const rows=list.sort((a,b)=>(a.order||0)-(b.order||0)).map(o=>[v,o]);
    view.innerHTML=`${bulkPanelV2(act)}<br><div class="card"><div class="toolbar filterbar"><label>VIN <select id="realVin" onchange="state.realVin=this.value;save();real()">${vehicleOptions}</select></label><label>Personne <select id="realPerson" onchange="state.realPerson=this.value;save();real()">${personOptions}</select></label><label>Filtre <select id="realFilter" onchange="state.realFilter=this.value;save();real()">${filterOptions}</select></label></div></div><br>${ofTable(rows,true,false)}`;
    bulkUpdateCountV2();
  };

  // V10 WEB : aucune donnée de démonstration n'est embarquée sur le site de production.
  // Rafraîchit l'écran pour afficher immédiatement le mode Réalisation.
  render();
})();

</script>
<script>

(function(){
  function escV3(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function activeNormalV3(){return activeVehicles().filter(v=>!isSAV(v));}
  function ofKeyV3(o){return [String(o.name||'').trim(),String(o.category||'').trim(),String(o.desc||'').trim()].join('|||');}
  function encodeKeyV3(k){return encodeURIComponent(k);}
  function decodeKeyV3(k){try{return decodeURIComponent(k);}catch(e){return k;}}
  function ofForVehicleV3(v,key){return (v.ofs||[]).find(o=>ofKeyV3(o)===key);}
  const phaseOrderV3={'Fabrication':1,'Prémontage':2,'Pose':3,'Essais':4,'Autre':5};

  function groupedOFsV3(){
    const act=activeNormalV3(), map=new Map();
    act.forEach(v=>{
      const seen=new Set();
      (v.ofs||[]).forEach(o=>{
        const key=ofKeyV3(o); if(!o.name || seen.has(key)) return; seen.add(key);
        if(!map.has(key)) map.set(key,{key,name:o.name,desc:o.desc||'',category:o.category||'Autre',time:Number(o.time)||0,order:Number(o.order)||99999,total:0,done:0,blocked:0,todo:0});
        const g=map.get(key); g.total++;
        if(o.status==='Fait') g.done++; else if(o.status==='Bloqué') g.blocked++; else g.todo++;
        g.order=Math.min(g.order,Number(o.order)||99999);
      });
    });
    return Array.from(map.values()).sort((a,b)=>(phaseOrderV3[a.category]||99)-(phaseOrderV3[b.category]||99)||a.order-b.order||String(a.name).localeCompare(String(b.name),'fr',{numeric:true,sensitivity:'base'}));
  }

  function ofRowV4(g){
    const p=g.total?Math.round(g.done/g.total*100):0;
    const complete=g.done===g.total && g.total>0;
    const remaining=Math.max(0,g.total-g.done);
    const status=complete
      ? '<span class="pill" style="background:#064e3b;color:#bbf7d0">✓ Terminé</span>'
      : `<span class="pill">${g.done}/${g.total} faits</span>`;
    const blocked=g.blocked
      ? `<span class="dangertext">${g.blocked}</span><div class="muted">bloqué${g.blocked>1?'s':''}</div>`
      : '<span class="muted">0</span>';
    return `<tr class="${complete?'ofRowCompleteV4':''}">
      <td><b>${g.order===99999?'-':escV3(g.order)}</b></td>
      <td><b>${escV3(g.name)}</b><div class="muted">${escV3(g.category)}</div></td>
      <td class="desc">${escV3(g.desc||'Sans description')}</td>
      <td><b>${fmt(g.time)}</b></td>
      <td><div class="progress ofProgressV4"><div class="bar" style="width:${p}%"></div></div><div class="muted"><b>${g.done}/${g.total}</b> faits • ${remaining} restant${remaining>1?'s':''}</div></td>
      <td>${blocked}</td>
      <td>${status}</td>
      <td class="actions"><button class="small ${complete?'alt':'good'}" ${complete?'disabled':''} onclick="openBulkOFV3('${encodeKeyV3(g.key)}')">${complete?'✓ Terminé':'Valider sur plusieurs VIN'}</button></td>
    </tr>`;
  }

  function ofListTableV4(groups){
    if(!groups.length) return '<div class="card">Aucun OF ne correspond à ce filtre.</div>';
    return `<div class="tablewrap ofListWrapV4"><table class="ofListTableV4"><thead><tr><th>Ordre</th><th>OF</th><th>Description</th><th>Temps</th><th>Avancement</th><th>Bloqués</th><th>Statut</th><th>Actions</th></tr></thead><tbody>${groups.map(ofRowV4).join('')}</tbody></table></div>`;
  }

  function filteredGroupsV3(){
    let groups=groupedOFsV3();
    const q=(document.getElementById('ofSearchV3')?.value||state.ofSearchV3||'').trim().toLowerCase();
    const cat=document.getElementById('ofPhaseV3')?.value||state.ofPhaseV3||'Tous';
    const status=document.getElementById('ofStatusV3')?.value||state.ofStatusV3||'À valider';
    if(cat!=='Tous') groups=groups.filter(g=>g.category===cat);
    if(status==='À valider') groups=groups.filter(g=>g.done<g.total);
    if(status==='Terminés') groups=groups.filter(g=>g.done===g.total && g.total>0);
    if(q) groups=groups.filter(g=>[g.name,g.desc,g.category].join(' ').toLowerCase().includes(q));
    return groups;
  }

  window.v3RenderOFList=function(){
    const search=document.getElementById('ofSearchV3'), phase=document.getElementById('ofPhaseV3'), status=document.getElementById('ofStatusV3');
    if(search) state.ofSearchV3=search.value; if(phase) state.ofPhaseV3=phase.value; if(status) state.ofStatusV3=status.value;
    try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
    const box=document.getElementById('ofListV4'); if(!box) return;
    const groups=filteredGroupsV3();
    box.innerHTML=ofListTableV4(groups);
  };

  window.setRealModeV3=function(mode){
    state.realModeV3=mode==='of'?'of':'vin';
    try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
    real();
  };

  function renderByVinV3(act){
    if(!act.some(v=>v.id===state.realVin)) state.realVin=act[0]?.id||'';
    if(!state.realPerson && state.people[0]) state.realPerson=personName(state.people[0]);
    state.realFilter=state.realFilter||'Tous';
    const vehicleOptions=act.map(v=>`<option value="${escV3(v.id)}" ${state.realVin===v.id?'selected':''}>${escV3(v.vin)} • ${escV3(v.brand||'')}</option>`).join('');
    const personOptions=(state.people||[]).map(p=>`<option ${state.realPerson===personName(p)?'selected':''}>${escV3(personName(p))}</option>`).join('');
    const filters=['Tous','Fabrication','Prémontage','Pose','Essais','Autre','Bloqué'];
    const filterOptions=filters.map(f=>`<option ${state.realFilter===f?'selected':''}>${escV3(f)}</option>`).join('');
    const v=act.find(x=>x.id===state.realVin);
    let list=v?(v.ofs||[]).filter(o=>o.status!=='Fait'):[];
    if(state.realFilter==='Bloqué') list=list.filter(o=>o.status==='Bloqué'); else if(state.realFilter!=='Tous') list=list.filter(o=>(o.category||'')===state.realFilter);
    const rows=list.sort((a,b)=>(a.order||0)-(b.order||0)).map(o=>[v,o]);
    return `<div class="modeHintV3"><b>Mode Par VIN :</b> tu travailles sur un camion précis, comme avant.</div><div class="card"><div class="toolbar filterbar"><label>VIN <select id="realVin" onchange="state.realVin=this.value;save();real()">${vehicleOptions}</select></label><label>Personne <select id="realPerson" onchange="state.realPerson=this.value;save();real()">${personOptions}</select></label><label>Filtre <select id="realFilter" onchange="state.realFilter=this.value;save();real()">${filterOptions}</select></label></div></div><br>${ofTable(rows,true,false)}`;
  }

  function renderByOFV3(){
    state.ofPhaseV3=state.ofPhaseV3||'Tous'; state.ofStatusV3=state.ofStatusV3||'À valider'; state.ofSearchV3=state.ofSearchV3||'';
    const cats=['Tous','Fabrication','Prémontage','Pose','Essais','Autre'];
    return `<div class="modeHintV3"><b>Mode Par OF :</b> même affichage en liste que le mode Par VIN. Chaque OF n'apparaît qu'une fois et peut être validé sur plusieurs VIN.</div>
      <div class="card"><div class="ofModeToolbar">
        <label class="ofSearch">Rechercher un OF<input id="ofSearchV3" value="${escV3(state.ofSearchV3)}" placeholder="N° OF ou description..." oninput="v3RenderOFList()"></label>
        <label>Phase<select id="ofPhaseV3" onchange="v3RenderOFList()">${cats.map(c=>`<option ${state.ofPhaseV3===c?'selected':''}>${escV3(c)}</option>`).join('')}</select></label>
        <label>Afficher<select id="ofStatusV3" onchange="v3RenderOFList()"><option ${state.ofStatusV3==='À valider'?'selected':''}>À valider</option><option ${state.ofStatusV3==='Tous'?'selected':''}>Tous</option><option ${state.ofStatusV3==='Terminés'?'selected':''}>Terminés</option></select></label>
      </div></div><br><div id="ofListV4"></div>`;
  }

  real=function(){
    normalizeAll(); setHead('Réalisation','');
    const act=activeNormalV3();
    if(!act.length){view.innerHTML='<div class="card">Aucun véhicule actif avec OF à réaliser.</div>';return;}
    state.realModeV3=state.realModeV3||'vin';
    const tabs=`<div class="realModeTabs"><button class="${state.realModeV3==='vin'?'active':''}" onclick="setRealModeV3('vin')">Par VIN</button><button class="${state.realModeV3==='of'?'active':''}" onclick="setRealModeV3('of')">Par OF</button></div>`;
    view.innerHTML=tabs+(state.realModeV3==='of'?renderByOFV3():renderByVinV3(act));
    if(state.realModeV3==='of') v3RenderOFList();
  };

  function currentGroupV3(){
    const key=window._bulkV3Key||''; return groupedOFsV3().find(g=>g.key===key);
  }
  function rowsForGroupV3(key){return activeNormalV3().map(v=>({v,o:ofForVehicleV3(v,key)})).filter(x=>x.o);}
  function vinButtonV3(v,o){
    const done=o.status==='Fait', blocked=o.status==='Bloqué', selected=window._bulkV3Selected?.has(v.id);
    const info=done?`✓ Déjà fait${o.doneBy?' par '+o.doneBy:''}`:(blocked?'Bloqué — '+(o.blockReason||'raison non précisée'):'À faire');
    return `<button type="button" class="vinChoiceV3 ${done?'done':''} ${blocked?'blocked':''} ${selected?'selected':''}" ${done?'disabled':''} onclick="toggleBulkVinV3('${escV3(v.id)}')"><b>${done?'✓ ':selected?'✓ ':''}${escV3(v.vin)}</b><small>${escV3(info)}</small></button>`;
  }
  function refreshBulkGridV3(){
    const g=currentGroupV3(); if(!g)return; const rows=rowsForGroupV3(g.key);
    const box=document.getElementById('vinChoiceGridV3'); if(box) box.innerHTML=rows.map(x=>vinButtonV3(x.v,x.o)).join('');
    const n=window._bulkV3Selected?.size||0, c=document.getElementById('bulkCountV3'), b=document.getElementById('bulkValidateV3');
    if(c)c.textContent=n+' VIN sélectionné'+(n>1?'s':''); if(b)b.textContent='✅ Valider sur '+n+' VIN'+(n>1?'s':'');
  }
  window.toggleBulkVinV3=function(id){
    window._bulkV3Selected=window._bulkV3Selected||new Set();
    if(window._bulkV3Selected.has(id)) window._bulkV3Selected.delete(id); else window._bulkV3Selected.add(id);
    refreshBulkGridV3();
  };
  window.bulkSelectModeV3=function(mode){
    const g=currentGroupV3(); if(!g)return; const rows=rowsForGroupV3(g.key); const set=new Set();
    if(mode!=='none') rows.forEach(({v,o})=>{if(o.status==='Fait')return; if(mode==='todo' && o.status!=='À faire')return; set.add(v.id);});
    window._bulkV3Selected=set; refreshBulkGridV3();
  };
  window.openBulkOFV3=function(encoded){
    const key=decodeKeyV3(encoded); const g=groupedOFsV3().find(x=>x.key===key); if(!g)return;
    window._bulkV3Key=key; window._bulkV3Selected=new Set();
    if(!state.realPerson && state.people[0]) state.realPerson=personName(state.people[0]);
    const people=(state.people||[]).map(p=>`<option value="${escV3(personName(p))}" ${state.realPerson===personName(p)?'selected':''}>${escV3(personName(p))}</option>`).join('');
    openModal('Validation sur plusieurs VIN',`<div class="bulkSummaryV3"><h3>${escV3(g.name)}</h3><div class="muted">${escV3(g.desc||'Sans description')} • ${escV3(g.category)} • ${fmt(g.time)}</div><div class="muted" style="margin-top:6px"><b>${g.done}/${g.total} déjà faits</b> • ${g.total-g.done} restant${g.total-g.done>1?'s':''}${g.blocked?' • '+g.blocked+' bloqué'+(g.blocked>1?'s':''):''}</div></div>
      <div class="bulkToolsV3"><button class="small alt" onclick="bulkSelectModeV3('all')">Tout sélectionner</button><button class="small alt" onclick="bulkSelectModeV3('todo')">Sélectionner les À faire</button><button class="small alt" onclick="bulkSelectModeV3('none')">Tout enlever</button><span class="spacer"></span><label>Personne<select id="bulkPersonV3">${people}</select></label></div>
      <div id="vinChoiceGridV3" class="vinChoiceGridV3"></div>
      <div class="bulkFooterV3"><span id="bulkCountV3" class="count">0 VIN sélectionné</span><button class="alt" onclick="closeModal()">Annuler</button><button id="bulkValidateV3" class="good validate" onclick="validateBulkV3()">✅ Valider sur 0 VIN</button></div>`);
    refreshBulkGridV3();
  };
  window.validateBulkV3=function(){
    const g=currentGroupV3(), ids=Array.from(window._bulkV3Selected||[]), person=document.getElementById('bulkPersonV3')?.value||state.realPerson||'';
    if(!g)return; if(!ids.length){alert('Sélectionne au moins un VIN.');return;} if(!person){alert('Choisis une personne.');return;}
    if(!confirm(`Marquer ${g.name} comme FAIT sur ${ids.length} VIN pour ${person} ?`))return;
    let count=0;
    ids.forEach(id=>{const v=state.vehicles.find(x=>x.id===id);const o=v?ofForVehicleV3(v,g.key):null;if(!v||!o||o.status==='Fait')return;o.status='Fait';o.doneBy=person;o.doneAt=new Date().toISOString();o.blockReason='';logAction('OF fait (multi-VIN)',v,o,'Validation groupée V3');count++;});
    state.realPerson=person; logAction('Validation multi-VIN terminée',null,null,g.name+' • '+count+' VIN • '+person); closeModal(); save(); state.realModeV3='of'; real();
  };

  // La V3 démarre directement sur le nouveau mode Par OF pour le tester visuellement.
  if(!state.realModeV3) state.realModeV3='of';
  render();
})();

</script>
<script>

(function(){
  const phaseOrderV5={'Fabrication':1,'Prémontage':2,'Pose':3,'Essais':4,'Autre':5};

  function escV5(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function qtyTotalV5(o){const n=Math.floor(Number(o?.quantity ?? o?.qty ?? 1));return Number.isFinite(n)&&n>0?n:1;}
  function qtyDoneV5(o){
    const total=qtyTotalV5(o);
    if(o&&o.completedQty!==undefined&&o.completedQty!==null&&o.completedQty!==''){
      const n=Math.floor(Number(o.completedQty)||0);return Math.max(0,Math.min(total,n));
    }
    return o?.status==='Fait'?total:0;
  }
  function qtyRemainingV5(o){return Math.max(0,qtyTotalV5(o)-qtyDoneV5(o));}
  function normalizeQtyOFV5(o){
    if(!o)return o;
    const total=qtyTotalV5(o),had=o.completedQty!==undefined&&o.completedQty!==null&&o.completedQty!=='';
    let done=had?Math.floor(Number(o.completedQty)||0):(o.status==='Fait'?total:0);
    done=Math.max(0,Math.min(total,done));o.quantity=total;o.completedQty=done;
    if(done>=total)o.status='Fait';else if(o.status==='Fait')o.status='À faire';
    return o;
  }
  function normalizeQtyAllV5(){
    try{
      if(state.customTemplates)Object.values(state.customTemplates).forEach(rows=>(rows||[]).forEach(o=>{o.quantity=qtyTotalV5(o);}));
      (state.vehicles||[]).forEach(v=>(v.ofs||[]).forEach(normalizeQtyOFV5));
    }catch(e){console.warn('Normalisation quantité V5',e);}
  }
  window.qtyTotalV5=qtyTotalV5;window.qtyDoneV5=qtyDoneV5;window.qtyRemainingV5=qtyRemainingV5;

  const buildOFsBeforeV5=buildOFsForVehicle;
  buildOFsForVehicle=function(brand,includeBase,selectedOptions){
    return buildOFsBeforeV5(brand,includeBase,selectedOptions).map(o=>{o.quantity=qtyTotalV5(o);o.completedQty=0;o.status='À faire';return o;});
  };

  readExcelFile=async function(file){
    if(!file)return[];
    if(!window.XLSX){alert("Lecture Excel indisponible dans ce navigateur. La version locale contient déjà ses bases intégrées.");return[];}
    const data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    return rows.map((r,i)=>{
      const order=parseNum(val(r,['Ordre','Order']));
      const name=String(val(r,['Nom','N°OF','N OF','OF','N°DESSIN','N DESSIN'])||'').trim();
      const desc=String(val(r,['Description','Desc'])||'').trim();
      const time=parseNum(val(r,['Temps X1','Temps','Temps unitaire','Temps X 1']));
      const quantity=Math.max(1,Math.floor(parseNum(val(r,['Quantité','Quantite','Qté','Qte','Qty','Quantity']))||1));
      const cat=normalizeCat(val(r,['Filtre','Catégorie','Categorie','Phase']));
      const opt=String(val(r,['Options','Option'])||'').trim(),rule=String(val(r,['Règle option','Regle option','Règle','Regle'])||'').trim();
      if(!name&&!desc)return null;
      const o={id:name||('OF-'+(i+1)),order:order||i+1,name:name||('OF-'+(i+1)),desc,time,quantity,category:cat,priority:catPriority(cat),option:''};
      if(opt.toUpperCase().startsWith('OPTION'))o.option=opt.toUpperCase();
      if(rule.toUpperCase().includes('SUPPRIMER SI')){const mm=rule.toUpperCase().match(/OPTION\s+.+/);o.removeIfOption=mm?mm[0].trim():rule.toUpperCase().replace('SUPPRIMER SI','').trim();}
      else if(opt.toUpperCase().includes('SUPPRIMER SI')){const mm=opt.toUpperCase().match(/OPTION\s+.+/);o.removeIfOption=mm?mm[0].trim():opt.toUpperCase().replace('SUPPRIMER SI','').trim();o.option='';}
      return o;
    }).filter(Boolean).sort((a,b)=>a.order-b.order);
  };

  const remainBeforeV5=remain;
  remain=function(v){if(typeof isSAV==='function'&&isSAV(v))return remainBeforeV5(v);return(v.ofs||[]).reduce((s,o)=>s+(Number(o.time)||0)*qtyRemainingV5(o),0);};
  function totalUnitsV5(v){return(v.ofs||[]).reduce((s,o)=>s+qtyTotalV5(o),0);}
  function doneUnitsV5(v){return(v.ofs||[]).reduce((s,o)=>s+qtyDoneV5(o),0);}
  pct=function(v){
    if(typeof isSAV==='function'&&isSAV(v)){const est=Number(v.savEstimated)||0,act=Number(v.savActual)||0;if(v.savDone)return 100;if(!est)return 0;return Math.min(100,Math.round(act/est*100));}
    const total=totalUnitsV5(v);return total?Math.round(doneUnitsV5(v)/total*100):0;
  };

  function phaseStatsV5(v,cat){const list=(v.ofs||[]).filter(o=>(o.category||'')===cat),total=list.reduce((s,o)=>s+qtyTotalV5(o),0),done=list.reduce((s,o)=>s+qtyDoneV5(o),0);return{total,done,pct:total?Math.round(done/total*100):0};}
  function phaseProgressHtmlV5(v){
    if(typeof isSAV==='function'&&isSAV(v))return`<div class="progress"><div class="bar" style="width:${pct(v)}%"></div></div><div class="muted">${fmt(v.savActual||0)} / ${fmt(v.savEstimated||0)}</div>`;
    return`<div class="phaseProgress">${['Fabrication','Prémontage','Pose'].map(cat=>{const s=phaseStatsV5(v,cat);return`<div class="phaseLine"><span class="phaseName">${cat}</span><div class="progress"><div class="bar" style="width:${s.pct}%"></div></div><span class="phasePct">${s.pct}%</span></div><div class="muted" style="margin:-4px 0 0 100px">${s.done}/${s.total} réalisation${s.total>1?'s':''}</div>`;}).join('')}</div>`;
  }

  estimateVehiclesActive=function(){
    normalizeAll();normalizeQtyAllV5();const people=state.people.filter(p=>personName(p));if(!people.length)return{};
    const now=new Date(),slots=people.map(p=>({p,free:nextWorkStart(p,now)||now})),result={};
    const vehicles=[...activeVehicles()].filter(v=>!isSAV(v)).sort((a,b)=>(Number(a.priority)||1)-(Number(b.priority)||1)||(a.vin||'').localeCompare(b.vin||''));
    for(const v of vehicles){const ofs=(v.ofs||[]).filter(o=>qtyRemainingV5(o)>0).sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0));let last=null;
      for(const o of ofs){slots.sort((a,b)=>a.free-b.free);const slot=slots[0],h=(Number(o.time)||0)*qtyRemainingV5(o);slot.free=addWorkHours(slot.p,slot.free,h)||slot.free;last=slot.free;}result[v.id]=last;}
    return result;
  };

  vehicleTable=function(list,est=null,isArchive=false){
    normalizeAll();normalizeQtyAllV5();est=est||estimateVehiclesActive();
    return`<div class="tablewrap"><table><thead><tr><th>VIN</th><th>Marque</th><th>Client</th><th>Options</th><th>Priorité</th><th>Avancement par phase</th><th>OF bloqués</th><th>Restant</th><th>${isArchive?'Archivé le':'Fin estimée'}</th><th>Actions</th></tr></thead><tbody>${list.map(v=>{
      const sav=isSAV(v),b=sav?0:blockedCount(v),archivedDate=v.archivedAt?new Date(v.archivedAt).toLocaleDateString('fr-FR'):'-';
      const actions=isArchive?`<button class="small good" onclick="openVehicleDetail('${v.id}')">Ouvrir</button><button class="small alt" onclick="restoreVehicle('${v.id}')">Restaurer</button><button class="small bad" onclick="delVehicle('${v.id}')">Suppr.</button>`:sav?`<button class="small good" onclick="openVehicleDetail('${v.id}')">Ouvrir</button><button class="small alt" onclick="openSAV('${v.id}')">Modifier SAV</button><button class="small warn" onclick="archiveVehicle('${v.id}')">Archiver</button><button class="small bad" onclick="delVehicle('${v.id}')">Suppr.</button>`:`<button class="small good" onclick="openVehicleDetail('${v.id}')">Ouvrir</button><button class="small alt" onclick="openVehicle('${v.id}')">Modifier</button><button class="small warn" onclick="archiveVehicle('${v.id}')">Archiver</button><button class="small bad" onclick="delVehicle('${v.id}')">Suppr.</button>`;
      const options=sav?`<span class="savbadge ${v.savDone?'savdone':''}">${v.savDone?'SAV terminé':'SAV'}</span>`:`<div class="optionchips">${vehicleOptionsHtml(v)}</div>`;
      const finLabel=isArchive?archivedDate:(sav?(v.savDone?'Terminé':'SAV en cours'):(remain(v)>0?fmtDate(est[v.id]):'Terminé')),finSub=isArchive?'<div class="muted">hors tableau de bord</div>':(sav?'<div class="muted">temps réel / prévu</div>':'<div class="muted">hors week-end et fériés</div>');
      return`<tr class="vehicleRow ${b?'blockedrow':''}" style="--vehColor:${vehicleColor(v)}"><td><div class="vinbox">${colorDot(v)}<b>${escV5(v.vin)}</b></div><div class="muted">${escV5(v.type||'CCF')}${v.archived?' • Archivé':''}</div></td><td>${sav?'SAV':escV5(v.brand||'-')}</td><td>${escV5(v.client||'-')}</td><td>${options}</td><td>${v.priority||1}</td><td>${phaseProgressHtmlV5(v)}</td><td><b class="${b?'dangertext':''}">${b}</b>${b?'<div class="muted">à traiter</div>':'<div class="muted">aucun</div>'}</td><td><b>${fmt(remain(v))}</b></td><td><b>${finLabel}</b>${finSub}</td><td class="actions">${actions}</td></tr>`;
    }).join('')}</tbody></table></div>`;
  };

  function statusHtmlV5(o){const t=qtyTotalV5(o),d=qtyDoneV5(o);if(o.status==='Bloqué')return`<span class="pill blocked">Bloqué</span>${o.blockReason?`<div class="blockedtxt">${escV5(o.blockReason)}</div>`:''}`;if(d>=t)return`<span class="qtyDonePillV5">✓ Fait ${d}/${t}</span>`;if(d>0)return`<span class="qtyPartialPillV5">En cours ${d}/${t}</span>`;return'<span class="pill">À faire</span>';}
  function qtyVisualV5(o){const t=qtyTotalV5(o),d=qtyDoneV5(o),p=t?Math.round(d/t*100):0;return`<div class="progress qtyProgressV5"><div class="bar" style="width:${p}%"></div></div><div class="qtyTextV5"><strong>${d}/${t}</strong> réalisé${t>1?'s':''} • ${t-d} restant${t-d>1?'s':''}</div>`;}

  window.addQtyDoneV5=function(vid,oid,amount=1,personOverride=''){
    const v=state.vehicles.find(x=>x.id===vid),o=v?.ofs?.find(x=>x.id===oid);if(!v||!o)return;normalizeQtyOFV5(o);
    const person=personOverride||state.realPerson||personName(state.people?.[0]);if(!person){alert('Choisis une personne.');return;}
    const add=Math.max(1,Math.floor(Number(amount)||1)),before=qtyDoneV5(o),after=Math.min(qtyTotalV5(o),before+add);
    o.completedQty=after;o.doneBy=person;o.doneAt=new Date().toISOString();o.blockReason='';o.status=after>=qtyTotalV5(o)?'Fait':'À faire';
    logAction('Quantité OF réalisée',v,o,`+${after-before} • ${after}/${qtyTotalV5(o)} • ${person}`);state.realPerson=person;save();
  };
  window.finishQtyV5=function(vid,oid){const v=state.vehicles.find(x=>x.id===vid),o=v?.ofs?.find(x=>x.id===oid);if(!v||!o)return;const rem=qtyRemainingV5(o);if(rem<=0)return;if(!confirm(`Marquer les ${rem} réalisation${rem>1?'s':''} restante${rem>1?'s':''} comme faites ?`))return;addQtyDoneV5(vid,oid,rem);};
  window.removeQtyDoneV5=function(vid,oid){const v=state.vehicles.find(x=>x.id===vid),o=v?.ofs?.find(x=>x.id===oid);if(!v||!o)return;normalizeQtyOFV5(o);if(qtyDoneV5(o)<=0)return;o.completedQty=Math.max(0,qtyDoneV5(o)-1);o.status=o.completedQty>=qtyTotalV5(o)?'Fait':'À faire';o.blockReason='';if(o.completedQty===0){o.doneBy='';o.doneAt='';}logAction('Quantité OF corrigée',v,o,`-1 • ${o.completedQty}/${qtyTotalV5(o)}`);save();};
  markDoneDirect=function(vid,oid){addQtyDoneV5(vid,oid,1,state.realPerson||'');};

  function realVinTableV5(v,list){
    if(!list.length)return'<div class="card">Aucun OF à réaliser avec ce filtre.</div>';
    return`<div class="tablewrap"><table class="ofQtyTableV5"><thead><tr><th>Ordre</th><th>OF</th><th>Description</th><th>Temps X1</th><th>Quantité</th><th>Réalisé</th><th>Statut</th><th>Actions</th></tr></thead><tbody>${list.map(o=>{const t=qtyTotalV5(o),d=qtyDoneV5(o);return`<tr class="${o.status==='Bloqué'?'blockedrow':''}"><td><b>${o.order||'-'}</b></td><td><b>${escV5(o.name)}</b><div class="muted">${escV5(o.category||'')}</div></td><td class="desc">${escV5(o.desc||'')}</td><td><b>${fmt(o.time)}</b></td><td><span class="qtyBadgeV5 ${t===1?'one':''}">× ${t}</span></td><td>${qtyVisualV5(o)}</td><td>${statusHtmlV5(o)}</td><td class="actions"><div class="qtyActionsV5"><button class="small good" onclick="addQtyDoneV5('${v.id}','${o.id}',1)">${t>1?'Fait +1':'Fait'}</button>${t>1&&d<t?`<button class="small alt" onclick="finishQtyV5('${v.id}','${o.id}')">Tout fait</button>`:''}<button class="small bad" onclick="blockOF('${v.id}','${o.id}',true)">Blocage</button><button class="small alt" onclick="openOF('${v.id}','${o.id}')">Modifier</button></div></td></tr>`;}).join('')}</tbody></table></div>`;
  }

  function ofKeyV5(o){return[String(o.name||'').trim(),String(o.category||'').trim(),String(o.desc||'').trim()].join('|||');}
  function encV5(s){return encodeURIComponent(s);}function decV5(s){try{return decodeURIComponent(s)}catch(e){return s}}
  function activeNormalV5(){return activeVehicles().filter(v=>!isSAV(v));}
  function ofForVehicleV5(v,key){return(v.ofs||[]).find(o=>ofKeyV5(o)===key);}
  function groupedOFsV5(){
    const map=new Map();
    activeNormalV5().forEach(v=>{const seen=new Set();(v.ofs||[]).forEach(o=>{const key=ofKeyV5(o);if(!o.name||seen.has(key))return;seen.add(key);normalizeQtyOFV5(o);
      if(!map.has(key))map.set(key,{key,name:o.name,desc:o.desc||'',category:o.category||'Autre',time:Number(o.time)||0,order:Number(o.order)||99999,vehicles:0,totalUnits:0,doneUnits:0,finishedVehicles:0,blockedVehicles:0});
      const g=map.get(key);g.vehicles++;g.totalUnits+=qtyTotalV5(o);g.doneUnits+=qtyDoneV5(o);if(qtyRemainingV5(o)===0)g.finishedVehicles++;if(o.status==='Bloqué')g.blockedVehicles++;g.order=Math.min(g.order,Number(o.order)||99999);
    });});
    return Array.from(map.values()).sort((a,b)=>(phaseOrderV5[a.category]||99)-(phaseOrderV5[b.category]||99)||a.order-b.order||String(a.name).localeCompare(String(b.name),'fr',{numeric:true,sensitivity:'base'}));
  }
  function filteredGroupsV5(){
    let groups=groupedOFsV5();const q=(document.getElementById('ofSearchV5')?.value||state.ofSearchV5||'').trim().toLowerCase(),cat=document.getElementById('ofPhaseV5')?.value||state.ofPhaseV5||'Tous',st=document.getElementById('ofStatusV5')?.value||state.ofStatusV5||'À valider';
    if(cat!=='Tous')groups=groups.filter(g=>g.category===cat);if(st==='À valider')groups=groups.filter(g=>g.doneUnits<g.totalUnits);if(st==='Terminés')groups=groups.filter(g=>g.doneUnits===g.totalUnits&&g.totalUnits>0);if(q)groups=groups.filter(g=>[g.name,g.desc,g.category].join(' ').toLowerCase().includes(q));return groups;
  }
  function ofListV5(groups){
    if(!groups.length)return'<div class="card">Aucun OF ne correspond à ce filtre.</div>';
    return`<div class="tablewrap"><table class="ofQtyTableV5"><thead><tr><th>Ordre</th><th>OF</th><th>Description</th><th>Temps X1</th><th>Qté totale</th><th>Avancement</th><th>VIN terminés</th><th>Bloqués</th><th>Actions</th></tr></thead><tbody>${groups.map(g=>{const p=g.totalUnits?Math.round(g.doneUnits/g.totalUnits*100):0,complete=g.doneUnits===g.totalUnits&&g.totalUnits>0;return`<tr class="${complete?'ofRowCompleteV4':''}"><td><b>${g.order===99999?'-':g.order}</b></td><td><b>${escV5(g.name)}</b><div class="muted">${escV5(g.category)}</div></td><td class="desc">${escV5(g.desc||'')}</td><td><b>${fmt(g.time)}</b></td><td><span class="qtyBadgeV5">× ${g.totalUnits}</span><div class="muted">${g.vehicles} VIN</div></td><td><div class="progress ofProgressV4"><div class="bar" style="width:${p}%"></div></div><div class="muted"><b>${g.doneUnits}/${g.totalUnits}</b> réalisés • ${g.totalUnits-g.doneUnits} restants</div></td><td><b>${g.finishedVehicles}/${g.vehicles}</b></td><td>${g.blockedVehicles?`<span class="dangertext">${g.blockedVehicles}</span>`:'<span class="muted">0</span>'}</td><td class="actions"><button class="small ${complete?'alt':'good'}" ${complete?'disabled':''} onclick="openBulkOFV5('${encV5(g.key)}')">${complete?'✓ Terminé':'Valider sur plusieurs VIN'}</button></td></tr>`;}).join('')}</tbody></table></div>`;
  }
  window.renderOFListV5=function(){const a=document.getElementById('ofSearchV5'),b=document.getElementById('ofPhaseV5'),c=document.getElementById('ofStatusV5');if(a)state.ofSearchV5=a.value;if(b)state.ofPhaseV5=b.value;if(c)state.ofStatusV5=c.value;try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}const box=document.getElementById('ofListV5');if(box)box.innerHTML=ofListV5(filteredGroupsV5());};
  window.setRealModeV5=function(mode){state.realModeV3=mode==='of'?'of':'vin';try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}real();};

  function renderByVinV5(act){
    if(!act.some(v=>v.id===state.realVin))state.realVin=act[0]?.id||'';if(!state.realPerson&&state.people[0])state.realPerson=personName(state.people[0]);state.realFilter=state.realFilter||'Tous';
    const vehicleOptions=act.map(v=>`<option value="${escV5(v.id)}" ${state.realVin===v.id?'selected':''}>${escV5(v.vin)} • ${escV5(v.brand||'')}</option>`).join(''),personOptions=(state.people||[]).map(p=>`<option ${state.realPerson===personName(p)?'selected':''}>${escV5(personName(p))}</option>`).join(''),filters=['Tous','Fabrication','Prémontage','Pose','Essais','Autre','Bloqué'],filterOptions=filters.map(f=>`<option ${state.realFilter===f?'selected':''}>${escV5(f)}</option>`).join('');
    const v=act.find(x=>x.id===state.realVin);let list=v?(v.ofs||[]).filter(o=>qtyRemainingV5(o)>0||o.status==='Bloqué'):[];
    if(state.realFilter==='Bloqué')list=list.filter(o=>o.status==='Bloqué');else if(state.realFilter!=='Tous')list=list.filter(o=>(o.category||'')===state.realFilter);list.sort((a,b)=>(a.order||0)-(b.order||0));
    return`<div class="qtyGuideV5"><b>Quantités :</b> lorsqu'un OF est à ×4, chaque clic sur <b>Fait +1</b> valide une réalisation. Il passe en Fait uniquement à 4/4.</div><div class="card"><div class="toolbar filterbar"><label>VIN <select id="realVin" onchange="state.realVin=this.value;save();real()">${vehicleOptions}</select></label><label>Personne <select id="realPerson" onchange="state.realPerson=this.value;save();real()">${personOptions}</select></label><label>Filtre <select id="realFilter" onchange="state.realFilter=this.value;save();real()">${filterOptions}</select></label></div></div><br>${realVinTableV5(v,list)}`;
  }
  function renderByOFV5(){
    state.ofPhaseV5=state.ofPhaseV5||'Tous';state.ofStatusV5=state.ofStatusV5||'À valider';state.ofSearchV5=state.ofSearchV5||'';const cats=['Tous','Fabrication','Prémontage','Pose','Essais','Autre'];

<script>

(function(){
  const TRACKED_PHASES_V6=['Fabrication','Prémontage','Pose'];
  function escV6(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function totalV6(o){return typeof qtyTotalV5==='function'?qtyTotalV5(o):Math.max(1,Number(o?.quantity)||1);}
  function doneV6(o){return typeof qtyDoneV5==='function'?qtyDoneV5(o):(o?.status==='Fait'?totalV6(o):Math.max(0,Number(o?.completedQty)||0));}
  function phasePctV6(v,cat){const list=(v?.ofs||[]).filter(o=>(o.category||'')===cat);const total=list.reduce((s,o)=>s+totalV6(o),0),done=list.reduce((s,o)=>s+doneV6(o),0);return total?Math.round(done/total*100):0;}
  function snapshotV6(v){return{global:typeof pct==='function'?pct(v):0,Fabrication:phasePctV6(v,'Fabrication'),Prémontage:phasePctV6(v,'Prémontage'),Pose:phasePctV6(v,'Pose')};}
  function eventsV6(){state.progressEventsV6=Array.isArray(state.progressEventsV6)?state.progressEventsV6:[];return state.progressEventsV6;}
  function vehicleEventsV6(vid){return eventsV6().filter(e=>e.vehicleId===vid).sort((a,b)=>new Date(a.at)-new Date(b.at));}
  function addStartIfNeededV6(v,before,at){if(vehicleEventsV6(v.id).length)return;const d=new Date(at||Date.now());d.setMilliseconds(Math.max(0,d.getMilliseconds()-1));eventsV6().push({id:uid(),vehicleId:v.id,vin:v.vin,ofId:'',ofName:'Début du suivi V6',category:'Global',person:'',qtyDelta:0,qtyAfter:0,qtyTotal:0,kind:'start',note:'Point de départ du suivi graphique',at:d.toISOString(),progress:before||snapshotV6(v)});}
  function recordV6(v,o,delta,person,kind='realisation',note='',before=null,at=null){if(!v)return;const when=at||new Date().toISOString();addStartIfNeededV6(v,before||snapshotV6(v),when);eventsV6().push({id:uid(),vehicleId:v.id,vin:v.vin,ofId:o?.id||'',ofName:o?.name||'',description:o?.desc||'',category:o?.category||'Global',person:person||'',qtyDelta:Number(delta)||0,qtyAfter:o?doneV6(o):0,qtyTotal:o?totalV6(o):0,kind,note,at:when,progress:snapshotV6(v)});}
  window.recordProgressEventV6=recordV6;
  function ensureBaselinesV6(){(state.vehicles||[]).filter(v=>!(typeof isSAV==='function'&&isSAV(v))).forEach(v=>{if(vehicleEventsV6(v.id).length)return;const hasProgress=(v.ofs||[]).some(o=>doneV6(o)>0);if(hasProgress){eventsV6().push({id:uid(),vehicleId:v.id,vin:v.vin,ofId:'',ofName:'État repris avant V6',category:'Global',person:'',qtyDelta:0,qtyAfter:0,qtyTotal:0,kind:'baseline',note:'Le détail antérieur à V6 n’était pas enregistré. Ce point reprend uniquement l’avancement existant.',at:new Date().toISOString(),progress:snapshotV6(v)});}});}

  // Enregistre chaque + quantité individuellement, avec la personne et l'heure.
  const oldAddQtyV6=window.addQtyDoneV5;
  if(typeof oldAddQtyV6==='function')window.addQtyDoneV5=function(vid,oid,amount=1,personOverride=''){
    const v=state.vehicles.find(x=>x.id===vid),o=v?.ofs?.find(x=>x.id===oid),beforeSnap=v?snapshotV6(v):null,before=o?doneV6(o):0;
    oldAddQtyV6(vid,oid,amount,personOverride);
    const v2=state.vehicles.find(x=>x.id===vid),o2=v2?.ofs?.find(x=>x.id===oid),after=o2?doneV6(o2):before,delta=after-before;
    if(v2&&o2&&delta){recordV6(v2,o2,delta,personOverride||o2.doneBy||state.realPerson||'','realisation',`+${delta} réalisation${delta>1?'s':''}`,beforeSnap);try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
    return after;
  };

  const oldRemoveQtyV6=window.removeQtyDoneV5;
  if(typeof oldRemoveQtyV6==='function')window.removeQtyDoneV5=function(vid,oid){
    const v=state.vehicles.find(x=>x.id===vid),o=v?.ofs?.find(x=>x.id===oid),beforeSnap=v?snapshotV6(v):null,before=o?doneV6(o):0,who=o?.doneBy||state.realPerson||'';
    oldRemoveQtyV6(vid,oid);const v2=state.vehicles.find(x=>x.id===vid),o2=v2?.ofs?.find(x=>x.id===oid),after=o2?doneV6(o2):before,delta=after-before;
    if(v2&&o2&&delta){recordV6(v2,o2,delta,who,'correction','Correction de quantité',beforeSnap);try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
  };

  const oldReopenV6=window.reopenOF;
  if(typeof oldReopenV6==='function')window.reopenOF=function(vid,oid){
    const v=state.vehicles.find(x=>x.id===vid),o=v?.ofs?.find(x=>x.id===oid),beforeSnap=v?snapshotV6(v):null,before=o?doneV6(o):0,who=o?.doneBy||state.realPerson||'';
    oldReopenV6(vid,oid);const v2=state.vehicles.find(x=>x.id===vid),o2=v2?.ofs?.find(x=>x.id===oid),after=o2?doneV6(o2):before,delta=after-before;
    if(v2&&o2&&delta){recordV6(v2,o2,delta,who,'correction','OF remis à zéro',beforeSnap);save();}
  };

  // La validation multi-VIN de V5 modifie directement les OF : on compare avant/après pour créer les événements.
  const oldBulkV6=window.validateBulkV5;
  if(typeof oldBulkV6==='function')window.validateBulkV5=function(){
    const before=new Map();(state.vehicles||[]).forEach(v=>(v.ofs||[]).forEach(o=>before.set(v.id+'||'+o.id,{done:doneV6(o),snap:snapshotV6(v)})));

    if(changed)save();
  };

  const oldBlockV6=window.blockOF;
  if(typeof oldBlockV6==='function')window.blockOF=function(vid,oid,backToReal=false){
    const v=state.vehicles.find(x=>x.id===vid),o=v?.ofs?.find(x=>x.id===oid),old=o?.status,before=v?snapshotV6(v):null;oldBlockV6(vid,oid,backToReal);const o2=v?.ofs?.find(x=>x.id===oid);
