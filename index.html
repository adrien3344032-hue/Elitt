<html lang="fr">
<head>

<title>ELITT - Suivi OF - V12.6 Espacement Pages</title>
<style>
:root{--bg:#071426;--panel:#0e1e35;--panel2:#122743;--text:#eaf2ff;--muted:#9cb2d1;--line:#284262;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--pill:#18375f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;font-weight:800;color:#fff;background:var(--blue);cursor:pointer}button.alt{background:#28415f}button.good{background:var(--green)}button.warn{background:var(--orange);color:#071426}button.bad{background:var(--red)}button.small{padding:8px 10px;font-size:13px}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}aside{background:#081830;border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:170px;height:auto;border-radius:0;background:transparent;display:block;object-fit:contain}.brand{align-items:flex-start}.brandText{display:none}nav button{width:100%;text-align:left;background:transparent;margin:4px 0;color:var(--text)}nav button.active,nav button:hover{background:#1b2f51}main{padding:20px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}h1{margin:0 0 6px;font-size:28px}p{color:var(--muted);margin:0}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,minmax(150px,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,.18)}.kpi{font-size:30px;font-weight:900;margin-top:6px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--panel)}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1000px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#bcd2f2;background:#0b1b33}td.desc{white-space:normal;min-width:280px}.muted{color:var(--muted);font-size:12px}.pill{display:inline-flex;border-radius:999px;padding:6px 10px;background:var(--pill);font-weight:800;font-size:12px;color:#cfe2ff}.progress{height:10px;background:#203654;border-radius:999px;overflow:hidden;min-width:140px}.bar{height:100%;background:linear-gradient(90deg,#38bdf8,#22c55e)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.dialog{background:#0d1f38;border:1px solid var(--line);border-radius:20px;padding:18px;width:min(720px,96vw);max-height:92vh;overflow:auto}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:6px;font-weight:700;color:#dceaff}input,select,textarea{background:#081830;color:#fff;border:1px solid #385579;border-radius:12px;padding:10px}textarea{min-height:90px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;justify-content:flex-start}.actions.wrap{flex-wrap:wrap}td.actions{min-width:290px}.actions button{min-width:74px;text-align:center}.checkrow{display:flex!important;align-items:center;gap:10px;background:#081830;border:1px solid #385579;border-radius:12px;padding:10px}.checkrow input{width:18px;height:18px}.actions{align-items:center!important}.tablewrap td.actions{vertical-align:middle!important}td,th{line-height:1.25}.tablewrap table td{vertical-align:middle}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar label{display:flex;align-items:center;gap:8px;font-weight:800;color:#dceaff}.toolbar select{min-width:180px}.searchbox{width:min(520px,100%);font-size:16px}@media(max-width:900px){.app{grid-template-columns:1fr}aside{height:auto;position:relative}.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}

/* Correctif V5 : alignement propre des tableaux */
.tablewrap table{border-collapse:separate;border-spacing:0;table-layout:auto;}
.tablewrap th,.tablewrap td{vertical-align:middle!important;line-height:1.25;}
.tablewrap tbody tr{min-height:62px;}
.tablewrap td:nth-child(1){min-width:90px;}
.tablewrap td:nth-child(2){min-width:70px;text-align:left;}
.tablewrap td:nth-child(3){min-width:160px;}
.tablewrap td:nth-child(5){min-width:90px;}
.tablewrap td:nth-child(6){min-width:90px;}
.tablewrap td:nth-child(7){min-width:110px;}
.tablewrap td:nth-child(8){min-width:110px;}
td.actions{display:table-cell!important;min-width:470px!important;white-space:nowrap!important;vertical-align:middle!important;}
td.actions button{display:inline-flex!important;align-items:center!important;justify-content:center!important;height:38px;min-width:78px;margin:3px 5px 3px 0;vertical-align:middle!important;}
div.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-start;}


/* V7 : blocage et simplification réalisation */
.pill.blocked{background:#7f1d1d;color:#fecaca;}
.blockedtxt{margin-top:6px;color:#fecaca;font-size:12px;font-weight:700;white-space:normal;max-width:260px;}
.dangertext{color:#fecaca;background:#7f1d1d;border-radius:999px;padding:4px 10px;display:inline-block;min-width:24px;text-align:center;}
tr.blockedrow{background:rgba(239,68,68,.08);}
tr.blockedrow td{border-bottom-color:#7f1d1d;}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.filterbar label{display:flex;gap:6px;align-items:center}.historyline{display:grid;grid-template-columns:160px 1fr;gap:10px;padding:10px;border-bottom:1px solid var(--line)}


/* V14 : affichage options tableau de bord */
.optionchips{display:flex;gap:6px;flex-wrap:wrap;min-width:160px}
.optionchip{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;background:#1d3b64;color:#dbeafe;font-size:12px;font-weight:800;white-space:nowrap}
.optionchip.none{background:#26374f;color:#9cb2d1}
.vehiclecolor{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.55);box-shadow:0 0 0 3px rgba(255,255,255,.06);vertical-align:middle;margin-right:8px}
.vinbox{display:flex;align-items:center;gap:6px;white-space:nowrap}
tr.vehicleRow td:first-child{border-left:6px solid var(--vehColor,#3b82f6)}
.vehicleBanner{border-left:8px solid var(--vehColor,#3b82f6)!important}
.colorBadge{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:6px 10px;border-radius:999px;background:#102846;color:#dbeafe;font-size:12px;font-weight:800}



/* V31 : gestion SAV */
.savbadge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:#7c2d12;color:#ffedd5;font-size:12px;font-weight:900;white-space:nowrap}
.savcomment{white-space:pre-wrap;background:#081830;border:1px solid var(--line);border-radius:14px;padding:12px;color:#eaf2ff}
.savdone{background:#064e3b;color:#bbf7d0}

/* V11.1 : sélection de plusieurs pièces manquantes dans le blocage d’un OF */
.singlePartsList{display:grid;gap:8px;max-height:300px;overflow:auto;padding:8px;background:#081830;border:1px solid #385579;border-radius:14px}
.singlePartRow{display:grid;grid-template-columns:auto minmax(0,1fr) 120px;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#0d1f38}
.singlePartRow.selected{border-color:#3b82f6;background:#102846}
.singlePartCheck{width:18px;height:18px;margin:0}
.singlePartMain{min-width:0}
.singlePartMain b,.singlePartMain span{overflow-wrap:anywhere}
.singlePartQtyBox{display:grid;gap:4px;font-size:12px;color:#dceaff}
.singlePartQtyBox input{width:100%;min-width:0}
@media(max-width:650px){.singlePartRow{grid-template-columns:auto minmax(0,1fr)}.singlePartQtyBox{grid-column:2}}


/* V11.2 : regroupement compact des OF bloqués identiques */
.blockedGroupSummary{cursor:pointer;background:rgba(245,158,11,.07)}
.blockedGroupSummary:hover{background:rgba(245,158,11,.13)}
.blockedGroupSummary td{border-bottom-color:#5c4720}
.blockedGroupDetail{background:rgba(239,68,68,.035)}
.blockedGroupDetail td:nth-child(2){padding-left:24px}

/* V11.3 : congés mieux espacés et bouton de suppression centré */
.vacationPill{display:inline-flex;align-items:center;gap:12px;margin:3px}
.vacationDelete{width:26px!important;height:26px!important;min-width:26px!important;padding:0!important;margin:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;border-radius:50%!important;line-height:1!important}

/* V11.3 : fenêtre d’envoi d’un OF bloqué */


/* V11.5 : date objectif de fin et indicateurs de risque */
.deadlineBox{display:grid;gap:5px;min-width:125px}
.deadlineBadge{display:inline-flex;align-items:center;width:max-content;max-width:100%;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;white-space:nowrap}
.deadlineBadge.ok{background:#064e3b;color:#bbf7d0}
.deadlineBadge.risk{background:#78350f;color:#fde68a}
.deadlineBadge.late{background:#7f1d1d;color:#fecaca}
.deadlineBadge.none{background:#26374f;color:#cbd5e1}
.deadlineBadge.done{background:#164e63;color:#cffafe}

/* V11.5 : fenêtre QR Code d'accès direct à une fiche VIN */
.qrWrapV115{display:grid;justify-items:center;gap:14px;padding:16px 0}
.qrBoxV115{background:#fff;padding:14px;border-radius:16px;min-width:248px;min-height:248px;display:flex;align-items:center;justify-content:center}
.qrLinkV115{width:100%;overflow-wrap:anywhere;white-space:normal;text-align:center}
.qrActionsV115{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}


/* V11.6 : fiche VIN publique en lecture seule ouverte directement depuis le QR Code */
body.publicVinModeV116 .app{display:block;min-height:100vh}
body.publicVinModeV116 aside,body.publicVinModeV116 header,body.publicVinModeV116 #fbTopbar,body.publicVinModeV116 #modal{display:none!important}
body.publicVinModeV116 main{padding:24px;max-width:900px;margin:0 auto}
.publicVinShellV116{display:grid;gap:18px;padding-top:10px}
.publicVinHeaderV116{text-align:center;padding:10px 0 2px}
.publicVinHeaderV116 img{width:min(190px,55vw);height:auto;margin-bottom:14px}
.publicVinHeaderV116 h1{font-size:30px;margin:0 0 6px}
.publicVinHeaderV116 p{margin:0}
.publicVinGridV116{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.publicVinMetricV116{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.publicVinMetricV116 .value{font-size:25px;font-weight:900;margin-top:7px}
.publicVinPhasesV116{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:15px}
.publicPhaseV116{display:grid;gap:6px}
.publicPhaseHeadV116{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.publicPhaseHeadV116 strong{font-size:16px}
.publicPhaseTrackV116{height:12px;background:#203654;border-radius:999px;overflow:hidden}
.publicPhaseBarV116{height:100%;background:linear-gradient(90deg,#38bdf8,#22c55e);border-radius:999px}
.publicVinUpdateV116{text-align:center;color:var(--muted);font-size:12px;padding-bottom:8px}
.publicVinErrorV116{max-width:620px;margin:70px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center}
@media(max-width:700px){body.publicVinModeV116 main{padding:16px}.publicVinGridV116{grid-template-columns:1fr}.publicVinHeaderV116 h1{font-size:25px}}

/* ==========================================================================
   RÉGLAGE SIMPLE - TAILLE DES FICHES VIN DU SUIVI GLOBAL
   Modifie UNIQUEMENT la valeur ci-dessous :
   0.75 = plus petit | 1 = taille actuelle | 1.25 = plus grand | 1.5 = très grand
   ========================================================================== */
:root{--echelle-fiche-vin-global:1;}

/* V11.9 : tableau public global - taille pilotée par une seule variable */
body.publicGlobalModeV117 .app{display:block;min-height:100vh}
body.publicGlobalModeV117 aside,body.publicGlobalModeV117 header,body.publicGlobalModeV117 #fbTopbar,body.publicGlobalModeV117 #modal{display:none!important}
body.publicGlobalModeV117 main{padding:18px;max-width:2200px;margin:0 auto}
.publicGlobalShellV117{display:grid;gap:18px}
.publicGlobalHeaderV117{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:4px 4px 8px;flex-wrap:wrap}
.publicGlobalHeaderV117 .left{display:flex;align-items:center;gap:16px;min-width:0}
.publicGlobalHeaderV117 img{width:135px;height:auto;flex:0 0 auto}
.publicGlobalHeaderV117 h1{font-size:30px;margin:0 0 4px}
.publicGlobalHeaderV117 p{margin:0;font-size:15px}

/* La largeur, les espacements, les textes et les barres suivent tous la variable --echelle-fiche-vin-global. */
.publicGlobalGridV117{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,calc(500px * var(--echelle-fiche-vin-global))),1fr));
  gap:calc(18px * var(--echelle-fiche-vin-global));
  align-items:stretch
}
.publicGlobalCardV117{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:calc(20px * var(--echelle-fiche-vin-global));
  padding:calc(22px * var(--echelle-fiche-vin-global));
  display:grid;
  gap:calc(16px * var(--echelle-fiche-vin-global));
  min-width:0
}
.publicGlobalCardHeadV117{display:flex;align-items:center;justify-content:space-between;gap:calc(14px * var(--echelle-fiche-vin-global))}
.publicGlobalVinV117{font-size:calc(30px * var(--echelle-fiche-vin-global));font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.publicGlobalCardV117 .deadlineBadge{font-size:calc(14px * var(--echelle-fiche-vin-global));padding:calc(6px * var(--echelle-fiche-vin-global)) calc(10px * var(--echelle-fiche-vin-global))}
.publicGlobalPhaseListV117{display:grid;gap:calc(12px * var(--echelle-fiche-vin-global))}
.publicGlobalPhaseV117{display:grid;gap:calc(6px * var(--echelle-fiche-vin-global))}
.publicGlobalPhaseHeadV117{display:flex;align-items:center;justify-content:space-between;gap:calc(12px * var(--echelle-fiche-vin-global));font-size:calc(17px * var(--echelle-fiche-vin-global))}
.publicGlobalPhaseHeadV117 strong{font-size:calc(19px * var(--echelle-fiche-vin-global))}
.publicGlobalPhaseTrackV117{height:calc(12px * var(--echelle-fiche-vin-global));background:#203654;border-radius:999px;overflow:hidden}
.publicGlobalPhaseBarV117{height:100%;background:linear-gradient(90deg,#38bdf8,#22c55e);border-radius:999px}
.publicGlobalMetricsV117{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(12px * var(--echelle-fiche-vin-global))}
.publicGlobalMetricV117{background:#0a1a30;border:1px solid #203b5d;border-radius:calc(14px * var(--echelle-fiche-vin-global));padding:calc(14px * var(--echelle-fiche-vin-global));min-width:0}
.publicGlobalMetricV117 b{display:block;font-size:calc(15px * var(--echelle-fiche-vin-global));color:#bcd2f2;margin-bottom:calc(6px * var(--echelle-fiche-vin-global))}
.publicGlobalMetricV117 .value{font-size:calc(18px * var(--echelle-fiche-vin-global));font-weight:900;line-height:1.25;overflow-wrap:anywhere}
.publicGlobalMetricV117 .deadlineBadge{font-size:calc(13px * var(--echelle-fiche-vin-global));padding:calc(5px * var(--echelle-fiche-vin-global)) calc(8px * var(--echelle-fiche-vin-global));margin-top:calc(7px * var(--echelle-fiche-vin-global))}
.publicGlobalFooterV117{text-align:right;color:var(--muted);font-size:calc(14px * var(--echelle-fiche-vin-global))}
.publicGlobalEmptyV117{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px;text-align:center}

/* Mise en page des boutons principaux du tableau de bord. */
.mainHeaderActions{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.mainHeaderActions .headerGroup{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mainHeaderActions button{margin:0}

/* Mise en page des boutons de sauvegarde placés dans la barre Firebase. */
.fbTopbarActions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.fbTopbarActions button{margin:0}

/* V11.15 : cloche et panneau de notifications synchronisées avec Firebase */
.notificationBellButtonV1115{position:relative;display:inline-flex;align-items:center;gap:7px}
.notificationBellIconV1115{font-size:16px;line-height:1}
.notificationBadgeV1115{
  min-width:20px;height:20px;padding:0 5px;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;
  background:#dc2626;color:#fff;font-size:11px;font-weight:950;
  border:2px solid #0b1728;box-shadow:0 2px 8px rgba(220,38,38,.35)
}
.notificationBadgeV1115.empty{display:none}
.connectedPersonBadgeV1116{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 10px;border-radius:999px;
  background:#102d4c;border:1px solid #2b557f;
  color:#dbeafe;font-size:12px;font-weight:900;white-space:nowrap
}
.connectedPersonBadgeV1116 strong{color:#fff}
.adminRoleBadgeV1117{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 8px;border-radius:999px;
  background:#4a2f08;border:1px solid #8a6118;
  color:#fde68a;font-size:10px;font-weight:950;letter-spacing:.3px
}
.adminRestrictedHintV1117{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--muted);font-size:11px;font-weight:700
}

/* V11.19 : commandes de zoom et navigation du graphique d'avancement */
.timelineControlsV1119{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin:12px 0 8px
}
.timelineZoomButtonsV1119{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.timelineZoomInfoV1119{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 10px;border-radius:999px;
  background:#10253f;border:1px solid #29486f;
  color:#cfe2ff;font-size:11px;font-weight:850
}
.timelinePanWrapV1119{
  display:grid;grid-template-columns:auto minmax(180px,360px) auto;
  align-items:center;gap:9px;flex:1;min-width:min(100%,360px)
}
.timelinePanWrapV1119 input[type="range"]{width:100%;margin:0}
.timelinePeriodV1119{
  font-size:11px;color:var(--muted);text-align:right;margin-top:5px
}

/* V11.22 : notes partagées par véhicule */
.vehicleNoteBadgeV1122{
  display:inline-flex;align-items:center;gap:5px;
  margin-top:6px;padding:3px 7px;border-radius:999px;
  background:#3b2d0e;border:1px solid #7a5b16;
  color:#fde68a;font-size:10px;font-weight:900;
  cursor:pointer
}
.vehicleNoteBadgeV1122:hover{filter:brightness(1.12)}
.vehicleNoteModalV1122 textarea{
  width:100%;min-height:220px;resize:vertical;
  background:#071427;color:#eef6ff;border:1px solid var(--line);
  border-radius:12px;padding:12px;box-sizing:border-box;
  font:inherit;line-height:1.45
}
.vehicleNoteMetaV1122{
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  color:var(--muted);font-size:11px;margin-top:7px
}
.vehicleNoteActionsV1122{
  display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px
}

/* V11.23 : mode écran atelier */
.workshopToolbarV1123{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;flex-wrap:wrap;margin-bottom:14px
}
.workshopTitleBlockV1123{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.workshopClockV1123{
  font-size:28px;font-weight:950;letter-spacing:.5px;color:#fff
}
.workshopDateV1123{font-size:12px;color:var(--muted);margin-top:2px}
.workshopKpisV1123{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;margin-bottom:12px
}
.workshopKpiV1123{
  background:#0a1d36;border:1px solid var(--line);border-radius:14px;
  padding:10px 12px;min-width:0
}
.workshopKpiV1123 b{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.workshopKpiV1123 strong{display:block;font-size:24px;line-height:1.05;margin-top:3px}
.workshopGridV1123{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px
}
.workshopCardV1123{
  position:relative;background:#08182e;border:1px solid #29405f;
  border-radius:16px;padding:13px;overflow:hidden;min-height:215px;
  box-shadow:0 8px 24px rgba(0,0,0,.13)
}
.workshopCardV1123:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--vehColor,#3b82f6)
}
.workshopCardHeadV1123{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:10px;margin-bottom:10px
}
.workshopVinV1123{font-size:23px;font-weight:950;line-height:1}
.workshopClientV1123{font-size:12px;color:var(--muted);margin-top:4px}
.workshopBadgesV1123{
  display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap
}
.workshopPhaseV1123{margin-top:7px}
.workshopPhaseTopV1123{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11px;margin-bottom:3px

  gap:7px;
  font-size:10px;
  color:#8dd2a5;
  font-weight:800;
  padding-bottom:4px;
}
body.v12-pro .v124-sync::before{
  content:"";
  width:8px;height:8px;border-radius:50%;
  background:#43b76d;
  box-shadow:0 0 0 3px rgba(67,183,109,.10);
}
body.v12-pro .v124-workshop-actions{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
body.v12-pro .v124-fullscreen{
  min-height:38px;
}

/* KPI supervision */
body.v12-pro .v124-workshop-kpis{
  display:grid;
  grid-template-columns:repeat(5,minmax(155px,1fr));
  gap:10px;
}
body.v12-pro .v124-workshop-kpi{
  position:relative;
  overflow:hidden;
  min-height:88px;
  padding:13px 15px;
  background:#162433;
  border:1px solid #2c3e52;
  border-radius:12px;
  box-shadow:0 5px 16px rgba(0,0,0,.16);
}
body.v12-pro .v124-workshop-kpi::before{
  content:"";
  position:absolute;left:0;top:0;bottom:0;width:3px;
  background:#4d8bc4;
}
body.v12-pro .v124-workshop-kpi.pause::before{background:#d49a36}
body.v12-pro .v124-workshop-kpi.sav::before{background:#8a68b4}
body.v12-pro .v124-workshop-kpi.risk::before{background:#d75a67}
body.v12-pro .v124-workshop-kpi .label{
  font-size:10px;
  color:#9bacbd;
  font-weight:800;
}
body.v12-pro .v124-workshop-kpi strong{
  display:block;
  font-size:27px;
  color:#fff;
  line-height:1;
  margin-top:9px;
}
body.v12-pro .v124-workshop-kpi small{
  display:block;
  margin-top:7px;
  color:#708399;
  font-size:9px;
}

/* Tabs / filtres */
body.v12-pro .v124-workshop-controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  padding:10px 11px;
  background:#142130;
  border:1px solid #293c50;
  border-radius:12px;
}
body.v12-pro .v124-workshop-tabs{
  display:flex;gap:7px;align-items:center;flex-wrap:wrap;
}
body.v12-pro .v124-workshop-tabs button{
  background:#213247!important;
  color:#cdd9e5!important;
  border:1px solid #334960!important;
  min-height:36px;
  padding:8px 13px;
  font-size:10px;
}
body.v12-pro .v124-workshop-tabs button.active{
  background:#276da8!important;
  border-color:#4287bd!important;
  color:#fff!important;
}
body.v12-pro .v124-workshop-filters{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
}
body.v12-pro .v124-workshop-filters label{
  display:flex;align-items:center;gap:6px;
  font-size:9px;color:#8295aa;font-weight:800;
}
body.v12-pro .v124-workshop-filters select{
  min-width:120px;
  height:35px;
  padding:6px 9px;
  font-size:10px;
}

/* Grille véhicules : 4x2 en grand écran */
body.v12-pro .v124-vehicle-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:11px;
}
body.v12-pro .v124-vehicle-card{
  --status-color:#3f9a64;
  position:relative;
  min-width:0;
  min-height:255px;
  padding:13px 14px 12px;
  background:linear-gradient(180deg,#172635 0%,#14212f 100%);
  border:1px solid #2c4156;
  border-radius:13px;
  box-shadow:0 7px 22px rgba(0,0,0,.18);
  overflow:hidden;
}
body.v12-pro .v124-vehicle-card::before{
  content:"";
  position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--status-color);
}
body.v12-pro .v124-vehicle-card.status-ok{--status-color:#40ae69}
body.v12-pro .v124-vehicle-card.status-run{--status-color:#4a90d3}
body.v12-pro .v124-vehicle-card.status-pause{--status-color:#d89b34}
body.v12-pro .v124-vehicle-card.status-risk{--status-color:#d89b34}
body.v12-pro .v124-vehicle-card.status-blocked{--status-color:#dc5664}
body.v12-pro .v124-vehicle-card.status-late{--status-color:#dc5664}

body.v12-pro .v124-card-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:10px;margin-bottom:10px;
}
body.v12-pro .v124-vin{
  font-size:18px;font-weight:950;color:#fff;line-height:1.05;
}
body.v12-pro .v124-vin-sub{
  color:#8fa1b4;font-size:9.5px;margin-top:4px;
}
body.v12-pro .v124-card-badges{
  display:flex;justify-content:flex-end;align-items:center;
  gap:5px;flex-wrap:wrap;max-width:55%;
}
body.v12-pro .v124-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 7px;border-radius:999px;
  border:1px solid #3c536b;
  background:#233448;color:#d7e3ee;
  font-size:8.5px;font-weight:900;white-space:nowrap;
}
body.v12-pro .v124-badge.ok{
  background:#173a29;border-color:#2a6445;color:#96d9ad;
}
body.v12-pro .v124-badge.run{
  background:#1b3653;border-color:#315b7d;color:#9dccf3;
}
body.v12-pro .v124-badge.pause,
body.v12-pro .v124-badge.risk{
  background:#3d2e17;border-color:#70531f;color:#e7b85c;
}
body.v12-pro .v124-badge.blocked,
body.v12-pro .v124-badge.late{
  background:#402128;border-color:#78404a;color:#f0a0a9;
}

/* Phases atelier */
body.v12-pro .v124-phases{
  display:grid;gap:7px;
}
body.v12-pro .v124-phase{
  display:grid;grid-template-columns:78px minmax(0,1fr) auto;
  gap:8px;align-items:center;
}
body.v12-pro .v124-phase-name{
  font-size:9.5px;color:#d7e1ea;font-weight:850;
}
body.v12-pro .v124-phase-track{
  height:7px;border-radius:999px;background:#293b4d;overflow:hidden;
}
body.v12-pro .v124-phase-fill{
  height:100%;border-radius:999px;
  background:linear-gradient(90deg,#438e60,#70b780);
}
body.v12-pro .v124-phase-value{
  min-width:31px;text-align:right;
  font-size:9px;color:#f0f4f8;font-weight:850;
}

/* Travail / planification */
body.v12-pro .v124-work-line{
  min-height:31px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin-top:10px;padding-top:9px;
  border-top:1px solid #293b4d;
}
body.v12-pro .v124-person-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 8px;border-radius:8px;
  background:#203850;border:1px solid #345773;
  color:#cbe0f2;font-size:9px;font-weight:850;
}
body.v12-pro .v124-person-pill.paused{
  background:#3c2d17;border-color:#6f511e;color:#e9bd68;
}
body.v12-pro .v124-empty-work{
  color:#76899d;font-size:9px;
}
body.v12-pro .v124-next-task{
  margin-top:7px;padding:7px 8px;
  border-radius:8px;
  background:#1e2c3c;border:1px solid #304459;
  color:#aebdcb;font-size:8.8px;line-height:1.3;
}
body.v12-pro .v124-next-task b{color:#e4ebf2}

/* Pied carte */
body.v12-pro .v124-card-footer{
  display:grid;grid-template-columns:1fr auto;gap:10px;
  align-items:end;margin-top:9px;
  color:#8294a7;font-size:8.8px;
}
body.v12-pro .v124-card-footer strong{
  color:#e4eaf0;font-size:9.5px;
}
body.v12-pro .v124-card-footer .right{text-align:right}

/* Note véhicule */
body.v12-pro .v124-note{
  margin-top:7px;padding:6px 8px;
  border-radius:7px;background:#322a17;border:1px solid #5a4822;
  color:#ddc586;font-size:8.5px;line-height:1.25;
}

/* SAV séparé */
body.v12-pro .v124-sav-zone{
  display:grid;gap:9px;
}
body.v12-pro .v124-section-title{
  display:flex;align-items:center;gap:8px;
  color:#dbe5ee;font-size:11px;font-weight:900;
}
body.v12-pro .v124-section-title::after{
  content:"";height:1px;flex:1;background:#283b4e;
}
body.v12-pro .v124-sav-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;
}
body.v12-pro .v124-sav-card{
  display:grid;grid-template-columns:minmax(170px,.7fr) minmax(240px,1.3fr) auto;
  gap:16px;align-items:center;
  padding:13px 15px;
  background:#172536;border:1px solid #4b3a68;border-left:3px solid #8967b3;
  border-radius:12px;
}
body.v12-pro .v124-sav-name{font-size:16px;font-weight:950;color:#fff}
body.v12-pro .v124-sav-client{font-size:9px;color:#8f9fb0;margin-top:3px}
body.v12-pro .v124-sav-status{margin-top:8px}
body.v12-pro .v124-sav-progress .v124-phase-track{height:9px}
body.v12-pro .v124-sav-progress-head{
  display:flex;justify-content:space-between;gap:10px;
  margin-bottom:6px;font-size:9px;color:#98a9ba;
}
body.v12-pro .v124-sav-progress-head b{color:#f2f5f8}
body.v12-pro .v124-sav-right{
  text-align:right;color:#94a5b7;font-size:9px;
}

/* ---------- Vue charge atelier ---------- */
body.v12-pro .v124-load-view{
  display:grid;gap:12px;
}
body.v12-pro .v124-phase-load-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;
}
body.v12-pro .v124-phase-load{
  background:#172536;border:1px solid #2b4055;border-radius:12px;
  padding:13px;
}
body.v12-pro .v124-phase-load-head{
  display:flex;justify-content:space-between;gap:10px;align-items:center;
  margin-bottom:11px;
}
body.v12-pro .v124-phase-load-head b{
  font-size:13px;color:#fff;
}
body.v12-pro .v124-phase-load-head span{
  font-size:9px;color:#8fa2b5;
}
body.v12-pro .v124-load-number{
  font-size:27px;font-weight:950;color:#fff;line-height:1;
}
body.v12-pro .v124-load-number small{
  font-size:9px;color:#8295a8;font-weight:700;
}
body.v12-pro .v124-load-meta{
  margin-top:10px;display:grid;gap:6px;
  font-size:9px;color:#8ea0b2;
}
body.v12-pro .v124-load-meta strong{color:#dde6ef}
body.v12-pro .v124-active-list{
  margin-top:10px;padding-top:9px;border-top:1px solid #293c50;
  display:grid;gap:5px;
}
body.v12-pro .v124-active-item{
  display:flex;justify-content:space-between;gap:7px;
  font-size:8.5px;color:#9eafbf;
}
body.v12-pro .v124-active-item b{color:#e7edf3}

body.v12-pro .v124-team-load{
  display:grid;grid-template-columns:1.1fr .9fr;gap:10px;
}
body.v12-pro .v124-team-panel{
  background:#172536;border:1px solid #2b4055;border-radius:12px;padding:13px;
}
body.v12-pro .v124-team-title{
  font-size:12px;font-weight:900;color:#fff;margin-bottom:11px;
}
body.v12-pro .v124-team-list{
  display:grid;gap:7px;
}
body.v12-pro .v124-team-row{
  display:grid;grid-template-columns:110px 1fr auto;gap:9px;align-items:center;
  padding:8px 9px;border-radius:8px;background:#142130;border:1px solid #26394c;
}
body.v12-pro .v124-team-name{
  font-size:9.5px;color:#e4ebf2;font-weight:850;
}
body.v12-pro .v124-team-task{
  font-size:8.5px;color:#91a2b4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
body.v12-pro .v124-team-hours{
  font-size:9px;color:#cfd9e3;font-weight:850;
}
body.v12-pro .v124-plan-list{
  display:grid;gap:7px;
}
body.v12-pro .v124-plan-row{
  display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;
  padding:8px;border-radius:8px;background:#142130;border:1px solid #26394c;
}
body.v12-pro .v124-plan-order{
  width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;
  background:#203b57;border:1px solid #345b78;
  color:#d6e8f7;font-size:9px;font-weight:950;
}
body.v12-pro .v124-plan-main{
  font-size:9px;color:#dce5ed;font-weight:850;
}
body.v12-pro .v124-plan-sub{
  margin-top:2px;font-size:8px;color:#7f92a5;
}
body.v12-pro .v124-plan-person{
  font-size:8.5px;color:#a8bacb;
}

/* Plein écran atelier Pro */
body.v12-pro.workshopFullscreenV1123 #view{
  padding:14px 16px 18px!important;
}
body.v12-pro.workshopFullscreenV1123 .v124-vehicle-grid{
  grid-template-columns:repeat(4,minmax(0,1fr));
}
body.v12-pro.workshopFullscreenV1123 .v124-vehicle-card{
  min-height:235px;
}

/* Responsive */
@media(max-width:1500px){
  body.v12-pro .v124-vehicle-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  body.v12-pro .v124-workshop-kpis{grid-template-columns:repeat(3,minmax(155px,1fr))}
  body.v12-pro .v124-phase-load-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:1100px){
  body.v12-pro .v124-vehicle-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  body.v12-pro .v124-team-load{grid-template-columns:1fr}
  body.v12-pro .v124-sav-grid{grid-template-columns:1fr}
}
@media(max-width:760px){
  body.v12-pro .v124-workshop-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  body.v12-pro .v124-vehicle-grid,
  body.v12-pro .v124-phase-load-grid{grid-template-columns:1fr}
  body.v12-pro .v124-sav-card{grid-template-columns:1fr}
  body.v12-pro .v124-sav-right{text-align:left}
  body.v12-pro .v124-clock{font-size:27px}
}

  gap:8px;

body.v12-pro #fbTopbar .fbDot{

<script>
/*
  ============================================================================
  ELITT - SUIVI OF - V11.6 FICHE VIN PUBLIQUE
  ============================================================================
  Base fonctionnelle : V11 nettoyée.
  Objectif : une seule version active de chaque fonctionnalité, sans les anciens
  écrans Recherche / Tous les OF / Véhicules, sans l'ancien statut rapide V34/V35
  et sans pièces de démonstration.

  Chaque fonction importante possède un commentaire en français qui explique
  précisément son rôle.
  ============================================================================
*/

// Clé principale utilisée pour conserver l'état du logiciel dans le navigateur.
const LS = 'suivi_of_simple_d14_v2';

// Clé dédiée à la conservation des bases OF importées depuis les fichiers Excel.
const BASES_LS = 'suivi_of_simple_bases_excel_persistantes_v1';

// Clé dédiée au catalogue des pièces lu dans les feuilles PIECES_OF.
const PARTS_LS = 'suivi_of_simple_parts_catalog_v8';

// Version du schéma de données actuellement utilisée par l'application.
window.ELITT_V10_SCHEMA = 10;

// Liste des pages réellement utilisées dans le menu de gauche.
const pages = [
  ['dash', 'Tableau de bord'],
  ['workshop', 'Écran atelier'],
  ['planning', 'Planning'],
  ['real', 'Réalisation'],
  ['blocked', 'OF bloqués'],
  ['times', 'Temps OF'],
  ['history', 'Historique'],
  ['people', 'Personnes'],
  ['archives', 'Archives']
];

// Page actuellement affichée.
let page = 'dash';

// Charge l'état local existant ou crée une structure vide compatible avec le site.
let state = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem(LS) || 'null');
    if (saved && typeof saved === 'object') return saved;
  } catch (e) {
    console.warn('État local illisible, démarrage avec un état vide.', e);
  }
  return {
    vehicles: [],
    people: ['Adrien', 'Dim', 'Julien', 'David', 'Maël', 'Lucas'],
    history: [],
    customTemplates: { Renault: [], Mercedes: [], MAN: [] },
    partsCatalogV8: { Renault: [], Mercedes: [], MAN: [], Autre: [] },
    progressEventsV6: [],
    workTimesV1112: [],
    schemaVersion: 10
  };
})();

// -----------------------------------------------------------------------------
// V11.20 - ÉTAT LOCAL DE L'INTERFACE
// Ces champs appartiennent uniquement au navigateur courant et ne sont jamais
// envoyés à Firebase. Deux utilisateurs peuvent ainsi consulter des pages,
// VIN, onglets et filtres différents sans se piloter mutuellement.
// -----------------------------------------------------------------------------
const LOCAL_UI_STATE_KEYS_V1120 = [
  'realModeV3',
  'realVin',
  'realFilter',
  'realPerson',
  'ofSearchV5',
  'ofPhaseV5',
  'ofStatusV5',
  'timePersonFilterV1112',
  'timeVinFilterV1112',
  'timeCategoryFilterV1112',
  'timeSearchV1112',
  'archiveFilter',
  'detailVin'
];

function captureLocalUiStateV1120(source = state) {
  const ui = {};
  LOCAL_UI_STATE_KEYS_V1120.forEach(key => {
    if (Object.prototype.hasOwnProperty.call(source || {}, key)) ui[key] = source[key];
  });
  return ui;
}

function restoreLocalUiStateV1120(target, ui) {
  if (!target || !ui) return target;
  LOCAL_UI_STATE_KEYS_V1120.forEach(key => {
    if (Object.prototype.hasOwnProperty.call(ui, key)) target[key] = ui[key];
  });
  return target;
}

function sharedStateV1120(source = state) {
  const copy = JSON.parse(JSON.stringify(source || {}));
  LOCAL_UI_STATE_KEYS_V1120.forEach(key => delete copy[key]);
  return copy;
}

function saveLocalOnlyV1120() {
  try { localStorage.setItem(LS, JSON.stringify(state)); }
  catch (error) { console.error(error); }
  render();
}

// Échappe du texte avant de l'insérer dans du HTML afin d'éviter de casser l'affichage.
function escHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Génère un identifiant unique pour un véhicule, un OF, un congé ou un événement.
function uid() {
  return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// Formate un nombre d'heures pour l'affichage français.
function fmt(value) {
  return (Math.round((Number(value) || 0) * 100) / 100).toString().replace('.', ',') + ' h';
}

// Formate une durée décimale en heures et minutes, par exemple 25,5 h devient 25 h 30.
function fmtHoursMinutesV11122(value) {
  const totalMinutes = Math.max(0, Math.round((Number(value) || 0) * 60));
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  if (minutes === 0) return `${hours} h`;
  return `${hours} h ${String(minutes).padStart(2, '0')}`;
}

// Retourne le nom d'une personne, que l'ancienne donnée soit une chaîne ou le nouvel objet personne.
function personName(person) {
  return typeof person === 'string' ? person : (person?.name || '');
}

// Retourne la quantité totale prévue pour un OF ; les anciens OF sans quantité valent automatiquement 1.
function qtyTotalV5(of) {
  const n = Math.floor(Number(of?.quantity ?? of?.qty ?? 1));
  return Number.isFinite(n) && n > 0 ? n : 1;
}

// Retourne la quantité déjà réalisée pour un OF tout en restant comprise entre 0 et la quantité totale.
function qtyDoneV5(of) {
  const total = qtyTotalV5(of);
  if (of && of.completedQty !== undefined && of.completedQty !== null && of.completedQty !== '') {
    const n = Math.floor(Number(of.completedQty) || 0);
    return Math.max(0, Math.min(total, n));
  }
  return of?.status === 'Fait' ? total : 0;
}

// Retourne le nombre de réalisations encore à faire sur un OF.
function qtyRemainingV5(of) {
  return Math.max(0, qtyTotalV5(of) - qtyDoneV5(of));
}

// Retourne la session de travail active d'un OF, qu'elle soit en cours ou momentanément en pause.
function activeWorkSessionV1111(of) {
  const session = of?.workSessionV1111;
  if (!session || !session.person || !session.startedAt) return null;
  if (qtyRemainingV5(of) <= 0 || of.status === 'Bloqué') return null;
  session.pausedTotalMs = Math.max(0, Number(session.pausedTotalMs) || 0);
  session.pausedAt = session.pausedAt || '';
  return session;
}

// Indique si une session de travail est actuellement en pause.
function isWorkPausedV1113(ofOrSession) {
  const session = ofOrSession?.workSessionV1111 ? activeWorkSessionV1111(ofOrSession) : ofOrSession;
  return !!(session && session.pausedAt);
}

// Calcule le temps de travail réellement écoulé en excluant toutes les périodes de pause.
function workSessionActiveMinutesV1113(session, endedAt = new Date().toISOString()) {
  if (!session?.startedAt) return 0;

  const start = new Date(session.startedAt);
  const end = new Date(endedAt);
  if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return 0;

  let pausedMs = Math.max(0, Number(session.pausedTotalMs) || 0);

  // Si l'OF est encore en pause, on retire également la pause actuellement ouverte.
  if (session.pausedAt) {
    const pausedAt = new Date(session.pausedAt);
    if (!Number.isNaN(pausedAt.getTime())) {
      pausedMs += Math.max(0, end - pausedAt);
    }
  }

  return Math.max(0, Math.round(((end - start) - pausedMs) / 60000));
}

// Calcule le temps total passé en pause pour une session.
function workSessionPausedMinutesV1113(session, endedAt = new Date().toISOString()) {
  if (!session) return 0;

  let pausedMs = Math.max(0, Number(session.pausedTotalMs) || 0);

  if (session.pausedAt) {
    const pausedAt = new Date(session.pausedAt);
    const end = new Date(endedAt);
    if (!Number.isNaN(pausedAt.getTime()) && !Number.isNaN(end.getTime())) {
      pausedMs += Math.max(0, end - pausedAt);
    }
  }

  return Math.max(0, Math.round(pausedMs / 60000));
}

// Formate le temps de travail réellement comptabilisé d'une session.
function workSessionDurationLabelV1113(session, endedAt = new Date().toISOString()) {
  return workMinutesLabelV1112(workSessionActiveMinutesV1113(session, endedAt));
}

// Nettoie une ancienne session invalide et restaure correctement son statut En cours ou En pause.
function normalizeWorkSessionV1111(of) {
  if (!of) return;
  const session = activeWorkSessionV1111(of);

  if (session) {
    of.status = session.pausedAt ? 'En pause' : 'En cours';
    return;
  }

  if (of.workSessionV1111) delete of.workSessionV1111;

  if (of.status === 'En cours' || of.status === 'En pause') {
    of.status = qtyRemainingV5(of) <= 0 ? 'Fait' : 'À faire';
  }
}

// Compte le nombre total d'OF démarrés sur un véhicule, qu'ils soient en cours ou en pause.
function inProgressCountV1111(vehicle) {
  if (!vehicle || isSAV(vehicle)) return 0;
  return (vehicle.ofs || []).filter(of => !!activeWorkSessionV1111(of)).length;
}

// Compte uniquement les OF sur lesquels une personne travaille réellement maintenant.
function runningOFCountV11143(vehicle) {
  if (!vehicle || isSAV(vehicle)) return 0;
  return (vehicle.ofs || []).filter(of => {
    const session = activeWorkSessionV1111(of);
    return !!session && !session.pausedAt;
  }).length;
}

// Compte uniquement les OF actuellement mis en pause.
function pausedOFCountV11143(vehicle) {
  if (!vehicle || isSAV(vehicle)) return 0;
  return (vehicle.ofs || []).filter(of => {
    const session = activeWorkSessionV1111(of);
    return !!session && !!session.pausedAt;
  }).length;
}

// Compte tous les OF réellement en cours sur l'ensemble des véhicules actifs.
function totalInProgressV1111() {
  return activeVehicles()
    .filter(vehicle => !isSAV(vehicle))
    .reduce((sum, vehicle) => sum + inProgressCountV1111(vehicle), 0);
}

// Formate la durée écoulée entre le démarrage et la fin d'une réalisation.
function workDurationLabelV1111(startedAt, endedAt = new Date().toISOString()) {
  const start = new Date(startedAt);
  const end = new Date(endedAt);
  if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return '-';
  const minutes = Math.max(0, Math.round((end - start) / 60000));
  const hours = Math.floor(minutes / 60);
  const rest = minutes % 60;
  if (hours && rest) return `${hours} h ${rest} min`;
  if (hours) return `${hours} h`;
  return `${rest} min`;
}

// Formate un nombre de minutes réelles sous forme lisible.
function workMinutesLabelV1112(minutes) {
  const value = Math.max(0, Math.round(Number(minutes) || 0));
  const hours = Math.floor(value / 60);
  const rest = value % 60;
  if (hours && rest) return `${hours} h ${rest} min`;
  if (hours) return `${hours} h`;
  return `${rest} min`;
}

// Classe un temps réel par rapport au temps prévu : vert jusqu'à +10 %, orange jusqu'à +50 %, rouge au-delà.
function workPerformanceV1112(actualMinutes, plannedMinutes) {
  const actual = Math.max(0, Number(actualMinutes) || 0);
  const planned = Math.max(0, Number(plannedMinutes) || 0);
  if (!planned) return { key: 'neutral', label: 'Sans temps prévu', ratio: null };
  const ratio = actual / planned;
  if (ratio <= 1.10) return { key: 'good', label: 'Bon', ratio };
  if (ratio <= 1.50) return { key: 'warn', label: 'Un peu dépassé', ratio };
  return { key: 'bad', label: 'Fort dépassement', ratio };
}

// Retourne la classe de fond utilisée dans les tableaux de temps.
function workPerformanceRowClassV1112(actualMinutes, plannedMinutes) {
  const perf = workPerformanceV1112(actualMinutes, plannedMinutes);
  return perf.key === 'good'
    ? 'timePerfGoodV1112'
    : perf.key === 'warn'
      ? 'timePerfWarnV1112'
      : perf.key === 'bad'
        ? 'timePerfBadV1112'
        : 'timePerfNeutralV1112';
}

// Génère la pastille colorée correspondant au respect du temps prévu.
function workPerformanceBadgeV1112(actualMinutes, plannedMinutes) {
  const perf = workPerformanceV1112(actualMinutes, plannedMinutes);
  if (perf.ratio === null) return `<span class="timeBadgeV1112 neutral">${escHtml(perf.label)}</span>`;
  const deltaPct = Math.round((perf.ratio - 1) * 100);
  const suffix = deltaPct > 0 ? ` • +${deltaPct}%` : deltaPct < 0 ? ` • ${deltaPct}%` : '';
  return `<span class="timeBadgeV1112 ${perf.key}">${escHtml(perf.label + suffix)}</span>`;
}

// Retourne tous les temps chronométrés, du plus récent au plus ancien.
function workTimesV1112() {
  state.workTimesV1112 = Array.isArray(state.workTimesV1112) ? state.workTimesV1112 : [];
  return state.workTimesV1112.slice().sort((a, b) => new Date(b.finishedAt) - new Date(a.finishedAt));
}

// Retrouve le temps prévu actuel d'un OF, utilisé seulement pour migrer les premières données V11.11.
function currentPlannedMinutesForOFV1112(vehicleId, ofId) {
  const vehicle = (state.vehicles || []).find(item => item.id === vehicleId);
  const of = vehicle?.ofs?.find(item => item.id === ofId);
  return Math.max(0, Math.round((Number(of?.time) || 0) * 60));
}

// Migre une seule fois les éventuels Début/Terminé enregistrés avec la V11.11, afin qu'un temps supprimé ne soit jamais recréé ensuite.
function migrateWorkTimesV1112() {
  state.workTimesV1112 = Array.isArray(state.workTimesV1112) ? state.workTimesV1112 : [];

  if (state.workTimesMigrationDoneV1112 === true) return;

  const events = (state.progressEventsV6 || []).slice().sort((a, b) => new Date(a.at) - new Date(b.at));
  const existingKeys = new Set(state.workTimesV1112.map(item =>
    [item.vehicleId, item.ofId, item.person, item.startedAt, item.finishedAt].join('||')
  ));
  const openStarts = [];

  events.forEach(event => {
    if (event.kind === 'start' && event.vehicleId && event.ofId && event.person) {
      openStarts.push(event);
      return;
    }
    if (event.kind !== 'finish' || !event.vehicleId || !event.ofId || !event.person) return;

    let index = -1;
    for (let i = openStarts.length - 1; i >= 0; i--) {
      const start = openStarts[i];
      if (
        start.vehicleId === event.vehicleId &&
        start.ofId === event.ofId &&
        start.person === event.person &&
        new Date(start.at) <= new Date(event.at)
      ) {
        index = i;
        break;
      }
    }
    if (index < 0) return;

    const start = openStarts.splice(index, 1)[0];
    const key = [event.vehicleId, event.ofId, event.person, start.at, event.at].join('||');
    if (existingKeys.has(key)) return;

    const minutes = Math.max(0, Math.round((new Date(event.at) - new Date(start.at)) / 60000));
    state.workTimesV1112.push({
      id: uid(),
      vehicleId: event.vehicleId,
      vin: event.vin || '',
      ofId: event.ofId,
      ofName: event.ofName || '',
      description: event.description || '',
      category: event.category || '',
      person: event.person,
      startedAt: start.at,
      finishedAt: event.at,
      durationMinutes: minutes,
      plannedMinutes: currentPlannedMinutesForOFV1112(event.vehicleId, event.ofId),
      quantityNumber: Number(event.qtyAfter) || 0,
      migratedFromV1111: true
    });
    existingKeys.add(key);
  });

  state.workTimesMigrationDoneV1112 = true;
}

// Enregistre une réalisation chronométrée en ne comptant que le temps réellement travaillé, pauses exclues.
function addWorkTimeRecordV1112(vehicle, of, session, finishedAt, quantityNumber) {
  if (!vehicle || !of || !session?.person || !session?.startedAt) return;

  const actualMinutes = workSessionActiveMinutesV1113(session, finishedAt);
  const pausedMinutes = workSessionPausedMinutesV1113(session, finishedAt);
  const plannedMinutes = Math.max(0, Math.round((Number(of.time) || 0) * 60));

  state.workTimesV1112 = Array.isArray(state.workTimesV1112) ? state.workTimesV1112 : [];
  state.workTimesV1112.push({
    id: uid(),
    vehicleId: vehicle.id,
    vin: vehicle.vin || '',
    ofId: of.id || '',
    ofName: of.name || '',
    description: of.desc || '',
    category: of.category || '',
    person: session.person,
    startedAt: session.startedAt,
    finishedAt,
    durationMinutes: actualMinutes,
    pausedMinutes,
    plannedMinutes,
    quantityNumber: Number(quantityNumber) || 0
  });

  if (state.workTimesV1112.length > 10000) {
    state.workTimesV1112 = state.workTimesV1112.slice(-10000);
  }
}

// Supprime définitivement une ligne de temps erronée sans modifier l'avancement, la quantité réalisée ni l'historique de production.
function deleteWorkTimeV1112(id) {
  if (!requireAdminV1117('la suppression des temps OF/SAV')) return;
  const item = (state.workTimesV1112 || []).find(row => row.id === id);
  if (!item || !confirm(`Supprimer ce temps chronométré ?\n\n${item.person} • ${item.vin} • ${item.ofName}`)) return;

  state.workTimesMigrationDoneV1112 = true;
  state.workTimesV1112 = state.workTimesV1112.filter(row => row.id !== id);
  saveSharedDataV1120();
}

// Ouvre la page Temps OF directement filtrée sur un VIN.
function openVehicleTimesV1112(vehicleId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  if (!vehicle) return;
  state.timeVinFilterV1112 = vehicle.vin || '';
  state.timePersonFilterV1112 = 'Tous';
  state.timeCategoryFilterV1112 = 'Toutes';
  state.timeSearchV1112 = '';
  page = 'times';
  render();
}

// Modifie un filtre de la page Temps OF puis rafraîchit l'affichage.
function setTimeFilterV1112(key, value) {
  state[key] = value;
  render();
}

// Retourne les temps respectant les filtres actifs de la page Temps OF.
function filteredWorkTimesV1112() {
  const person = state.timePersonFilterV1112 || 'Tous';
  const vin = state.timeVinFilterV1112 || 'Tous';
  const category = state.timeCategoryFilterV1112 || 'Toutes';
  const search = String(state.timeSearchV1112 || '').trim().toLowerCase();

  return workTimesV1112().filter(item => {
    if (person !== 'Tous' && item.person !== person) return false;
    if (vin !== 'Tous' && item.vin !== vin) return false;
    if (category !== 'Toutes' && item.category !== category) return false;
    if (search) {
      const haystack = [item.ofName, item.description, item.vin, item.person].join(' ').toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });
}

// Calcule les totaux utiles en haut de la page Temps OF.
function workTimeSummaryV1112(rows) {
  const actual = rows.reduce((sum, item) => sum + (Number(item.durationMinutes) || 0), 0);
  const planned = rows.reduce((sum, item) => sum + (Number(item.plannedMinutes) || 0), 0);
  const delta = actual - planned;
  return { count: rows.length, actual, planned, delta };
}

// -----------------------------------------------------------------------------
// V11.26 - FILE DE SAUVEGARDE FIREBASE PERSISTANTE
//
// OBJECTIF : aucune attente pour l'utilisateur.
// - chaque action est appliquée immédiatement à l'écran ;
// - l'état est sauvegardé immédiatement dans le navigateur ;
// - UNE SEULE copie de l'état métier en attente est conservée par compte ;
// - Firebase synchronise en arrière-plan après une courte période d'inactivité ;
// - fermer / actualiser le navigateur ne perd pas le lot : il sera repris à la
//   prochaine connexion du même compte ;
// - si de nouveaux clics arrivent pendant une sauvegarde réseau, ils créent une
//   version plus récente et ne peuvent pas être écrasés par l'ancien retour.
//
// Le système garde les noms historiques saveCriticalV1118 / saveSharedDataV1120
// pour éviter de modifier toute la logique métier existante.
// -----------------------------------------------------------------------------

const PERSISTENT_SAVE_PREFIX_V1126 = 'suivi_of_pending_v1126::';
const PERSISTENT_SAVE_IDLE_DELAY_V1126 = 1200;
const PERSISTENT_SAVE_RETRY_MIN_V1126 = 2000;
const PERSISTENT_SAVE_RETRY_MAX_V1126 = 30000;

let persistentSaveTimerV1126 = null;
let persistentSaveInFlightV1126 = null;
let persistentSaveRetryAttemptV1126 = 0;
let persistentSaveRuntimeGenerationV1126 = 0;

function persistentSaveOwnerV1126() {
  const uid = String(window.SUIVI_OF_CONNECTED_UID_V1126 || '').trim();
  if (uid) return uid;

  const email = String(window.SUIVI_OF_CONNECTED_EMAIL_V1116 || '').trim().toLowerCase();
  return email || '';
}

function persistentSaveKeyV1126(owner = persistentSaveOwnerV1126()) {
  return owner ? PERSISTENT_SAVE_PREFIX_V1126 + owner : '';
}

function persistentBasesSnapshotV1126() {
  try {
    if (typeof BASES_LS !== 'undefined') {
      return JSON.parse(localStorage.getItem(BASES_LS) || '{}');
    }
  } catch (error) {
    console.error(error);
  }
  return {};
}

function readPersistentSaveV1126(owner = persistentSaveOwnerV1126()) {
  const key = persistentSaveKeyV1126(owner);
  if (!key) return null;

  try {
    const value = JSON.parse(localStorage.getItem(key) || 'null');
    return value && value.owner === owner && value.payload?.state ? value : null;
  } catch (error) {
    console.error(error);
    return null;
  }
}

function writePersistentSaveV1126(record) {
  if (!record?.owner) return false;
  try {
    localStorage.setItem(persistentSaveKeyV1126(record.owner), JSON.stringify(record));
    return true;
  } catch (error) {
    console.error(error);
    return false;
  }
}

function removePersistentSaveV1126(owner = persistentSaveOwnerV1126()) {
  const key = persistentSaveKeyV1126(owner);
  if (!key) return;
  try { localStorage.removeItem(key); } catch (error) { console.error(error); }
}

function persistentPendingCountV1126(owner = persistentSaveOwnerV1126()) {
  return Math.max(0, Number(readPersistentSaveV1126(owner)?.actionCount) || 0);
}

function setPersistentSaveStatusV1126(mode, count = persistentPendingCountV1126()) {
  const label = document.getElementById('fbStatusText');
  const dot = document.getElementById('fbDot');
  if (!label || !dot) return;

  if (mode === 'saved') {
    label.textContent = 'Sauvegardé Firebase';
    dot.className = 'fbDot ok';
    return;
  }

  if (mode === 'syncing') {
    label.textContent = count > 1
      ? `Synchronisation... ${count} modifications`
      : 'Synchronisation...';
    dot.className = 'fbDot';
    return;
  }

  if (mode === 'error') {
    label.textContent = count > 0
      ? `Connexion indisponible • ${count} modification${count > 1 ? 's' : ''} conservée${count > 1 ? 's' : ''}`
      : 'Connexion Firebase indisponible';
    dot.className = 'fbDot bad';
    return;
  }

  label.textContent = count > 0
    ? `${count} modification${count > 1 ? 's' : ''} en attente`
    : 'Modification en attente';
  dot.className = 'fbDot';
}

// Réinitialise seulement la partie RUNTIME. La copie persistante n'est jamais
// supprimée lors d'une déconnexion/changement de compte.
function resetPersistentSaveRuntimeV1126() {
  persistentSaveRuntimeGenerationV1126 += 1;

  if (persistentSaveTimerV1126) {
    clearTimeout(persistentSaveTimerV1126);
    persistentSaveTimerV1126 = null;
  }

  persistentSaveInFlightV1126 = null;
  persistentSaveRetryAttemptV1126 = 0;

  window.SUIVI_OF_PENDING_WRITES_V1120 = 0;
  window.SUIVI_OF_LOCAL_PENDING_V1118 = false;
}

// Compatibilité avec la V11.25.
function resetGroupedSaveSessionV1125() {
  resetPersistentSaveRuntimeV1126();
}

function schedulePersistentSaveV1126(delay = PERSISTENT_SAVE_IDLE_DELAY_V1126) {
  if (persistentSaveTimerV1126) clearTimeout(persistentSaveTimerV1126);

  persistentSaveTimerV1126 = setTimeout(() => {
    persistentSaveTimerV1126 = null;
    flushPersistentSaveV1126().catch(() => {});
  }, Math.max(0, Number(delay) || 0));
}

// Indique au module Firebase si une version plus récente a été créée pendant
// l'envoi de la version actuellement en cours.
window.persistentQueueHasNewerV1126 = function persistentQueueHasNewerV1126(owner, version) {
  const current = readPersistentSaveV1126(owner);
  return !!current && Number(current.version) > Number(version);
};

// Enregistre la DERNIÈRE image métier du poste dans la file persistante.
// On ne stocke pas une liste de 50 actions : une seule image récente suffit,
// ce qui limite fortement la taille et le nombre d'écritures locales.
function queuePersistentSaveV1126() {
  const owner = persistentSaveOwnerV1126();

  // Normalement impossible puisque les actions métier exigent une connexion,
  // mais on garde la donnée locale si Firebase Auth n'est pas encore disponible.
  if (!owner) {
    window.SUIVI_OF_LOCAL_PENDING_V1118 = true;
    setPersistentSaveStatusV1126('pending', 1);
    return null;
  }

  const previous = readPersistentSaveV1126(owner);
  const now = new Date().toISOString();

  const record = {
    owner,
    email: String(window.SUIVI_OF_CONNECTED_EMAIL_V1116 || '').trim().toLowerCase(),
    version: Math.max(0, Number(previous?.version) || 0) + 1,
    actionCount: Math.max(0, Number(previous?.actionCount) || 0) + 1,
    createdAt: previous?.createdAt || now,
    updatedAt: now,
    payload: {
      state: sharedStateV1120(state),
      basesExcel: persistentBasesSnapshotV1126()
    }
  };

  if (!writePersistentSaveV1126(record)) {
    setPersistentSaveStatusV1126('error', record.actionCount);
    return record;
  }

  window.SUIVI_OF_PENDING_WRITES_V1120 = record.actionCount;
  window.SUIVI_OF_LOCAL_PENDING_V1118 = true;
  persistentSaveRetryAttemptV1126 = 0;

  setPersistentSaveStatusV1126('pending', record.actionCount);
  schedulePersistentSaveV1126();

  return record;
}

// Effectue une synchronisation réseau du dernier lot persistant.
// Si une nouvelle action arrive pendant l'envoi, elle reste dans localStorage
// et un second envoi est programmé automatiquement.
async function flushPersistentSaveV1126() {
  if (persistentSaveInFlightV1126) return persistentSaveInFlightV1126;

  const owner = persistentSaveOwnerV1126();
  if (!owner) return false;

  const record = readPersistentSaveV1126(owner);
  if (!record) {
    window.SUIVI_OF_PENDING_WRITES_V1120 = 0;
    window.SUIVI_OF_LOCAL_PENDING_V1118 = false;
    setPersistentSaveStatusV1126('saved', 0);
    return true;
  }

  if (typeof window.requestFirebaseSave !== 'function') {
    setPersistentSaveStatusV1126('pending', record.actionCount);
    return false;
  }

  const runtimeGeneration = persistentSaveRuntimeGenerationV1126;
  const sendingVersion = Number(record.version) || 0;
  setPersistentSaveStatusV1126('syncing', record.actionCount);

  const operation = (async () => {
    try {
      const committed = await window.requestFirebaseSave(
        true,
        record.payload,
        {
          silent: true,
          persistentOwner: owner,
          persistentVersion: sendingVersion
        }
      );

      if (!committed) throw new Error('Sauvegarde Firebase non confirmée.');

      // Si le compte a changé pendant la requête, l'ancien runtime ne touche
      // jamais l'état du nouveau compte.
      if (runtimeGeneration !== persistentSaveRuntimeGenerationV1126) {
        return false;
      }

      const latest = readPersistentSaveV1126(owner);

      if (latest && Number(latest.version) === sendingVersion) {
        removePersistentSaveV1126(owner);
        window.SUIVI_OF_PENDING_WRITES_V1120 = 0;
        window.SUIVI_OF_LOCAL_PENDING_V1118 = false;
        persistentSaveRetryAttemptV1126 = 0;
        setPersistentSaveStatusV1126('saved', 0);
      } else if (latest) {
        // Des clics ont eu lieu pendant la sauvegarde : on ne supprime surtout
        // pas la nouvelle version.
        window.SUIVI_OF_PENDING_WRITES_V1120 = latest.actionCount || 1;
        window.SUIVI_OF_LOCAL_PENDING_V1118 = true;
        setPersistentSaveStatusV1126('pending', latest.actionCount || 1);
        schedulePersistentSaveV1126(150);
      }

      return true;
    } catch (error) {
      console.error('Synchronisation persistante Firebase :', error);

      if (runtimeGeneration !== persistentSaveRuntimeGenerationV1126) {
        return false;
      }

      const latest = readPersistentSaveV1126(owner);
      const count = latest?.actionCount || record.actionCount || 1;

      window.SUIVI_OF_PENDING_WRITES_V1120 = count;
      window.SUIVI_OF_LOCAL_PENDING_V1118 = true;
      setPersistentSaveStatusV1126('error', count);

      // Retry exponentiel : 2 s, 4 s, 8 s... jusqu'à 30 s.
      persistentSaveRetryAttemptV1126 += 1;
      const retryDelay = Math.min(
        PERSISTENT_SAVE_RETRY_MAX_V1126,
        PERSISTENT_SAVE_RETRY_MIN_V1126 * Math.pow(2, persistentSaveRetryAttemptV1126 - 1)
      );
      schedulePersistentSaveV1126(retryDelay);
      return false;
    }
  })();

  persistentSaveInFlightV1126 = operation;

  try {
    return await operation;
  } finally {
    if (runtimeGeneration === persistentSaveRuntimeGenerationV1126) {
      persistentSaveInFlightV1126 = null;
    }
  }
}

// Ancien nom conservé pour les rares actions qui demandent un flush immédiat
// (annulation, QR, bouton Forcer sauvegarde).
async function flushSharedDataV1121() {
  if (persistentSaveTimerV1126) {
    clearTimeout(persistentSaveTimerV1126);
    persistentSaveTimerV1126 = null;
  }
  return flushPersistentSaveV1126();
}

// Au prochain login du même compte, restaure la copie locale non envoyée AVANT
// que le snapshot Firebase ne puisse l'écraser, puis synchronise en arrière-plan.
function recoverPersistentSaveV1126() {
  const owner = persistentSaveOwnerV1126();
  const record = readPersistentSaveV1126(owner);

  if (!record?.payload?.state) {
    window.SUIVI_OF_PENDING_WRITES_V1120 = 0;
    window.SUIVI_OF_LOCAL_PENDING_V1118 = false;
    return false;
  }

  const localUi = captureLocalUiStateV1120(state);

  state = restoreLocalUiStateV1120(
    JSON.parse(JSON.stringify(record.payload.state)),
    localUi
  );

  try {
    if (record.payload.basesExcel && typeof BASES_LS !== 'undefined') {
      localStorage.setItem(BASES_LS, JSON.stringify(record.payload.basesExcel));
      if (typeof loadPersistedBases === 'function') loadPersistedBases();
    }
  } catch (error) {
    console.error(error);
  }

  if (typeof normalizeAll === 'function') normalizeAll();
  if (typeof applyConnectedPersonV1116 === 'function') applyConnectedPersonV1116();

  try { localStorage.setItem(LS, JSON.stringify(state)); } catch (error) { console.error(error); }

  window.SUIVI_OF_PENDING_WRITES_V1120 = record.actionCount || 1;
  window.SUIVI_OF_LOCAL_PENDING_V1118 = true;

  setPersistentSaveStatusV1126('pending', record.actionCount || 1);
  render();
  schedulePersistentSaveV1126(250);

  return true;
}

// Une modification métier est toujours instantanée : navigateur d'abord,
// Firebase ensuite, sans attendre le réseau.
function saveCriticalV1118() {
  try { localStorage.setItem(LS, JSON.stringify(state)); }
  catch (error) { console.error(error); }

  queuePersistentSaveV1126();
  render();

  // L'appelant n'a pas à attendre Firebase pour continuer.
  return Promise.resolve(true);
}

function saveSharedDataV1120() {
  return saveCriticalV1118();
}

// Retourne le libellé court de l'heure de démarrage d'un OF.
function workStartTimeLabelV1111(startedAt) {
  const date = new Date(startedAt);
  if (Number.isNaN(date.getTime())) return '-';
  return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

// Démarre une réalisation d'OF pour la personne sélectionnée sans augmenter encore la quantité faite.
function startOFWorkV1111(vehicleId, ofId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  const of = vehicle?.ofs.find(item => item.id === ofId);
  if (!vehicle || !of) return;
  normalizeQtyOFV5(of);

  if (of.status === 'Bloqué') {
    alert('Cet OF est bloqué. Débloque-le avant de le démarrer.');
    return;
  }
  if (qtyRemainingV5(of) <= 0) {
    alert('Cet OF est déjà terminé.');
    return;
  }

  const existing = activeWorkSessionV1111(of);
  if (existing) {
    alert(`Cet OF est déjà en cours par ${existing.person} depuis ${workStartTimeLabelV1111(existing.startedAt)}.`);
    return;
  }

  const person = operationalPersonV1116();
  if (!person) {
    alert("Utilisateur connecté non reconnu. Reconnecte-toi avec ton compte Firebase.");
    return;
  }

  const beforeSnapshot = progressSnapshot(vehicle);
  const now = new Date().toISOString();
  of.workSessionV1111 = {
    person,
    startedAt: now,
    pausedAt: '',
    pausedTotalMs: 0
  };
  of.status = 'En cours';
  touchOFV1118(of, now);
  state.realPerson = person;

  logAction('OF débuté', vehicle, of, `${person} • réalisation ${qtyDoneV5(of) + 1}/${qtyTotalV5(of)}`);
  recordProgressEvent(vehicle, of, 0, person, 'start', 'OF débuté', beforeSnapshot, now);
  saveCriticalV1118();
}

// Met en pause une réalisation sans la terminer et sans augmenter la quantité réalisée.
function pauseOFWorkV1113(vehicleId, ofId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  const of = vehicle?.ofs.find(item => item.id === ofId);
  const session = activeWorkSessionV1111(of);

  if (!vehicle || !of || !session) {
    alert("Cet OF n'est pas actuellement démarré.");
    return;
  }

  if (session.pausedAt) {
    alert('Cet OF est déjà en pause.');
    return;
  }

  if (!canControlWorkSessionV1116(session, 'Cet OF')) return;

  const beforeSnapshot = progressSnapshot(vehicle);
  const now = new Date().toISOString();

  session.pausedAt = now;
  of.status = 'En pause';
  touchOFV1118(of, now);

  logAction('OF mis en pause', vehicle, of, `${session.person} • temps travaillé ${workSessionDurationLabelV1113(session, now)}`);
  recordProgressEvent(vehicle, of, 0, session.person, 'pause', 'OF mis en pause', beforeSnapshot, now);
  saveCriticalV1118();
}

// Relance une réalisation en pause en reprenant le chronomètre à partir de maintenant.
function resumeOFWorkV1113(vehicleId, ofId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  const of = vehicle?.ofs.find(item => item.id === ofId);
  const session = activeWorkSessionV1111(of);

  if (!vehicle || !of || !session) {
    alert("Cet OF n'est pas actuellement démarré.");
    return;
  }

  if (!session.pausedAt) {
    alert("Cet OF n'est pas en pause.");
    return;
  }

  if (!canControlWorkSessionV1116(session, 'Cet OF')) return;

  const beforeSnapshot = progressSnapshot(vehicle);
  const now = new Date().toISOString();
  const pausedAt = new Date(session.pausedAt);
  const resumedAt = new Date(now);

  if (!Number.isNaN(pausedAt.getTime()) && !Number.isNaN(resumedAt.getTime())) {
    session.pausedTotalMs = Math.max(0, Number(session.pausedTotalMs) || 0) + Math.max(0, resumedAt - pausedAt);
  }

  session.pausedAt = '';
  of.status = 'En cours';
  touchOFV1118(of, now);
  state.realPerson = session.person;

  logAction('OF repris', vehicle, of, `${session.person} • temps travaillé ${workSessionDurationLabelV1113(session, now)}`);
  recordProgressEvent(vehicle, of, 0, session.person, 'resume', 'OF repris', beforeSnapshot, now);
  saveCriticalV1118();
}

// Termine la réalisation actuellement démarrée et ajoute exactement +1 à la quantité faite.
function finishOFWorkV1111(vehicleId, ofId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  const of = vehicle?.ofs.find(item => item.id === ofId);
  const session = activeWorkSessionV1111(of);
  if (!vehicle || !of || !session) {
    alert("Cet OF n'est pas actuellement démarré.");
    return;
  }

  if (session.pausedAt) {
    alert("Cet OF est en pause. Clique d'abord sur « Reprendre », puis sur « Terminer ».");
    return;
  }

  if (!canControlWorkSessionV1116(session, 'Cet OF')) return;

  const total = qtyTotalV5(of);
  const nextDone = Math.min(total, qtyDoneV5(of) + 1);
  const confirmation = confirm(
    `Confirmer la fin de cet OF ?\n\n` +
    `${of.name || 'OF'}\n` +
    `VIN : ${vehicle.vin || '-'}\n` +
    `Personne : ${session.person}\n` +
    `Réalisation : ${nextDone}/${total}\n\n` +
    `Cette action validera +1 réalisation.`
  );

  if (!confirmation) return;

  addQtyDoneV5(vehicleId, ofId, 1, session.person);
}

// Annule un démarrage sans modifier la quantité réalisée et confirme immédiatement la suppression de la session dans Firebase.
async function cancelOFWorkV1111(vehicleId, ofId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  const of = vehicle?.ofs.find(item => item.id === ofId);
  const session = activeWorkSessionV1111(of);
  if (!vehicle || !of || !session) return;

  if (!canControlWorkSessionV1116(session, 'Cet OF')) return;
  if (!confirm(`Annuler le démarrage de ${of.name} par ${session.person} ?`)) return;

  const beforeSnapshot = progressSnapshot(vehicle);
  const duration = workSessionDurationLabelV1113(session);

  // La session est réellement supprimée de l'OF avant toute sauvegarde.
  delete of.workSessionV1111;
  of.status = qtyRemainingV5(of) <= 0 ? 'Fait' : 'À faire';
  touchOFV1118(of);

  logAction('Démarrage OF annulé', vehicle, of, `${session.person} • après ${duration}`);
  recordProgressEvent(vehicle, of, 0, session.person, 'cancel', 'Démarrage annulé', beforeSnapshot);

  // L'annulation reste une action rare : on vide immédiatement le lot après l'avoir enregistrée.
  saveSharedDataV1120();
  await flushSharedDataV1121();
}

// Met un OF ancien au format quantité actuel sans perdre son statut ni son avancement.
function normalizeQtyOFV5(of) {
  if (!of) return;
  of.quantity = qtyTotalV5(of);
  of.completedQty = qtyDoneV5(of);
  if (!of.status) of.status = 'À faire';
  if (of.completedQty >= of.quantity) of.status = 'Fait';
  else if (of.status === 'Fait') of.status = 'À faire';
  of.doneBy = of.doneBy || '';
  of.doneAt = of.doneAt || '';
  of.blockReason = of.blockReason || '';
}

// Met tous les OF et toutes les bases Excel au format quantité actuel.
function normalizeQtyAllV5() {
  (state.vehicles || []).forEach(vehicle => (vehicle.ofs || []).forEach(of => {
    normalizeQtyOFV5(of);
    normalizeWorkSessionV1111(of);
  }));
  ['Renault', 'Mercedes', 'MAN'].forEach(brand => {
    (state.customTemplates?.[brand] || []).forEach(of => {
      const n = Math.floor(Number(of?.quantity ?? of?.qty ?? 1));
      of.quantity = Number.isFinite(n) && n > 0 ? n : 1;
    });
  });
}

// Retourne le nombre de lignes OF entièrement terminées sur un véhicule.
function doneOf(vehicle) {
  if (isSAV(vehicle)) return vehicle.savDone ? 1 : 0;
  return (vehicle.ofs || []).filter(of => qtyRemainingV5(of) === 0).length;
}

// Calcule le pourcentage global d'avancement en tenant compte des quantités de chaque OF.
function pct(vehicle) {
  if (isSAV(vehicle)) {
    if (vehicle.savDone) return 100;
    const planned = Number(vehicle.savEstimated) || 0;
    const actual = savActualHoursNowV1114(vehicle);
    return planned ? Math.min(100, Math.round(actual / planned * 100)) : 0;
  }
  const total = (vehicle.ofs || []).reduce((sum, of) => sum + qtyTotalV5(of), 0);
  const done = (vehicle.ofs || []).reduce((sum, of) => sum + qtyDoneV5(of), 0);
  return total ? Math.round(done / total * 100) : 0;
}

// Calcule le temps restant d'un véhicule en multipliant le temps unitaire par la quantité restante.
function remain(vehicle) {
  if (isSAV(vehicle)) {
    if (vehicle.savDone) return 0;
    return Math.max((Number(vehicle.savEstimated) || 0) - savActualHoursNowV1114(vehicle), 0);
  }
  return (vehicle.ofs || []).reduce((sum, of) => sum + (Number(of.time) || 0) * qtyRemainingV5(of), 0);
}

// Retourne le nombre total de réalisations prévues sur un véhicule.
function totalUnitsV5(vehicle) {
  return (vehicle.ofs || []).reduce((sum, of) => sum + qtyTotalV5(of), 0);
}

// Retourne le nombre total de réalisations déjà faites sur un véhicule.
function doneUnitsV5(vehicle) {
  return (vehicle.ofs || []).reduce((sum, of) => sum + qtyDoneV5(of), 0);
}

// Indique si une fiche véhicule correspond à un SAV et non à un camion avec OF.
function isSAV(vehicle) {
  return !!(vehicle && vehicle.isSAV);
}

// Retourne les véhicules actifs, c'est-à-dire non archivés.
function activeVehicles() {
  return (state.vehicles || []).filter(vehicle => !vehicle.archived);
}

// Retourne les véhicules archivés.
function archivedVehicles() {
  return (state.vehicles || []).filter(vehicle => !!vehicle.archived);
}

// Retourne les véhicules actifs qui possèdent des OF et exclut les SAV.
function activeNormalVehicles() {
  return activeVehicles().filter(vehicle => !isSAV(vehicle));
}

// Retourne la couleur visuelle d'un véhicule ou la couleur bleue par défaut.
function vehicleColor(vehicle) {
  return vehicle?.color || '#3b82f6';
}

// Génère le petit rond de couleur affiché devant le VIN.
function colorDot(vehicle) {
  return `<span class="vehiclecolor" style="background:${escHtml(vehicleColor(vehicle))}"></span>`;
}

// Transforme le nom interne d'une option en libellé plus lisible.
function optionLabel(option) {
  return String(option || '')
    .replace('OPTION ', '')
    .replace('CANON ELC', 'Canon ELC')
    .replace('TRITON', 'Triton');
}

// Génère les pastilles d'options affichées dans le tableau de bord.
function vehicleOptionsHtml(vehicle) {
  let options = Array.isArray(vehicle.selectedOptions) ? vehicle.selectedOptions.slice() : [];
  if (!options.length && Array.isArray(vehicle.ofs)) {
    options = [...new Set(vehicle.ofs.map(of => of.option).filter(Boolean))];
  }
  if (!options.length) return '<span class="optionchip none">Aucune</span>';
  return options.map(option => `<span class="optionchip">${escHtml(optionLabel(option))}</span>`).join('');
}

// Retourne la base OF actuellement chargée pour une marque.
function templateForBrand(brand) {
  const rows = state.customTemplates?.[brand];
  return Array.isArray(rows) ? rows : [];
}

// Retourne toutes les options présentes dans la base Excel d'une marque.
function optionsForBrand(brand) {
  return [...new Set(templateForBrand(brand).map(of => of.option).filter(Boolean))];
}

// Construit les OF automatiques d'un nouveau véhicule à partir de sa base et de ses options.
function buildOFsForVehicle(brand, includeBase, selectedOptions) {
  const selected = new Set(selectedOptions || []);
  return templateForBrand(brand)
    .filter(of => {
      if (of.removeIfOption && selected.has(of.removeIfOption)) return false;
      if (of.option) return selected.has(of.option);
      return includeBase;
    })
    .map(of => ({
      ...of,
      id: uid(),
      quantity: qtyTotalV5(of),
      completedQty: 0,
      status: 'À faire',
      doneBy: '',
      doneAt: '',
      blockReason: '',
      manual: false
    }));
}

// Sauvegarde les bases OF actuellement chargées dans un espace local séparé.

}

// Recharge le catalogue de pièces réel ; aucune pièce de démonstration n'est injectée.
