// Crée l'horaire standard d'une personne selon un contrat 39 h ou 35 h.
function defaultSchedule(mode = '39h') {
  const schedule = {};
  ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'].forEach((day, index) => {
    schedule[day] = {
      work: true,
      amStart: '07:30',
      amEnd: '12:30',
      pmStart: '13:30',
      pmEnd: mode === '35h' ? '15:30' : (index === 4 ? '15:30' : '16:30')
    };
  });
  return schedule;
}

// Convertit les anciennes personnes simples en objets complets avec horaires et congés, puis garantit que la personne active existe toujours.
function normalizePeople() {
  state.people = (state.people || []).map((person, index) => {
    if (typeof person === 'string') {
      return { id: uid(), name: person, mode: '39h', schedule: defaultSchedule('39h'), vacations: [] };
    }
    person.id = person.id || uid();
    person.name = person.name || ('Personne ' + (index + 1));
    person.mode = person.mode || '39h';
    person.schedule = person.schedule || defaultSchedule(person.mode);
    person.vacations = Array.isArray(person.vacations) ? person.vacations : [];
    return person;
  });

  // V11.29 : comptes atelier ajoutés au code.
  // Sur une base Firebase déjà existante, on ajoute automatiquement les personnes
  // si elles ne sont pas encore présentes, sans toucher aux autres personnes.
  ['Maël', 'Lucas'].forEach(requiredName => {
    const exists = state.people.some(person =>
      String(personName(person) || '').trim().toLocaleLowerCase('fr-FR') ===
      requiredName.toLocaleLowerCase('fr-FR')
    );

    if (!exists) {
      state.people.push({
        id: uid(),
        name: requiredName,
        mode: '39h',
        schedule: defaultSchedule('39h'),
        vacations: []
      });
    }
  });

  const connected = typeof connectedPersonV1116 === 'function' ? connectedPersonV1116() : '';
  if (connected) {
    state.realPerson = connected;
    return;
  }

  const validNames = new Set(state.people.map(person => personName(person)).filter(Boolean));
  if (!state.realPerson || !validNames.has(state.realPerson)) {
    state.realPerson = state.people[0] ? personName(state.people[0]) : '';
  }
}

// Normalise l'ensemble de l'état après un chargement local, une restauration ou une réception Firebase.
function normalizeAll() {
  state.vehicles = Array.isArray(state.vehicles) ? state.vehicles : [];
  state.history = Array.isArray(state.history) ? state.history : [];
  state.customTemplates = state.customTemplates || { Renault: [], Mercedes: [], MAN: [] };
  state.partsCatalogV8 = state.partsCatalogV8 || { Renault: [], Mercedes: [], MAN: [], Autre: [] };
  state.progressEventsV6 = Array.isArray(state.progressEventsV6) ? state.progressEventsV6 : [];
  state.workTimesV1112 = Array.isArray(state.workTimesV1112) ? state.workTimesV1112 : [];
  state.notificationsV1115 = Array.isArray(state.notificationsV1115) ? state.notificationsV1115 : [];
  state.planningV1124 = Array.isArray(state.planningV1124) ? state.planningV1124 : [];
  normalizePlanningV1124();
  // On garde les 300 notifications les plus récentes afin de ne pas alourdir le document Firebase.
  state.notificationsV1115 = state.notificationsV1115
    .filter(item => item && item.id && item.at)
    .sort((a, b) => new Date(b.at) - new Date(a.at))
    .slice(0, 300);
  const colors = ['#3b82f6', '#22c55e', '#f97316', '#a855f7', '#ef4444', '#14b8a6', '#eab308', '#ec4899'];
  state.vehicles.forEach((vehicle, index) => {
    vehicle.ofs = Array.isArray(vehicle.ofs) ? vehicle.ofs : [];
    if (!vehicle.color) vehicle.color = colors[index % colors.length];
    // Compatibilité V11.5 : les anciennes fiches n'avaient pas encore de date objectif.
    if (typeof vehicle.targetDate !== 'string') vehicle.targetDate = '';
  });
  normalizePeople();
  normalizeQtyAllV5();
  normalizeSAVWorkV1114();
  migrateWorkTimesV1112();
  ['Renault', 'Mercedes', 'MAN', 'Autre'].forEach(brand => {
    if (!Array.isArray(state.partsCatalogV8[brand])) state.partsCatalogV8[brand] = [];
  });
  state.schemaVersion = 10;
}

// Normalise les informations de chronométrage d'un SAV ancien ou en cours.
function normalizeSAVWorkV1114() {
  (state.vehicles || []).filter(vehicle => isSAV(vehicle)).forEach(vehicle => {
    if (vehicle.savDone && vehicle.savWorkSessionV1114) {
      delete vehicle.savWorkSessionV1114;
    }

    const session = vehicle.savWorkSessionV1114;
    if (!session) return;

    if (!session.person || !session.startedAt) {
      delete vehicle.savWorkSessionV1114;
      return;
    }

    session.pausedTotalMs = Math.max(0, Number(session.pausedTotalMs) || 0);
    session.pausedAt = session.pausedAt || '';
  });
}

// Retourne la session de travail active d'un SAV.
function savWorkSessionV1114(vehicle) {
  if (!vehicle || !isSAV(vehicle) || vehicle.savDone) return null;
  const session = vehicle.savWorkSessionV1114;
  if (!session || !session.person || !session.startedAt) return null;
  session.pausedTotalMs = Math.max(0, Number(session.pausedTotalMs) || 0);
  session.pausedAt = session.pausedAt || '';
  return session;
}

// Retourne le temps SAV déjà enregistré auquel s'ajoute le travail de la session actuellement ouverte.
function savActualHoursNowV1114(vehicle) {
  const base = Math.max(0, Number(vehicle?.savActual) || 0);
  const session = savWorkSessionV1114(vehicle);
  if (!session) return base;
  return base + workSessionActiveMinutesV1113(session) / 60;
}

// Retourne l'état lisible d'un SAV : À faire, En cours, En pause ou Terminé.
function savWorkStatusV1114(vehicle) {
  if (!vehicle || !isSAV(vehicle)) return { key: 'todo', label: 'À faire', person: '', session: null };
  if (vehicle.savDone) return { key: 'done', label: 'Terminé', person: '', session: null };

  const session = savWorkSessionV1114(vehicle);
  if (!session) return { key: 'todo', label: 'À faire', person: '', session: null };

  if (session.pausedAt) {
    return { key: 'paused', label: 'En pause', person: session.person, session };
  }

  return { key: 'running', label: 'En cours', person: session.person, session };
}

// Génère la pastille d'état d'un SAV et indique la personne qui travaille dessus.
function savWorkStatusHtmlV1114(vehicle) {
  const status = savWorkStatusV1114(vehicle);
  let sub = '';

  if (status.session) {
    sub = status.key === 'paused'
      ? `<div class="muted" style="margin-top:5px">${escHtml(status.person)} • pause depuis ${escHtml(workStartTimeLabelV1111(status.session.pausedAt))}</div>`
      : `<div class="muted" style="margin-top:5px">${escHtml(status.person)} • depuis ${escHtml(workStartTimeLabelV1111(status.session.startedAt))}</div>`;
  }

  return `<span class="savWorkBadgeV1114 ${status.key}">${status.key === 'running' ? '▶ ' : status.key === 'paused' ? '⏸ ' : status.key === 'done' ? '✓ ' : ''}${escHtml(status.label)}</span>${sub}`;
}

// Compte les SAV sur lesquels une personne travaille actuellement, pause comprise.
function totalSAVInProgressV1114() {
  return activeVehicles()
    .filter(vehicle => isSAV(vehicle) && !!savWorkSessionV1114(vehicle))
    .length;
}

// Crée un pseudo-OF SAV uniquement pour enregistrer proprement sa durée dans la page Temps OF.
function savPseudoOFV1114(vehicle) {
  return {
    id: 'SAV-' + vehicle.id,
    name: 'SAV',
    desc: vehicle.savComment || '',
    category: 'SAV',
    time: Math.max(0, Number(vehicle.savEstimated) || 0)
  };
}

// Démarre le chronomètre d'un SAV avec la personne sélectionnée dans Réalisation.
function startSAVWorkV1114(vehicleId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId && isSAV(item));
  if (!vehicle) return;

  if (vehicle.savDone) {
    alert('Ce SAV est déjà terminé. Décoche « SAV terminé » dans Modifier SAV pour le rouvrir.');
    return;
  }

  const existing = savWorkSessionV1114(vehicle);
  if (existing) {
    alert(`Ce SAV est déjà ${existing.pausedAt ? 'en pause' : 'en cours'} par ${existing.person}.`);
    return;
  }

  const person = operationalPersonV1116();
  if (!person) {
    alert("Utilisateur connecté non reconnu. Reconnecte-toi avec ton compte Firebase.");
    return;
  }

  const now = new Date().toISOString();

  vehicle.savWorkSessionV1114 = {
    person,
    startedAt: now,
    pausedAt: '',
    pausedTotalMs: 0
  };
  touchSAVV1118(vehicle, now);

  state.realPerson = person;
  logAction('SAV débuté', vehicle, { name: 'SAV', doneBy: person }, `${person} • ${workStartTimeLabelV1111(now)}`);
  saveCriticalV1118();
}

// Met le chronomètre d'un SAV en pause sans comptabiliser cette période dans le temps réel.
function pauseSAVWorkV1114(vehicleId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId && isSAV(item));
  const session = savWorkSessionV1114(vehicle);

  if (!vehicle || !session) {
    alert("Ce SAV n'est pas actuellement démarré.");
    return;
  }

  if (session.pausedAt) {
    alert('Ce SAV est déjà en pause.');
    return;
  }

  if (!canControlWorkSessionV1116(session, 'Ce SAV')) return;

  const now = new Date().toISOString();
  session.pausedAt = now;
  touchSAVV1118(vehicle, now);

  logAction('SAV mis en pause', vehicle, { name: 'SAV', doneBy: session.person }, `${session.person} • ${workSessionDurationLabelV1113(session, now)} travaillé`);
  saveCriticalV1118();
}

// Reprend le chronomètre d'un SAV en pause.
function resumeSAVWorkV1114(vehicleId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId && isSAV(item));
  const session = savWorkSessionV1114(vehicle);

  if (!vehicle || !session) {
    alert("Ce SAV n'est pas actuellement démarré.");
    return;
  }

  if (!session.pausedAt) {
    alert("Ce SAV n'est pas en pause.");
    return;
  }

  if (!canControlWorkSessionV1116(session, 'Ce SAV')) return;

  const now = new Date().toISOString();
  const pausedAt = new Date(session.pausedAt);
  const resumedAt = new Date(now);

  if (!Number.isNaN(pausedAt.getTime()) && !Number.isNaN(resumedAt.getTime())) {
    session.pausedTotalMs =
      Math.max(0, Number(session.pausedTotalMs) || 0) +
      Math.max(0, resumedAt - pausedAt);
  }

  session.pausedAt = '';
  touchSAVV1118(vehicle, now);
  state.realPerson = session.person;

  logAction('SAV repris', vehicle, { name: 'SAV', doneBy: session.person }, `${session.person} • ${workSessionDurationLabelV1113(session, now)} travaillé`);
  saveCriticalV1118();
}

// Annule un démarrage de SAV sans ajouter de temps réel.
function cancelSAVWorkV1114(vehicleId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId && isSAV(item));
  const session = savWorkSessionV1114(vehicle);
  if (!vehicle || !session) return;

  if (!canControlWorkSessionV1116(session, 'Ce SAV')) return;
  if (!confirm(`Annuler le démarrage du SAV ${vehicle.vin} par ${session.person} ?`)) return;

  const duration = workSessionDurationLabelV1113(session);
  delete vehicle.savWorkSessionV1114;
  touchSAVV1118(vehicle);

  logAction('Démarrage SAV annulé', vehicle, { name: 'SAV', doneBy: session.person }, `${session.person} • après ${duration}`);
  saveCriticalV1118();
}

// Termine un SAV, ajoute automatiquement son temps travaillé au temps réel et l'enregistre dans Temps OF.
function finishSAVWorkV1114(vehicleId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId && isSAV(item));
  const session = savWorkSessionV1114(vehicle);

  if (!vehicle || !session) {
    alert("Ce SAV n'est pas actuellement démarré.");
    return;
  }

  if (session.pausedAt) {
    alert("Ce SAV est en pause. Clique d'abord sur « Reprendre », puis sur « Terminer ».");
    return;
  }

  if (!canControlWorkSessionV1116(session, 'Ce SAV')) return;

  const now = new Date().toISOString();
  const actualMinutes = workSessionActiveMinutesV1113(session, now);
  const pausedMinutes = workSessionPausedMinutesV1113(session, now);
  const previousActual = Math.max(0, Number(vehicle.savActual) || 0);

  // Le temps manuel déjà présent est conservé ; le chrono vient simplement s'y ajouter.
  vehicle.savActual = previousActual + actualMinutes / 60;
  vehicle.savDone = true;
  vehicle.savDoneAt = now;
  touchSAVV1118(vehicle, now);

  addWorkTimeRecordV1112(vehicle, savPseudoOFV1114(vehicle), session, now, 1);

  const person = session.person;
  delete vehicle.savWorkSessionV1114;

  logAction(
    'SAV terminé',
    vehicle,
    { name: 'SAV', doneBy: person },
    `${person} • ${workMinutesLabelV1112(actualMinutes)} travaillé${pausedMinutes ? ` • ${workMinutesLabelV1112(pausedMinutes)} de pause` : ''}`
  );

  saveCriticalV1118();
}

// Génère les boutons Débuter / Pause / Reprendre / Terminer d'un SAV.
function savWorkButtonsV1114(vehicle) {
  if (!vehicle || vehicle.archived || vehicle.savDone) return '';

  const session = savWorkSessionV1114(vehicle);

  if (!session) {
    return `<button class="small good" onclick="startSAVWorkV1114('${vehicle.id}')">▶ Débuter</button>`;
  }

  if (session.pausedAt) {
    return `<button class="small good" onclick="resumeSAVWorkV1114('${vehicle.id}')">▶ Reprendre</button>
      <button class="small warn" onclick="cancelSAVWorkV1114('${vehicle.id}')">Annuler démarrage</button>`;
  }

  return `<button class="small warn" onclick="pauseSAVWorkV1114('${vehicle.id}')">⏸ Pause</button>
    <button class="small good" onclick="finishSAVWorkV1114('${vehicle.id}')">✓ Terminer</button>
    <button class="small alt" onclick="cancelSAVWorkV1114('${vehicle.id}')">Annuler démarrage</button>`;
}

// Traduit une action métier en type de notification visible dans la cloche.
function notificationTypeFromActionV1115(action) {
  const map = {
    'OF bloqué': 'blocked',
    'OF bloqué (multi-VIN)': 'blocked',
    'OF débloqué': 'unblocked',
    'OF débuté': 'started',

    'OF terminé': 'finished',
    'Démarrage OF annulé': 'cancelled',
    'SAV débuté': 'started',
    'SAV mis en pause': 'paused',
    'SAV repris': 'resumed',

// Retourne la personne la plus pertinente pour une notification.
function notificationPersonV1115(vehicle, of) {

}

// Ajoute une notification globale ; elle sera synchronisée avec les autres postes via Firebase.
function createNotificationV1115(action, vehicle, of, detail = '', personOverride = '') {
  const type = notificationTypeFromActionV1115(action);
  if (!type) return;

  state.notificationsV1115 = Array.isArray(state.notificationsV1115) ? state.notificationsV1115 : [];

  const cleanAction = action === 'OF bloqué (multi-VIN)' ? 'OF bloqué' : action;
  const item = {
    id: uid(),
    at: new Date().toISOString(),
    type,
    action: cleanAction,
    vehicleId: vehicle?.id || '',
    vin: vehicle?.vin || '',
    ofId: of?.id || '',
    ofName: of?.name || (isSAV(vehicle) ? 'SAV' : ''),
    person: personOverride || notificationPersonV1115(vehicle, of),
    detail: detail || ''
  };

  state.notificationsV1115.unshift(item);
  state.notificationsV1115 = state.notificationsV1115.slice(0, 300);
}

// Retourne l'icône correspondant au type d'une notification.
function notificationIconV1115(type, action = '') {
  if (action.startsWith('SAV')) {
    if (type === 'paused') return '⏸';
    if (type === 'resumed') return '▶';
    if (type === 'finished') return '✓';
    if (type === 'cancelled') return '↩';
    return '🛠';
  }
  if (type === 'blocked') return '⛔';
  if (type === 'unblocked') return '✓';
  if (type === 'started') return '▶';
  if (type === 'paused') return '⏸';
  if (type === 'resumed') return '↻';
  if (type === 'finished') return '✓';
  return '↩';
}

// Convertit une heure HH:MM en nombre de minutes depuis minuit.
function timeToMin(time) {
  const [hours, minutes] = String(time || '00:00').split(':').map(Number);
  return (hours || 0) * 60 + (minutes || 0);
}

// Crée une date à partir d'un jour et d'un nombre de minutes depuis minuit.
function minToDate(date, minutes) {
  const result = new Date(date);
  result.setHours(Math.floor(minutes / 60), minutes % 60, 0, 0);
  return result;
}

// Calcule le nombre d'heures hebdomadaires correspondant aux créneaux enregistrés d'une personne.
function hoursDaySchedule(person) {
  const schedule = person.schedule || defaultSchedule(person.mode);
  let totalMinutes = 0;
  Object.values(schedule).forEach(day => {
    if (day.work !== false) {
      totalMinutes += Math.max(0, timeToMin(day.amEnd) - timeToMin(day.amStart));
      totalMinutes += Math.max(0, timeToMin(day.pmEnd) - timeToMin(day.pmStart));
    }
  });
  return totalMinutes / 60;
}

// Calcule la date de Pâques pour une année afin d'en déduire les jours fériés mobiles.
function easterDate(year) {
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, month - 1, day);
}

// Ajoute un nombre de jours à une date sans modifier la date d'origine.
function addDays(date, days) {
  const result = new Date(date);
  result.setDate(result.getDate() + days);
  return result;
}

// Transforme une date en chaîne YYYY-MM-DD utilisée pour les comparaisons de jours.
function ymd(date) {
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
}

// Retourne l'ensemble des principaux jours fériés français utilisés par l'estimation de planning.
function frenchHolidays(year) {
  const easter = easterDate(year);
  return new Set([
    `${year}-01-01`, `${year}-05-01`, `${year}-05-08`, `${year}-07-14`, `${year}-08-15`,
    `${year}-11-01`, `${year}-11-11`, `${year}-12-25`,
    ymd(addDays(easter, 1)), ymd(addDays(easter, 39)), ymd(addDays(easter, 50))
  ]);
}

// Indique si une date correspond à un jour férié français pris en compte par le planning.
function isHoliday(date) {
  return frenchHolidays(date.getFullYear()).has(ymd(date));
}

// Retourne ou initialise la liste des périodes de congé d'une personne.
function personVacations(person) {
  person.vacations = Array.isArray(person.vacations) ? person.vacations : [];
  return person.vacations;
}

// Indique si une personne est en congé à une date donnée.
function isPersonOnVacation(person, date) {
  const day = ymd(date);
  return personVacations(person).some(vacation => day >= vacation.start && day <= vacation.end);
}

// Retourne les créneaux de travail disponibles pour une personne sur une journée précise.
function intervalsForDay(person, date) {
  if (isPersonOnVacation(person, date)) return [];
  const names = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
  const dayName = names[date.getDay()];
  const schedule = (person.schedule || defaultSchedule(person.mode))[dayName];
  if (!schedule || schedule.work === false || date.getDay() === 0 || date.getDay() === 6 || isHoliday(date)) return [];
  return [
    [timeToMin(schedule.amStart), timeToMin(schedule.amEnd)],
    [timeToMin(schedule.pmStart), timeToMin(schedule.pmEnd)]
  ].filter(([start, end]) => end > start);
}

// Cherche le prochain instant où une personne est disponible pour travailler.
function nextWorkStart(person, from) {
  let date = new Date(from);
  date.setSeconds(0, 0);
  for (let guard = 0; guard < 800; guard++) {
    const intervals = intervalsForDay(person, date);
    const now = date.getHours() * 60 + date.getMinutes();
    for (const [start, end] of intervals) {
      if (now <= start) return minToDate(date, start);
      if (now >= start && now < end) return date;
    }
    date.setDate(date.getDate() + 1);
    date.setHours(0, 0, 0, 0);
  }
  return null;
}

// Ajoute un nombre d'heures de travail réelles à une date en sautant pauses, week-ends, fériés et congés.
function addWorkHours(person, start, hours) {
  let remainingMinutes = Math.max(0, Number(hours) || 0) * 60;
  let date = nextWorkStart(person, start);
  if (!date) return null;
  for (let guard = 0; guard < 2000 && remainingMinutes > 0; guard++) {
    const intervals = intervalsForDay(person, date);
    const now = date.getHours() * 60 + date.getMinutes();
    let progressed = false;
    for (const [startMin, endMin] of intervals) {
      const current = Math.max(now, startMin);
      if (current >= endMin) continue;
      const used = Math.min(remainingMinutes, endMin - current);
      remainingMinutes -= used;
      date = minToDate(date, current + used);
      progressed = true;
      if (remainingMinutes <= 0) return date;
    }
    if (!progressed || remainingMinutes > 0) {
      date.setDate(date.getDate() + 1);
      date.setHours(0, 0, 0, 0);
      date = nextWorkStart(person, date);
      if (!date) return null;
    }
  }
  return date;
}

// Formate une date estimée de fin de production.
function fmtDate(date) {
  return date ? date.toLocaleDateString('fr-FR') + ' ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '-';
}

// Formate une date objectif YYYY-MM-DD au format français sans décalage de fuseau horaire.
function targetDateLabelV115(value) {
  if (!value) return '-';
  const parts = String(value).split('-').map(Number);
  if (parts.length !== 3 || !parts[0] || !parts[1] || !parts[2]) return '-';
  return String(parts[2]).padStart(2, '0') + '/' + String(parts[1]).padStart(2, '0') + '/' + parts[0];
}

// Transforme une date objectif en fin de journée locale pour comparer proprement planning et objectif.
function targetEndDateV115(value) {
  if (!value) return null;
  const parts = String(value).split('-').map(Number);
  if (parts.length !== 3 || !parts[0] || !parts[1] || !parts[2]) return null;
  return new Date(parts[0], parts[1] - 1, parts[2], 23, 59, 59, 999);
}

// Détermine si un camion est dans les temps, à risque ou déjà en retard par rapport à sa date objectif.
function deadlineInfoV115(vehicle, estimatedEnd, isArchive = false) {
  if (!vehicle || isSAV(vehicle) || !vehicle.targetDate) return { label: 'Non défini', className: 'none' };
  if (isArchive) return { label: 'Archivé', className: 'none' };
  if (remain(vehicle) <= 0) return { label: 'Terminé', className: 'done' };
  const targetEnd = targetEndDateV115(vehicle.targetDate);
  if (!targetEnd) return { label: 'Non défini', className: 'none' };
  const now = new Date();
  if (now > targetEnd) return { label: 'En retard', className: 'late' };
  if (!estimatedEnd) return { label: 'À calculer', className: 'none' };
  if (estimatedEnd > targetEnd) return { label: 'Risque de retard', className: 'risk' };
  return { label: 'Dans les temps', className: 'ok' };
}

// Génère la cellule Objectif du tableau de bord avec la date et l'état calculé.
function deadlineHtmlV115(vehicle, estimatedEnd, isArchive = false) {
  if (isSAV(vehicle)) return '<span class="muted">-</span>';
  const info = deadlineInfoV115(vehicle, estimatedEnd, isArchive);
  if (!vehicle.targetDate) return '<div class="deadlineBox"><span class="muted">Aucune date</span><span class="deadlineBadge none">Non défini</span></div>';
  return '<div class="deadlineBox"><b>' + escHtml(targetDateLabelV115(vehicle.targetDate)) + '</b><span class="deadlineBadge ' + info.className + '">' + escHtml(info.label) + '</span></div>';
}

// Génère un identifiant public aléatoire difficile à deviner pour une fiche VIN.
function generatePublicVinIdV116() {
  if (window.crypto && typeof window.crypto.randomUUID === 'function') {
    return 'vin_' + window.crypto.randomUUID().replace(/-/g, '');
  }
  return 'vin_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 14) + Math.random().toString(36).slice(2, 10);
}

// Garantit qu'un camion possède un identifiant public stable ; cet identifiant ne change plus ensuite.
function ensureVehiclePublicIdV116(vehicle) {

// Formate une date/heure ISO pour l'affichage de la fiche VIN publique.
function publicDateTimeLabelV116(value) {
  if (!value) return '-';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '-';
  return date.toLocaleDateString('fr-FR') + ' ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

// Prépare uniquement les informations autorisées à apparaître sur la fiche publique du camion.
function buildPublicVinPayloadV116(vehicle, estimatedEnd) {
  const phases = {};
  ['Fabrication', 'Prémontage', 'Pose'].forEach(category => {
    const stats = phaseStatsV5(vehicle, category);
    phases[category] = {
      pct: stats.pct,
      hoursPct: stats.hoursPct,
      done: stats.done,
      total: stats.total,
      totalHours: stats.totalHours,
      doneHours: stats.doneHours,
      remainingHours: stats.remainingHours
    };
  });
  return {
    publicVersion: 1,
    publicId: vehicle.publicIdV116 || '',
    vin: String(vehicle.vin || ''),
    phases,
    inProgressCount: inProgressCountV1111(vehicle),
    remainingHours: Math.max(0, Number(remain(vehicle)) || 0),
    estimatedEnd: estimatedEnd ? estimatedEnd.toISOString() : null,
    targetDate: vehicle.targetDate || '',
    targetStatus: deadlineInfoV115(vehicle, estimatedEnd || null, !!vehicle.archived).label,
    archived: !!vehicle.archived,
    completed: remain(vehicle) <= 0,
    updatedAt: new Date().toISOString()
  };
}

// Prépare la version publique globale contenant uniquement les informations autorisées pour les camions actifs.
function buildPublicGlobalPayloadV117(estimates = {}) {

    .filter(vehicle => !isSAV(vehicle))
    .sort((a, b) => (Number(a.priority) || 1) - (Number(b.priority) || 1) || String(a.vin || '').localeCompare(String(b.vin || ''), 'fr', { numeric: true, sensitivity: 'base' }))
    .map(vehicle => {
      const payload = buildPublicVinPayloadV116(vehicle, estimates[vehicle.id] || null);
      return {
        vin: payload.vin,
        phases: payload.phases,
        inProgressCount: payload.inProgressCount,
        remainingHours: payload.remainingHours,
        estimatedEnd: payload.estimatedEnd,
        targetDate: payload.targetDate,
        targetStatus: payload.targetStatus,
        completed: payload.completed

  return {
    publicVersion: 2,
    vehicles,
    inProgressTotal: vehicles.reduce((sum, vehicle) => sum + (Number(vehicle.inProgressCount) || 0), 0),

  };
}

// Conserve la compatibilité avec les anciens QR V11.5 qui ouvraient une fiche après connexion.
function applyVehicleDeepLinkV115() {

// Estime la date de fin des véhicules actifs en répartissant le travail restant sur les personnes disponibles.
function estimateVehiclesActive() {
  normalizeAll();
  const peopleList = state.people.filter(person => personName(person));
  if (!peopleList.length) return {};
  const now = new Date();
  const slots = peopleList.map(person => ({ person, free: nextWorkStart(person, now) || now }));
  const result = {};
  const vehicles = [...activeVehicles()].sort((a, b) =>
    (Number(a.priority) || 1) - (Number(b.priority) || 1) || String(a.vin || '').localeCompare(String(b.vin || ''))
  );
  for (const vehicle of vehicles) {
    if (isSAV(vehicle)) continue;
    const ofs = (vehicle.ofs || []).filter(of => qtyRemainingV5(of) > 0).sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
    let last = null;
    for (const of of ofs) {
      slots.sort((a, b) => a.free - b.free);
      const slot = slots[0];
      const hours = (Number(of.time) || 0) * qtyRemainingV5(of);
      slot.free = addWorkHours(slot.person, slot.free, hours) || slot.free;
      last = slot.free;
    }
    result[vehicle.id] = last;
  }
  return result;
}

// Calcule l'avancement d'une phase en quantités ET en heures afin que chaque réalisation retire uniquement le temps de sa propre phase.
function phaseStatsV5(vehicle, category) {
  const list = (vehicle.ofs || []).filter(of => (of.category || '') === category);

  const total = list.reduce((sum, of) => sum + qtyTotalV5(of), 0);
  const done = list.reduce((sum, of) => sum + qtyDoneV5(of), 0);

  const totalHours = list.reduce(
    (sum, of) => sum + (Number(of.time) || 0) * qtyTotalV5(of),
    0
  );

  const doneHours = list.reduce(
    (sum, of) => sum + (Number(of.time) || 0) * qtyDoneV5(of),
    0
  );

  const remainingHours = Math.max(0, totalHours - doneHours);

  return {
    total,
    done,
    pct: total ? Math.round(done / total * 100) : 0,
    totalHours,
    doneHours,
    remainingHours,
    hoursPct: totalHours ? Math.round(doneHours / totalHours * 100) : 0
  };
}

// Génère les trois barres du tableau de bord en heures faites / heures totales, séparées strictement par phase.
function phaseProgressHtmlV5(vehicle) {
  if (isSAV(vehicle)) {
    const actual = savActualHoursNowV1114(vehicle);
    const planned = Math.max(0, Number(vehicle.savEstimated) || 0);
    return '<div style="min-width:220px">' +
      '<div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:5px">' +
        '<b>SAV ' + pct(vehicle) + '%</b>' +
        '<b>' + fmtHoursMinutesV11122(actual) + ' / ' + fmtHoursMinutesV11122(planned) + '</b>' +
      '</div>' +
      '<div class="progress"><div class="bar" style="width:' + pct(vehicle) + '%"></div></div>' +
      '<div style="margin-top:7px">' + savWorkStatusHtmlV1114(vehicle) + '</div>' +
    '</div>';
  }

  let html = '';

  ['Fabrication', 'Prémontage', 'Pose'].forEach(category => {
    const stats = phaseStatsV5(vehicle, category);

    html += '<div style="margin-bottom:8px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:3px;flex-wrap:wrap">' +
        '<span><b>' + escHtml(category) + '</b> ' + stats.hoursPct + '%</span>' +
        '<span style="font-weight:850">' +
          fmtHoursMinutesV11122(stats.doneHours) + ' / ' + fmtHoursMinutesV11122(stats.totalHours) +
        '</span>' +
      '</div>' +
      '<div class="progress" style="height:7px;min-width:190px">' +
        '<div class="bar" style="width:' + stats.hoursPct + '%"></div>' +
      '</div>' +
      '<div class="muted" style="margin-top:3px">' +
        stats.done + '/' + stats.total + ' réalisations • reste ' + fmtHoursMinutesV11122(stats.remainingHours) +
      '</div>' +
    '</div>';
  });

  const running = runningOFCountV11143(vehicle);
  const paused = pausedOFCountV11143(vehicle);

  if (running > 0 || paused > 0) {
    html += '<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:2px">';

    if (running > 0) {
      html += '<div class="inProgressBadgeV1111">▶ ' + running + ' OF en cours</div>';
    }

    if (paused > 0) {
      html += '<div class="pausedBadgeV1113">⏸ ' + paused + ' OF en pause</div>';
    }

    html += '</div>';
  }

  return '<div style="min-width:220px">' + html + '</div>';
}

// -----------------------------------------------------------------------------
// V11.24 - PLANIFICATION DES OF
// L'admin attribue un OF à une seule personne et définit son ordre de travail.
// Le planning ne verrouille pas la Réalisation : il sert d'organisation.
// Le statut affiché est toujours dérivé de l'OF réel.
// -----------------------------------------------------------------------------

function normalizePlanningV1124() {
  state.planningV1124 = Array.isArray(state.planningV1124) ? state.planningV1124 : [];

  const seen = new Set();
  state.planningV1124 = state.planningV1124
    .filter(item => item && item.id && item.vehicleId && item.ofId && item.person)
    .sort((a, b) => new Date(b.updatedAt || b.assignedAt || 0) - new Date(a.updatedAt || a.assignedAt || 0))
    .filter(item => {
      const key = `${item.vehicleId}||${item.ofId}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

  const people = [...new Set(state.planningV1124.map(item => item.person))];
  people.forEach(person => renumberPlanningForPersonV1124(person, false));
}

function touchPlanningV1124(at = new Date().toISOString()) {
  state.planningSyncUpdatedAtV1124 = at;
  return at;
}

function planningAssignmentsV1124() {
  normalizePlanningV1124();
  return state.planningV1124;
}

function planningTargetV1124(item) {
  const vehicle = state.vehicles.find(vehicle => vehicle.id === item?.vehicleId);
  const of = vehicle?.ofs?.find(of => of.id === item?.ofId);
  return { vehicle, of };
}

function planningStatusV1124(item) {
  const { vehicle, of } = planningTargetV1124(item);

  if (!vehicle || !of) {
    return { key: 'missing', label: 'Indisponible' };
  }

  if (qtyRemainingV5(of) <= 0) {
    return { key: 'done', label: '✓ Fait' };
  }

  if (of.status === 'Bloqué') {
    return { key: 'blocked', label: '⚠ Bloqué' };
  }

  const session = activeWorkSessionV1111(of);
  if (session?.pausedAt) {
    return { key: 'paused', label: `⏸ Pause • ${session.person}` };
  }
  if (session) {
    return { key: 'running', label: `▶ En cours • ${session.person}` };
  }

  return { key: 'todo', label: 'À faire' };
}

function planningRemainingHoursV1124(item) {
  const { of } = planningTargetV1124(item);
  if (!of) return 0;
  return Math.max(0, Number(of.time) || 0) * qtyRemainingV5(of);
}

function planningPersonNamesV1124() {
  return (state.people || [])
    .map(personName)
    .filter(Boolean)
    .sort((a, b) => a.localeCompare(b, 'fr'));
}

function nextPlanningOrderV1124(person) {
  const items = planningAssignmentsV1124().filter(item => item.person === person);
  return items.reduce((max, item) => Math.max(max, Number(item.order) || 0), 0) + 1;
}

function renumberPlanningForPersonV1124(person, touch = true) {
  const list = (state.planningV1124 || [])
    .filter(item => item.person === person)
    .sort((a, b) => (Number(a.order) || 999999) - (Number(b.order) || 999999)
      || new Date(a.assignedAt || 0) - new Date(b.assignedAt || 0));

  list.forEach((item, index) => item.order = index + 1);
  if (touch && list.length) touchPlanningV1124();
}

function planningSelectedVinsV1124() {
  if (!(window._planningSelectedVinsV1124 instanceof Set)) {
    window._planningSelectedVinsV1124 = new Set();
  }
  return window._planningSelectedVinsV1124;
}

function togglePlanningVinV1124(vehicleId, checked) {
  const selected = planningSelectedVinsV1124();
  if (checked) selected.add(vehicleId);
  else selected.delete(vehicleId);
  renderPlanningOFPickerV1124();
}

function selectAllPlanningVinsV1124(checked) {
  const selected = planningSelectedVinsV1124();
  selected.clear();
  if (checked) {
    activeNormalVehicles().forEach(vehicle => selected.add(vehicle.id));
  }
  document.querySelectorAll('.planningVinCheckV1124').forEach(input => {

  renderPlanningOFPickerV1124();

// V11.27 - Recherche instantanée dans la sélection des OF de la planification.
// La recherche porte sur le nom/numéro de l'OF et son descriptif.
// Les cases déjà cochées ne sont jamais modifiées par le filtre.
function normalizePlanningSearchV1127(value) {
  return String(value || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim();
}

function filterPlanningOFsV1127(value) {
  window._planningOfSearchV1127 = String(value || '');

  const query = normalizePlanningSearchV1127(value);
  const rows = Array.from(document.querySelectorAll('.planningOfRowV1124[data-search-v1127]'));
  let visible = 0;

  rows.forEach(row => {
    const haystack = normalizePlanningSearchV1127(row.getAttribute('data-search-v1127') || '');
    const match = !query || haystack.includes(query);
    row.style.display = match ? '' : 'none';
    if (match) visible += 1;
  });

  const count = document.getElementById('planningSearchCountV1127');
  if (count) {
    count.textContent = query
      ? `${visible} OF affiché${visible > 1 ? 's' : ''}`
      : `${rows.length} OF`;
  }
}

function planningOFPickerHtmlV1124() {
  const selected = planningSelectedVinsV1124();
  const vehicles = activeNormalVehicles().filter(vehicle => selected.has(vehicle.id));

  if (!vehicles.length) {
    return `<div class="planningEmptyV1124">Sélectionne un ou plusieurs VIN pour afficher leurs OF.</div>`;
  }

  const currentAssignments = new Map(
    planningAssignmentsV1124().map(item => [`${item.vehicleId}||${item.ofId}`, item])
  );

  const rows = [];
  vehicles
    .slice()
    .sort((a, b) => (Number(a.priority) || 1) - (Number(b.priority) || 1)
      || String(a.vin || '').localeCompare(String(b.vin || '')))
    .forEach(vehicle => {
      (vehicle.ofs || [])
        .slice()
        .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0))
        .forEach(of => {
          const key = `${vehicle.id}||${of.id}`;
          const assignment = currentAssignments.get(key);
          const done = qtyRemainingV5(of) <= 0;
          const disabled = done ? 'disabled' : '';
          const assignedHtml = assignment
            ? `<span class="planningAssignedV1124">👤 ${escHtml(assignment.person)} • #${Number(assignment.order) || '-'}</span>`
            : '<span class="muted">Non attribué</span>';

          const searchTextV1127 = `${of.name || ''} ${of.desc || ''}`;

          rows.push(`<div class="planningOfRowV1124" data-search-v1127="${escHtml(searchTextV1127)}">
            <div><input class="planningOfCheckV1124" type="checkbox" value="${escHtml(key)}" ${disabled}></div>

function assignSelectedPlanningV1124() {
  if (!requireAdminV1117('la planification des OF')) return;

  const person = String(document.getElementById('planningPersonV1124')?.value || '').trim();
  if (!person) {
    alert('Sélectionne une personne.');
    return;
  }

  const selectedKeys = Array.from(document.querySelectorAll('.planningOfCheckV1124:checked'))
    .map(input => input.value)
    .filter(Boolean);

  if (!selectedKeys.length) {
    alert('Sélectionne au moins un OF.');
    return;
  }

  const now = new Date().toISOString();
  const admin = operationalPersonV1116() || 'Administrateur';
  let nextOrder = nextPlanningOrderV1124(person);
  let added = 0;
  let reassigned = 0;

  selectedKeys.forEach(key => {
    const [vehicleId, ofId] = key.split('||');
    const vehicle = state.vehicles.find(item => item.id === vehicleId);
    const of = vehicle?.ofs?.find(item => item.id === ofId);
    if (!vehicle || !of || qtyRemainingV5(of) <= 0) return;

    let item = state.planningV1124.find(row => row.vehicleId === vehicleId && row.ofId === ofId);

    if (item) {
      if (item.person !== person) {
        const oldPerson = item.person;
        item.person = person;
        item.order = nextOrder++;
        item.updatedAt = now;
        item.assignedBy = admin;
        renumberPlanningForPersonV1124(oldPerson, false);
        reassigned++;
      }
    } else {
      state.planningV1124.push({
        id: uid(),
        vehicleId,
        ofId,
        person,
        order: nextOrder++,
        assignedAt: now,
        updatedAt: now,
        assignedBy: admin
      });
      added++;
    }
  });

  renumberPlanningForPersonV1124(person, false);
  touchPlanningV1124(now);

  logAction(
    'Planification OF',
    null,
    null,
    `${person} • ${added} ajouté${added > 1 ? 's' : ''}${reassigned ? ` • ${reassigned} réattribué${reassigned > 1 ? 's' : ''}` : ''}`
  );

  saveSharedDataV1120();
}

function movePlanningAssignmentV1124(id, delta) {
  if (!requireAdminV1117('la modification de l’ordre du planning')) return;

  const item = state.planningV1124.find(row => row.id === id);
  if (!item) return;

  const list = state.planningV1124
    .filter(row => row.person === item.person)
    .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));

  const index = list.findIndex(row => row.id === id);
  const targetIndex = index + delta;
  if (index < 0 || targetIndex < 0 || targetIndex >= list.length) return;

  const target = list[targetIndex];
  const currentOrder = item.order;
  item.order = target.order;
  target.order = currentOrder;

  const now = new Date().toISOString();
  item.updatedAt = now;
  target.updatedAt = now;
  touchPlanningV1124(now);
  saveSharedDataV1120();
}

function removePlanningAssignmentV1124(id) {
  if (!requireAdminV1117('la suppression d’une tâche du planning')) return;
  const item = state.planningV1124.find(row => row.id === id);
  if (!item) return;

  const person = item.person;
  state.planningV1124 = state.planningV1124.filter(row => row.id !== id);
  renumberPlanningForPersonV1124(person, false);
  touchPlanningV1124();
  saveSharedDataV1120();
}

function reassignPlanningV1124(id, newPerson) {
  if (!requireAdminV1117('la réattribution du planning')) return;

  const item = state.planningV1124.find(row => row.id === id);
  newPerson = String(newPerson || '').trim();
  if (!item || !newPerson || item.person === newPerson) return;

  const oldPerson = item.person;
  item.person = newPerson;
  item.order = nextPlanningOrderV1124(newPerson);
  item.updatedAt = new Date().toISOString();
  item.assignedBy = operationalPersonV1116() || item.assignedBy || 'Administrateur';

  renumberPlanningForPersonV1124(oldPerson, false);
  renumberPlanningForPersonV1124(newPerson, false);
  touchPlanningV1124(item.updatedAt);
  saveSharedDataV1120();
}

function cleanupCompletedPlanningV1124() {
  if (!requireAdminV1117('le nettoyage du planning')) return;

  const completedIds = new Set(
    state.planningV1124
      .filter(item => planningStatusV1124(item).key === 'done' || planningStatusV1124(item).key === 'missing')
      .map(item => item.id)
  );

  if (!completedIds.size) {
    alert('Aucune tâche terminée ou indisponible à retirer.');
    return;
  }

  if (!confirm(`Retirer ${completedIds.size} tâche${completedIds.size > 1 ? 's' : ''} terminée${completedIds.size > 1 ? 's' : ''} / indisponible${completedIds.size > 1 ? 's' : ''} du planning ?`)) return;

  state.planningV1124 = state.planningV1124.filter(item => !completedIds.has(item.id));
  planningPersonNamesV1124().forEach(person => renumberPlanningForPersonV1124(person, false));
  touchPlanningV1124();
  saveSharedDataV1120();
}

async function toggleWorkshopFullscreenV1123() {
  const entering = !document.body.classList.contains('workshopFullscreenV1123');

  if (entering) {
    document.body.classList.add('workshopFullscreenV1123');
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen();
      }
    } catch (error) {
      console.warn('Plein écran navigateur indisponible.', error);
    }
  } else {
    document.body.classList.remove('workshopFullscreenV1123');
    try {
      if (document.fullscreenElement && document.exitFullscreen) {
        await document.exitFullscreen();
      }
    } catch (error) {
      console.warn('Sortie plein écran impossible.', error);
    }
  }

  render();
}

function leaveWorkshopV1123() {
  document.body.classList.remove('workshopFullscreenV1123');

  if (document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});

  page = 'dash';
  render();
}

// Retourne une clé stable d'un OF automatique sans utiliser son numéro d'ordre, afin qu'un OF manuel inséré avant lui ne fasse jamais perdre son avancement.
function automaticOFKey(of) {
  return [
    String(of?.name || '').trim().toUpperCase(),
    String(of?.category || '').trim().toUpperCase(),
    String(of?.desc || '').trim().toUpperCase(),
    String(of?.option || '').trim().toUpperCase(),
    String(of?.removeIfOption || '').trim().toUpperCase()
  ].join('||');
}

// Retrouve l'ancien OF automatique correspondant à un nouvel OF de base, avec un secours contrôlé pour les anciennes données.
function findPreviousAutomaticOF(oldAutomaticOFs, newOF, alreadyUsedIds) {
  const exactKey = automaticOFKey(newOF);
  let candidate = oldAutomaticOFs.find(oldOF =>
    !alreadyUsedIds.has(oldOF.id) &&
    automaticOFKey(oldOF) === exactKey
  );
  if (candidate) return candidate;

  const fallback = oldAutomaticOFs.filter(oldOF =>
    !alreadyUsedIds.has(oldOF.id) &&
    String(oldOF.name || '').trim().toUpperCase() === String(newOF.name || '').trim().toUpperCase() &&
    String(oldOF.category || '').trim().toUpperCase() === String(newOF.category || '').trim().toUpperCase() &&
    String(oldOF.option || '').trim().toUpperCase() === String(newOF.option || '').trim().toUpperCase()
  );

  return fallback.length === 1 ? fallback[0] : null;
}

// Compare deux listes d'options sans tenir compte de leur ordre.
function sameOptions(a, b) {
  const first = [...(a || [])].sort();
  const second = [...(b || [])].sort();
  return JSON.stringify(first) === JSON.stringify(second);
}

// Reconstruit les OF automatiques après changement de base ou d'option sans perdre leur avancement, même si des OF manuels ont modifié les numéros d'ordre.
function syncVehicleOFs(vehicle, includeBase, options) {
  const desired = buildOFsForVehicle(vehicle.brand, includeBase, options);
  const old = Array.isArray(vehicle.ofs) ? vehicle.ofs : [];
  const oldAutomaticOFs = old.filter(of => of.manual !== true);
  const manualOFs = old
    .filter(of => of.manual === true)
    .map(of => ({ ...of, __savedOrder: Math.max(1, Number(of.order) || 1) }))
    .sort((a, b) => a.__savedOrder - b.__savedOrder);

  const usedOldIds = new Set();

  const rebuiltAutomaticOFs = desired.map(newOF => {
    const previous = findPreviousAutomaticOF(oldAutomaticOFs, newOF, usedOldIds);
    if (!previous) {
      normalizeQtyOFV5(newOF);
      return { ...newOF, manual: false };
    }

    usedOldIds.add(previous.id);

    const rebuilt = {
      ...newOF,
      id: previous.id || newOF.id,
      completedQty: Math.min(qtyDoneV5(previous), qtyTotalV5(newOF)),
      status: previous.status || 'À faire',
      doneBy: previous.doneBy || '',
      doneAt: previous.doneAt || '',
      blockReason: previous.blockReason || '',
      blockDetailsV8: previous.blockDetailsV8 || undefined,
      workSessionV1111: previous.workSessionV1111 || undefined,
      manual: false
    };

    normalizeQtyOFV5(rebuilt);
    if (rebuilt.completedQty >= qtyTotalV5(rebuilt)) rebuilt.status = 'Fait';
    else if (rebuilt.status !== 'Bloqué') rebuilt.status = 'À faire';

    return rebuilt;
  });

  const merged = rebuiltAutomaticOFs.slice();

  manualOFs.forEach(manualOF => {
    const targetIndex = Math.min(
      Math.max(0, manualOF.__savedOrder - 1),
      merged.length
    );
    delete manualOF.__savedOrder;
    merged.splice(targetIndex, 0, manualOF);
  });

  vehicle.ofs = merged;
  vehicle.ofs.forEach((of, index) => {
    of.order = index + 1;
    normalizeQtyOFV5(of);
  });
}

// Enregistre un véhicule et génère ou synchronise ses OF automatiques si nécessaire.
function saveVehicle(id) {
  if (!requireAdminV1117('la création ou modification des véhicules')) return;
  const isNew = !id;
  let vehicle = id ? state.vehicles.find(item => item.id === id) : null;
  if (!vehicle) {
    vehicle = { id: uid(), ofs: [] };
    state.vehicles.push(vehicle);
  }
  const oldBrand = vehicle.brand;
  const oldBase = vehicle.selectedBase !== false;
  const oldOptions = Array.isArray(vehicle.selectedOptions) ? vehicle.selectedOptions.slice() : [];
  Object.assign(vehicle, {
    vin: document.getElementById('vin').value.trim(),
    brand: document.getElementById('brand').value,
    client: document.getElementById('client').value,
    type: document.getElementById('type').value,
    priority: Number(document.getElementById('prio').value) || 1,
    color: document.getElementById('color').value,
    targetDate: document.getElementById('targetDate')?.value || ''
  });
  const hasTemplate = templateForBrand(vehicle.brand).length > 0;
  if (hasTemplate) {
    const includeBase = !!document.getElementById('createBase')?.checked;
    const options = selectedOptionValues();
    const changed = isNew || oldBrand !== vehicle.brand || oldBase !== includeBase || !sameOptions(oldOptions, options);
    vehicle.selectedBase = includeBase;
    vehicle.selectedOptions = options;
    if (isNew) {
      vehicle.ofs = buildOFsForVehicle(vehicle.brand, includeBase, options);
    } else if (changed) {
      const update = confirm('Tu as modifié la marque / base / options.\n\nMettre à jour automatiquement la liste des OF du camion ?\n\nOK = ajoute/supprime les OF automatiques selon les options, en gardant les statuts des OF identiques et les OF manuels.\nAnnuler = garde la liste OF actuelle.');
      if (update) syncVehicleOFs(vehicle, includeBase, options);
    }
  } else {
    vehicle.selectedBase = false;
    vehicle.selectedOptions = [];
  }
  logAction(isNew ? 'Véhicule créé' : 'Véhicule modifié', vehicle, null, '');
  state.realVin = vehicle.id;
  closeModal();
  saveSharedDataV1120();
}

      .filter(vehicle => isSAV(vehicle) && vehicle.id !== excludeVehicleId)
      .map(vehicle => String(vehicle.vin || '').trim().toUpperCase())

  );

// Réordonne proprement les OF d'un véhicule de 1 à N.
function normalizeOrders(vehicle) {
  vehicle.ofs.sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
  vehicle.ofs.forEach((of, index) => { of.order = index + 1; });
}

// Insère ou déplace un OF à un numéro d'ordre précis en décalant les suivants.
function insertOrMoveOF(vehicle, of, targetOrder, isNew) {
  let order = Math.max(1, Number(targetOrder) || 1);
  if (!isNew) vehicle.ofs = vehicle.ofs.filter(item => item.id !== of.id);
  if (order > vehicle.ofs.length + 1) order = vehicle.ofs.length + 1;
  vehicle.ofs.forEach(item => {
    if ((Number(item.order) || 0) >= order) item.order = (Number(item.order) || 0) + 1;
  });
  of.order = order;
  vehicle.ofs.push(of);
  normalizeOrders(vehicle);
}

// Enregistre un OF et marque automatiquement les nouveaux OF créés à la main comme manuels.
function saveOF(ofId) {
  if (!requireAdminV1117('la création ou modification des OF')) return;
  const destination = state.vehicles.find(item => item.id === document.getElementById('ov').value);
  if (!destination) return;
  const oldVehicle = state.vehicles.find(vehicle => (vehicle.ofs || []).some(of => of.id === ofId));
  let of = ofId ? oldVehicle?.ofs.find(item => item.id === ofId) : null;
  const isNew = !of;
  if (!of) {
    of = { id: uid(), status: 'À faire', doneBy: '', doneAt: '', blockReason: '', completedQty: 0, manual: true };
  }
  Object.assign(of, {
    name: document.getElementById('on').value.trim(),
    desc: document.getElementById('od').value.trim(),
    time: Number(document.getElementById('ot').value) || 0,
    quantity: Math.max(1, Math.floor(Number(document.getElementById('oqty').value) || 1)),
    category: document.getElementById('oc').value,
    priority: Number(document.getElementById('op').value) || 1
  });
  of.completedQty = Math.min(qtyDoneV5(of), qtyTotalV5(of));
  of.status = of.completedQty >= qtyTotalV5(of) ? 'Fait' : (of.status === 'Bloqué' ? 'Bloqué' : 'À faire');
  if (isNew) of.manual = true;
  const movedVehicle = !isNew && oldVehicle && oldVehicle.id !== destination.id;
  if (movedVehicle) {
    oldVehicle.ofs = oldVehicle.ofs.filter(item => item.id !== ofId);
    normalizeOrders(oldVehicle);
  }
  insertOrMoveOF(destination, of, Number(document.getElementById('oo').value) || 1, isNew || movedVehicle);
  logAction(isNew ? 'OF ajouté' : 'OF modifié', destination, of, `Quantité ${qtyTotalV5(of)} • ordre ${of.order}`);
  closeModal();
  saveSharedDataV1120();
}

// Retourne la liste globale des événements d'avancement et l'initialise si nécessaire.
function progressEvents() {
  state.progressEventsV6 = Array.isArray(state.progressEventsV6) ? state.progressEventsV6 : [];
  return state.progressEventsV6;
}

// Retourne les événements d'avancement d'un véhicule triés du plus ancien au plus récent.
function vehicleProgressEvents(vehicleId) {
  return progressEvents().filter(event => event.vehicleId === vehicleId).sort((a, b) => new Date(a.at) - new Date(b.at));
}

// Ajoute un point de départ à la courbe lorsqu'un véhicule reçoit son premier événement suivi.
function ensureProgressStart(vehicle, beforeSnapshot, at) {
  if (vehicleProgressEvents(vehicle.id).length) return;
  const date = new Date(at || Date.now());
  date.setMilliseconds(Math.max(0, date.getMilliseconds() - 1));
  progressEvents().push({
    id: uid(), vehicleId: vehicle.id, vin: vehicle.vin || '', ofId: '', ofName: 'Début du suivi',
    description: '', category: 'Global', person: '', qtyDelta: 0, qtyAfter: 0, qtyTotal: 0,
    kind: 'start', note: 'Point de départ du suivi graphique', at: date.toISOString(),
    progress: beforeSnapshot || progressSnapshot(vehicle)
  });
}

// Enregistre une réalisation, une correction, un blocage ou un déblocage dans la courbe d'avancement.
function recordProgressEvent(vehicle, of, delta, person, kind = 'realisation', note = '', beforeSnapshot = null, at = null) {
  if (!vehicle || isSAV(vehicle)) return;
  const when = at || new Date().toISOString();
  ensureProgressStart(vehicle, beforeSnapshot || progressSnapshot(vehicle), when);
  progressEvents().push({
    id: uid(), vehicleId: vehicle.id, vin: vehicle.vin || '', ofId: of?.id || '', ofName: of?.name || '',
    description: of?.desc || '', category: of?.category || 'Global', person: person || '',
    qtyDelta: Number(delta) || 0, qtyAfter: of ? qtyDoneV5(of) : 0, qtyTotal: of ? qtyTotalV5(of) : 0,
    kind, note, at: when, progress: progressSnapshot(vehicle)
  });
  // Évite que l'historique graphique grossisse indéfiniment : on garde jusqu'à 10 000 événements globaux.
  if (state.progressEventsV6.length > 10000) state.progressEventsV6 = state.progressEventsV6.slice(-10000);
}

// Expose l'enregistrement d'événement pour les fonctions de blocage et les éventuelles évolutions futures.
window.recordProgressEventV6 = recordProgressEvent;

// Crée un point de reprise pour les véhicules anciens qui avaient déjà de l'avancement avant le suivi graphique.
function ensureProgressBaselines() {
  (state.vehicles || []).filter(vehicle => !isSAV(vehicle)).forEach(vehicle => {
    if (vehicleProgressEvents(vehicle.id).length) return;
    const hasProgress = (vehicle.ofs || []).some(of => qtyDoneV5(of) > 0);
    if (!hasProgress) return;
    progressEvents().push({
      id: uid(), vehicleId: vehicle.id, vin: vehicle.vin || '', ofId: '', ofName: 'État repris à la migration',
      description: '', category: 'Global', person: '', qtyDelta: 0, qtyAfter: 0, qtyTotal: 0,
      kind: 'baseline', note: 'Le détail antérieur n’était pas enregistré. Ce point reprend l’avancement existant.',
      at: new Date().toISOString(), progress: progressSnapshot(vehicle)
    });
  });
}

// Ajoute une quantité réalisée à un OF, met son statut à jour et enregistre l'événement dans la courbe.
function addQtyDoneV5(vehicleId, ofId, amount = 1, personOverride = '') {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  const of = vehicle?.ofs.find(item => item.id === ofId);
  if (!vehicle || !of) return 0;
  normalizeQtyOFV5(of);

  const workSession = activeWorkSessionV1111(of);
  const person = personOverride || operationalPersonV1116() || workSession?.person || of.doneBy || '';
  if (!person) { alert("Utilisateur connecté non reconnu."); return qtyDoneV5(of); }

  const beforeSnapshot = progressSnapshot(vehicle);
  const before = qtyDoneV5(of);
  const after = Math.min(qtyTotalV5(of), before + Math.max(1, Math.floor(Number(amount) || 1)));
  const added = after - before;
  if (!added) return after;

  const now = new Date().toISOString();
  const duration = workSession ? workSessionDurationLabelV1113(workSession, now) : '';

  of.completedQty = after;
  of.status = after >= qtyTotalV5(of) ? 'Fait' : 'À faire';
  of.doneBy = person;
  of.doneAt = now;
  of.blockReason = '';
  delete of.blockDetailsV8;
  if (workSession) delete of.workSessionV1111;
  touchOFV1118(of, now);

  state.realPerson = person;

  if (workSession) {
    addWorkTimeRecordV1112(vehicle, of, workSession, now, after);
    logAction('OF terminé', vehicle, of, `+${added} • ${after}/${qtyTotalV5(of)} • ${person} • durée ${duration}`);
    recordProgressEvent(vehicle, of, added, person, 'finish', `OF terminé • ${duration}`, beforeSnapshot, now);
  } else {
    logAction('Quantité OF réalisée', vehicle, of, `+${added} • ${after}/${qtyTotalV5(of)} • ${person}`);
    recordProgressEvent(vehicle, of, added, person, 'realisation', `+${added} réalisation${added > 1 ? 's' : ''}`, beforeSnapshot, now);
  }

  saveCriticalV1118();
  return after;
}

// Termine d'un coup toute la quantité restante d'un OF après confirmation.
function finishQtyV5(vehicleId, ofId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  const of = vehicle?.ofs.find(item => item.id === ofId);
  if (!vehicle || !of) return;
  const remaining = qtyRemainingV5(of);
  if (remaining <= 0) return;
  if (activeWorkSessionV1111(of)) {
    alert("Cet OF est actuellement en cours. Termine d'abord la réalisation démarrée.");
    return;
  }
  if (!confirm(`Marquer les ${remaining} réalisation${remaining > 1 ? 's' : ''} restante${remaining > 1 ? 's' : ''} comme faites ?`)) return;
  addQtyDoneV5(vehicleId, ofId, remaining);
}

// Retire une réalisation d'un OF pour corriger une validation faite en trop.
function removeQtyDoneV5(vehicleId, ofId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  const of = vehicle?.ofs.find(item => item.id === ofId);
  if (!vehicle || !of) return;
  normalizeQtyOFV5(of);
  const before = qtyDoneV5(of);
  if (before <= 0) return;
  const beforeSnapshot = progressSnapshot(vehicle);
  const person = operationalPersonV1116() || of.doneBy || '';
  of.completedQty = Math.max(0, before - 1);
  of.status = of.completedQty >= qtyTotalV5(of) ? 'Fait' : 'À faire';
  of.blockReason = '';
  delete of.blockDetailsV8;
  if (of.completedQty === 0) {
    of.doneBy = '';
    of.doneAt = '';
  }
  touchOFV1118(of);
  logAction('Quantité OF corrigée', vehicle, of, `-1 • ${of.completedQty}/${qtyTotalV5(of)}`);
  recordProgressEvent(vehicle, of, -1, person, 'correction', 'Correction de quantité', beforeSnapshot);
  saveCriticalV1118();
}

// Retourne l'attribution de planning active d'un OF.
// L'OF conserve son vrai statut métier ; la planification ne modifie que l'affichage
// tant que l'OF n'est ni démarré, ni en pause, ni bloqué, ni terminé.
function planningAssignmentForOFV11241(of) {
  if (!of || !of.id || !Array.isArray(state.planningV1124)) return null;
  return state.planningV1124.find(item => item && item.ofId === of.id) || null;
}

// Génère la pastille de statut d'un OF avec son éventuelle raison de blocage.
function statusHtmlV5(of) {
  const total = qtyTotalV5(of), done = qtyDoneV5(of);
  const session = activeWorkSessionV1111(of);

  if (of.status === 'Bloqué') {
    return `<span class="pill blocked">Bloqué</span>${of.blockReason ? `<div class="blockedtxt">${escHtml(of.blockReason)}</div>` : ''}`;
  }

  if (done >= total) {
    return `<span class="pill" style="background:#064e3b;color:#bbf7d0">✓ Fait ${done}/${total}</span>`;
  }

  if (session) {
    if (session.pausedAt) {
      return `<div class="workStatusV1111">
        <span class="pausedBadgeV1113">⏸ En pause ${done}/${total}</span>
        <span class="startedBy">${escHtml(session.person)} • début ${escHtml(workStartTimeLabelV1111(session.startedAt))} • pause depuis ${escHtml(workStartTimeLabelV1111(session.pausedAt))}</span>
      </div>`;
    }

    return `<div class="workStatusV1111">
      <span class="inProgressBadgeV1111">▶ En cours ${done}/${total}</span>
      <span class="startedBy">${escHtml(session.person)} • depuis ${escHtml(workStartTimeLabelV1111(session.startedAt))}</span>
    </div>`;
  }

  const planning = planningAssignmentForOFV11241(of);

  if (planning) {
    const partial = done > 0
      ? `<div class="muted" style="margin-top:4px">${done}/${total} déjà réalisé${done > 1 ? 's' : ''}</div>`
      : '';

    return `<div>
      <span class="plannedBadgeV11241">📋 Planifié</span>
      <div class="plannedByV11241">👤 ${escHtml(planning.person || 'Personne non définie')} • ordre #${Number(planning.order) || '-'}</div>
      ${partial}
    </div>`;
  }

  if (done > 0) {
    return `<span class="pill">À faire</span><div class="muted" style="margin-top:4px">${done}/${total} déjà réalisé${done > 1 ? 's' : ''}</div>`;
  }

  return '<span class="pill">À faire</span>';
}

// Génère la petite barre d'avancement quantité utilisée dans les tableaux OF.
function qtyVisualV5(of) {
  const total = qtyTotalV5(of), done = qtyDoneV5(of);
  const percent = total ? Math.round(done / total * 100) : 0;
  return `<div class="progress"><div class="bar" style="width:${percent}%"></div></div><div class="muted"><strong>${done}/${total}</strong> réalisé${total > 1 ? 's' : ''} • ${total - done} restant${total - done > 1 ? 's' : ''}</div>`;
}

  return `<div class="tablewrap"><table><thead><tr><th>Ordre</th><th>OF</th><th>Description</th><th>Temps X1</th><th>Quantité</th><th>Réalisé</th><th>Statut</th><th>Actions</th></tr></thead><tbody>${list.map(of => {

          : `<button class="small warn" onclick="pauseOFWorkV1113('${vehicle.id}','${of.id}')">⏸ Pause</button><button class="small good" onclick="finishOFWorkV1111('${vehicle.id}','${of.id}')">✓ Terminer</button><button class="small alt" onclick="cancelOFWorkV1111('${vehicle.id}','${of.id}')">Annuler démarrage</button>`

// Construit la clé commune permettant de regrouper un même OF présent sur plusieurs VIN.
function ofKeyV5(of) {
  return [String(of.name || '').trim(), String(of.category || '').trim(), String(of.desc || '').trim()].join('|||');
}

// Retrouve sur un véhicule l'OF correspondant à une clé de regroupement Par OF.
function ofForVehicleV5(vehicle, key) {
  return (vehicle.ofs || []).find(of => ofKeyV5(of) === key);
}

// Regroupe les mêmes OF de tous les véhicules actifs afin de construire le mode Réalisation > Par OF.
function groupedOFsV5() {
  const phaseOrder = { Fabrication: 1, Prémontage: 2, Pose: 3, Essais: 4, Autre: 5 };
  const map = new Map();
  activeNormalVehicles().forEach(vehicle => {
    const seen = new Set();
    (vehicle.ofs || []).forEach(of => {
      const key = ofKeyV5(of);
      if (!of.name || seen.has(key)) return;
      seen.add(key);
      if (!map.has(key)) {
        map.set(key, {
          key, name: of.name, desc: of.desc || '', category: of.category || 'Autre', time: Number(of.time) || 0,
          order: Number(of.order) || 99999, vehicles: 0, totalUnits: 0, doneUnits: 0, finishedVehicles: 0, blockedVehicles: 0, inProgressVehicles: 0
        });
      }
      const group = map.get(key);
      const total = qtyTotalV5(of), done = qtyDoneV5(of);
      group.vehicles++;
      group.totalUnits += total;
      group.doneUnits += done;
      if (done >= total) group.finishedVehicles++;
      if (of.status === 'Bloqué') group.blockedVehicles++;
      if (activeWorkSessionV1111(of)) group.inProgressVehicles++;
      group.order = Math.min(group.order, Number(of.order) || 99999);
    });
  });
  return Array.from(map.values()).sort((a, b) =>
    (phaseOrder[a.category] || 99) - (phaseOrder[b.category] || 99) || a.order - b.order || String(a.name).localeCompare(String(b.name), 'fr', { numeric: true, sensitivity: 'base' })
  );
}

// Applique la recherche, le filtre de phase et le filtre de statut au mode Par OF.
function filteredGroupsV5() {
  let groups = groupedOFsV5();
  const query = (document.getElementById('ofSearchV5')?.value || state.ofSearchV5 || '').trim().toLowerCase();
  const category = document.getElementById('ofPhaseV5')?.value || state.ofPhaseV5 || 'Tous';
  const status = document.getElementById('ofStatusV5')?.value || state.ofStatusV5 || 'À valider';
  if (category !== 'Tous') groups = groups.filter(group => group.category === category);
  if (status === 'À valider') groups = groups.filter(group => group.doneUnits < group.totalUnits);
  if (status === 'En cours') groups = groups.filter(group => group.inProgressVehicles > 0);
  if (status === 'Terminés') groups = groups.filter(group => group.doneUnits >= group.totalUnits && group.totalUnits > 0);
  if (query) groups = groups.filter(group => [group.name, group.desc, group.category].join(' ').toLowerCase().includes(query));
  return groups;
}

      <td><div class="progress"><div class="bar" style="width:${percent}%"></div></div><div class="muted"><b>${group.doneUnits}/${group.totalUnits}</b> réalisés • ${group.totalUnits - group.doneUnits} restants</div></td>
      <td><b>${group.finishedVehicles}/${group.vehicles}</b></td>

      <td class="actions"><button class="small ${complete ? 'alt' : 'good'}" ${complete ? 'disabled' : ''} onclick="openBulkOFV5('${encoded}')">${complete ? '✓ Terminé' : 'Valider plusieurs VIN'}</button><button class="small bad" ${complete ? 'disabled' : ''} onclick="openBulkBlockV7('${encoded}')">⛔ Bloquer plusieurs VIN</button></td>
    </tr>`;
  }).join('')}</tbody></table></div>`;
}

// Affiche la page Réalisation dans le mode sélectionné par l'utilisateur.

  normalizeAll();
  setHead('Réalisation');

  const active = activeNormalVehicles();

  if (!active.length && !activeSAV.length) {

  }

  state.realModeV3 = state.realModeV3 || (active.length ? 'of' : 'sav');

    <button class="${state.realModeV3 === 'of' ? 'active' : ''}" onclick="setRealModeV5('of')" ${!active.length ? 'disabled' : ''}>Par OF</button>

// Génère un bouton VIN dans la fenêtre de validation multiple avec son avancement quantité.
function vinButtonV5(vehicle, of) {
  normalizeQtyOFV5(of);
  const total = qtyTotalV5(of), done = qtyDoneV5(of), remaining = total - done;
  const session = activeWorkSessionV1111(of);
  const complete = remaining === 0, blocked = of.status === 'Bloqué', selected = window._bulkV5Selected?.has(vehicle.id);
  const percent = total ? Math.round(done / total * 100) : 0;
  const info = complete
    ? `✓ Terminé ${done}/${total}`
    : blocked
      ? `Bloqué • ${done}/${total} • ${of.blockReason || ''}`
      : session

// Valide réellement la quantité choisie sur tous les VIN sélectionnés et crée les événements d'avancement correspondants.
function validateBulkV5() {
  const group = currentBulkGroupV5();
  const ids = Array.from(window._bulkV5Selected || []);
  const person = operationalPersonV1116();
  const amount = Math.max(1, Math.floor(Number(document.getElementById('bulkQtyAmountV5')?.value) || 1));
  if (!group) return;
  if (!ids.length) { alert('Sélectionne au moins un VIN.'); return; }
  if (!person) { alert('Choisis une personne.'); return; }
  if (!confirm(`Ajouter jusqu'à ${amount} réalisation${amount > 1 ? 's' : ''} de ${group.name} sur ${ids.length} VIN pour ${person} ?`)) return;
  let units = 0, vehicles = 0;
  ids.forEach(id => {
    const vehicle = state.vehicles.find(item => item.id === id);
    const of = vehicle ? ofForVehicleV5(vehicle, group.key) : null;
    if (!vehicle || !of || qtyRemainingV5(of) <= 0 || activeWorkSessionV1111(of)) return;
    const beforeSnapshot = progressSnapshot(vehicle);
    const before = qtyDoneV5(of);
    const after = Math.min(qtyTotalV5(of), before + amount);
    const added = after - before;
    if (!added) return;
    of.completedQty = after;
    of.doneBy = person;
    of.doneAt = new Date().toISOString();
    of.blockReason = '';
    delete of.blockDetailsV8;
    of.status = after >= qtyTotalV5(of) ? 'Fait' : 'À faire';
    touchOFV1118(of, of.doneAt);
    units += added;
    vehicles++;
    logAction('OF fait (multi-VIN quantité)', vehicle, of, `+${added} • ${after}/${qtyTotalV5(of)} • ${person}`);
    recordProgressEvent(vehicle, of, added, person, 'realisation', 'Validation multi-VIN', beforeSnapshot);
  });
  state.realPerson = person;
  logAction('Validation multi-VIN quantité terminée', null, null, `${group.name} • ${units} réalisation(s) • ${vehicles} VIN • ${person}`);
  closeModal();
  state.realModeV3 = 'of';
  saveCriticalV1118();
}

// Retourne le libellé français correspondant au type d'événement d'avancement.
function progressKindLabel(event) {
  if (event.kind === 'blocage') return 'Bloqué';
  if (event.kind === 'deblocage') return 'Débloqué';
  if (event.kind === 'correction') return 'Correction';
  if (event.kind === 'baseline') return 'Reprise historique';
  if (event.kind === 'start') return 'Début';
  if (event.kind === 'pause') return 'Pause';
  if (event.kind === 'resume') return 'Reprise';
  if (event.kind === 'finish') return 'Terminé';
  if (event.kind === 'cancel') return 'Démarrage annulé';
  return 'Réalisation';
}

// Formate la date et l'heure d'un événement d'avancement.
function fmtProgressDate(value) {
  const date = new Date(value);
  return date.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// Retourne le pourcentage d'un événement pour le mode de courbe choisi.
function progressMetric(event, mode) {
  return mode === 'Global' ? Number(event.progress?.global) || 0 : Number(event.progress?.[mode]) || 0;
}

// Formate une graduation de l'axe du temps selon l'étendue actuellement affichée.
function timelineAxisDateLabelV1119(timestamp, spanMs) {
  const date = new Date(timestamp);
  if (Number.isNaN(date.getTime())) return '-';

  if (spanMs <= 24 * 3600000) {
    return date.toLocaleString('fr-FR', {
      day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
    });
  }

  if (spanMs <= 7 * 24 * 3600000) {
    return date.toLocaleString('fr-FR', {
      day: '2-digit', month: '2-digit', hour: '2-digit'
    });
  }

  if (spanMs <= 120 * 24 * 3600000) {
    return date.toLocaleDateString('fr-FR', {
      day: '2-digit', month: '2-digit'
    });
  }

  return date.toLocaleDateString('fr-FR', {
    month: '2-digit', year: 'numeric'
  });
}

// Retourne la fenêtre temporelle visible en fonction du zoom et du déplacement horizontal.
function timelineVisibleRangeV1119(events) {
  const timestamps = events
    .map(event => new Date(event.at).getTime())
    .filter(Number.isFinite)
    .sort((a, b) => a - b);

  if (!timestamps.length) {
    const now = Date.now();
    return { start: now - 3600000, end: now + 3600000, fullStart: now - 3600000, fullEnd: now + 3600000 };
  }

  let fullStart = timestamps[0];
  let fullEnd = timestamps[timestamps.length - 1];

  // Une seule activité doit quand même donner une vraie barre de temps lisible.
  if (fullEnd - fullStart < 10 * 60000) {
    const center = (fullStart + fullEnd) / 2;
    fullStart = center - 30 * 60000;
    fullEnd = center + 30 * 60000;
  }

  const fullSpan = Math.max(60000, fullEnd - fullStart);
  const zoom = Math.max(1, Number(window._timelineZoomV1119) || 1);
  const visibleSpan = Math.max(60000, fullSpan / zoom);

  if (zoom <= 1) {
    return { start: fullStart, end: fullEnd, fullStart, fullEnd };
  }

  const pan = Math.max(0, Math.min(1, Number(window._timelinePanV1119) || 0));
  const availableShift = Math.max(0, fullSpan - visibleSpan);
  const start = fullStart + availableShift * pan;
  const end = start + visibleSpan;

  return { start, end, fullStart, fullEnd };
}

// Génère un graphique SVG avec une vraie échelle de dates et un zoom temporel.
function timelineChartSvg(vehicle, mode) {
  const events = vehicleProgressEvents(vehicle.id);
  if (!events.length) return '<div class="card">Pas encore d’événement d’avancement pour ce véhicule.</div>';

  const range = timelineVisibleRangeV1119(events);
  const width = 980, height = 330, left = 54, right = 22, top = 18, bottom = 78;
  const plotW = width - left - right, plotH = height - top - bottom;
  const span = Math.max(1, range.end - range.start);

  const xForTime = timestamp =>
    left + ((timestamp - range.start) / span) * plotW;

  const yForValue = value =>
    top + plotH - (Math.max(0, Math.min(100, Number(value) || 0)) / 100) * plotH;

  // Les graduations horizontales représentent le pourcentage.
  const horizontalGrid = [0, 25, 50, 75, 100].map(value => {
    const y = yForValue(value);
    return `<line x1="${left}" y1="${y}" x2="${left + plotW}" y2="${y}" stroke="#284262" stroke-width="1"/>
      <text x="10" y="${y + 4}" fill="#9cb2d1" font-size="11">${value}%</text>`;
  }).join('');

  // Les graduations verticales représentent maintenant de vraies dates/heures.
  const tickCount = 6;
  const timeGrid = Array.from({ length: tickCount }, (_, index) => {
    const ratio = index / (tickCount - 1);
    const timestamp = range.start + span * ratio;
    const x = left + plotW * ratio;
    const label = timelineAxisDateLabelV1119(timestamp, span);
    const anchor = index === 0 ? 'start' : index === tickCount - 1 ? 'end' : 'middle';

    return `<line x1="${x}" y1="${top}" x2="${x}" y2="${top + plotH}" stroke="#1d3654" stroke-width="1" stroke-dasharray="3 5"/>
      <text x="${x}" y="${top + plotH + 24}" text-anchor="${anchor}" fill="#a9bdd9" font-size="11">${escHtml(label)}</text>`;
  }).join('');

  // Événements réellement présents dans la fenêtre.
  const visibleEvents = events.filter(event => {
    const time = new Date(event.at).getTime();
    return Number.isFinite(time) && time >= range.start && time <= range.end;
  });

  // On garde la dernière valeur connue juste avant la fenêtre pour assurer la continuité de la courbe après zoom.
  const before = events
    .filter(event => new Date(event.at).getTime() < range.start)
    .sort((a, b) => new Date(a.at) - new Date(b.at))
    .pop();

  const linePoints = [];

  if (before) {
    linePoints.push({
      x: left,
      y: yForValue(progressMetric(before, mode)),
      event: before,
      synthetic: true
    });
  }

  visibleEvents.forEach(event => {
    const time = new Date(event.at).getTime();
    linePoints.push({
      x: xForTime(time),
      y: yForValue(progressMetric(event, mode)),
      event,
      synthetic: false
    });
  });

  // Si aucun événement n'est visible mais qu'on connaît la dernière valeur, on trace une ligne horizontale.
  if (!visibleEvents.length && before) {
    linePoints.push({
      x: left + plotW,
      y: yForValue(progressMetric(before, mode)),
      event: before,
      synthetic: true
    });
  }

  // Courbe en escalier : l'avancement change au moment précis de chaque événement.
  let path = '';
  linePoints.forEach((point, index) => {
    if (index === 0) {
      path += `M ${point.x.toFixed(1)} ${point.y.toFixed(1)}`;
      return;
    }

    const previous = linePoints[index - 1];
    path += ` H ${point.x.toFixed(1)} V ${point.y.toFixed(1)}`;
  });

  const dots = linePoints
    .filter(point => !point.synthetic)
    .map(point => {
      const value = progressMetric(point.event, mode);
      return `<circle cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="4.5" fill="#38bdf8" stroke="#081830" stroke-width="2">
        <title>${escHtml(fmtProgressDate(point.event.at))} • ${value}% • ${escHtml(point.event.ofName || progressKindLabel(point.event))}</title>
      </circle>`;
    })
    .join('');

  const emptyWindow = !linePoints.length
    ? `<text x="${left + plotW / 2}" y="${top + plotH / 2}" text-anchor="middle" fill="#9cb2d1" font-size="14">Aucune activité dans cette période</text>`
    : '';

  return `<div class="timelineChartScrollV1119">
    <svg viewBox="0 0 ${width} ${height}" class="timelineChartSvgV1119">
      ${horizontalGrid}
      ${timeGrid}
      <text x="${left + plotW / 2}" y="${height - 14}" text-anchor="middle" fill="#8da8cc" font-size="11">Temps</text>
      ${path ? `<path d="${path}" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
      ${dots}
      ${emptyWindow}
    </svg>
  </div>`;
}

// Affiche tout le contenu de la fenêtre d'historique graphique avec barre de temps, zoom et déplacement horizontal.
function renderTimelineBodyV6(vehicle) {
  const mode = window._timelineModeV6 || 'Global';

// Modifie le niveau de zoom temporel du graphique par paliers ×1, ×2, ×4, ×8 et ×16.
function changeTimelineZoomV1119(direction) {
  const levels = [1, 2, 4, 8, 16];
  const current = Math.max(1, Number(window._timelineZoomV1119) || 1);
  let index = levels.indexOf(current);
  if (index < 0) index = 0;

  index = Math.max(0, Math.min(levels.length - 1, index + (direction > 0 ? 1 : -1)));
  window._timelineZoomV1119 = levels[index];

  // Au premier zoom, on se place sur la période la plus récente, souvent la plus utile à l'atelier.
  if (window._timelineZoomV1119 > 1 && current === 1) {
    window._timelinePanV1119 = 1;
  }

  if (window._timelineZoomV1119 === 1) {
    window._timelinePanV1119 = 0;
  }

  const vehicle = state.vehicles.find(item => item.id === window._timelineVehicleV6);
  if (vehicle) renderTimelineBodyV6(vehicle);
}

// Déplace la fenêtre temporelle visible de la date la plus ancienne vers la plus récente.
function setTimelinePanV1119(value) {
  window._timelinePanV1119 = Math.max(0, Math.min(1, (Number(value) || 0) / 100));
  const vehicle = state.vehicles.find(item => item.id === window._timelineVehicleV6);
  if (vehicle) renderTimelineBodyV6(vehicle);
}

// Remet le graphique sur toute la période historique disponible.
function resetTimelineZoomV1119() {
  window._timelineZoomV1119 = 1;
  window._timelinePanV1119 = 0;
  const vehicle = state.vehicles.find(item => item.id === window._timelineVehicleV6);
  if (vehicle) renderTimelineBodyV6(vehicle);
}
