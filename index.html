  function fmtDTv6(x){const d=new Date(x);return d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
  function metricForModeV6(e,mode){if(mode==='Global')return Number(e.progress?.global)||0;return Number(e.progress?.[mode])||0;}
  function kindLabelV6(e){if(e.kind==='blocage')return'Bloqué';if(e.kind==='deblocage')return'Débloqué';if(e.kind==='correction')return'Correction';if(e.kind==='baseline'||e.kind==='start')return'Point départ';return'Réalisé';}
  function kindClassV6(e){if(e.kind==='blocage')return'block';if(e.kind==='correction')return'correction';return'';}
  function chartSvgV6(v,mode){
    const ev=vehicleEventsV6(v.id);if(!ev.length)return'<div class="timelineEmptyV6">Aucune activité enregistrée pour ce VIN pour le moment.</div>';
    const W=960,H=310,L=58,R=24,T=22,B=48,iw=W-L-R,ih=H-T-B;let t0=Math.min(...ev.map(e=>+new Date(e.at))),t1=Math.max(...ev.map(e=>+new Date(e.at)));if(t0===t1){t0-=3600000;t1+=3600000;}
    const x=t=>L+((t-t0)/(t1-t0))*iw,y=p=>T+ih-(Math.max(0,Math.min(100,p))/100)*ih;
    const pts=ev.map(e=>({e,x:x(+new Date(e.at)),y:y(metricForModeV6(e,mode)),p:metricForModeV6(e,mode)}));
    let grid='';[0,25,50,75,100].forEach(p=>{const yy=y(p);grid+=`<line class="timelineGridV6" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"></line><text class="timelineAxisV6" x="${L-10}" y="${yy+4}" text-anchor="end">${p}%</text>`;});
    let xlabels='';for(let i=0;i<5;i++){const tt=t0+(t1-t0)*(i/4),xx=x(tt),d=new Date(tt);xlabels+=`<text class="timelineAxisV6" x="${xx}" y="${H-12}" text-anchor="middle">${d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}</text>`;}
    const path=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
    const circles=pts.map(p=>{const cls=p.e.kind==='correction'?'correction':((p.e.kind==='blocage'||p.e.kind==='deblocage'||p.e.kind==='baseline'||p.e.kind==='start')?'note':'');const q=p.e.qtyDelta?`${p.e.qtyDelta>0?'+':''}${p.e.qtyDelta}`:'—';return`<circle class="timelinePointV6 ${cls}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5"><title>${escV6(fmtDTv6(p.e.at))} • ${escV6(p.e.person||'—')} • ${escV6(p.e.ofName||kindLabelV6(p.e))} • Qté ${q} • ${p.p}%</title></circle>`;}).join('');
    return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution ${escV6(mode)} du VIN ${escV6(v.vin)}"><g>${grid}${xlabels}<path class="timelinePathV6" d="${path}"></path>${circles}</g></svg>`;
  }
  function peopleSummaryV6(v){const sums={};vehicleEventsV6(v.id).filter(e=>e.qtyDelta>0).forEach(e=>{const p=e.person||'Non renseigné';sums[p]=(sums[p]||0)+e.qtyDelta;});const arr=Object.entries(sums).sort((a,b)=>b[1]-a[1]);return arr.length?arr.map(([p,n])=>`<span class="timelinePersonV6">${escV6(p)} : ${n} réalisation${n>1?'s':''}</span>`).join(''):'<span class="muted">Aucune réalisation enregistrée depuis V6.</span>';}
  function historyTableV6(v){const ev=vehicleEventsV6(v.id).slice().reverse();if(!ev.length)return'<div class="timelineEmptyV6">Aucun historique détaillé.</div>';return`<div class="tablewrap timelineHistoryV6"><table><thead><tr><th>Date</th><th>Personne</th><th>Phase</th><th>OF</th><th>Action</th><th>Quantité</th><th>Avancement global</th></tr></thead><tbody>${ev.map(e=>{const q=e.qtyDelta===0?'—':`${e.qtyDelta>0?'+':''}${e.qtyDelta}`;return`<tr><td><b>${escV6(fmtDTv6(e.at))}</b></td><td>${escV6(e.person||'—')}</td><td>${escV6(e.category||'—')}</td><td><b>${escV6(e.ofName||'—')}</b><div class="muted">${escV6(e.note||'')}</div></td><td><span class="timelineKindV6 ${kindClassV6(e)}">${kindLabelV6(e)}</span></td><td class="${e.qtyDelta>0?'timelineQtyPlusV6':e.qtyDelta<0?'timelineQtyMinusV6':''}">${q}${e.qtyTotal?` <span class="muted">(${e.qtyAfter}/${e.qtyTotal})</span>`:''}</td><td><b>${Number(e.progress?.global)||0}%</b></td></tr>`;}).join('')}</tbody></table></div>`;}
  function renderTimelineBodyV6(v){const mode=window._timelineModeV6||'Global',snap=snapshotV6(v),ev=vehicleEventsV6(v.id);const first=ev[0],last=ev[ev.length-1];const box=document.getElementById('timelineBodyV6');if(!box)return;box.innerHTML=`<div class="timelineV6"><div class="timelineTopV6"><div class="timelineMetricV6"><b>Global</b><strong>${snap.global}%</strong></div><div class="timelineMetricV6"><b>Fabrication</b><strong>${snap.Fabrication}%</strong></div><div class="timelineMetricV6"><b>Prémontage</b><strong>${snap.Prémontage}%</strong></div><div class="timelineMetricV6"><b>Pose</b><strong>${snap.Pose}%</strong></div></div><div class="timelineTabsV6">${['Global','Fabrication','Prémontage','Pose'].map(m=>`<button class="small ${mode===m?'active':''}" onclick="setTimelineModeV6('${m}')">${m}</button>`).join('')}</div><div class="timelineChartBoxV6">${chartSvgV6(v,mode)}<div class="timelineLegendV6"><span>Courbe affichée : <b>${escV6(mode)}</b></span><span>${first?`Début : <b>${escV6(fmtDTv6(first.at))}</b>`:'Pas encore commencé'}${last&&last!==first?` • Dernière activité : <b>${escV6(fmtDTv6(last.at))}</b>`:''}</span></div></div><div><b>Qui a réalisé quoi</b><div class="timelinePeopleV6" style="margin-top:8px">${peopleSummaryV6(v)}</div></div><div><b>Historique détaillé</b><div class="muted" style="margin:5px 0 9px">Chaque +1, validation multiple, correction et blocage est conservé à partir de la V6.</div>${historyTableV6(v)}</div></div>`;}
  window.setTimelineModeV6=function(mode){window._timelineModeV6=mode;const v=state.vehicles.find(x=>x.id===window._timelineVehicleV6);if(v)renderTimelineBodyV6(v);};
  window.openVehicleTimelineV6=function(vid){const v=state.vehicles.find(x=>x.id===vid);if(!v||isSAV(v))return;window._timelineVehicleV6=vid;window._timelineModeV6='Global';openModal('📈 Avancement dans le temps — '+v.vin,'<div id="timelineBodyV6"></div>');document.querySelector('#modal .dialog')?.classList.add('timelineDialogV6');renderTimelineBodyV6(v);};
  const oldCloseV6=window.closeModal;window.closeModal=function(){document.querySelector('#modal .dialog')?.classList.remove('timelineDialogV6');return oldCloseV6();};

  // Ajoute le bouton à la fiche VIN sans réécrire la fiche de V5.
  const oldDetailV6=window.vehicleDetail;
  window.vehicleDetail=function(){oldDetailV6();const v=state.vehicles.find(x=>x.id===state.detailVin)||activeVehicles()[0]||archivedVehicles()[0];if(!v||isSAV(v))return;const tb=document.querySelector('#view > .toolbar');if(tb&&!document.getElementById('timelineBtnV6')){const b=document.createElement('button');b.id='timelineBtnV6';b.className='alt';b.textContent='📈 Avancement dans le temps';b.onclick=()=>openVehicleTimelineV6(v.id);tb.appendChild(b);}};

  // V10 WEB : démo graphique supprimée en production.
  ensureBaselinesV6();try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  render();

<script>

(function(){
  function escV7(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function totalV7(o){const n=Math.floor(Number(o?.quantity ?? o?.qty ?? 1));return Number.isFinite(n)&&n>0?n:1;}
  function doneV7(o){const total=totalV7(o);if(o?.completedQty!==undefined&&o?.completedQty!==null&&o?.completedQty!=='')return Math.max(0,Math.min(total,Math.floor(Number(o.completedQty)||0)));return o?.status==='Fait'?total:0;}
  function remainV7(o){return Math.max(0,totalV7(o)-doneV7(o));}
  function keyV7(o){return[String(o?.name||'').trim(),String(o?.category||'').trim(),String(o?.desc||'').trim()].join('|||');}
  function activeNormalV7(){return (typeof activeVehicles==='function'?activeVehicles():state.vehicles||[]).filter(v=>!(typeof isSAV==='function'&&isSAV(v)));}
  function ofForV7(v,key){return(v.ofs||[]).find(o=>keyV7(o)===key);}
  const phaseOrderV7={'Fabrication':1,'Prémontage':2,'Pose':3,'Essais':4,'Autre':5};
  function groupsV7(){
    const map=new Map();
    activeNormalV7().forEach(v=>{const seen=new Set();(v.ofs||[]).forEach(o=>{const key=keyV7(o);if(!o.name||seen.has(key))return;seen.add(key);
      if(!map.has(key))map.set(key,{key,name:o.name,desc:o.desc||'',category:o.category||'Autre',time:Number(o.time)||0,order:Number(o.order)||99999,vehicles:0,totalUnits:0,doneUnits:0,finishedVehicles:0,blockedVehicles:0});
      const g=map.get(key);g.vehicles++;g.totalUnits+=totalV7(o);g.doneUnits+=doneV7(o);if(remainV7(o)===0)g.finishedVehicles++;if(o.status==='Bloqué')g.blockedVehicles++;g.order=Math.min(g.order,Number(o.order)||99999);
    });});
    return Array.from(map.values()).sort((a,b)=>(phaseOrderV7[a.category]||99)-(phaseOrderV7[b.category]||99)||a.order-b.order||String(a.name).localeCompare(String(b.name),'fr',{numeric:true,sensitivity:'base'}));
  }
  function filteredV7(){
    let groups=groupsV7();
    const q=(document.getElementById('ofSearchV5')?.value||state.ofSearchV5||'').trim().toLowerCase();
    const cat=document.getElementById('ofPhaseV5')?.value||state.ofPhaseV5||'Tous';
    const st=document.getElementById('ofStatusV5')?.value||state.ofStatusV5||'À valider';
    if(cat!=='Tous')groups=groups.filter(g=>g.category===cat);
    if(st==='À valider')groups=groups.filter(g=>g.doneUnits<g.totalUnits);
    if(st==='Terminés')groups=groups.filter(g=>g.doneUnits===g.totalUnits&&g.totalUnits>0);
    if(q)groups=groups.filter(g=>[g.name,g.desc,g.category].join(' ').toLowerCase().includes(q));
    return groups;
  }
  function listV7(groups){
    if(!groups.length)return'<div class="card">Aucun OF ne correspond à ce filtre.</div>';
    return`<div class="tablewrap"><table class="ofQtyTableV5"><thead><tr><th>Ordre</th><th>OF</th><th>Description</th><th>Temps X1</th><th>Qté totale</th><th>Avancement</th><th>VIN terminés</th><th>Bloqués</th><th>Actions</th></tr></thead><tbody>${groups.map(g=>{const p=g.totalUnits?Math.round(g.doneUnits/g.totalUnits*100):0,complete=g.doneUnits===g.totalUnits&&g.totalUnits>0;return`<tr class="${complete?'ofRowCompleteV4':''}"><td><b>${g.order===99999?'-':g.order}</b></td><td><b>${escV7(g.name)}</b><div class="muted">${escV7(g.category)}</div></td><td class="desc">${escV7(g.desc||'')}</td><td><b>${fmt(g.time)}</b></td><td><span class="qtyBadgeV5">× ${g.totalUnits}</span><div class="muted">${g.vehicles} VIN</div></td><td><div class="progress ofProgressV4"><div class="bar" style="width:${p}%"></div></div><div class="muted"><b>${g.doneUnits}/${g.totalUnits}</b> réalisés • ${g.totalUnits-g.doneUnits} restants</div></td><td><b>${g.finishedVehicles}/${g.vehicles}</b></td><td>${g.blockedVehicles?`<span class="dangertext">${g.blockedVehicles}</span>`:'<span class="muted">0</span>'}</td><td class="actions"><div class="ofActionsV7"><button class="small ${complete?'alt':'good'}" ${complete?'disabled':''} onclick="openBulkOFV5('${encodeURIComponent(g.key)}')">${complete?'✓ Terminé':'Valider plusieurs VIN'}</button><button class="small bad" ${complete?'disabled':''} onclick="openBulkBlockV7('${encodeURIComponent(g.key)}')">⛔ Bloquer plusieurs VIN</button></div></td></tr>`;}).join('')}</tbody></table></div>`;
  }
  window.renderOFListV5=function(){
    const a=document.getElementById('ofSearchV5'),b=document.getElementById('ofPhaseV5'),c=document.getElementById('ofStatusV5');
    if(a)state.ofSearchV5=a.value;if(b)state.ofPhaseV5=b.value;if(c)state.ofStatusV5=c.value;
    try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
    const box=document.getElementById('ofListV5');if(box)box.innerHTML=listV7(filteredV7());
  };

  function currentGroupV7(){return groupsV7().find(g=>g.key===window._bulkBlockKeyV7);}
  function blockRowsV7(){const g=currentGroupV7();return g?activeNormalV7().map(v=>({v,o:ofForV7(v,g.key)})).filter(x=>x.o):[];}
  function blockChoiceV7(v,o){
    const rem=remainV7(o),d=doneV7(o),t=totalV7(o),done=rem===0,blocked=o.status==='Bloqué',selectable=!done&&!blocked,sel=!!window._bulkBlockSelectedV7?.has(v.id);
    let info=done?`✓ Terminé ${d}/${t}`:blocked?`Déjà bloqué • ${o.blockReason||'sans raison'}`:`${d}/${t} faits • ${rem} restant${rem>1?'s':''}`;
    return`<button type="button" class="vinBlockChoiceV7 ${done?'done':''} ${blocked?'blocked':''} ${sel?'selected':''}" ${selectable?'':'disabled'} onclick="toggleBulkBlockVinV7('${escV7(v.id)}')"><b>${sel?'✓ ':''}${escV7(v.vin)}</b><small>${escV7(info)}</small></button>`;
  }
  function refreshBlockV7(){
    const box=document.getElementById('vinBlockGridV7');if(box)box.innerHTML=blockRowsV7().map(({v,o})=>blockChoiceV7(v,o)).join('');
    const n=window._bulkBlockSelectedV7?.size||0,c=document.getElementById('bulkBlockCountV7'),b=document.getElementById('bulkBlockValidateV7');
    if(c)c.textContent=`${n} VIN sélectionné${n>1?'s':''}`;
    if(b){b.textContent=`⛔ Bloquer ${n} VIN`;b.disabled=n===0;}
  }
  window.toggleBulkBlockVinV7=function(id){const rows=blockRowsV7(),row=rows.find(x=>x.v.id===id);if(!row||remainV7(row.o)<=0||row.o.status==='Bloqué')return;window._bulkBlockSelectedV7=window._bulkBlockSelectedV7||new Set();window._bulkBlockSelectedV7.has(id)?window._bulkBlockSelectedV7.delete(id):window._bulkBlockSelectedV7.add(id);refreshBlockV7();};
  window.bulkBlockSelectV7=function(mode){const set=new Set();if(mode!=='none')blockRowsV7().forEach(({v,o})=>{if(remainV7(o)>0&&o.status!=='Bloqué')set.add(v.id);});window._bulkBlockSelectedV7=set;refreshBlockV7();};
  window.openBulkBlockV7=function(encoded){
    let key;try{key=decodeURIComponent(encoded);}catch(e){key=encoded;}const g=groupsV7().find(x=>x.key===key);if(!g)return;
    window._bulkBlockKeyV7=key;window._bulkBlockSelectedV7=new Set();if(!state.realPerson&&state.people?.[0])state.realPerson=typeof personName==='function'?personName(state.people[0]):String(state.people[0]||'');
    const people=(state.people||[]).map(p=>{const n=typeof personName==='function'?personName(p):String(p||'');return`<option value="${escV7(n)}" ${state.realPerson===n?'selected':''}>${escV7(n)}</option>`;}).join('');
    openModal('Blocage sur plusieurs VIN',`<div class="bulkBlockNoteV7"><b>⛔ Blocage groupé de ${escV7(g.name)}</b><div style="margin-top:5px">Sélectionne les VIN concernés. La même raison de blocage sera enregistrée sur chacun.</div></div><div class="bulkSummaryV3"><h3>${escV7(g.name)}</h3><div class="muted">${escV7(g.desc||'')} • ${escV7(g.category)} • ${g.blockedVehicles} VIN déjà bloqué${g.blockedVehicles>1?'s':''}</div></div><div class="bulkToolsV3"><button class="small alt" onclick="bulkBlockSelectV7('all')">Sélectionner tous les disponibles</button><button class="small alt" onclick="bulkBlockSelectV7('none')">Tout enlever</button></div><div class="bulkBlockFieldsV7"><label>Personne<select id="bulkBlockPersonV7">${people}</select></label><label>Raison du blocage<textarea id="bulkBlockReasonV7" placeholder="Ex : attente pièce, problème faisceau, accès impossible..."></textarea></label></div><div id="vinBlockGridV7" class="vinBlockGridV7"></div><div class="bulkBlockFooterV7"><span id="bulkBlockCountV7" class="count">0 VIN sélectionné</span><button class="alt" onclick="closeModal()">Annuler</button><button id="bulkBlockValidateV7" class="bad" onclick="validateBulkBlockV7()" disabled>⛔ Bloquer 0 VIN</button></div>`);
    refreshBlockV7();
  };
  window.validateBulkBlockV7=function(){
    const g=currentGroupV7(),ids=Array.from(window._bulkBlockSelectedV7||[]),person=document.getElementById('bulkBlockPersonV7')?.value||state.realPerson||'',reason=(document.getElementById('bulkBlockReasonV7')?.value||'').trim();
    if(!g)return;if(!ids.length){alert('Sélectionne au moins un VIN.');return;}if(!person){alert('Choisis une personne.');return;}if(!reason){alert('Écris la raison du blocage.');return;}
    if(!confirm(`Bloquer ${g.name} sur ${ids.length} VIN ?\n\nRaison : ${reason}`))return;
    let count=0;const now=new Date().toISOString();
    ids.forEach(id=>{const v=state.vehicles.find(x=>x.id===id),o=v?ofForV7(v,g.key):null;if(!v||!o||remainV7(o)<=0||o.status==='Bloqué')return;o.status='Bloqué';o.blockReason=reason;o.doneBy=person;o.doneAt=now;logAction('OF bloqué (multi-VIN)',v,o,`${reason} • ${person}`);if(typeof window.recordProgressEventV6==='function')window.recordProgressEventV6(v,o,0,person,'blocage','Blocage multi-VIN : '+reason);count++;});
    state.realPerson=person;logAction('Blocage multi-VIN terminé',null,null,`${g.name} • ${count} VIN • ${person} • ${reason}`);closeModal();save();state.realModeV3='of';real();
  };

  // Re-rend la page courante pour afficher immédiatement les nouveaux boutons V7.
  if(typeof render==='function')render();
})();

</script>
<script>

(function(){
  const PARTS_LS_V8='suivi_of_simple_parts_catalog_v8';
  const EMBEDDED_PARTS_V8={Renault:[],Mercedes:[],MAN:[],Autre:[]};
  function escV8(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function normalKeyV8(s){return String(s||'').trim().toUpperCase();}
  function totalV8(o){return typeof qtyTotalV5==='function'?qtyTotalV5(o):Math.max(1,Math.floor(Number(o?.quantity)||1));}
  function doneV8(o){return typeof qtyDoneV5==='function'?qtyDoneV5(o):(o?.status==='Fait'?totalV8(o):Math.max(0,Math.floor(Number(o?.completedQty)||0)));}

  function ofKeyV8(o){return [String(o?.name||'').trim(),String(o?.category||'').trim(),String(o?.desc||'').trim()].join('|||');}
  function ofForKeyV8(v,key){return (v.ofs||[]).find(o=>ofKeyV8(o)===key);}

  function loadPartsV8(){

  function partsForOFV8(brand,ofName){const key=normalKeyV8(ofName);return ((state.partsCatalogV8||{})[brand]||[]).filter(p=>normalKeyV8(p.of)===key);}
  function partsUnionV8(rows){
    const map=new Map();rows.forEach(({v,o})=>partsForOFV8(v.brand,o.name).forEach(p=>{const k=normalKeyV8(p.ref)+'|||'+normalKeyV8(p.name);if(!map.has(k))map.set(k,p);}));return Array.from(map.values());
  }
  function partLabelV8(p){return [p.ref,p.name].filter(Boolean).join(' — ') + ` (Qté / OF : ${Math.max(1,Number(p.quantity)||1)})`;}
  function piecesPreviewV8(parts){if(!parts.length)return'<div class="muted">Aucune pièce n’est renseignée pour cet OF dans la feuille PIECES_OF.</div>';return`<div class="partsListV8">${parts.map(p=>`<div class="partLineV8"><div class="partRefV8">${escV8(p.ref||'-')}</div><div>${escV8(p.name||'-')}</div><div class="partQtyV8">× ${Math.max(1,Number(p.quantity)||1)}</div></div>`).join('')}</div>`;}
  function pieceSelectOptionsV8(parts){return parts.map((p,i)=>`<option value="${i}">${escV8(partLabelV8(p))}</option>`).join('');}
  function reasonFromV8(mode,part,missingQty,comment){
    if(mode==='piece'&&part){let s=`Pièce manquante : ${[part.ref,part.name].filter(Boolean).join(' — ')} • Qté manquante ${missingQty}`;if(comment)s+=' • '+comment;return s;}

  window.changeBulkBlockPartV8=function(){const p=window._bulkBlockPartsV8?.[Number(document.getElementById('bulkBlockPartV8')?.value||0)],q=document.getElementById('bulkBlockMissingQtyV8');if(p&&q)q.value=Math.max(1,Number(p.quantity)||1);};

<script>

(function(){
  const SAMPLE_PARTS_V9={Renault:[],Mercedes:[],MAN:[],Autre:[]};

  const escV9=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  const ofKeyV9=o=>[String(o?.name||'').trim(),String(o?.category||'').trim(),String(o?.desc||'').trim()].join('|||');
  const activeV9=()=>((typeof activeVehicles==='function'?activeVehicles():state.vehicles||[]).filter(v=>!(typeof isSAV==='function'&&isSAV(v))));
  const ofForV9=(v,key)=>(v.ofs||[]).find(o=>ofKeyV9(o)===key);
  const partsForV9=(brand,of)=>(((state.partsCatalogV8||{})[brand]||[]).filter(p=>normV9(p.of)===normV9(of)));

  function shouldUpgradeSamplesV9(){
    const all=Object.values(state.partsCatalogV8||{}).flat().filter(Boolean);
    return !all.length || all.every(p=>!p.ref || String(p.ref).toUpperCase().startsWith('TEST-'));
  }

    state.partsCatalogV8=JSON.parse(JSON.stringify(SAMPLE_PARTS_V9));
    try{localStorage.setItem(PARTS_KEY_V9,JSON.stringify(state.partsCatalogV8));localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  }

  function partsUnionV9(rows){
    const m=new Map();
    rows.forEach(({v,o})=>partsForV9(v.brand,o.name).forEach(p=>{const k=normV9(p.ref)+'|||'+normV9(p.name);if(!m.has(k))m.set(k,p);}));
    return Array.from(m.values());
  }
  function piecesPreviewV9(parts){

  }

  }
  function selectedPartHtmlV9(p){

    return `<div class="selectedPartV9"><div><span class="labelV9">Référence</span><b>${escV9(p.ref||'-')}</b></div><div class="wideV9"><span class="labelV9">Désignation</span>${escV9(p.name||'-')}</div><div><span class="labelV9">Qté / OF</span><b>× ${Math.max(1,Number(p.quantity)||1)}</b></div><div class="wideV9"><span class="labelV9">Note Excel</span>${escV9(p.comment||'-')}</div></div>`;

  window.blockOF=function(vid,oid,backToReal=false){

      <label id="blockQtyLabelV9" class="span3V9">Quantité manquante<input type="number" min="1" step="1" id="blockMissingQtyV9" value="${defaultQty}"></label>
      <div id="blockSelectedPartInfoV9" class="span12V9">${selectedPartHtmlV9(parts[0])}</div>

      <div class="blockFooterV9"><button class="alt" id="cancelBlockV9">Annuler</button><button class="bad" id="confirmBlockV9">⛔ Bloquer l’OF</button></div>

    toggle();

  function confirmSingleV9(){
    const c=window._singleBlockV9,v=state.vehicles.find(x=>x.id===c?.vid),o=v?.ofs?.find(x=>x.id===c?.oid);if(!v||!o)return;

    const blocked=rows.filter(x=>x.o.status==='Bloqué').length,defaultQty=parts.length?Math.max(1,Number(parts[0].quantity)||1):1;

<script>
(function(){
  window.ELITT_V10_SCHEMA = 10;

  function positiveIntV10(v, fallback=1){
    const n=Math.floor(Number(v));
    return Number.isFinite(n)&&n>0?n:fallback;
  }
  function doneQtyV10(o,total){
    if(o.completedQty!==undefined && o.completedQty!==null && o.completedQty!==''){
      const n=Math.floor(Number(o.completedQty)||0);
      return Math.max(0,Math.min(total,n));
    }
    return o.status==='Fait'?total:0;
  }
  function phaseSnapshotV10(v){
    const phases=['Fabrication','Prémontage','Pose'];
    const out={global:0,Fabrication:0,Prémontage:0,Pose:0};
    let allTotal=0,allDone=0;
    phases.forEach(cat=>{
      let total=0,done=0;
      (v.ofs||[]).filter(o=>(o.category||'')===cat).forEach(o=>{
        const q=positiveIntV10(o.quantity??o.qty,1),d=doneQtyV10(o,q);
        total+=q;done+=d;
      });
      out[cat]=total?Math.round(done/total*100):0;
    });
    (v.ofs||[]).forEach(o=>{const q=positiveIntV10(o.quantity??o.qty,1);allTotal+=q;allDone+=doneQtyV10(o,q);});
    out.global=allTotal?Math.round(allDone/allTotal*100):0;
    return out;
  }
  function migrateStateV10(){
    if(!window.state) return;
    state.vehicles=Array.isArray(state.vehicles)?state.vehicles:[];
    state.history=Array.isArray(state.history)?state.history:[];
    state.customTemplates=state.customTemplates||{Renault:[],Mercedes:[],MAN:[]};
    ['Renault','Mercedes','MAN'].forEach(b=>{
      if(!Array.isArray(state.customTemplates[b])) state.customTemplates[b]=[];
      state.customTemplates[b].forEach(o=>{o.quantity=positiveIntV10(o.quantity??o.qty,1);});
    });
    state.partsCatalogV8=state.partsCatalogV8||{};
    ['Renault','Mercedes','MAN','Autre'].forEach(b=>{if(!Array.isArray(state.partsCatalogV8[b]))state.partsCatalogV8[b]=[];});
    state.progressEventsV6=Array.isArray(state.progressEventsV6)?state.progressEventsV6:[];

    state.vehicles.forEach(v=>{
      v.ofs=Array.isArray(v.ofs)?v.ofs:[];
      if(v.isSAV) return;
      v.ofs.forEach(o=>{
        const total=positiveIntV10(o.quantity??o.qty,1);
        const done=doneQtyV10(o,total);
        o.quantity=total;
        o.completedQty=done;
        if(done>=total) o.status='Fait';
        else if(o.status==='Fait') o.status='À faire';
        if(!o.status) o.status='À faire';
      });
      const hasEvent=state.progressEventsV6.some(e=>e&&e.vehicleId===v.id);
      const hasProgress=v.ofs.some(o=>doneQtyV10(o,positiveIntV10(o.quantity,1))>0);
      if(!hasEvent&&hasProgress){
        state.progressEventsV6.push({
          id:(typeof uid==='function'?uid():'v10-'+Date.now()+'-'+Math.random().toString(36).slice(2)),
          vehicleId:v.id,vin:v.vin||'',ofId:'',ofName:'État repris à la migration V10',description:'',category:'Global',person:'',qtyDelta:0,qtyAfter:0,qtyTotal:0,kind:'baseline',
          note:'Le détail des réalisations antérieures à la V10 n’était pas enregistré sous forme de courbe. Ce point reprend l’avancement existant au moment de la migration.',
          at:new Date().toISOString(),progress:phaseSnapshotV10(v)
        });
      }
    });
    state.schemaVersion=10;
    state.migratedAtV10=state.migratedAtV10||new Date().toISOString();
    try{
      if(typeof LS!=='undefined') localStorage.setItem(LS,JSON.stringify(state));
      localStorage.setItem('suivi_of_simple_parts_catalog_v8',JSON.stringify(state.partsCatalogV8));
    }catch(e){console.warn('Migration V10 : sauvegarde locale impossible',e);}
  }
  window.migrateStateV10=migrateStateV10;

  // Garantit que les données reçues plus tard depuis Firebase sont elles aussi migrées.
  if(typeof normalizeAll==='function'){
    const normalizeAllBeforeV10=normalizeAll;
    normalizeAll=function(){normalizeAllBeforeV10();migrateStateV10();};
  }
  migrateStateV10();
  if(typeof render==='function') render();
})();
</script>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
(function(){
  const FIREBASE_SAVE_DELAY = 650;
  const FIREBASE_DOC_COLLECTION = 'suivi_of';
  const FIREBASE_DOC_ID = 'donnees_principales';
  let fbReady=false, db=null, auth=null, currentUser=null, applyingRemote=false, saveTimer=null, unsubSnapshot=null;
  let lastRemoteJSON='';

  const css=document.createElement('style');
  css.textContent=`
    .fbTopbar{position:sticky;top:0;z-index:8;margin:-20px -20px 16px -20px;padding:10px 20px;background:#081830;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .fbStatus{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#cfe2ff;font-weight:800;font-size:13px}
    .fbDot{width:10px;height:10px;border-radius:50%;background:#f59e0b;display:inline-block}.fbDot.ok{background:#22c55e}.fbDot.bad{background:#ef4444}
    .fbLogin{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at top,#122743,#071426 60%);display:flex;align-items:center;justify-content:center;padding:20px}
    .fbLogin.hidden{display:none}.fbBox{width:min(420px,94vw);background:#0d1f38;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.45)}
    .fbBox img{max-width:210px;display:block;margin:0 auto 18px}.fbBox h2{margin:0 0 8px;text-align:center}.fbBox p{text-align:center;margin-bottom:18px}.fbBox label{margin:10px 0}.fbBox input{width:100%}.fbError{color:#fecaca;background:#7f1d1d;border-radius:12px;padding:10px;margin-top:12px;display:none;font-weight:800}.fbHelp{font-size:12px;color:#9cb2d1;margin-top:12px;line-height:1.45}
  `;
  document.head.appendChild(css);

  function emailFromLogin(login){
    const v=(login||'').trim();
    if(v.includes('@')) return v;
    return v.toLowerCase()+'@suivi-of.local';
  }
  function getBasesPayload(){
    try{ return (typeof BASES_LS!=='undefined') ? JSON.parse(localStorage.getItem(BASES_LS)||'{}') : {}; }
    catch(e){ return {}; }
  }
  function setBasesPayload(bases){
    try{
      if(bases && typeof BASES_LS!=='undefined'){
        localStorage.setItem(BASES_LS, JSON.stringify(bases));
        if(typeof loadPersistedBases==='function') loadPersistedBases();
      }
    }catch(e){ console.warn('Bases Excel non restaurées',e); }
  }
  function payloadFromCurrent(){
    return {
      app:'ELITT Suivi OF Web Firebase',
      version:10,
      updatedAt:new Date().toISOString(),
      state:state,
      basesExcel:getBasesPayload()
    };
  }
  function setStatus(text,kind){
    const el=document.getElementById('fbStatusText');
    const dot=document.getElementById('fbDot');
    if(el) el.textContent=text;
    if(dot){dot.className='fbDot '+(kind||'');}
  }
  function queueFirebaseSave(){
    if(!fbReady || !currentUser || applyingRemote || !db) return;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(pushFirebaseNow,FIREBASE_SAVE_DELAY);
  }
  async function pushFirebaseNow(){
    if(!fbReady || !currentUser || !db) return;
    try{
      const payload=payloadFromCurrent();
      const json=JSON.stringify(payload);
      if(json===lastRemoteJSON) return;
      setStatus('Sauvegarde...', '');
      await db.collection(FIREBASE_DOC_COLLECTION).doc(FIREBASE_DOC_ID).set(payload,{merge:true});
      lastRemoteJSON=json;
      setStatus('Sauvegardé Firebase', 'ok');
    }catch(e){
      console.error(e);
      setStatus('Erreur sauvegarde Firebase', 'bad');
      alert('Erreur sauvegarde Firebase : '+e.message);
    }
  }

  function buildLogin(){
    const overlay=document.createElement('div');
    overlay.id='fbLogin';
    overlay.className='fbLogin';
    overlay.innerHTML=`
      <div class="fbBox">
        <img src="logo_elitt.png" alt="Logo">
        <h2>Connexion Suivi OF</h2>
        <p>Connecte-toi pour charger les camions depuis Firebase.</p>
        <label>Identifiant<input id="fbLoginId" autocomplete="username" value="admin"></label>
        <label>Mot de passe<input id="fbLoginPass" type="password" autocomplete="current-password" placeholder="Mot de passe Firebase"></label>
        <button id="fbLoginBtn" style="width:100%;margin-top:10px">Se connecter</button>
        <div id="fbError" class="fbError"></div>
        <div class="fbHelp">L'identifiant <b>admin</b> correspond au compte Firebase <b>admin@suivi-of.local</b>. Le mot de passe se règle dans Firebase Authentication.</div>
      </div>`;
    document.body.appendChild(overlay);
    const pass=overlay.querySelector('#fbLoginPass');
    overlay.querySelector('#fbLoginBtn').onclick=doLogin;
    pass.addEventListener('keydown',e=>{if(e.key==='Enter') doLogin();});
    setTimeout(()=>pass.focus(),150);
  }
  function showError(msg){
    const el=document.getElementById('fbError');
    if(el){el.textContent=msg;el.style.display='block';}
  }
  async function doLogin(){
    try{
      const id=document.getElementById('fbLoginId').value;
      const pass=document.getElementById('fbLoginPass').value;
      showError(''); document.getElementById('fbError').style.display='none';
      await auth.signInWithEmailAndPassword(emailFromLogin(id), pass);
    }catch(e){
      console.error(e);
      showError('Connexion impossible : '+e.message);
    }
  }
  function buildTopbar(){
    const main=document.querySelector('main'); if(!main || document.getElementById('fbTopbar')) return;
    const div=document.createElement('div');
    div.id='fbTopbar'; div.className='fbTopbar';
    div.innerHTML=`
      <div class="fbStatus"><span id="fbDot" class="fbDot"></span><span id="fbStatusText">Connexion Firebase...</span></div>
      <div class="toolbar"><button class="small alt" id="fbForceSave">Forcer sauvegarde</button><button class="small bad" id="fbLogout">Déconnexion</button></div>`;
    main.prepend(div);
    document.getElementById('fbForceSave').onclick=pushFirebaseNow;
    document.getElementById('fbLogout').onclick=()=>auth.signOut();
  }

  function applyRemotePayload(data){
    if(!data || !data.state || !Array.isArray(data.state.vehicles)) return;
    applyingRemote=true;
    try{
      state=data.state;
      if(typeof normalizeAll==='function') normalizeAll();
      setBasesPayload(data.basesExcel || {});
      if(typeof migrateStateV10==='function') migrateStateV10();
      localStorage.setItem(LS,JSON.stringify(state));
      // Garde l'empreinte de la donnée réellement reçue. Ainsi « Forcer sauvegarde »
      // peut pousser explicitement la migration V10 vers Firebase sans boucle automatique.
      lastRemoteJSON=JSON.stringify(data);
      render();
      setStatus('Données chargées Firebase', 'ok');
    }finally{ applyingRemote=false; }
  }
  async function startSnapshot(){
    if(unsubSnapshot) unsubSnapshot();
    const ref=db.collection(FIREBASE_DOC_COLLECTION).doc(FIREBASE_DOC_ID);
    unsubSnapshot=ref.onSnapshot(async snap=>{
      if(snap.exists){
        applyRemotePayload(snap.data());
      }else{
        setStatus('Aucune donnée Firebase : restauration ou création possible', '');
      }
    }, err=>{
      console.error(err);
      setStatus('Erreur lecture Firebase', 'bad');
      alert('Erreur lecture Firebase : '+err.message);
    });
  }

  // Remplace la sauvegarde locale par sauvegarde locale + Firebase.
  if(typeof save==='function'){
    const localSave=save;
    save=function(){
      if(applyingRemote){ localStorage.setItem(LS,JSON.stringify(state)); render(); return; }
      localStorage.setItem(LS,JSON.stringify(state));
      queueFirebaseSave();
      render();
    };
  }
  if(typeof savePersistedBases==='function'){
    const oldSaveBases=savePersistedBases;
    savePersistedBases=function(){ oldSaveBases(); queueFirebaseSave(); };
  }
  // Après une restauration JSON, envoyer automatiquement les données restaurées vers Firebase.
  if(typeof restoreAllV37==='function'){
    const oldRestore=restoreAllV37;
    restoreAllV37=function(){ oldRestore(); setTimeout(()=>{queueFirebaseSave(); pushFirebaseNow();},1000); };
    importData=restoreAllV37;
  }

  function initFirebase(){
    buildLogin();
    buildTopbar();
    if(!window.SUIVI_OF_FIREBASE_CONFIG || !window.SUIVI_OF_FIREBASE_CONFIG.apiKey || window.SUIVI_OF_FIREBASE_CONFIG.apiKey.includes('REMPLACER')){
      setStatus('Configuration Firebase manquante', 'bad');
      showError('Il faut remplir le fichier firebase-config.js avec la configuration de ton projet Firebase.');
      return;
    }
    try{
      firebase.initializeApp(window.SUIVI_OF_FIREBASE_CONFIG);
      auth=firebase.auth(); db=firebase.firestore(); fbReady=true;
      auth.onAuthStateChanged(user=>{
        currentUser=user;
        const login=document.getElementById('fbLogin');
        if(user){
          login.classList.add('hidden');
          setStatus('Connecté : '+(user.email||'admin'), 'ok');
          startSnapshot();
        }else{
          if(unsubSnapshot) unsubSnapshot();
          login.classList.remove('hidden');
          setStatus('Déconnecté', '');
        }
      });
    }catch(e){
      console.error(e);
      setStatus('Firebase non initialisé', 'bad');
      showError('Firebase non initialisé : '+e.message);
    }
  }
  window.addEventListener('load', initFirebase);
})();
</script>
