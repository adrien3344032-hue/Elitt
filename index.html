<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/*
  ============================================================================
  ELITT - SUIVI OF - V11.4 SANS MAIL - OF BLOQUES GROUPES + CONGES
  ============================================================================
  Base fonctionnelle : V11 nettoyée.
  Objectif : une seule version active de chaque fonctionnalité, sans les anciens
  écrans Recherche / Tous les OF / Véhicules, sans l'ancien statut rapide V34/V35
  et sans pièces de démonstration.

  Chaque fonction importante possède un commentaire en français qui explique
  précisément son rôle.
  ============================================================================
*/

// Clé principale utilisée pour conserver l'état du logiciel dans le navigateur.
const LS = 'suivi_of_simple_d14_v2';

// Clé dédiée à la conservation des bases OF importées depuis les fichiers Excel.
const BASES_LS = 'suivi_of_simple_bases_excel_persistantes_v1';

// Clé dédiée au catalogue des pièces lu dans les feuilles PIECES_OF.
const PARTS_LS = 'suivi_of_simple_parts_catalog_v8';

// Version du schéma de données actuellement utilisée par l'application.
window.ELITT_V10_SCHEMA = 10;

// Liste des pages réellement utilisées dans le menu de gauche.
const pages = [
  ['dash', 'Tableau de bord'],
  ['real', 'Réalisation'],
  ['blocked', 'OF bloqués'],
  ['history', 'Historique'],
  ['people', 'Personnes'],
  ['archives', 'Archives']
];

// Page actuellement affichée.
let page = 'dash';

// Charge l'état local existant ou crée une structure vide compatible avec le site.
let state = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem(LS) || 'null');
    if (saved && typeof saved === 'object') return saved;
  } catch (e) {
    console.warn('État local illisible, démarrage avec un état vide.', e);
  }
  return {
    vehicles: [],
    people: ['Adrien', 'Dim', 'Julien', 'David'],
    history: [],
    customTemplates: { Renault: [], Mercedes: [], MAN: [] },
    partsCatalogV8: { Renault: [], Mercedes: [], MAN: [], Autre: [] },
    progressEventsV6: [],
    schemaVersion: 10
  };
})();

// Échappe du texte avant de l'insérer dans du HTML afin d'éviter de casser l'affichage.
function escHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Génère un identifiant unique pour un véhicule, un OF, un congé ou un événement.
function uid() {
  return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// Formate un nombre d'heures pour l'affichage français.
function fmt(value) {
  return (Math.round((Number(value) || 0) * 100) / 100).toString().replace('.', ',') + ' h';
}

// Retourne le nom d'une personne, que l'ancienne donnée soit une chaîne ou le nouvel objet personne.
function personName(person) {
  return typeof person === 'string' ? person : (person?.name || '');
}

// Retourne la quantité totale prévue pour un OF ; les anciens OF sans quantité valent automatiquement 1.
function qtyTotalV5(of) {
  const n = Math.floor(Number(of?.quantity ?? of?.qty ?? 1));
  return Number.isFinite(n) && n > 0 ? n : 1;
}

// Retourne la quantité déjà réalisée pour un OF tout en restant comprise entre 0 et la quantité totale.
function qtyDoneV5(of) {
  const total = qtyTotalV5(of);
  if (of && of.completedQty !== undefined && of.completedQty !== null && of.completedQty !== '') {
    const n = Math.floor(Number(of.completedQty) || 0);
    return Math.max(0, Math.min(total, n));
  }
  return of?.status === 'Fait' ? total : 0;
}

// Retourne le nombre de réalisations encore à faire sur un OF.
function qtyRemainingV5(of) {
  return Math.max(0, qtyTotalV5(of) - qtyDoneV5(of));
}

// Met un OF ancien au format quantité actuel sans perdre son statut ni son avancement.
function normalizeQtyOFV5(of) {
  if (!of) return;
  of.quantity = qtyTotalV5(of);
  of.completedQty = qtyDoneV5(of);
  if (!of.status) of.status = 'À faire';
  if (of.completedQty >= of.quantity) of.status = 'Fait';
  else if (of.status === 'Fait') of.status = 'À faire';
  of.doneBy = of.doneBy || '';
  of.doneAt = of.doneAt || '';
  of.blockReason = of.blockReason || '';
}

// Met tous les OF et toutes les bases Excel au format quantité actuel.
function normalizeQtyAllV5() {
  (state.vehicles || []).forEach(vehicle => (vehicle.ofs || []).forEach(normalizeQtyOFV5));
  ['Renault', 'Mercedes', 'MAN'].forEach(brand => {
    (state.customTemplates?.[brand] || []).forEach(of => {
      const n = Math.floor(Number(of?.quantity ?? of?.qty ?? 1));
      of.quantity = Number.isFinite(n) && n > 0 ? n : 1;
    });
  });
}

// Retourne le nombre de lignes OF entièrement terminées sur un véhicule.
function doneOf(vehicle) {
  if (isSAV(vehicle)) return vehicle.savDone ? 1 : 0;
  return (vehicle.ofs || []).filter(of => qtyRemainingV5(of) === 0).length;
}

// Calcule le pourcentage global d'avancement en tenant compte des quantités de chaque OF.
function pct(vehicle) {
  if (isSAV(vehicle)) {
    if (vehicle.savDone) return 100;
    const planned = Number(vehicle.savEstimated) || 0;
    const actual = Number(vehicle.savActual) || 0;
    return planned ? Math.min(100, Math.round(actual / planned * 100)) : 0;
  }
  const total = (vehicle.ofs || []).reduce((sum, of) => sum + qtyTotalV5(of), 0);
  const done = (vehicle.ofs || []).reduce((sum, of) => sum + qtyDoneV5(of), 0);
  return total ? Math.round(done / total * 100) : 0;
}

// Calcule le temps restant d'un véhicule en multipliant le temps unitaire par la quantité restante.
function remain(vehicle) {
  if (isSAV(vehicle)) {
    if (vehicle.savDone) return 0;
    return Math.max((Number(vehicle.savEstimated) || 0) - (Number(vehicle.savActual) || 0), 0);
  }
  return (vehicle.ofs || []).reduce((sum, of) => sum + (Number(of.time) || 0) * qtyRemainingV5(of), 0);
}

// Retourne le nombre total de réalisations prévues sur un véhicule.
function totalUnitsV5(vehicle) {
  return (vehicle.ofs || []).reduce((sum, of) => sum + qtyTotalV5(of), 0);
}

// Retourne le nombre total de réalisations déjà faites sur un véhicule.
function doneUnitsV5(vehicle) {
  return (vehicle.ofs || []).reduce((sum, of) => sum + qtyDoneV5(of), 0);
}

// Indique si une fiche véhicule correspond à un SAV et non à un camion avec OF.
function isSAV(vehicle) {
  return !!(vehicle && vehicle.isSAV);
}

// Retourne les véhicules actifs, c'est-à-dire non archivés.
function activeVehicles() {
  return (state.vehicles || []).filter(vehicle => !vehicle.archived);
}

// Retourne les véhicules archivés.
function archivedVehicles() {
  return (state.vehicles || []).filter(vehicle => !!vehicle.archived);
}

// Retourne les véhicules actifs qui possèdent des OF et exclut les SAV.
function activeNormalVehicles() {
  return activeVehicles().filter(vehicle => !isSAV(vehicle));
}

// Retourne la couleur visuelle d'un véhicule ou la couleur bleue par défaut.
function vehicleColor(vehicle) {
  return vehicle?.color || '#3b82f6';
}

// Génère le petit rond de couleur affiché devant le VIN.
function colorDot(vehicle) {
  return `<span class="vehiclecolor" style="background:${escHtml(vehicleColor(vehicle))}"></span>`;
}

// Transforme le nom interne d'une option en libellé plus lisible.
function optionLabel(option) {
  return String(option || '')
    .replace('OPTION ', '')
    .replace('CANON ELC', 'Canon ELC')
    .replace('TRITON', 'Triton');
}

// Génère les pastilles d'options affichées dans le tableau de bord.
function vehicleOptionsHtml(vehicle) {
  let options = Array.isArray(vehicle.selectedOptions) ? vehicle.selectedOptions.slice() : [];
  if (!options.length && Array.isArray(vehicle.ofs)) {
    options = [...new Set(vehicle.ofs.map(of => of.option).filter(Boolean))];
  }
  if (!options.length) return '<span class="optionchip none">Aucune</span>';
  return options.map(option => `<span class="optionchip">${escHtml(optionLabel(option))}</span>`).join('');
}

// Retourne la base OF actuellement chargée pour une marque.
function templateForBrand(brand) {
  const rows = state.customTemplates?.[brand];
  return Array.isArray(rows) ? rows : [];
}

// Retourne toutes les options présentes dans la base Excel d'une marque.
function optionsForBrand(brand) {
  return [...new Set(templateForBrand(brand).map(of => of.option).filter(Boolean))];
}

// Construit les OF automatiques d'un nouveau véhicule à partir de sa base et de ses options.
function buildOFsForVehicle(brand, includeBase, selectedOptions) {
  const selected = new Set(selectedOptions || []);
  return templateForBrand(brand)
    .filter(of => {
      if (of.removeIfOption && selected.has(of.removeIfOption)) return false;
      if (of.option) return selected.has(of.option);
      return includeBase;
    })
    .map(of => ({
      ...of,
      id: uid(),
      quantity: qtyTotalV5(of),
      completedQty: 0,
      status: 'À faire',
      doneBy: '',
      doneAt: '',
      blockReason: '',
      manual: false
    }));
}

// Sauvegarde les bases OF actuellement chargées dans un espace local séparé.
function savePersistedBases() {
  try {
    localStorage.setItem(BASES_LS, JSON.stringify({
      Renault: state.customTemplates?.Renault || [],
      Mercedes: state.customTemplates?.Mercedes || [],
      MAN: state.customTemplates?.MAN || []
    }));
  } catch (e) {
    console.warn('Impossible de sauvegarder les bases OF locales.', e);
  }
}

// Recharge les bases OF conservées localement sans écraser une base déjà présente dans l'état courant.
function loadPersistedBases() {
  try {
    const saved = JSON.parse(localStorage.getItem(BASES_LS) || '{}');
    state.customTemplates = state.customTemplates || { Renault: [], Mercedes: [], MAN: [] };
    ['Renault', 'Mercedes', 'MAN'].forEach(brand => {
      if (Array.isArray(saved[brand]) && saved[brand].length) state.customTemplates[brand] = saved[brand];
      if (!Array.isArray(state.customTemplates[brand])) state.customTemplates[brand] = [];
    });
  } catch (e) {
    console.warn('Impossible de recharger les bases OF locales.', e);
  }
}

// Sauvegarde le catalogue de pièces dans le navigateur.
function savePartsCatalog() {
  try {
    localStorage.setItem(PARTS_LS, JSON.stringify(state.partsCatalogV8 || {}));
  } catch (e) {
    console.warn('Impossible de sauvegarder le catalogue de pièces.', e);
  }
}

// Recharge le catalogue de pièces réel ; aucune pièce de démonstration n'est injectée.
function loadPartsCatalog() {
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem(PARTS_LS) || 'null');
  } catch (e) {
    console.warn('Catalogue de pièces local illisible.', e);
  }
  const currentCatalog = state.partsCatalogV8;
  const currentHasParts = currentCatalog && Object.values(currentCatalog).some(list => Array.isArray(list) && list.length);
  state.partsCatalogV8 = currentHasParts ? currentCatalog : (saved || currentCatalog || {});
  ['Renault', 'Mercedes', 'MAN', 'Autre'].forEach(brand => {
    if (!Array.isArray(state.partsCatalogV8[brand])) state.partsCatalogV8[brand] = [];
  });
  savePartsCatalog();
}

// Crée l'horaire standard d'une personne selon un contrat 39 h ou 35 h.
function defaultSchedule(mode = '39h') {
  const schedule = {};
  ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'].forEach((day, index) => {
    schedule[day] = {
      work: true,
      amStart: '07:30',
      amEnd: '12:30',
      pmStart: '13:30',
      pmEnd: mode === '35h' ? '15:30' : (index === 4 ? '15:30' : '16:30')
    };
  });
  return schedule;
}

// Convertit les anciennes personnes simples en objets complets avec horaires et congés.
function normalizePeople() {
  state.people = (state.people || []).map((person, index) => {
    if (typeof person === 'string') {
      return { id: uid(), name: person, mode: '39h', schedule: defaultSchedule('39h'), vacations: [] };
    }
    person.id = person.id || uid();
    person.name = person.name || ('Personne ' + (index + 1));
    person.mode = person.mode || '39h';
    person.schedule = person.schedule || defaultSchedule(person.mode);
    person.vacations = Array.isArray(person.vacations) ? person.vacations : [];
    return person;
  });
  if (!state.realPerson && state.people[0]) state.realPerson = personName(state.people[0]);
}

// Normalise l'ensemble de l'état après un chargement local, une restauration ou une réception Firebase.
function normalizeAll() {
  state.vehicles = Array.isArray(state.vehicles) ? state.vehicles : [];
  state.history = Array.isArray(state.history) ? state.history : [];
  state.customTemplates = state.customTemplates || { Renault: [], Mercedes: [], MAN: [] };
  state.partsCatalogV8 = state.partsCatalogV8 || { Renault: [], Mercedes: [], MAN: [], Autre: [] };
  state.progressEventsV6 = Array.isArray(state.progressEventsV6) ? state.progressEventsV6 : [];

// Convertit une heure HH:MM en nombre de minutes depuis minuit.
function timeToMin(time) {
  const [hours, minutes] = String(time || '00:00').split(':').map(Number);
  return (hours || 0) * 60 + (minutes || 0);
}

// Crée une date à partir d'un jour et d'un nombre de minutes depuis minuit.
function minToDate(date, minutes) {
  const result = new Date(date);
  result.setHours(Math.floor(minutes / 60), minutes % 60, 0, 0);
  return result;
}

// Calcule le nombre d'heures hebdomadaires correspondant aux créneaux enregistrés d'une personne.
function hoursDaySchedule(person) {
  const schedule = person.schedule || defaultSchedule(person.mode);
  let totalMinutes = 0;
  Object.values(schedule).forEach(day => {
    if (day.work !== false) {
      totalMinutes += Math.max(0, timeToMin(day.amEnd) - timeToMin(day.amStart));
      totalMinutes += Math.max(0, timeToMin(day.pmEnd) - timeToMin(day.pmStart));
    }
  });
  return totalMinutes / 60;
}

// Calcule la date de Pâques pour une année afin d'en déduire les jours fériés mobiles.
function easterDate(year) {
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, month - 1, day);
}

// Ajoute un nombre de jours à une date sans modifier la date d'origine.
function addDays(date, days) {
  const result = new Date(date);
  result.setDate(result.getDate() + days);
  return result;
}

// Transforme une date en chaîne YYYY-MM-DD utilisée pour les comparaisons de jours.
function ymd(date) {
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
}

// Retourne l'ensemble des principaux jours fériés français utilisés par l'estimation de planning.
function frenchHolidays(year) {
  const easter = easterDate(year);
  return new Set([
    `${year}-01-01`, `${year}-05-01`, `${year}-05-08`, `${year}-07-14`, `${year}-08-15`,
    `${year}-11-01`, `${year}-11-11`, `${year}-12-25`,
    ymd(addDays(easter, 1)), ymd(addDays(easter, 39)), ymd(addDays(easter, 50))
  ]);
}

// Indique si une date correspond à un jour férié français pris en compte par le planning.
function isHoliday(date) {
  return frenchHolidays(date.getFullYear()).has(ymd(date));
}

// Retourne ou initialise la liste des périodes de congé d'une personne.
function personVacations(person) {
  person.vacations = Array.isArray(person.vacations) ? person.vacations : [];
  return person.vacations;
}

// Indique si une personne est en congé à une date donnée.
function isPersonOnVacation(person, date) {
  const day = ymd(date);
  return personVacations(person).some(vacation => day >= vacation.start && day <= vacation.end);
}

// Retourne les créneaux de travail disponibles pour une personne sur une journée précise.
function intervalsForDay(person, date) {
  if (isPersonOnVacation(person, date)) return [];
  const names = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
  const dayName = names[date.getDay()];
  const schedule = (person.schedule || defaultSchedule(person.mode))[dayName];
  if (!schedule || schedule.work === false || date.getDay() === 0 || date.getDay() === 6 || isHoliday(date)) return [];
  return [
    [timeToMin(schedule.amStart), timeToMin(schedule.amEnd)],
    [timeToMin(schedule.pmStart), timeToMin(schedule.pmEnd)]
  ].filter(([start, end]) => end > start);
}

// Cherche le prochain instant où une personne est disponible pour travailler.
function nextWorkStart(person, from) {
  let date = new Date(from);
  date.setSeconds(0, 0);
  for (let guard = 0; guard < 800; guard++) {
    const intervals = intervalsForDay(person, date);
    const now = date.getHours() * 60 + date.getMinutes();
    for (const [start, end] of intervals) {
      if (now <= start) return minToDate(date, start);
      if (now >= start && now < end) return date;
    }
    date.setDate(date.getDate() + 1);
    date.setHours(0, 0, 0, 0);
  }
  return null;
}

// Ajoute un nombre d'heures de travail réelles à une date en sautant pauses, week-ends, fériés et congés.
function addWorkHours(person, start, hours) {
  let remainingMinutes = Math.max(0, Number(hours) || 0) * 60;
  let date = nextWorkStart(person, start);
  if (!date) return null;
  for (let guard = 0; guard < 2000 && remainingMinutes > 0; guard++) {
    const intervals = intervalsForDay(person, date);
    const now = date.getHours() * 60 + date.getMinutes();
    let progressed = false;
    for (const [startMin, endMin] of intervals) {
      const current = Math.max(now, startMin);
      if (current >= endMin) continue;
      const used = Math.min(remainingMinutes, endMin - current);
      remainingMinutes -= used;
      date = minToDate(date, current + used);
      progressed = true;
      if (remainingMinutes <= 0) return date;
    }
    if (!progressed || remainingMinutes > 0) {
      date.setDate(date.getDate() + 1);
      date.setHours(0, 0, 0, 0);
      date = nextWorkStart(person, date);
      if (!date) return null;
    }
  }
  return date;
}

// Formate une date estimée de fin de production.
function fmtDate(date) {
  return date ? date.toLocaleDateString('fr-FR') + ' ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '-';
}

// Estime la date de fin des véhicules actifs en répartissant le travail restant sur les personnes disponibles.
function estimateVehiclesActive() {
  normalizeAll();
  const peopleList = state.people.filter(person => personName(person));
  if (!peopleList.length) return {};
  const now = new Date();
  const slots = peopleList.map(person => ({ person, free: nextWorkStart(person, now) || now }));
  const result = {};
  const vehicles = [...activeVehicles()].sort((a, b) =>
    (Number(a.priority) || 1) - (Number(b.priority) || 1) || String(a.vin || '').localeCompare(String(b.vin || ''))
  );
  for (const vehicle of vehicles) {
    if (isSAV(vehicle)) continue;
    const ofs = (vehicle.ofs || []).filter(of => qtyRemainingV5(of) > 0).sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
    let last = null;
    for (const of of ofs) {
      slots.sort((a, b) => a.free - b.free);
      const slot = slots[0];
      const hours = (Number(of.time) || 0) * qtyRemainingV5(of);
      slot.free = addWorkHours(slot.person, slot.free, hours) || slot.free;
      last = slot.free;
    }
    result[vehicle.id] = last;
  }
  return result;
}

// Calcule l'avancement d'une phase précise en unités réalisées et non simplement en nombre de lignes OF.
function phaseStatsV5(vehicle, category) {
  const list = (vehicle.ofs || []).filter(of => (of.category || '') === category);
  const total = list.reduce((sum, of) => sum + qtyTotalV5(of), 0);
  const done = list.reduce((sum, of) => sum + qtyDoneV5(of), 0);
  return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
}

// Génère l'affichage compact des barres Fabrication, Prémontage et Pose du tableau de bord.
function phaseProgressHtmlV5(vehicle) {
  if (isSAV(vehicle)) {

      '<div class="muted">' + fmt(vehicle.savActual || 0) + ' / ' + fmt(vehicle.savEstimated || 0) + '</div>';
  }
  let html = '';
  ['Fabrication', 'Prémontage', 'Pose'].forEach(category => {
    const stats = phaseStatsV5(vehicle, category);
    html += '<div style="margin-bottom:6px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:3px">' +
      '<span><b>' + escHtml(category) + '</b> ' + stats.pct + '%</span>' +
      '<span class="muted">' + stats.done + '/' + stats.total + ' réalisations</span>' +
      '</div>' +
      '<div class="progress" style="height:7px;min-width:190px">' +
      '<div class="bar" style="width:' + stats.pct + '%"></div>' +
      '</div></div>';
  });
  return '<div style="min-width:190px">' + html + '</div>';
}

function automaticOFKey(of) {

}

// Génère les cases à cocher des options disponibles pour une marque.

// Met à jour la zone Base + Options lorsqu'on change de marque dans la fiche véhicule.
function toggleBaseChoice() {

// Retourne les options actuellement cochées dans la fiche véhicule.
function selectedOptionValues() {
  return Array.from(document.querySelectorAll('.optCheck:checked')).map(input => input.value);
}

// Compare deux listes d'options sans tenir compte de leur ordre.
function sameOptions(a, b) {
  const first = [...(a || [])].sort();
  const second = [...(b || [])].sort();
  return JSON.stringify(first) === JSON.stringify(second);
}

// Reconstruit uniquement les OF automatiques d'un camion après changement de base ou d'option tout en conservant les OF manuels.
function syncVehicleOFs(vehicle, includeBase, options) {
  const desired = buildOFsForVehicle(vehicle.brand, includeBase, options);
  const old = vehicle.ofs || [];
  const oldByKey = new Map(old.filter(of => !of.manual).map(of => [automaticOFKey(of), of]));
  const merged = desired.map(newOF => {
    const previous = oldByKey.get(automaticOFKey(newOF));
    if (!previous) return newOF;
    return {
      ...newOF,
      id: previous.id || newOF.id,
      completedQty: Math.min(qtyDoneV5(previous), qtyTotalV5(newOF)),
      status: previous.status || 'À faire',
      doneBy: previous.doneBy || '',
      doneAt: previous.doneAt || '',
      blockReason: previous.blockReason || '',
      blockDetailsV8: previous.blockDetailsV8 || undefined,
      manual: false
    };
  });
  old.filter(of => of.manual === true).forEach(of => merged.push(of));
  vehicle.ofs = merged.sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
  vehicle.ofs.forEach(normalizeQtyOFV5);
}

// Enregistre un véhicule et génère ou synchronise ses OF automatiques si nécessaire.
function saveVehicle(id) {
  const isNew = !id;
  let vehicle = id ? state.vehicles.find(item => item.id === id) : null;
  if (!vehicle) {
    vehicle = { id: uid(), ofs: [] };
    state.vehicles.push(vehicle);
  }
  const oldBrand = vehicle.brand;
  const oldBase = vehicle.selectedBase !== false;
  const oldOptions = Array.isArray(vehicle.selectedOptions) ? vehicle.selectedOptions.slice() : [];
  Object.assign(vehicle, {
    vin: document.getElementById('vin').value.trim(),
    brand: document.getElementById('brand').value,
    client: document.getElementById('client').value,
    type: document.getElementById('type').value,
    priority: Number(document.getElementById('prio').value) || 1,
    color: document.getElementById('color').value
  });
  const hasTemplate = templateForBrand(vehicle.brand).length > 0;
  if (hasTemplate) {
    const includeBase = !!document.getElementById('createBase')?.checked;
    const options = selectedOptionValues();
    const changed = isNew || oldBrand !== vehicle.brand || oldBase !== includeBase || !sameOptions(oldOptions, options);
    vehicle.selectedBase = includeBase;
    vehicle.selectedOptions = options;
    if (isNew) {
      vehicle.ofs = buildOFsForVehicle(vehicle.brand, includeBase, options);
    } else if (changed) {
      const update = confirm('Tu as modifié la marque / base / options.\n\nMettre à jour automatiquement la liste des OF du camion ?\n\nOK = ajoute/supprime les OF automatiques selon les options, en gardant les statuts des OF identiques et les OF manuels.\nAnnuler = garde la liste OF actuelle.');
      if (update) syncVehicleOFs(vehicle, includeBase, options);
    }
  } else {
    vehicle.selectedBase = false;
    vehicle.selectedOptions = [];
  }
  logAction(isNew ? 'Véhicule créé' : 'Véhicule modifié', vehicle, null, '');
  state.realVin = vehicle.id;
  closeModal();
  save();
}

// Supprime définitivement un véhicule ou un SAV après confirmation.
function delVehicle(id) {
  const vehicle = state.vehicles.find(item => item.id === id);

  logAction(isSAV(vehicle) ? 'SAV supprimé' : 'Véhicule supprimé', vehicle, null, '');
  state.vehicles = state.vehicles.filter(item => item.id !== id);
  if (state.detailVin === id) state.detailVin = '';
  if (state.realVin === id) state.realVin = '';
  save();
}

// Réordonne proprement les OF d'un véhicule de 1 à N.
function normalizeOrders(vehicle) {
  vehicle.ofs.sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
  vehicle.ofs.forEach((of, index) => { of.order = index + 1; });
}

// Insère ou déplace un OF à un numéro d'ordre précis en décalant les suivants.
function insertOrMoveOF(vehicle, of, targetOrder, isNew) {
  let order = Math.max(1, Number(targetOrder) || 1);
  if (!isNew) vehicle.ofs = vehicle.ofs.filter(item => item.id !== of.id);
  if (order > vehicle.ofs.length + 1) order = vehicle.ofs.length + 1;
  vehicle.ofs.forEach(item => {
    if ((Number(item.order) || 0) >= order) item.order = (Number(item.order) || 0) + 1;
  });
  of.order = order;
  vehicle.ofs.push(of);
  normalizeOrders(vehicle);
}

// Ouvre la fenêtre permettant d'ajouter ou modifier un OF avec son temps et sa quantité.
function openOF(vehicleId, ofId) {
  let vehicle = vehicleId ? state.vehicles.find(item => item.id === vehicleId) : activeNormalVehicles()[0];
  if (!vehicle) { alert('Crée d’abord un véhicule.'); return; }

  };

  openModal(ofId ? 'Modifier OF' : 'Ajouter OF', `<div class="form">

    <label>Priorité<input type="number" id="op" value="${of.priority || 1}"></label>
    <label>Catégorie<select id="oc"><option>Fabrication</option><option>Prémontage</option><option>Pose</option><option>Essais</option><option>Autre</option></select></label>
    <label class="full">Description<textarea id="od">${escHtml(of.desc || '')}</textarea></label>
    <div class="full card" style="margin:0;padding:12px"><b>Quantité</b><div class="muted" style="margin-top:6px">Quantité 6 = cet OF doit être réalisé 6 fois sur le camion. Le temps restant utilise Temps X1 × quantité restante.</div></div>
    <div class="full actions"><button onclick="saveOF('${ofId || ''}')">Enregistrer</button><button class="alt" onclick="closeModal()">Annuler</button></div>
  </div>`);
  setTimeout(() => {
    document.getElementById('ov').value = vehicle.id;
    document.getElementById('oc').value = of.category || 'Fabrication';
  }, 0);
}

// Enregistre un OF et marque automatiquement les nouveaux OF créés à la main comme manuels.
function saveOF(ofId) {
  const destination = state.vehicles.find(item => item.id === document.getElementById('ov').value);
  if (!destination) return;
  const oldVehicle = state.vehicles.find(vehicle => (vehicle.ofs || []).some(of => of.id === ofId));
  let of = ofId ? oldVehicle?.ofs.find(item => item.id === ofId) : null;
  const isNew = !of;
  if (!of) {
    of = { id: uid(), status: 'À faire', doneBy: '', doneAt: '', blockReason: '', completedQty: 0, manual: true };
  }
  Object.assign(of, {
    name: document.getElementById('on').value.trim(),
    desc: document.getElementById('od').value.trim(),
    time: Number(document.getElementById('ot').value) || 0,
    quantity: Math.max(1, Math.floor(Number(document.getElementById('oqty').value) || 1)),
    category: document.getElementById('oc').value,
    priority: Number(document.getElementById('op').value) || 1
  });
  of.completedQty = Math.min(qtyDoneV5(of), qtyTotalV5(of));
  of.status = of.completedQty >= qtyTotalV5(of) ? 'Fait' : (of.status === 'Bloqué' ? 'Bloqué' : 'À faire');
  if (isNew) of.manual = true;
  const movedVehicle = !isNew && oldVehicle && oldVehicle.id !== destination.id;
  if (movedVehicle) {
    oldVehicle.ofs = oldVehicle.ofs.filter(item => item.id !== ofId);
    normalizeOrders(oldVehicle);
  }
  insertOrMoveOF(destination, of, Number(document.getElementById('oo').value) || 1, isNew || movedVehicle);
  logAction(isNew ? 'OF ajouté' : 'OF modifié', destination, of, `Quantité ${qtyTotalV5(of)} • ordre ${of.order}`);
  closeModal();
  save();
}

// Supprime un OF précis d'un véhicule et renumérote les OF restants.
function delOF(vehicleId, ofId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  const of = vehicle?.ofs.find(item => item.id === ofId);
  if (!vehicle || !of || !confirm('Supprimer cet OF ?')) return;
  logAction('OF supprimé', vehicle, of, '');
  vehicle.ofs = vehicle.ofs.filter(item => item.id !== ofId);
  normalizeOrders(vehicle);
  save();
}

// Retourne un instantané des pourcentages utiles à la courbe d'avancement d'un véhicule.
function progressSnapshot(vehicle) {
  return {
    global: pct(vehicle),
    Fabrication: phaseStatsV5(vehicle, 'Fabrication').pct,
    Prémontage: phaseStatsV5(vehicle, 'Prémontage').pct,
    Pose: phaseStatsV5(vehicle, 'Pose').pct
  };
}

// Retourne la liste globale des événements d'avancement et l'initialise si nécessaire.
function progressEvents() {
  state.progressEventsV6 = Array.isArray(state.progressEventsV6) ? state.progressEventsV6 : [];
  return state.progressEventsV6;
}

// Retourne les événements d'avancement d'un véhicule triés du plus ancien au plus récent.
function vehicleProgressEvents(vehicleId) {
  return progressEvents().filter(event => event.vehicleId === vehicleId).sort((a, b) => new Date(a.at) - new Date(b.at));
}

// Ajoute un point de départ à la courbe lorsqu'un véhicule reçoit son premier événement suivi.
function ensureProgressStart(vehicle, beforeSnapshot, at) {
  if (vehicleProgressEvents(vehicle.id).length) return;
  const date = new Date(at || Date.now());
  date.setMilliseconds(Math.max(0, date.getMilliseconds() - 1));
  progressEvents().push({
    id: uid(), vehicleId: vehicle.id, vin: vehicle.vin || '', ofId: '', ofName: 'Début du suivi',
    description: '', category: 'Global', person: '', qtyDelta: 0, qtyAfter: 0, qtyTotal: 0,
    kind: 'start', note: 'Point de départ du suivi graphique', at: date.toISOString(),
    progress: beforeSnapshot || progressSnapshot(vehicle)
  });
}

// Enregistre une réalisation, une correction, un blocage ou un déblocage dans la courbe d'avancement.
function recordProgressEvent(vehicle, of, delta, person, kind = 'realisation', note = '', beforeSnapshot = null, at = null) {
  if (!vehicle || isSAV(vehicle)) return;
  const when = at || new Date().toISOString();
  ensureProgressStart(vehicle, beforeSnapshot || progressSnapshot(vehicle), when);
  progressEvents().push({
    id: uid(), vehicleId: vehicle.id, vin: vehicle.vin || '', ofId: of?.id || '', ofName: of?.name || '',
    description: of?.desc || '', category: of?.category || 'Global', person: person || '',
    qtyDelta: Number(delta) || 0, qtyAfter: of ? qtyDoneV5(of) : 0, qtyTotal: of ? qtyTotalV5(of) : 0,
    kind, note, at: when, progress: progressSnapshot(vehicle)
  });
  // Évite que l'historique graphique grossisse indéfiniment : on garde jusqu'à 10 000 événements globaux.
  if (state.progressEventsV6.length > 10000) state.progressEventsV6 = state.progressEventsV6.slice(-10000);
}

// Expose l'enregistrement d'événement pour les fonctions de blocage et les éventuelles évolutions futures.
window.recordProgressEventV6 = recordProgressEvent;

// Crée un point de reprise pour les véhicules anciens qui avaient déjà de l'avancement avant le suivi graphique.
function ensureProgressBaselines() {
  (state.vehicles || []).filter(vehicle => !isSAV(vehicle)).forEach(vehicle => {
    if (vehicleProgressEvents(vehicle.id).length) return;
    const hasProgress = (vehicle.ofs || []).some(of => qtyDoneV5(of) > 0);
    if (!hasProgress) return;
    progressEvents().push({
      id: uid(), vehicleId: vehicle.id, vin: vehicle.vin || '', ofId: '', ofName: 'État repris à la migration',
      description: '', category: 'Global', person: '', qtyDelta: 0, qtyAfter: 0, qtyTotal: 0,
      kind: 'baseline', note: 'Le détail antérieur n’était pas enregistré. Ce point reprend l’avancement existant.',
      at: new Date().toISOString(), progress: progressSnapshot(vehicle)
    });
  });
}

// Ajoute une quantité réalisée à un OF, met son statut à jour et enregistre l'événement dans la courbe.
function addQtyDoneV5(vehicleId, ofId, amount = 1, personOverride = '') {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  const of = vehicle?.ofs.find(item => item.id === ofId);
  if (!vehicle || !of) return 0;
  normalizeQtyOFV5(of);
  const person = personOverride || state.realPerson || of.doneBy || '';
  if (!person) { alert('Choisis une personne avant de valider.'); return qtyDoneV5(of); }
  const beforeSnapshot = progressSnapshot(vehicle);
  const before = qtyDoneV5(of);
  const after = Math.min(qtyTotalV5(of), before + Math.max(1, Math.floor(Number(amount) || 1)));
  const added = after - before;
  if (!added) return after;
  of.completedQty = after;
  of.status = after >= qtyTotalV5(of) ? 'Fait' : 'À faire';
  of.doneBy = person;
  of.doneAt = new Date().toISOString();
  of.blockReason = '';
  delete of.blockDetailsV8;
  state.realPerson = person;
  logAction('Quantité OF réalisée', vehicle, of, `+${added} • ${after}/${qtyTotalV5(of)} • ${person}`);
  recordProgressEvent(vehicle, of, added, person, 'realisation', `+${added} réalisation${added > 1 ? 's' : ''}`, beforeSnapshot);
  save();
  return after;
}

// Termine d'un coup toute la quantité restante d'un OF après confirmation.
function finishQtyV5(vehicleId, ofId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  const of = vehicle?.ofs.find(item => item.id === ofId);
  if (!vehicle || !of) return;
  const remaining = qtyRemainingV5(of);
  if (remaining <= 0) return;
  if (!confirm(`Marquer les ${remaining} réalisation${remaining > 1 ? 's' : ''} restante${remaining > 1 ? 's' : ''} comme faites ?`)) return;
  addQtyDoneV5(vehicleId, ofId, remaining);
}

// Retire une réalisation d'un OF pour corriger une validation faite en trop.
function removeQtyDoneV5(vehicleId, ofId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  const of = vehicle?.ofs.find(item => item.id === ofId);
  if (!vehicle || !of) return;
  normalizeQtyOFV5(of);
  const before = qtyDoneV5(of);
  if (before <= 0) return;
  const beforeSnapshot = progressSnapshot(vehicle);
  const person = of.doneBy || state.realPerson || '';
  of.completedQty = Math.max(0, before - 1);
  of.status = of.completedQty >= qtyTotalV5(of) ? 'Fait' : 'À faire';
  of.blockReason = '';
  delete of.blockDetailsV8;
  if (of.completedQty === 0) {
    of.doneBy = '';
    of.doneAt = '';
  }
  logAction('Quantité OF corrigée', vehicle, of, `-1 • ${of.completedQty}/${qtyTotalV5(of)}`);
  recordProgressEvent(vehicle, of, -1, person, 'correction', 'Correction de quantité', beforeSnapshot);
  save();
}

// Génère la pastille de statut d'un OF avec son éventuelle raison de blocage.
function statusHtmlV5(of) {
  const total = qtyTotalV5(of), done = qtyDoneV5(of);
  if (of.status === 'Bloqué') return `<span class="pill blocked">Bloqué</span>${of.blockReason ? `<div class="blockedtxt">${escHtml(of.blockReason)}</div>` : ''}`;
  if (done >= total) return `<span class="pill" style="background:#064e3b;color:#bbf7d0">✓ Fait ${done}/${total}</span>`;
  if (done > 0) return `<span class="pill" style="background:#78350f;color:#fde68a">En cours ${done}/${total}</span>`;
  return '<span class="pill">À faire</span>';
}

// Génère la petite barre d'avancement quantité utilisée dans les tableaux OF.
function qtyVisualV5(of) {
  const total = qtyTotalV5(of), done = qtyDoneV5(of);
  const percent = total ? Math.round(done / total * 100) : 0;
  return `<div class="progress"><div class="bar" style="width:${percent}%"></div></div><div class="muted"><strong>${done}/${total}</strong> réalisé${total > 1 ? 's' : ''} • ${total - done} restant${total - done > 1 ? 's' : ''}</div>`;
}

// Génère le tableau des OF d'un seul VIN dans le mode Réalisation > Par VIN.
function realVinTableV5(vehicle, list) {
  return `<div class="tablewrap"><table><thead><tr><th>Ordre</th><th>OF</th><th>Description</th><th>Temps X1</th><th>Quantité</th><th>Réalisé</th><th>Statut</th><th>Actions</th></tr></thead><tbody>${list.map(of => {
    const total = qtyTotalV5(of), done = qtyDoneV5(of);
    return `<tr class="${of.status === 'Bloqué' ? 'blockedrow' : ''}">
      <td><b>${of.order || '-'}</b></td><td><b>${escHtml(of.name)}</b><div class="muted">${escHtml(of.category || '')}</div></td>
      <td class="desc">${escHtml(of.desc || '')}</td><td><b>${fmt(of.time)}</b></td><td><span class="pill">× ${total}</span></td>
      <td>${qtyVisualV5(of)}</td><td>${statusHtmlV5(of)}</td>
      <td class="actions"><button class="small good" onclick="addQtyDoneV5('${vehicle.id}','${of.id}',1)">${total > 1 ? 'Fait +1' : 'Fait'}</button>${total > 1 && done < total ? `<button class="small alt" onclick="finishQtyV5('${vehicle.id}','${of.id}')">Tout fait</button>` : ''}<button class="small bad" onclick="blockOF('${vehicle.id}','${of.id}',true)">Blocage</button><button class="small alt" onclick="openOF('${vehicle.id}','${of.id}')">Modifier</button></td>
    </tr>`;
  }).join('')}</tbody></table></div>`;
}

// Construit la clé commune permettant de regrouper un même OF présent sur plusieurs VIN.
function ofKeyV5(of) {
  return [String(of.name || '').trim(), String(of.category || '').trim(), String(of.desc || '').trim()].join('|||');
}

// Retrouve sur un véhicule l'OF correspondant à une clé de regroupement Par OF.
function ofForVehicleV5(vehicle, key) {
  return (vehicle.ofs || []).find(of => ofKeyV5(of) === key);
}

// Regroupe les mêmes OF de tous les véhicules actifs afin de construire le mode Réalisation > Par OF.
function groupedOFsV5() {
  const phaseOrder = { Fabrication: 1, Prémontage: 2, Pose: 3, Essais: 4, Autre: 5 };
  const map = new Map();
  activeNormalVehicles().forEach(vehicle => {
    const seen = new Set();
    (vehicle.ofs || []).forEach(of => {
      const key = ofKeyV5(of);
      if (!of.name || seen.has(key)) return;
      seen.add(key);
      if (!map.has(key)) {
        map.set(key, {
          key, name: of.name, desc: of.desc || '', category: of.category || 'Autre', time: Number(of.time) || 0,
          order: Number(of.order) || 99999, vehicles: 0, totalUnits: 0, doneUnits: 0, finishedVehicles: 0, blockedVehicles: 0
        });
      }
      const group = map.get(key);
      const total = qtyTotalV5(of), done = qtyDoneV5(of);
      group.vehicles++;
      group.totalUnits += total;
      group.doneUnits += done;
      if (done >= total) group.finishedVehicles++;
      if (of.status === 'Bloqué') group.blockedVehicles++;
      group.order = Math.min(group.order, Number(of.order) || 99999);
    });
  });
  return Array.from(map.values()).sort((a, b) =>
    (phaseOrder[a.category] || 99) - (phaseOrder[b.category] || 99) || a.order - b.order || String(a.name).localeCompare(String(b.name), 'fr', { numeric: true, sensitivity: 'base' })
  );
}

// Applique la recherche, le filtre de phase et le filtre de statut au mode Par OF.
function filteredGroupsV5() {
  let groups = groupedOFsV5();
  const query = (document.getElementById('ofSearchV5')?.value || state.ofSearchV5 || '').trim().toLowerCase();
  const category = document.getElementById('ofPhaseV5')?.value || state.ofPhaseV5 || 'Tous';
  const status = document.getElementById('ofStatusV5')?.value || state.ofStatusV5 || 'À valider';
  if (category !== 'Tous') groups = groups.filter(group => group.category === category);
  if (status === 'À valider') groups = groups.filter(group => group.doneUnits < group.totalUnits);
  if (status === 'Terminés') groups = groups.filter(group => group.doneUnits >= group.totalUnits && group.totalUnits > 0);
  if (query) groups = groups.filter(group => [group.name, group.desc, group.category].join(' ').toLowerCase().includes(query));
  return groups;
}

// Génère la liste du mode Par OF avec les boutons de validation multiple et de blocage multiple.
function ofListV5(groups) {
  if (!groups.length) return '<div class="card">Aucun OF ne correspond à ce filtre.</div>';
  return `<div class="tablewrap"><table><thead><tr><th>Ordre</th><th>OF</th><th>Description</th><th>Temps X1</th><th>Qté totale</th><th>Avancement</th><th>VIN terminés</th><th>Bloqués</th><th>Actions</th></tr></thead><tbody>${groups.map(group => {
    const percent = group.totalUnits ? Math.round(group.doneUnits / group.totalUnits * 100) : 0;
    const complete = group.doneUnits === group.totalUnits && group.totalUnits > 0;
    const encoded = encodeURIComponent(group.key);
    return `<tr class="${complete ? 'ofRowCompleteV4' : ''}">
      <td><b>${group.order === 99999 ? '-' : group.order}</b></td>
      <td><b>${escHtml(group.name)}</b><div class="muted">${escHtml(group.category)}</div></td>
      <td class="desc">${escHtml(group.desc || '')}</td><td><b>${fmt(group.time)}</b></td>
      <td><span class="pill">× ${group.totalUnits}</span><div class="muted">${group.vehicles} VIN</div></td>
      <td><div class="progress"><div class="bar" style="width:${percent}%"></div></div><div class="muted"><b>${group.doneUnits}/${group.totalUnits}</b> réalisés • ${group.totalUnits - group.doneUnits} restants</div></td>
      <td><b>${group.finishedVehicles}/${group.vehicles}</b></td>
      <td>${group.blockedVehicles ? `<span class="dangertext">${group.blockedVehicles}</span>` : '<span class="muted">0</span>'}</td>
      <td class="actions"><button class="small ${complete ? 'alt' : 'good'}" ${complete ? 'disabled' : ''} onclick="openBulkOFV5('${encoded}')">${complete ? '✓ Terminé' : 'Valider plusieurs VIN'}</button><button class="small bad" ${complete ? 'disabled' : ''} onclick="openBulkBlockV7('${encoded}')">⛔ Bloquer plusieurs VIN</button></td>
    </tr>`;
  }).join('')}</tbody></table></div>`;
}

// Rafraîchit uniquement la liste Par OF lorsqu'un filtre ou une recherche change.
function renderOFListV5() {
  const search = document.getElementById('ofSearchV5');
  const phase = document.getElementById('ofPhaseV5');
  const status = document.getElementById('ofStatusV5');
  if (search) state.ofSearchV5 = search.value;
  if (phase) state.ofPhaseV5 = phase.value;
  if (status) state.ofStatusV5 = status.value;
  try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
  const box = document.getElementById('ofListV5');
  if (box) box.innerHTML = ofListV5(filteredGroupsV5());
}

// Change entre les modes Réalisation Par VIN et Par OF.
function setRealModeV5(mode) {
  state.realModeV3 = mode === 'of' ? 'of' : 'vin';
  try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
  real();
}

// Construit le contenu du mode Réalisation Par VIN.
function renderByVinV5(active) {
  if (!active.some(vehicle => vehicle.id === state.realVin)) state.realVin = active[0].id;
  if (!state.realPerson && state.people[0]) state.realPerson = personName(state.people[0]);
  state.realFilter = state.realFilter || 'Tous';
  const vehicleOptions = active.map(vehicle => `<option value="${vehicle.id}" ${state.realVin === vehicle.id ? 'selected' : ''}>${escHtml(vehicle.vin)} • ${escHtml(vehicle.brand || '')}</option>`).join('');
  const personOptions = state.people.map(person => `<option ${state.realPerson === personName(person) ? 'selected' : ''}>${escHtml(personName(person))}</option>`).join('');
  const filters = ['Tous', 'Fabrication', 'Prémontage', 'Pose', 'Essais', 'Autre', 'Bloqué'];
  const filterOptions = filters.map(filter => `<option ${state.realFilter === filter ? 'selected' : ''}>${escHtml(filter)}</option>`).join('');
  const vehicle = active.find(item => item.id === state.realVin);
  let list = vehicle ? (vehicle.ofs || []).filter(of => qtyRemainingV5(of) > 0 || of.status === 'Bloqué') : [];
  if (state.realFilter === 'Bloqué') list = list.filter(of => of.status === 'Bloqué');
  else if (state.realFilter !== 'Tous') list = list.filter(of => (of.category || '') === state.realFilter);
  list.sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
  return `<div class="card"><div class="toolbar filterbar">
    <label>VIN <select id="realVin" onchange="state.realVin=this.value;save()">${vehicleOptions}</select></label>
    <label>Personne <select id="realPerson" onchange="state.realPerson=this.value;save()">${personOptions}</select></label>
    <label>Filtre <select id="realFilter" onchange="state.realFilter=this.value;save()">${filterOptions}</select></label>
  </div></div><br>${realVinTableV5(vehicle, list)}`;
}

// Construit les filtres et le conteneur du mode Réalisation Par OF.
function renderByOFV5() {
  state.ofPhaseV5 = state.ofPhaseV5 || 'Tous';
  state.ofStatusV5 = state.ofStatusV5 || 'À valider';
  const categories = ['Tous', 'Fabrication', 'Prémontage', 'Pose', 'Essais', 'Autre'];
  return `<div class="card"><div class="toolbar filterbar">
    <input id="ofSearchV5" value="${escHtml(state.ofSearchV5 || '')}" placeholder="Rechercher un OF..." oninput="renderOFListV5()">
    <label>Phase <select id="ofPhaseV5" onchange="renderOFListV5()">${categories.map(category => `<option ${state.ofPhaseV5 === category ? 'selected' : ''}>${escHtml(category)}</option>`).join('')}</select></label>
    <label>Afficher <select id="ofStatusV5" onchange="renderOFListV5()"><option ${state.ofStatusV5 === 'À valider' ? 'selected' : ''}>À valider</option><option ${state.ofStatusV5 === 'Tous' ? 'selected' : ''}>Tous</option><option ${state.ofStatusV5 === 'Terminés' ? 'selected' : ''}>Terminés</option></select></label>
  </div></div><br><div id="ofListV5"></div>`;
}

// Affiche la page Réalisation dans le mode sélectionné par l'utilisateur.
function real() {
  normalizeAll();
  setHead('Réalisation');
  const active = activeNormalVehicles();
  if (!active.length) {
    document.getElementById('view').innerHTML = '<div class="card">Aucun véhicule actif avec OF à réaliser.</div>';
    return;
  }
  state.realModeV3 = state.realModeV3 || 'of';
  const tabs = `<div class="realModeTabs" style="display:flex;gap:10px;margin-bottom:14px"><button class="${state.realModeV3 === 'vin' ? 'active' : ''}" onclick="setRealModeV5('vin')">Par VIN</button><button class="${state.realModeV3 === 'of' ? 'active' : ''}" onclick="setRealModeV5('of')">Par OF</button></div>`;
  document.getElementById('view').innerHTML = tabs + (state.realModeV3 === 'of' ? renderByOFV5() : renderByVinV5(active));
  if (state.realModeV3 === 'of') renderOFListV5();
}

// Retourne le groupe Par OF actuellement ouvert dans la fenêtre de validation multiple.
function currentBulkGroupV5() {
  return groupedOFsV5().find(group => group.key === window._bulkV5Key);
}

// Retourne tous les VIN qui contiennent l'OF sélectionné pour la validation multiple.
function rowsBulkV5(key) {
  return activeNormalVehicles().map(vehicle => ({ vehicle, of: ofForVehicleV5(vehicle, key) })).filter(item => item.of);
}

// Génère un bouton VIN dans la fenêtre de validation multiple avec son avancement quantité.
function vinButtonV5(vehicle, of) {
  normalizeQtyOFV5(of);
  const total = qtyTotalV5(of), done = qtyDoneV5(of), remaining = total - done;
  const complete = remaining === 0, blocked = of.status === 'Bloqué', selected = window._bulkV5Selected?.has(vehicle.id);
  const percent = total ? Math.round(done / total * 100) : 0;
  const info = complete ? `✓ Terminé ${done}/${total}` : blocked ? `Bloqué • ${done}/${total} • ${of.blockReason || ''}` : `${done}/${total} faits • ${remaining} restant${remaining > 1 ? 's' : ''}`;
  return `<button type="button" class="vinChoiceV3 ${complete ? 'done' : ''} ${blocked ? 'blocked' : ''} ${selected ? 'selected' : ''}" ${complete ? 'disabled' : ''} onclick="toggleBulkVinV5('${vehicle.id}')"><b>${complete ? '✓ ' : selected ? '✓ ' : ''}${escHtml(vehicle.vin)}</b><small style="margin-left:8px">${escHtml(info)}</small><div class="progress" style="height:4px;margin-top:5px"><div class="bar" style="width:${percent}%"></div></div></button>`;
}

// Rafraîchit la grille des VIN et le compteur dans la fenêtre de validation multiple.
function refreshBulkV5() {
  const group = currentBulkGroupV5();
  if (!group) return;
  const rows = rowsBulkV5(group.key);
  const box = document.getElementById('vinChoiceGridV5');
  if (box) box.innerHTML = rows.map(item => vinButtonV5(item.vehicle, item.of)).join('');
  const count = window._bulkV5Selected?.size || 0;
  const amount = Math.max(1, Math.floor(Number(document.getElementById('bulkQtyAmountV5')?.value) || 1));
  const countElement = document.getElementById('bulkCountV5');
  const button = document.getElementById('bulkValidateV5');
  if (countElement) countElement.textContent = count + ' VIN sélectionné' + (count > 1 ? 's' : '');
  if (button) button.textContent = `✅ Valider +${amount} sur ${count} VIN${count > 1 ? 's' : ''}`;
}

// Sélectionne ou désélectionne un VIN dans la fenêtre de validation multiple.
function toggleBulkVinV5(id) {
  window._bulkV5Selected = window._bulkV5Selected || new Set();
  if (window._bulkV5Selected.has(id)) window._bulkV5Selected.delete(id);
  else window._bulkV5Selected.add(id);
  refreshBulkV5();
}

// Applique une sélection rapide à la fenêtre de validation multiple : tous, à faire uniquement ou aucun.
function bulkSelectModeV5(mode) {
  const group = currentBulkGroupV5();
  if (!group) return;
  const selected = new Set();
  if (mode !== 'none') {
    rowsBulkV5(group.key).forEach(({ vehicle, of }) => {
      if (qtyRemainingV5(of) <= 0) return;
      if (mode === 'todo' && of.status === 'Bloqué') return;
      selected.add(vehicle.id);
    });
  }
  window._bulkV5Selected = selected;
  refreshBulkV5();
}

// Ouvre la fenêtre permettant de valider une même quantité d'un OF sur plusieurs VIN.
function openBulkOFV5(encodedKey) {
  let key;
  try { key = decodeURIComponent(encodedKey); } catch (e) { key = encodedKey; }
  window._bulkV5Key = key;
  window._bulkV5Selected = new Set();
  const group = currentBulkGroupV5();
  if (!group) return;
  if (!state.realPerson && state.people[0]) state.realPerson = personName(state.people[0]);
  const peopleOptions = (state.people || []).map(person => `<option value="${escHtml(personName(person))}" ${state.realPerson === personName(person) ? 'selected' : ''}>${escHtml(personName(person))}</option>`).join('');
  openModal('Validation sur plusieurs VIN', `<div class="bulkSummaryV3"><h3>${escHtml(group.name)}</h3><div class="muted">${escHtml(group.desc || '')} • ${escHtml(group.category)} • ${fmt(group.time)} par réalisation</div><div class="muted" style="margin-top:6px"><b>${group.doneUnits}/${group.totalUnits} réalisations faites</b> • ${group.totalUnits - group.doneUnits} restantes • ${group.finishedVehicles}/${group.vehicles} VIN terminés</div></div>
    <div class="bulkToolsV3" style="display:flex;flex-wrap:wrap;gap:10px"><button class="small alt" onclick="bulkSelectModeV5('all')">Tout sélectionner</button><button class="small alt" onclick="bulkSelectModeV5('todo')">Sélectionner les À faire</button><button class="small alt" onclick="bulkSelectModeV5('none')">Tout enlever</button></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px"><label>Personne<select id="bulkPersonV5">${peopleOptions}</select></label><label>Quantité faite par VIN<input type="number" id="bulkQtyAmountV5" min="1" step="1" value="1" oninput="refreshBulkV5()"></label></div>
    <div id="vinChoiceGridV5" class="vinChoiceGridV3" style="display:flex;flex-wrap:wrap;gap:10px;margin:12px 0"></div>
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px"><span id="bulkCountV5" class="count">0 VIN sélectionné</span><button class="alt" style="margin-left:15px" onclick="closeModal()">Annuler</button><button id="bulkValidateV5" class="good" style="margin-left:10px" onclick="validateBulkV5()">✅ Valider +1 sur 0 VIN</button></div>`);
  refreshBulkV5();
}

// Valide réellement la quantité choisie sur tous les VIN sélectionnés et crée les événements d'avancement correspondants.
function validateBulkV5() {
  const group = currentBulkGroupV5();
  const ids = Array.from(window._bulkV5Selected || []);
  const person = document.getElementById('bulkPersonV5')?.value || state.realPerson || '';
  const amount = Math.max(1, Math.floor(Number(document.getElementById('bulkQtyAmountV5')?.value) || 1));
  if (!group) return;
  if (!ids.length) { alert('Sélectionne au moins un VIN.'); return; }
  if (!person) { alert('Choisis une personne.'); return; }
  if (!confirm(`Ajouter jusqu'à ${amount} réalisation${amount > 1 ? 's' : ''} de ${group.name} sur ${ids.length} VIN pour ${person} ?`)) return;
  let units = 0, vehicles = 0;
  ids.forEach(id => {
    const vehicle = state.vehicles.find(item => item.id === id);
    const of = vehicle ? ofForVehicleV5(vehicle, group.key) : null;
    if (!vehicle || !of || qtyRemainingV5(of) <= 0) return;
    const beforeSnapshot = progressSnapshot(vehicle);
    const before = qtyDoneV5(of);
    const after = Math.min(qtyTotalV5(of), before + amount);
    const added = after - before;
    if (!added) return;
    of.completedQty = after;
    of.doneBy = person;
    of.doneAt = new Date().toISOString();
    of.blockReason = '';
    delete of.blockDetailsV8;
    of.status = after >= qtyTotalV5(of) ? 'Fait' : 'À faire';
    units += added;
    vehicles++;
    logAction('OF fait (multi-VIN quantité)', vehicle, of, `+${added} • ${after}/${qtyTotalV5(of)} • ${person}`);
    recordProgressEvent(vehicle, of, added, person, 'realisation', 'Validation multi-VIN', beforeSnapshot);
  });
  state.realPerson = person;
  logAction('Validation multi-VIN quantité terminée', null, null, `${group.name} • ${units} réalisation(s) • ${vehicles} VIN • ${person}`);
  closeModal();
  state.realModeV3 = 'of';
  save();
}

// Génère le tableau complet des OF visible lorsqu'on ouvre un VIN.
function detailTableV5(vehicle) {
  const rows = (vehicle.ofs || []).slice().sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
  return `<div class="tablewrap"><table><thead><tr><th>Ordre</th><th>OF</th><th>Description</th><th>Temps X1</th><th>Quantité</th><th>Réalisé</th><th>Statut</th><th>Fait par</th><th>Actions</th></tr></thead><tbody>${rows.map(of => {
    const total = qtyTotalV5(of), done = qtyDoneV5(of);
    return `<tr class="${of.status === 'Bloqué' ? 'blockedrow' : ''}"><td><b>${of.order || '-'}</b></td><td><b>${escHtml(of.name)}</b><div class="muted">${escHtml(of.category || '')}</div></td><td class="desc">${escHtml(of.desc || '')}</td><td><b>${fmt(of.time)}</b></td><td><span class="pill">× ${total}</span></td><td>${qtyVisualV5(of)}</td><td>${statusHtmlV5(of)}</td><td>${escHtml(of.doneBy || '-')}</td><td class="actions">${vehicle.archived ? '' : `<button class="small good" onclick="addQtyDoneV5('${vehicle.id}','${of.id}',1)">${total > 1 ? 'Fait +1' : 'Fait'}</button>${done > 0 ? `<button class="small warn" onclick="removeQtyDoneV5('${vehicle.id}','${of.id}')">-1</button>` : ''}<button class="small bad" onclick="blockOF('${vehicle.id}','${of.id}',false)">Blocage</button><button class="small alt" onclick="openOF('${vehicle.id}','${of.id}')">Modifier</button><button class="small bad" onclick="delOF('${vehicle.id}','${of.id}')">Suppr.</button>`}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}

// Affiche la fiche détaillée d'un camion ou d'un SAV et donne accès à la courbe d'avancement pour les camions.
function vehicleDetail() {
  normalizeAll();
  const vehicle = state.vehicles.find(item => item.id === state.detailVin) || activeVehicles()[0] || archivedVehicles()[0];
  if (!vehicle) {

    document.getElementById('view').innerHTML = `<div class="toolbar">${back}${actions}</div><br><div class="grid cards"><div class="card vehicleBanner" style="--vehColor:${vehicleColor(vehicle)}"><b>Référence</b><div class="kpi">${colorDot(vehicle)}${escHtml(vehicle.vin)}</div><div class="muted">${escHtml(vehicle.client || '')}</div></div><div class="card"><b>Temps prévu</b><div class="kpi">${fmt(vehicle.savEstimated || 0)}</div></div><div class="card"><b>Temps réel</b><div class="kpi">${fmt(vehicle.savActual || 0)}</div></div><div class="card"><b>Statut</b><div class="kpi">${vehicle.archived ? 'Archivé' : (vehicle.savDone ? 'Terminé' : 'En cours')}</div></div></div><br><div class="card"><b>Commentaire / travail réalisé</b><br><br><div class="savcomment">${escHtml(vehicle.savComment || 'Aucun commentaire.')}</div></div>`;

  }
  setHead('Véhicule ' + vehicle.vin);

  const actions = vehicle.archived ? `<button class="good" onclick="restoreVehicle('${vehicle.id}')">Restaurer</button>` : `<button onclick="openOF('${vehicle.id}')">+ Ajouter OF</button><button class="warn" onclick="archiveVehicle('${vehicle.id}')">Archiver</button>`;
  const timeline = `<button class="alt" onclick="openVehicleTimelineV6('${vehicle.id}')">📈 Avancement dans le temps</button>`;

}

// Retourne le libellé français correspondant au type d'événement d'avancement.
function progressKindLabel(event) {
  if (event.kind === 'blocage') return 'Bloqué';
  if (event.kind === 'deblocage') return 'Débloqué';
  if (event.kind === 'correction') return 'Correction';
  if (event.kind === 'baseline') return 'Reprise historique';
  if (event.kind === 'start') return 'Début';
  return 'Réalisation';
}

// Formate la date et l'heure d'un événement d'avancement.
function fmtProgressDate(value) {
  const date = new Date(value);
  return date.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// Retourne le pourcentage d'un événement pour le mode de courbe choisi.
function progressMetric(event, mode) {
  return mode === 'Global' ? Number(event.progress?.global) || 0 : Number(event.progress?.[mode]) || 0;
}

// Génère un graphique SVG simple de l'évolution du pourcentage dans le temps.
function timelineChartSvg(vehicle, mode) {
  const events = vehicleProgressEvents(vehicle.id);
  if (!events.length) return '<div class="card">Pas encore d’événement d’avancement pour ce véhicule.</div>';
  const width = 900, height = 260, left = 46, right = 18, top = 18, bottom = 42;
  const plotW = width - left - right, plotH = height - top - bottom;
  const points = events.map((event, index) => {
    const x = events.length === 1 ? left + plotW / 2 : left + (index / (events.length - 1)) * plotW;
    const y = top + plotH - progressMetric(event, mode) / 100 * plotH;
    return { x, y, event };
  });
  const polyline = points.map(point => `${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(' ');
  const grid = [0, 25, 50, 75, 100].map(value => {
    const y = top + plotH - value / 100 * plotH;
    return `<line x1="${left}" y1="${y}" x2="${left + plotW}" y2="${y}" stroke="#284262" stroke-width="1"/><text x="8" y="${y + 4}" fill="#9cb2d1" font-size="11">${value}%</text>`;
  }).join('');
  const dots = points.map(point => `<circle cx="${point.x}" cy="${point.y}" r="4" fill="#38bdf8"><title>${escHtml(fmtProgressDate(point.event.at))} • ${progressMetric(point.event, mode)}%</title></circle>`).join('');
  return `<div style="overflow:auto"><svg viewBox="0 0 ${width} ${height}" style="min-width:760px;width:100%;background:#081830;border:1px solid var(--line);border-radius:14px">${grid}<polyline points="${polyline}" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg></div>`;
}

// Résume le nombre de réalisations enregistrées par personne sur un véhicule.
function timelinePeopleSummary(vehicle) {
  const counts = new Map();
  vehicleProgressEvents(vehicle.id).forEach(event => {
    if (!event.person || event.qtyDelta <= 0) return;
    counts.set(event.person, (counts.get(event.person) || 0) + event.qtyDelta);
  });
  if (!counts.size) return '<span class="muted">Aucune réalisation détaillée enregistrée.</span>';
  return Array.from(counts.entries()).sort((a, b) => b[1] - a[1]).map(([person, quantity]) => `<span class="pill" style="margin:3px">${escHtml(person)} • ${quantity} réalisation${quantity > 1 ? 's' : ''}</span>`).join('');
}

// Génère le tableau détaillé de tous les événements d'avancement d'un véhicule.
function timelineHistoryTable(vehicle) {
  const events = vehicleProgressEvents(vehicle.id).slice().reverse();
  if (!events.length) return '<div class="muted">Aucun événement.</div>';
  return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>OF</th><th>Personne</th><th>Variation</th><th>Après</th><th>Détail</th></tr></thead><tbody>${events.map(event => `<tr><td>${escHtml(fmtProgressDate(event.at))}</td><td>${escHtml(progressKindLabel(event))}</td><td><b>${escHtml(event.ofName || '-')}</b><div class="muted">${escHtml(event.category || '')}</div></td><td>${escHtml(event.person || '-')}</td><td><b>${event.qtyDelta > 0 ? '+' : ''}${event.qtyDelta || 0}</b></td><td>${event.qtyTotal ? `${event.qtyAfter}/${event.qtyTotal}` : '-'}</td><td class="desc">${escHtml(event.note || '')}</td></tr>`).join('')}</tbody></table></div>`;
}

// Affiche tout le contenu de la fenêtre d'historique graphique pour le véhicule sélectionné.
function renderTimelineBodyV6(vehicle) {
  const mode = window._timelineModeV6 || 'Global';
  const events = vehicleProgressEvents(vehicle.id);
  const first = events[0], last = events[events.length - 1];
  const body = document.getElementById('timelineBodyV6');
  if (!body) return;
  body.innerHTML = `<div class="toolbar" style="margin-bottom:12px">${['Global', 'Fabrication', 'Prémontage', 'Pose'].map(item => `<button class="small ${mode === item ? '' : 'alt'}" onclick="setTimelineModeV6('${item}')">${escHtml(item)}</button>`).join('')}</div><div class="card"><b>${escHtml(mode)} : ${mode === 'Global' ? pct(vehicle) : phaseStatsV5(vehicle, mode).pct}%</b><div class="muted" style="margin-top:6px">${first ? `Première activité : ${escHtml(fmtProgressDate(first.at))}` : 'Pas encore commencé'}${last && last !== first ? ` • Dernière activité : ${escHtml(fmtProgressDate(last.at))}` : ''}</div><br>${timelineChartSvg(vehicle, mode)}</div><br><div class="card"><b>Qui a réalisé quoi</b><div style="margin-top:8px">${timelinePeopleSummary(vehicle)}</div></div><br><div class="card"><b>Historique détaillé</b><div class="muted" style="margin:5px 0 9px">Les réalisations, corrections, blocages et déblocages sont conservés à partir du suivi détaillé.</div>${timelineHistoryTable(vehicle)}</div>`;
}

// Change la phase affichée dans la courbe d'avancement.
function setTimelineModeV6(mode) {
  window._timelineModeV6 = mode;
  const vehicle = state.vehicles.find(item => item.id === window._timelineVehicleV6);
  if (vehicle) renderTimelineBodyV6(vehicle);
}

// Ouvre la fenêtre de courbe et d'historique détaillé d'un véhicule.
function openVehicleTimelineV6(vehicleId) {
  const vehicle = state.vehicles.find(item => item.id === vehicleId);
  if (!vehicle || isSAV(vehicle)) return;
  window._timelineVehicleV6 = vehicleId;
  window._timelineModeV6 = 'Global';
  openModal('📈 Avancement dans le temps — ' + vehicle.vin, '<div id="timelineBodyV6"></div>');
  document.querySelector('#modal .dialog')?.classList.add('timelineDialogV6');
  renderTimelineBodyV6(vehicle);
}

// Nettoie une clé de colonne Excel pour permettre plusieurs variantes d'orthographe et d'accents.
function cleanKey(key) {
  return String(key || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

// Récupère une valeur dans une ligne Excel en acceptant plusieurs noms possibles pour la même colonne.
function val(row, names) {
  const wanted = names.map(cleanKey);
  for (const key of Object.keys(row)) {
    if (wanted.includes(cleanKey(key))) return row[key];
  }
  return '';
}

// Convertit une valeur Excel en nombre en acceptant la virgule française.
function parseNum(value) {
  if (value === undefined || value === null || value === '') return 0;
  return Number(String(value).replace(',', '.').replace(/[^0-9.\-]/g, '')) || 0;
}

// Normalise le nom de phase lu dans un fichier Excel.
function normalizeCat(category) {
  const value = String(category || 'Autre').trim();
  const lower = value.toLowerCase();
  if (!value) return 'Autre';
  if (lower.includes('fabric')) return 'Fabrication';
  if (lower.includes('prem') || lower.includes('pré')) return 'Prémontage';
  if (lower.includes('pose')) return 'Pose';
  if (lower.includes('essai') || lower.includes('debug')) return 'Essais';
  return value;
}

// Attribue automatiquement une priorité d'OF cohérente avec sa phase.
function catPriority(category) {
  const value = String(category || 'Autre').toLowerCase();
  if (value.includes('fabric')) return 1;
  if (value.includes('prem') || value.includes('pré')) return 2;
  if (value.includes('pose')) return 3;
  if (value.includes('essai') || value.includes('debug')) return 4;
  return 5;
}

// Lit la première feuille d'un fichier Excel et la transforme en base OF avec quantité et règles d'options.
async function readExcelFile(file) {
  if (!file) return [];
  if (!window.XLSX) throw new Error('La lecture Excel nécessite SheetJS et une connexion Internet au moment du chargement de la bibliothèque.');
  const data = await file.arrayBuffer();
  const workbook = XLSX.read(data, { type: 'array' });
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
  return rows.map((row, index) => {
    const order = parseNum(val(row, ['Ordre', 'Order']));
    const name = String(val(row, ['Nom', 'N°OF', 'N OF', 'OF', 'N°DESSIN', 'N DESSIN']) || '').trim();
    const desc = String(val(row, ['Description', 'Desc']) || '').trim();
    const time = parseNum(val(row, ['Temps X1', 'Temps', 'Temps unitaire', 'Temps X 1']));
    const quantity = Math.max(1, Math.floor(parseNum(val(row, ['Quantité', 'Quantite', 'Qté', 'Qte', 'Qty'])) || 1));
    const category = normalizeCat(val(row, ['Filtre', 'Catégorie', 'Categorie', 'Phase']));
    const optionRaw = String(val(row, ['Options', 'Option']) || '').trim();
    const rule = String(val(row, ['Règle option', 'Regle option', 'Règle', 'Regle']) || '').trim();
    if (!name && !desc) return null;
    const of = {
      id: name || ('OF-' + (index + 1)), order: order || index + 1, name: name || ('OF-' + (index + 1)),
      desc, time, quantity, category, priority: catPriority(category), option: ''
    };
    if (optionRaw.toUpperCase().startsWith('OPTION')) of.option = optionRaw.toUpperCase();
    if (rule.toUpperCase().includes('SUPPRIMER SI')) {
      const match = rule.toUpperCase().match(/OPTION\s+.+/);
      of.removeIfOption = match ? match[0].trim() : rule.toUpperCase().replace('SUPPRIMER SI', '').trim();
    } else if (optionRaw.toUpperCase().includes('SUPPRIMER SI')) {
      const match = optionRaw.toUpperCase().match(/OPTION\s+.+/);
      of.removeIfOption = match ? match[0].trim() : optionRaw.toUpperCase().replace('SUPPRIMER SI', '').trim();
      of.option = '';
    }
    return of;
  }).filter(Boolean).sort((a, b) => a.order - b.order);
}

// Lit la feuille PIECES_OF d'un fichier Excel et retourne les références de pièces associées à chaque OF.
async function readPartsSheet(file) {
  if (!file || !window.XLSX) return [];
  const data = await file.arrayBuffer();
  const workbook = XLSX.read(data, { type: 'array' });
  const sheetName = workbook.SheetNames.find(name => cleanKey(name) === cleanKey('PIECES_OF'));
  if (!sheetName) return [];
  const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: '' });
  return rows.map(row => {
    const of = String(val(row, ['OF', 'Nom OF', 'N°OF', 'N OF']) || '').trim();
    const ref = String(val(row, ['Référence pièce', 'Reference piece', 'Référence', 'Reference', 'Ref', 'Code pièce', 'Code piece']) || '').trim();
    const name = String(val(row, ['Désignation', 'Designation', 'Pièce', 'Piece', 'Nom pièce', 'Nom piece']) || '').trim();
    const quantity = Math.max(1, Math.floor(parseNum(val(row, ['Quantité par OF', 'Quantite par OF', 'Quantité', 'Quantite', 'Qté', 'Qte', 'Qty'])) || 1));
    const comment = String(val(row, ['Commentaire', 'Comment', 'Note']) || '').trim();
    if (!of || (!ref && !name)) return null;
    return { of, ref, name, quantity, comment };
  }).filter(Boolean);
}

// Importe pour une marque la base OF et son catalogue de pièces depuis un seul fichier Excel.
async function importBrandFile(brand, file) {
  if (!file) return null;
  const ofs = await readExcelFile(file);
  const parts = await readPartsSheet(file);
  if (!ofs.length) throw new Error('Aucun OF trouvé dans ' + file.name);
  state.customTemplates[brand] = ofs;
  state.partsCatalogV8[brand] = parts;
  return { brand, ofs: ofs.length, parts: parts.length };
}

// Retourne les pièces associées à un OF pour une marque donnée.
function partsForOF(brand, ofName) {
  const key = String(ofName || '').trim().toUpperCase();
  return ((state.partsCatalogV8 || {})[brand] || []).filter(part => String(part.of || '').trim().toUpperCase() === key);
}
