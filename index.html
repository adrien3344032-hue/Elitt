<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi OF Simple</title>
<style>
:root{--bg:#071426;--panel:#0e1e35;--panel2:#122743;--text:#eaf2ff;--muted:#9cb2d1;--line:#284262;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--pill:#18375f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;font-weight:800;color:#fff;background:var(--blue);cursor:pointer}button.alt{background:#28415f}button.good{background:var(--green)}button.warn{background:var(--orange);color:#071426}button.bad{background:var(--red)}button.small{padding:8px 10px;font-size:13px}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}aside{background:#081830;border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:170px;height:auto;border-radius:0;background:transparent;display:block;object-fit:contain}.brand{align-items:flex-start}.brandText{display:none}nav button{width:100%;text-align:left;background:transparent;margin:4px 0;color:var(--text)}nav button.active,nav button:hover{background:#1b2f51}main{padding:20px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}h1{margin:0 0 6px;font-size:28px}p{color:var(--muted);margin:0}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,minmax(150px,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,.18)}.kpi{font-size:30px;font-weight:900;margin-top:6px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--panel)}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1000px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#bcd2f2;background:#0b1b33}td.desc{white-space:normal;min-width:280px}.muted{color:var(--muted);font-size:12px}.pill{display:inline-flex;border-radius:999px;padding:6px 10px;background:var(--pill);font-weight:800;font-size:12px;color:#cfe2ff}.progress{height:10px;background:#203654;border-radius:999px;overflow:hidden;min-width:140px}.bar{height:100%;background:linear-gradient(90deg,#38bdf8,#22c55e)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.dialog{background:#0d1f38;border:1px solid var(--line);border-radius:20px;padding:18px;width:min(720px,96vw);max-height:92vh;overflow:auto}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:6px;font-weight:700;color:#dceaff}input,select,textarea{background:#081830;color:#fff;border:1px solid #385579;border-radius:12px;padding:10px}textarea{min-height:90px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;justify-content:flex-start}.actions.wrap{flex-wrap:wrap}td.actions{min-width:290px}.actions button{min-width:74px;text-align:center}.checkrow{display:flex!important;align-items:center;gap:10px;background:#081830;border:1px solid #385579;border-radius:12px;padding:10px}.checkrow input{width:18px;height:18px}.actions{align-items:center!important}.tablewrap td.actions{vertical-align:middle!important}td,th{line-height:1.25}.tablewrap table td{vertical-align:middle}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar label{display:flex;align-items:center;gap:8px;font-weight:800;color:#dceaff}.toolbar select{min-width:180px}.searchbox{width:min(520px,100%);font-size:16px}@media(max-width:900px){.app{grid-template-columns:1fr}aside{height:auto;position:relative}.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}

/* Correctif V5 : alignement propre des tableaux */
.tablewrap table{border-collapse:separate;border-spacing:0;table-layout:auto;}
.tablewrap th,.tablewrap td{vertical-align:middle!important;line-height:1.25;}
.tablewrap tbody tr{min-height:62px;}
.tablewrap td:nth-child(1){min-width:90px;}
.tablewrap td:nth-child(2){min-width:70px;text-align:left;}
.tablewrap td:nth-child(3){min-width:160px;}
.tablewrap td:nth-child(5){min-width:90px;}
.tablewrap td:nth-child(6){min-width:90px;}
.tablewrap td:nth-child(7){min-width:110px;}
.tablewrap td:nth-child(8){min-width:110px;}
td.actions{display:table-cell!important;min-width:470px!important;white-space:nowrap!important;vertical-align:middle!important;}
td.actions button{display:inline-flex!important;align-items:center!important;justify-content:center!important;height:38px;min-width:78px;margin:3px 5px 3px 0;vertical-align:middle!important;}
div.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-start;}


/* V7 : blocage et simplification réalisation */
.pill.blocked{background:#7f1d1d;color:#fecaca;}
.blockedtxt{margin-top:6px;color:#fecaca;font-size:12px;font-weight:700;white-space:normal;max-width:260px;}
.dangertext{color:#fecaca;background:#7f1d1d;border-radius:999px;padding:4px 10px;display:inline-block;min-width:24px;text-align:center;}
tr.blockedrow{background:rgba(239,68,68,.08);}
tr.blockedrow td{border-bottom-color:#7f1d1d;}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.filterbar label{display:flex;gap:6px;align-items:center}.historyline{display:grid;grid-template-columns:160px 1fr;gap:10px;padding:10px;border-bottom:1px solid var(--line)}


/* V14 : affichage options tableau de bord */
.optionchips{display:flex;gap:6px;flex-wrap:wrap;min-width:160px}
.optionchip{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;background:#1d3b64;color:#dbeafe;font-size:12px;font-weight:800;white-space:nowrap}
.optionchip.none{background:#26374f;color:#9cb2d1}
.vehiclecolor{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.55);box-shadow:0 0 0 3px rgba(255,255,255,.06);vertical-align:middle;margin-right:8px}
.vinbox{display:flex;align-items:center;gap:6px;white-space:nowrap}
tr.vehicleRow td:first-child{border-left:6px solid var(--vehColor,#3b82f6)}
.vehicleBanner{border-left:8px solid var(--vehColor,#3b82f6)!important}
.colorBadge{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:6px 10px;border-radius:999px;background:#102846;color:#dbeafe;font-size:12px;font-weight:800}



/* V31 : gestion SAV */
.savbadge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:#7c2d12;color:#ffedd5;font-size:12px;font-weight:900;white-space:nowrap}
.savcomment{white-space:pre-wrap;background:#081830;border:1px solid var(--line);border-radius:14px;padding:12px;color:#eaf2ff}
.savdone{background:#064e3b;color:#bbf7d0}

</style>
</head>

function ofTable(rows,realMode=false,readOnly=false,detailDelete=false){
  const top=(realMode||readOnly)?'':`<div class="toolbar"><button onclick="openOF()">+ Ajouter OF</button></div><br>`;
  const head = readOnly
    ? `<tr><th>VIN</th><th>Ordre</th><th>OF</th><th>Description</th><th>Temps</th><th>Priorité</th><th>Statut</th><th>Fait par</th>${detailDelete?'<th>Actions</th>':''}</tr>`
    : realMode
      ? `<tr><th>VIN</th><th>Ordre</th><th>OF</th><th>Description</th><th>Temps</th><th>Priorité</th><th>Statut</th><th>Actions</th></tr>`
      : `<tr><th>VIN</th><th>Ordre</th><th>OF</th><th>Description</th><th>Temps</th><th>Priorité</th><th>Statut</th><th>Fait par</th><th>Actions</th></tr>`;
  const body = rows.map(([v,o])=>{
    const st=o.status||'À faire';
    const pillClass = st==='Bloqué' ? 'pill blocked' : 'pill';
    const statusHtml = `<span class="${pillClass}">${st}</span>${o.blockReason?`<div class="blockedtxt">${o.blockReason}</div>`:''}`;

    const normalActions = `<button class="small alt" onclick="openOF('${v.id}','${o.id}')">Modifier</button><button class="small good" onclick="markDone('${v.id}','${o.id}')">Fait</button><button class="small warn" onclick="reopenOF('${v.id}','${o.id}')">Réouvrir</button><button class="small bad" onclick="delOF('${v.id}','${o.id}')">Suppr.</button>`;
    const faitPar = o.doneBy || '-';
    if(readOnly){
      const deleteAction = detailDelete ? `<td class="actions"><button class="small bad" onclick="delOF('${v.id}','${o.id}')">Suppr.</button></td>` : '';
      return `<tr class="${st==='Bloqué'?'blockedrow':''}"><td><b>${v.vin}</b></td><td><b>${o.order}</b></td><td><b>${o.name}</b><div class="muted">${o.category}${o.option ? ' • '+o.option.replace('OPTION ','') : ''}</div></td><td class="desc">${o.desc}</td><td><b>${fmt(o.time)}</b></td><td><b>${o.priority}</b></td><td>${statusHtml}</td><td><b>${faitPar}</b></td>${deleteAction}</tr>`;
    }
    return `<tr class="${st==='Bloqué'?'blockedrow':''}"><td><b>${v.vin}</b></td><td><b>${o.order}</b></td><td><b>${o.name}</b><div class="muted">${o.category}${o.option ? ' • '+o.option.replace('OPTION ','') : ''}</div></td><td class="desc">${o.desc}</td><td><b>${fmt(o.time)}</b></td><td><b>${o.priority}</b></td><td>${statusHtml}</td>${realMode?'':`<td>${faitPar}</td>`}<td class="actions">${realMode?realActions:normalActions}</td></tr>`;
  }).join('');
  return `${top}<div class="tablewrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`
}

function normalizeOrders(v){

function insertOrMoveOF(v,o,targetOrder,isNew){
  targetOrder=Math.max(1, Number(targetOrder)||1);
  if(!isNew){ v.ofs=v.ofs.filter(x=>x.id!==o.id); }
  if(targetOrder>v.ofs.length+1) targetOrder=v.ofs.length+1;
  v.ofs.forEach(x=>{ if((x.order||0)>=targetOrder) x.order=(x.order||0)+1; });

  v.ofs.push(o);
  normalizeOrders(v);
}

function normalizeCat(cat){

  if(c.toLowerCase().includes('prem')||c.toLowerCase().includes('pré')) return 'Prémontage';

async function readExcelFile(file){
  if(!file) return [];
  if(!window.XLSX){ alert('Lecture Excel indisponible : connecte Internet une fois ou dis-moi et je te ferai une version avec import CSV.'); return []; }
  const data=await file.arrayBuffer();
  const wb=XLSX.read(data,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
  return rows.map((r,i)=>{
    const order=parseNum(val(r,['Ordre','Order']));
    const name=String(val(r,['Nom','N°OF','N OF','OF','N°DESSIN','N DESSIN'])||'').trim();
    const desc=String(val(r,['Description','Desc'])||'').trim();
    const time=parseNum(val(r,['Temps X1','Temps','Temps unitaire','Temps X 1']));
    const cat=normalizeCat(val(r,['Filtre','Catégorie','Categorie','Phase']));
    const opt=String(val(r,['Options','Option'])||'').trim();
    const rule=String(val(r,['Règle option','Regle option','Règle','Regle'])||'').trim();
    if(!name && !desc) return null;
    const o={id:name||('OF-'+(i+1)), order:order||i+1, name:name||('OF-'+(i+1)), desc, time, category:cat, priority:catPriority(cat), option:''};
    if(opt.toUpperCase().startsWith('OPTION')) o.option=opt.toUpperCase();
    if(rule.toUpperCase().includes('SUPPRIMER SI')){
      const m=rule.toUpperCase().match(/OPTION\s+.+/);
      o.removeIfOption=m ? m[0].trim() : rule.toUpperCase().replace('SUPPRIMER SI','').trim();
    } else if(opt.toUpperCase().includes('SUPPRIMER SI')){
      const m=opt.toUpperCase().match(/OPTION\s+.+/);
      o.removeIfOption=m ? m[0].trim() : opt.toUpperCase().replace('SUPPRIMER SI','').trim();
      o.option='';
    }
    return o;
  }).filter(Boolean).sort((a,b)=>a.order-b.order);
}

function personName(p){ return typeof p==='string' ? p : (p?.name||''); }
function defaultSchedule(mode='39h'){
  const base={};
  ['Lundi','Mardi','Mercredi','Jeudi','Vendredi'].forEach((d,i)=>{
    base[d]={work:true,amStart:'07:30',amEnd:'12:30',pmStart:'13:30',pmEnd:(mode==='35h'?'15:30':(i===4?'15:30':'16:30'))};
  });
  return base;
}
function normalizePeople(){
  state.people = (state.people||[]).map((p,i)=>{

    p.id = p.id || uid(); p.name = p.name || ('Personne '+(i+1)); p.mode = p.mode || '39h'; p.schedule = p.schedule || defaultSchedule(p.mode); return p;
  });
  if(!state.realPerson && state.people[0]) state.realPerson=personName(state.people[0]);
}
function normalizeAll(){ state.vehicles=state.vehicles||[]; state.history=state.history||[]; state.vehicles.forEach((v,i)=>{ if(!v.color){ const colors=['#3b82f6','#22c55e','#f97316','#a855f7','#ef4444','#14b8a6','#eab308','#ec4899']; v.color=colors[i%colors.length]; } }); normalizePeople(); }
function timeToMin(t){ const [h,m]=(t||'00:00').split(':').map(Number); return (h||0)*60+(m||0); }
function minToDate(d,min){ const x=new Date(d); x.setHours(Math.floor(min/60),min%60,0,0); return x; }
function hoursDaySchedule(p){ const sc=p.schedule||defaultSchedule(p.mode); let total=0; Object.values(sc).forEach(d=>{ if(d.work!==false) total+=Math.max(0,timeToMin(d.amEnd)-timeToMin(d.amStart))+Math.max(0,timeToMin(d.pmEnd)-timeToMin(d.pmStart)); }); return total/60; }
function easterDate(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function frenchHolidays(y){ const e=easterDate(y); return new Set([`${y}-01-01`,`${y}-05-01`,`${y}-05-08`,`${y}-07-14`,`${y}-08-15`,`${y}-11-01`,`${y}-11-11`,`${y}-12-25`,ymd(addDays(e,1)),ymd(addDays(e,39)),ymd(addDays(e,50))]); }
function isHoliday(d){ return frenchHolidays(d.getFullYear()).has(ymd(d)); }
const dayNames=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
function intervalsForDay(p,d){ const name=dayNames[d.getDay()]; const s=(p.schedule||defaultSchedule(p.mode))[name]; if(!s || s.work===false || d.getDay()===0 || d.getDay()===6 || isHoliday(d)) return []; return [[timeToMin(s.amStart),timeToMin(s.amEnd)],[timeToMin(s.pmStart),timeToMin(s.pmEnd)]].filter(a=>a[1]>a[0]); }
function nextWorkStart(p,from){ let d=new Date(from); d.setSeconds(0,0); for(let guard=0;guard<800;guard++){ const ints=intervalsForDay(p,d); const now=d.getHours()*60+d.getMinutes(); for(const [a,b] of ints){ if(now<=a) return minToDate(d,a); if(now>=a && now<b) return d; } d.setDate(d.getDate()+1); d.setHours(0,0,0,0); } return null; }
function addWorkHours(p,start,hours){ let rem=Math.max(0,Number(hours)||0)*60; let d=nextWorkStart(p,start); if(!d) return null; for(let guard=0;guard<2000 && rem>0;guard++){ const ints=intervalsForDay(p,d); const now=d.getHours()*60+d.getMinutes(); let progressed=false; for(const [a,b] of ints){ let cur=Math.max(now,a); if(cur>=b) continue; const use=Math.min(rem,b-cur); rem-=use; d=minToDate(d,cur+use); progressed=true; if(rem<=0) return d; }
    if(!progressed || rem>0){ d.setDate(d.getDate()+1); d.setHours(0,0,0,0); d=nextWorkStart(p,d); if(!d) return null; }
  } return d; }
function estimateVehicles(){ normalizeAll(); const people=state.people.filter(p=>personName(p)); if(!people.length) return {}; const now=new Date(); const slots=people.map(p=>({p,free:nextWorkStart(p,now)||now})); const result={}; const vehicles=[...state.vehicles].sort((a,b)=>(Number(a.priority)||1)-(Number(b.priority)||1)||(a.vin||'').localeCompare(b.vin||'')); for(const v of vehicles){ const ofs=(v.ofs||[]).filter(o=>o.status!=='Fait').sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0)); let last=null; for(const o of ofs){ slots.sort((a,b)=>a.free-b.free); const slot=slots[0]; slot.free=addWorkHours(slot.p,slot.free,Number(o.time)||0) || slot.free; last=slot.free; } result[v.id]=last; } return result; }

function cleanKey(k){return String(k||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function val(row,names){
  const wanted=names.map(cleanKey);
  for(const k of Object.keys(row)){ if(wanted.includes(cleanKey(k))) return row[k]; }
  return '';
}
function parseNum(x){
  if(x===undefined||x===null||x==='') return 0;
  return Number(String(x).replace(',','.').replace(/[^0-9.\-]/g,'')) || 0;
}
function catPriority(cat){
  const c=String(cat||'Autre').toLowerCase();
  if(c.includes('fabric')) return 1;
  if(c.includes('prem')||c.includes('pré')) return 2;
  if(c.includes('pose')) return 3;
  if(c.includes('essai')||c.includes('debug')) return 4;
  return 5;
}
function normalizeCat(cat){
  const c=String(cat||'Autre').trim();
  if(!c) return 'Autre';
  if(c.toLowerCase().includes('fabric')) return 'Fabrication';
  if(c.toLowerCase().includes('prem')||c.toLowerCase().includes('pré')) return 'Prémontage';
  if(c.toLowerCase().includes('pose')) return 'Pose';
  if(c.toLowerCase().includes('essai')||c.toLowerCase().includes('debug')) return 'Essais';
  return c;
}
async function readExcelFile(file){
  if(!file) return [];
  if(!window.XLSX){ alert('Lecture Excel indisponible : connecte Internet une fois ou dis-moi et je te ferai une version avec import CSV.'); return []; }
  const data=await file.arrayBuffer();
  const wb=XLSX.read(data,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
  return rows.map((r,i)=>{
    const order=parseNum(val(r,['Ordre','Order']));
    const name=String(val(r,['Nom','N°OF','N OF','OF','N°DESSIN','N DESSIN'])||'').trim();
    const desc=String(val(r,['Description','Desc'])||'').trim();
    const time=parseNum(val(r,['Temps X1','Temps','Temps unitaire','Temps X 1']));
    const cat=normalizeCat(val(r,['Filtre','Catégorie','Categorie','Phase']));
    const opt=String(val(r,['Options','Option'])||'').trim();
    const rule=String(val(r,['Règle option','Regle option','Règle','Regle'])||'').trim();
    if(!name && !desc) return null;
    const o={id:name||('OF-'+(i+1)), order:order||i+1, name:name||('OF-'+(i+1)), desc, time, category:cat, priority:catPriority(cat), option:''};
    if(opt.toUpperCase().startsWith('OPTION')) o.option=opt.toUpperCase();
    if(rule.toUpperCase().includes('SUPPRIMER SI')){
      const m=rule.toUpperCase().match(/OPTION\s+.+/);
      o.removeIfOption=m ? m[0].trim() : rule.toUpperCase().replace('SUPPRIMER SI','').trim();
    } else if(opt.toUpperCase().includes('SUPPRIMER SI')){
      const m=opt.toUpperCase().match(/OPTION\s+.+/);
      o.removeIfOption=m ? m[0].trim() : opt.toUpperCase().replace('SUPPRIMER SI','').trim();
      o.option='';
    }
    return o;
  }).filter(Boolean).sort((a,b)=>a.order-b.order);
}
async function importExcelBases(){

  if(fm){ const rows=await readExcelFile(fm); if(rows.length){ state.customTemplates.Mercedes=rows; imported.push('Mercedes '+rows.length+' OF'); } }

  closeModal(); save(); alert('Import terminé : '+imported.join(' / '));
}

   les fichiers Excel du dossier sans sélection de l'utilisateur.

state.customTemplates = {Renault:[], Mercedes:[], MAN:[]};
window.excelBasesLoaded = {Renault:false, Mercedes:false, MAN:false};

function templateForBrand(brand){
  const rows = state.customTemplates && state.customTemplates[brand];
  return Array.isArray(rows) ? rows : [];
}
function optionsForBrand(brand){
  return [...new Set(templateForBrand(brand).map(o=>o.option).filter(Boolean))];
}
function buildOFsForVehicle(brand, includeBase, selectedOptions){
  const opts=new Set(selectedOptions||[]);
  return templateForBrand(brand).filter(o=>{
    if(o.removeIfOption && opts.has(o.removeIfOption)) return false;
    if(o.option) return opts.has(o.option);
    return includeBase;
  }).map(o=>({...o,id:uid(),status:'À faire',doneBy:'',doneAt:'',blockReason:''}));
}

async function importExcelBases(){
  const fr=document.getElementById('excelRenault')?.files?.[0];
  const fm=document.getElementById('excelMercedes')?.files?.[0];
  const fman=document.getElementById('excelMan')?.files?.[0];
  let imported=[];
  if(fr){
    const rows=await readExcelFile(fr);
    state.customTemplates.Renault=rows||[];
    window.excelBasesLoaded.Renault=!!rows.length;
    imported.push('Renault : '+rows.length+' OF');
  }
  if(fm){
    const rows=await readExcelFile(fm);
    state.customTemplates.Mercedes=rows||[];
    window.excelBasesLoaded.Mercedes=!!rows.length;
    imported.push('Mercedes : '+rows.length+' OF');
  }
  if(fman){
    const rows=await readExcelFile(fman);
    state.customTemplates.MAN=rows||[];
    window.excelBasesLoaded.MAN=!!rows.length;
    imported.push('MAN : '+rows.length+' OF');
  }
  if(!imported.length){ alert('Aucun fichier Excel sélectionné. Les bases restent vides.'); return; }
  logAction('Bases Excel chargées',null,null,imported.join(' / '));
  closeModal();
  // On sauvegarde les véhicules mis à jour, mais au prochain lancement les bases seront volontairement vides tant que tu ne recharges pas les Excel.
  localStorage.setItem(LS, JSON.stringify({...state, customTemplates:{Renault:[],Mercedes:[],MAN:[]}}));
  render();
  alert('Bases chargées pour les nouveaux véhicules uniquement :\n' + imported.join('\n'));
}

/* ===== V31 SAV : véhicule spécial sans OF ===== */
function isSAV(v){ return !!(v && v.isSAV); }
const _oldDoneOf = doneOf;
doneOf = function(v){
  if(isSAV(v)) return v.savDone ? 1 : 0;
  return (v.ofs||[]).filter(o=>o.status==='Fait').length;
}
const _oldPct = pct;
pct = function(v){
  if(isSAV(v)){
    const est=Number(v.savEstimated)||0, act=Number(v.savActual)||0;
    if(v.savDone) return 100;
    if(!est) return 0;
    return Math.min(100, Math.round((act/est)*100));
  }
  return (v.ofs||[]).length ? Math.round(doneOf(v)/(v.ofs||[]).length*100) : 0;
}
const _oldRemain = remain;
remain = function(v){
  if(isSAV(v)){
    if(v.savDone) return 0;
    return Math.max((Number(v.savEstimated)||0)-(Number(v.savActual)||0),0);
  }
  return (v.ofs||[]).filter(o=>o.status!=='Fait').reduce((s,o)=>s+(Number(o.time)||0),0);
}

  let v=id ? state.vehicles.find(x=>x.id===id) : {id:'',vin:'',brand:'SAV',client:'SDIS 33',type:'SAV',priority:1,color:'#ef4444',savEstimated:1,savActual:0,savComment:'',savDone:false,isSAV:true};
  openModal(id?'Modifier SAV':'Nouveau SAV',`<div class="form">
    <label>VIN / Référence<input id="savVin" value="${v.vin||''}" placeholder="Ex : VIN100 ou SAV-001"></label>
    <label>Client<input id="savClient" value="${v.client||'SDIS 33'}"></label>
    <label>Priorité<input type="number" id="savPrio" value="${v.priority||1}"></label>
    <label>Couleur<input type="color" id="savColor" value="${v.color||'#ef4444'}"></label>
    <label>Temps prévu SAV (h)<input type="number" step="0.01" id="savEstimated" value="${v.savEstimated||0}"></label>
    <label>Temps réel passé (h)<input type="number" step="0.01" id="savActual" value="${v.savActual||0}"></label>
    <label class="checkrow full"><input type="checkbox" id="savDone" ${v.savDone?'checked':''}> <span>SAV terminé</span></label>
    <label class="full">Commentaire / Travail réalisé<textarea id="savComment" placeholder="Explique ce qui a été fait sur le SAV...">${v.savComment||''}</textarea></label>
    <div class="full actions"><button onclick="saveSAV('${id||''}')">Enregistrer</button><button class="alt" onclick="closeModal()">Annuler</button></div>
  </div>`);
}
function saveSAV(id){
  let isNew=!id;
  let v=id?state.vehicles.find(x=>x.id===id):null;
  if(!v){ v={id:uid(),ofs:[],isSAV:true}; state.vehicles.push(v); }
  Object.assign(v,{
    isSAV:true,
    vin:savVin.value.trim() || ('SAV-'+(state.vehicles.length+1)),
    brand:'SAV',
    client:savClient.value || '',
    type:'SAV',
    priority:Number(savPrio.value)||1,
    color:savColor.value || '#ef4444',
    savEstimated:Number(savEstimated.value)||0,
    savActual:Number(savActual.value)||0,
    savComment:savComment.value.trim(),
    savDone:!!savDone.checked,
    ofs:[]
  });
  logAction(isNew?'SAV créé':'SAV modifié',v,null,`Prévu ${fmt(v.savEstimated)} • Réel ${fmt(v.savActual)}`);
  closeModal(); save();
}

  state.customTemplates = state.customTemplates || {Renault:[],Mercedes:[],MAN:[]};

  const fm=document.getElementById('excelMercedes')?.files?.[0];

function personVacations(p){ p.vacations = Array.isArray(p.vacations) ? p.vacations : []; return p.vacations; }
function isPersonOnVacation(p,d){
  const day=ymd(d);
  return personVacations(p).some(v=> day >= v.start && day <= v.end);
}
const _v33OldIntervalsForDay = intervalsForDay;
intervalsForDay = function(p,d){
  if(isPersonOnVacation(p,d)) return [];
  return _v33OldIntervalsForDay(p,d);
}
const _v33OldNormalizePeople = normalizePeople;
normalizePeople = function(){
  _v33OldNormalizePeople();
  state.people.forEach(p=>{ p.vacations = Array.isArray(p.vacations) ? p.vacations : []; });
}

function vacationsHtml(p){

function saveStatusOF(vid,oid){
  const v=state.vehicles.find(x=>x.id===vid); const o=v?.ofs?.find(x=>x.id===oid);
  if(!v || !o) return;
  const newStatus=document.getElementById('statusOF')?.value || 'À faire';
  const person=document.getElementById('statusPerson')?.value || '';
  const reason=(document.getElementById('statusReason')?.value || '').trim();
  o.status=newStatus;
  if(newStatus==='Fait'){
    o.doneBy=person || o.doneBy || '';
    o.doneAt=o.doneAt || new Date().toISOString();
    o.blockReason='';
  }else if(newStatus==='Bloqué'){
    if(!reason){ alert('Écris une raison de blocage.'); return; }
    o.doneBy=person || o.doneBy || '';
    o.doneAt=new Date().toISOString();
    o.blockReason=reason;
  }else{
    o.doneBy='';
    o.doneAt='';
    o.blockReason='';
  }
  logAction('Statut OF modifié',v,o,newStatus+(reason?' : '+reason:''));
  closeModal(); save(); page='detail'; state.detailVin=vid; render();
}

function sameOptionsV36(a,b){ a=[...(a||[])].sort(); b=[...(b||[])].sort(); return JSON.stringify(a)===JSON.stringify(b); }
function syncVehicleOFsV36(v, includeBase, opts){
  const desired=buildOFsForVehicle(v.brand, includeBase, opts);
  const old=v.ofs||[];
  const oldByKey=new Map(old.map(o=>[optKeyV36(o),o]));
  const desiredKeys=new Set(desired.map(optKeyV36));
  const merged=desired.map(n=>{
    const oldO=oldByKey.get(optKeyV36(n));
    if(oldO){
      return {...n, id:oldO.id||n.id, status:oldO.status||'À faire', doneBy:oldO.doneBy||'', doneAt:oldO.doneAt||'', blockReason:oldO.blockReason||''};
    }
    return n;
  });
  // On garde les OF ajoutés à la main, mais on enlève les anciens OF automatiques qui ne correspondent plus aux options.
  old.forEach(o=>{
    if(!desiredKeys.has(optKeyV36(o)) && o.manual===true){ merged.push(o); }
  });
  v.ofs=merged.sort((a,b)=>(a.order||0)-(b.order||0));
}
function saveVehicle(id){
  const isNew=!id;
  let v=id?state.vehicles.find(x=>x.id===id):null;
  if(!v){v={id:uid(),ofs:[]};state.vehicles.push(v)}
  const oldBrand=v.brand;
  const oldBase=v.selectedBase!==false;
  const oldOpts=Array.isArray(v.selectedOptions)?v.selectedOptions.slice():[];
  Object.assign(v,{vin:vin.value.trim(),brand:brand.value,client:client.value,type:type.value,priority:Number(prio.value)||1,color:color.value});
  const hasTemplate=templateForBrand(v.brand).length>0;
  if(hasTemplate){
    const includeBase=!!document.getElementById('createBase')?.checked;
    const opts=selectedOptionValues();
    const changed=isNew || oldBrand!==v.brand || oldBase!==includeBase || !sameOptionsV36(oldOpts,opts);
    v.selectedBase=includeBase;
    v.selectedOptions=opts;
    if(isNew){
      v.ofs=buildOFsForVehicle(v.brand, includeBase, opts);
    }else if(changed){
      const ok=confirm('Tu as modifié la marque / base / options.\n\nMettre à jour automatiquement la liste des OF du camion ?\n\nOK = ajoute/supprime les OF automatiques selon les options, en gardant les statuts des OF identiques.\nAnnuler = garde la liste OF actuelle et modifie seulement les infos/options affichées.');
      if(ok) syncVehicleOFsV36(v, includeBase, opts);
    }
  }else{
    v.selectedBase=false;
    v.selectedOptions=[];
  }
  logAction(isNew?'Véhicule créé':'Véhicule modifié',v,null,'');
  state.realVin=v.id;
  closeModal(); save();
}
// Les OF ajoutés depuis la fiche camion sont marqués comme manuels pour ne pas être supprimés lors d'un changement d'option.
const saveOF_V36_previous = saveOF;
saveOF = function(oid){
  let beforeIds=new Set();
  state.vehicles.forEach(v=>(v.ofs||[]).forEach(o=>beforeIds.add(o.id)));
  saveOF_V36_previous(oid);
  if(!oid){
    state.vehicles.forEach(v=>(v.ofs||[]).forEach(o=>{ if(!beforeIds.has(o.id)) o.manual=true; }));
    save();
  }
};



/* ===== V37 navigateur : sauvegarde / restauration complète pour migrer entre versions ===== */
function backupAllV37(){
  try{
    const payload={
      app:'Suivi OF Simple',
      backupVersion:37,
      exportedAt:new Date().toISOString(),
      state:state,
      basesExcel: (typeof BASES_LS!=='undefined') ? JSON.parse(localStorage.getItem(BASES_LS)||'{}') : {},
      storageKey: (typeof LS!=='undefined') ? LS : ''
    };
    const date=new Date().toISOString().slice(0,10);
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='sauvegarde_suivi_of_'+date+'.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }catch(e){
    alert('Erreur sauvegarde : '+e.message);
  }
}
function restoreAllV37(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='.json,application/json';
  input.onchange=()=>{
    const file=input.files&&input.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        let newState=data.state || data.appState || data;
        if(!newState || !Array.isArray(newState.vehicles)) throw new Error('Ce fichier ne ressemble pas à une sauvegarde Suivi OF.');
        if(!confirm('Restaurer cette sauvegarde ?\n\nAttention : ça remplace les données actuellement affichées par celles du fichier.')) return;
        state=newState;
        if(typeof normalizeAll==='function') normalizeAll();
        localStorage.setItem(LS, JSON.stringify(state));
        if(data.basesExcel && typeof BASES_LS!=='undefined'){
          localStorage.setItem(BASES_LS, JSON.stringify(data.basesExcel));
          if(typeof loadPersistedBases==='function') loadPersistedBases();
        }
        alert('Restauration terminée. Tes véhicules, OF, avancements, personnes, archives et blocages sont récupérés.');
        render();
      }catch(e){
        alert('Impossible de restaurer : '+e.message);
      }
    };
    reader.readAsText(file,'utf-8');
  };
  input.click();
}
// Remplace les anciens boutons/fonctions cachés par la sauvegarde complète.
exportData=backupAllV37;
importData=restoreAllV37;


// Enregistre l'état actuel avec les éventuelles bases déjà chargées dans cette session.
savePersistedBases();

</script>

<!-- ===== V38 WEB : GitHub Pages + Firebase ===== -->
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
(function(){
  const FIREBASE_SAVE_DELAY = 650;
  const FIREBASE_DOC_COLLECTION = 'suivi_of';
  const FIREBASE_DOC_ID = 'donnees_principales';
  let fbReady=false, db=null, auth=null, currentUser=null, applyingRemote=false, saveTimer=null, unsubSnapshot=null;
  let lastRemoteJSON='';

  const css=document.createElement('style');
  css.textContent=`
    .fbTopbar{position:sticky;top:0;z-index:8;margin:-20px -20px 16px -20px;padding:10px 20px;background:#081830;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .fbStatus{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#cfe2ff;font-weight:800;font-size:13px}
    .fbDot{width:10px;height:10px;border-radius:50%;background:#f59e0b;display:inline-block}.fbDot.ok{background:#22c55e}.fbDot.bad{background:#ef4444}
    .fbLogin{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at top,#122743,#071426 60%);display:flex;align-items:center;justify-content:center;padding:20px}
    .fbLogin.hidden{display:none}.fbBox{width:min(420px,94vw);background:#0d1f38;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.45)}
    .fbBox img{max-width:210px;display:block;margin:0 auto 18px}.fbBox h2{margin:0 0 8px;text-align:center}.fbBox p{text-align:center;margin-bottom:18px}.fbBox label{margin:10px 0}.fbBox input{width:100%}.fbError{color:#fecaca;background:#7f1d1d;border-radius:12px;padding:10px;margin-top:12px;display:none;font-weight:800}.fbHelp{font-size:12px;color:#9cb2d1;margin-top:12px;line-height:1.45}
  `;
  document.head.appendChild(css);

  function emailFromLogin(login){
    const v=(login||'').trim();
    if(v.includes('@')) return v;
    return v.toLowerCase()+'@suivi-of.local';
  }
  function getBasesPayload(){
    try{ return (typeof BASES_LS!=='undefined') ? JSON.parse(localStorage.getItem(BASES_LS)||'{}') : {}; }
    catch(e){ return {}; }
  }
  function setBasesPayload(bases){
    try{
      if(bases && typeof BASES_LS!=='undefined'){
        localStorage.setItem(BASES_LS, JSON.stringify(bases));
        if(typeof loadPersistedBases==='function') loadPersistedBases();
      }
    }catch(e){ console.warn('Bases Excel non restaurées',e); }
  }
  function payloadFromCurrent(){
    return {
      app:'Suivi OF Simple Web Firebase',
      version:38,
      updatedAt:new Date().toISOString(),
      state:state,
      basesExcel:getBasesPayload()
    };
  }
  function setStatus(text,kind){
    const el=document.getElementById('fbStatusText');
    const dot=document.getElementById('fbDot');
    if(el) el.textContent=text;
    if(dot){dot.className='fbDot '+(kind||'');}
  }
  function queueFirebaseSave(){
    if(!fbReady || !currentUser || applyingRemote || !db) return;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(pushFirebaseNow,FIREBASE_SAVE_DELAY);
  }
  async function pushFirebaseNow(){
    if(!fbReady || !currentUser || !db) return;
    try{
      const payload=payloadFromCurrent();
      const json=JSON.stringify(payload);
      if(json===lastRemoteJSON) return;
      setStatus('Sauvegarde...', '');
      await db.collection(FIREBASE_DOC_COLLECTION).doc(FIREBASE_DOC_ID).set(payload,{merge:true});
      lastRemoteJSON=json;
      setStatus('Sauvegardé Firebase', 'ok');
    }catch(e){
      console.error(e);
      setStatus('Erreur sauvegarde Firebase', 'bad');
      alert('Erreur sauvegarde Firebase : '+e.message);
    }
  }

  function buildLogin(){
    const overlay=document.createElement('div');
    overlay.id='fbLogin';
    overlay.className='fbLogin';
    overlay.innerHTML=`
      <div class="fbBox">
        <img src="logo_elitt.png" alt="Logo">
        <h2>Connexion Suivi OF</h2>
        <p>Connecte-toi pour charger les camions depuis Firebase.</p>
        <label>Identifiant<input id="fbLoginId" autocomplete="username" value="admin"></label>
        <label>Mot de passe<input id="fbLoginPass" type="password" autocomplete="current-password" placeholder="Mot de passe Firebase"></label>
        <button id="fbLoginBtn" style="width:100%;margin-top:10px">Se connecter</button>
        <div id="fbError" class="fbError"></div>
        <div class="fbHelp">L'identifiant <b>admin</b> correspond au compte Firebase <b>admin@suivi-of.local</b>. Le mot de passe se règle dans Firebase Authentication.</div>
      </div>`;
    document.body.appendChild(overlay);
    const pass=overlay.querySelector('#fbLoginPass');
    overlay.querySelector('#fbLoginBtn').onclick=doLogin;
    pass.addEventListener('keydown',e=>{if(e.key==='Enter') doLogin();});
    setTimeout(()=>pass.focus(),150);
  }
  function showError(msg){
    const el=document.getElementById('fbError');
    if(el){el.textContent=msg;el.style.display='block';}
  }
  async function doLogin(){
    try{
      const id=document.getElementById('fbLoginId').value;
      const pass=document.getElementById('fbLoginPass').value;
      showError(''); document.getElementById('fbError').style.display='none';
      await auth.signInWithEmailAndPassword(emailFromLogin(id), pass);
    }catch(e){
      console.error(e);
      showError('Connexion impossible : '+e.message);
    }
  }
  function buildTopbar(){
    const main=document.querySelector('main'); if(!main || document.getElementById('fbTopbar')) return;
    const div=document.createElement('div');
    div.id='fbTopbar'; div.className='fbTopbar';
    div.innerHTML=`
      <div class="fbStatus"><span id="fbDot" class="fbDot"></span><span id="fbStatusText">Connexion Firebase...</span></div>
      <div class="toolbar"><button class="small alt" id="fbForceSave">Forcer sauvegarde</button><button class="small bad" id="fbLogout">Déconnexion</button></div>`;
    main.prepend(div);
    document.getElementById('fbForceSave').onclick=pushFirebaseNow;
    document.getElementById('fbLogout').onclick=()=>auth.signOut();
  }

  function applyRemotePayload(data){
    if(!data || !data.state || !Array.isArray(data.state.vehicles)) return;
    applyingRemote=true;
    try{
      state=data.state;
      if(typeof normalizeAll==='function') normalizeAll();
      localStorage.setItem(LS,JSON.stringify(state));
      setBasesPayload(data.basesExcel || {});
      lastRemoteJSON=JSON.stringify(payloadFromCurrent());
      render();
      setStatus('Données chargées Firebase', 'ok');
    }finally{ applyingRemote=false; }
  }
  async function startSnapshot(){
    if(unsubSnapshot) unsubSnapshot();
    const ref=db.collection(FIREBASE_DOC_COLLECTION).doc(FIREBASE_DOC_ID);
    unsubSnapshot=ref.onSnapshot(async snap=>{
      if(snap.exists){
        applyRemotePayload(snap.data());
      }else{
        setStatus('Aucune donnée Firebase : restauration ou création possible', '');
      }
    }, err=>{
      console.error(err);
      setStatus('Erreur lecture Firebase', 'bad');
      alert('Erreur lecture Firebase : '+err.message);
    });
  }

  // Remplace la sauvegarde locale par sauvegarde locale + Firebase.
  if(typeof save==='function'){
    const localSave=save;
    save=function(){
      if(applyingRemote){ localStorage.setItem(LS,JSON.stringify(state)); render(); return; }
      localStorage.setItem(LS,JSON.stringify(state));
      queueFirebaseSave();
      render();
    };
  }
  if(typeof savePersistedBases==='function'){
    const oldSaveBases=savePersistedBases;
    savePersistedBases=function(){ oldSaveBases(); queueFirebaseSave(); };
  }
  // Après une restauration JSON, envoyer automatiquement les données restaurées vers Firebase.
  if(typeof restoreAllV37==='function'){
    const oldRestore=restoreAllV37;
    restoreAllV37=function(){ oldRestore(); setTimeout(()=>{queueFirebaseSave(); pushFirebaseNow();},1000); };
    importData=restoreAllV37;
  }

  function initFirebase(){
    buildLogin();
    buildTopbar();
    if(!window.SUIVI_OF_FIREBASE_CONFIG || !window.SUIVI_OF_FIREBASE_CONFIG.apiKey || window.SUIVI_OF_FIREBASE_CONFIG.apiKey.includes('REMPLACER')){
      setStatus('Configuration Firebase manquante', 'bad');
      showError('Il faut remplir le fichier firebase-config.js avec la configuration de ton projet Firebase.');
      return;
    }
    try{
      firebase.initializeApp(window.SUIVI_OF_FIREBASE_CONFIG);
      auth=firebase.auth(); db=firebase.firestore(); fbReady=true;
      auth.onAuthStateChanged(user=>{
        currentUser=user;
        const login=document.getElementById('fbLogin');
        if(user){
          login.classList.add('hidden');
          setStatus('Connecté : '+(user.email||'admin'), 'ok');
          startSnapshot();
        }else{
          if(unsubSnapshot) unsubSnapshot();
          login.classList.remove('hidden');
          setStatus('Déconnecté', '');
        }
      });
    }catch(e){
      console.error(e);
      setStatus('Firebase non initialisé', 'bad');
      showError('Firebase non initialisé : '+e.message);
    }
  }
  window.addEventListener('load', initFirebase);
})();
</script>
</body></html>
