      <div class="fbTopbarActions">
        <button class="small alt notificationBellButtonV1115" id="notificationBellV1115" type="button" title="Notifications">
          <span class="notificationBellIconV1115">🔔</span>
          <span class="notificationBellLabelV1115">Notifications</span>
          <span class="notificationBadgeV1115 empty" id="notificationBadgeV1115">0</span>
        </button>
        <button class="small alt" id="fbForceSave" data-admin-only-v1117>Forcer sauvegarde</button>
        <button class="small alt" id="fbBackupData" data-admin-only-v1117>Sauvegarder données</button>
        <button class="small alt" id="fbRestoreData" data-admin-only-v1117>Restaurer données</button>
        <button class="small bad" id="fbLogout">Déconnexion</button>
      </div>`;
    main.prepend(bar);
    document.getElementById('notificationBellV1115').onclick = event => {
      event.stopPropagation();
      toggleNotificationsV1115();
    };
    document.getElementById('fbForceSave').onclick = async () => {
      try {
        if (window.SUIVI_OF_LOCAL_PENDING_V1118) {
          await flushSharedDataV1121();
        } else {
          await pushFirebaseNow(true);
        }
      } catch (error) {
        console.error(error);
      }
    };
    document.getElementById('fbBackupData').onclick = () => backupAllV37();
    document.getElementById('fbRestoreData').onclick = () => restoreAllV37();
    document.getElementById('fbLogout').onclick = async () => {
      // On lance une tentative immédiate, mais on ne bloque jamais longtemps
      // la déconnexion : le lot reste persistant pour ce compte si nécessaire.
      if (window.SUIVI_OF_LOCAL_PENDING_V1118) {
        try {
          await Promise.race([
            flushSharedDataV1121(),
            new Promise(resolve => setTimeout(resolve, 700))
          ]);
        } catch (error) {
          console.error(error);
        }
      }

      await auth.signOut();
    };

    ensureNotificationPanelV1115();
    renderNotificationBellV1115();
    applyRoleUiV1117();
  }

  // Applique les données métier Firebase sans jamais toucher à la navigation/filtres du navigateur courant.
  function applyRemotePayload(data, force = false){
    if(!data || !data.state || !Array.isArray(data.state.vehicles)) return;

    if(!force && window.SUIVI_OF_LOCAL_PENDING_V1118 === true){
      deferredRemotePayloadV1118 = data;
      setStatus('Sauvegarde locale prioritaire...', '');
      return;
    }

    const localUi = captureLocalUiStateV1120(state);
    const incomingSharedState = sharedStateV1120(data.state);
    const incomingStableJSON = JSON.stringify({
      state: incomingSharedState,
      basesExcel: data.basesExcel || {}
    });

    // Firestore renvoie aussi nos propres écritures. Le cas le plus fréquent est
    // exactement le dernier document déjà confirmé : on l'écarte sans sérialiser
    // une seconde fois tout l'état local.
    if(!force && incomingStableJSON === lastRemoteDataJSON){
      setStatus('Synchronisé Firebase', 'ok');
      return;
    }

    const currentStableJSON = JSON.stringify(stableDataFromCurrent());
    if(!force && incomingStableJSON === currentStableJSON){
      lastRemoteDataJSON = incomingStableJSON;
      setStatus('Synchronisé Firebase', 'ok');
      return;
    }

    applyingRemote = true;
    try{
      state = restoreLocalUiStateV1120(incomingSharedState, localUi);
      invalidateDerivedCachesV1130();
      // Compatibilité : une très ancienne sauvegarde peut encore avoir les bases
      // uniquement dans state.customTemplates.
      setBasesPayload(data.basesExcel || data.state?.customTemplates || {});

      if(typeof migrateStateV10 === 'function') migrateStateV10();
      else if(typeof normalizeAll === 'function') normalizeAll();

      if(typeof applyConnectedPersonV1116 === 'function') {
        applyConnectedPersonV1116();
      }

      persistLocalStateV1130();
      lastRemoteDataJSON = incomingStableJSON;
      render();
      applyVehicleDeepLinkV115();
      setStatus('Données mises à jour Firebase', 'ok');
    }finally{
      applyingRemote = false;
    }
  }

  // Nettoie tout ce qui appartient à l'ancienne session Firebase.
  // Appelé dès que l'utilisateur Firebase change.
  function resetFirebaseAccountSessionV1125(){
    authSessionGenerationV1125 += 1;

    if(unsubscribeSnapshot){
      try { unsubscribeSnapshot(); } catch(error) { console.error(error); }
      unsubscribeSnapshot = null;
    }

    applyingRemote = false;
    lastRemoteDataJSON = '';
    deferredRemotePayloadV1118 = null;

    // Les caches des QR ne doivent pas empêcher le nouveau compte de republier.
    lastPublicPayloadJSONV116.clear();
    lastPublicGlobalJSONV117 = '';

    // Réinitialise seulement timers/requêtes de l'ancienne session.
    // Le lot persistant du compte reste sur le disque jusqu'à confirmation Firebase.
    if(typeof resetGroupedSaveSessionV1125 === 'function'){
      resetGroupedSaveSessionV1125();
    }
  }

  // Démarre l'écoute temps réel du document Firestore partagé.
  async function startSnapshot(){
    if(unsubscribeSnapshot){
      try { unsubscribeSnapshot(); } catch(error) { console.error(error); }
      unsubscribeSnapshot = null;
    }

    const generation = authSessionGenerationV1125;
    const userUid = currentUser?.uid || '';
    const reference = db.collection(FIREBASE_DOC_COLLECTION).doc(FIREBASE_DOC_ID);

    unsubscribeSnapshot = reference.onSnapshot(snapshot => {
      // Ignore tout retour provenant d'une session/utilisateur devenu obsolète.
      if(generation !== authSessionGenerationV1125) return;
      if(!currentUser || currentUser.uid !== userUid) return;

      if(snapshot.exists){
        applyRemotePayload(snapshot.data());
      }else{
        setStatus('Aucune donnée Firebase : restauration ou création possible', '');
      }
    }, error => {
      if(generation !== authSessionGenerationV1125) return;
      console.error(error);
      setStatus('Erreur lecture Firebase', 'bad');
      alert('Erreur lecture Firebase : ' + error.message);
    });
  }


  // Initialise Firebase, l'authentification et l'écoute Firestore lorsque la page est complètement chargée.
  function initFirebase(){
    if(!window.SUIVI_OF_FIREBASE_CONFIG || !window.SUIVI_OF_FIREBASE_CONFIG.apiKey || window.SUIVI_OF_FIREBASE_CONFIG.apiKey.includes('REMPLACER')){
      if(isPublicGlobalRequestV117()) renderPublicGlobalErrorV117('Configuration Firebase manquante.');
      else if(isPublicVinRequestV116()) renderPublicVinErrorV116('Configuration Firebase manquante.');
      else {
        buildLogin();
        buildTopbar();
        setStatus('Configuration Firebase manquante', 'bad');
        showError('Il faut remplir le fichier firebase-config.js avec la configuration de ton projet Firebase.');
      }
      return;
    }
    try{
      firebase.initializeApp(window.SUIVI_OF_FIREBASE_CONFIG);
      db = firebase.firestore();
      fbReady = true;
      if(isPublicGlobalRequestV117()){
        startPublicGlobalSnapshotV117();
        return;
      }
      if(isPublicVinRequestV116()){
        startPublicVinSnapshotV116();
        return;
      }
      buildLogin();
      buildTopbar();
      auth = firebase.auth();
      auth.onAuthStateChanged(user => {
        const previousUid = currentUser?.uid || '';
        const nextUid = user?.uid || '';

        // Un changement de compte doit créer une session Firebase totalement neuve.
        // Cela corrige les sauvegardes qui restaient bloquées jusqu'au F5.
        if(previousUid !== nextUid){
          resetFirebaseAccountSessionV1125();
        }

        currentUser = user;
        const login = document.getElementById('fbLogin');
        if(user){
          const connectedName =
            (typeof window.personFromEmailV1116 === 'function'
              ? window.personFromEmailV1116(user.email || '')
              : '') || '';

          window.SUIVI_OF_CONNECTED_UID_V1126 = user.uid || '';
          window.SUIVI_OF_CONNECTED_EMAIL_V1116 = user.email || '';
          window.SUIVI_OF_CONNECTED_PERSON_V1116 = connectedName;

          if(typeof applyConnectedPersonV1116 === 'function') {
            applyConnectedPersonV1116();
            try { persistLocalStateV1130(); } catch(e) {}
          }

          login.classList.add('hidden');
          setStatus('Connecté Firebase', 'ok');

          const badge = document.getElementById('fbConnectedPersonV1116');
          if(badge){
            const strong = badge.querySelector('strong');
            if(strong) strong.textContent = connectedName || (user.email || 'Utilisateur');
            badge.style.display = 'inline-flex';
          }

          // Le rôle est toujours recalculé à partir de l'adresse du NOUVEAU compte.
          // Plusieurs comptes peuvent être admin simultanément.
          applyRoleUiV1117();

          // Si ce compte possède des modifications non envoyées d'une ancienne
          // fermeture, elles sont restaurées avant l'écoute distante.
          const recoveredPendingV1126 =
            typeof recoverPersistentSaveV1126 === 'function'
              ? recoverPersistentSaveV1126()
              : false;

          if(!recoveredPendingV1126) render();
          startSnapshot();
        }else{
          window.SUIVI_OF_CONNECTED_UID_V1126 = '';
          window.SUIVI_OF_CONNECTED_EMAIL_V1116 = '';
          window.SUIVI_OF_CONNECTED_PERSON_V1116 = '';

          // Le reset a déjà fermé l'écoute et les timers ; on garantit ici
          // qu'aucune référence ancienne ne reste active.
          if(unsubscribeSnapshot){
            try { unsubscribeSnapshot(); } catch(error) { console.error(error); }
            unsubscribeSnapshot = null;
          }

          const badge = document.getElementById('fbConnectedPersonV1116');
          if(badge) badge.style.display = 'none';

          page = 'dash';
          login.classList.remove('hidden');
          setStatus('Déconnecté', '');
          applyRoleUiV1117();
          render();
        }
      });
    }catch(e){
      console.error(e);
      setStatus('Firebase non initialisé', 'bad');
      showError('Firebase non initialisé : ' + e.message);
    }
  }


  // Plus aucun popup de fermeture : le lot est déjà conservé dans localStorage.
  // On tente simplement une synchronisation opportuniste lorsque l'onglet passe
  // en arrière-plan. Si le navigateur coupe la requête, la reprise au prochain
  // login du même compte est automatique.
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'hidden' && window.SUIVI_OF_LOCAL_PENDING_V1118){
      flushSharedDataV1121().catch(() => {});
    }
  });

  window.addEventListener('pagehide', () => {
    if(window.SUIVI_OF_LOCAL_PENDING_V1118){
      flushSharedDataV1121().catch(() => {});
    }
  });

  window.addEventListener('load', initFirebase);
})();

</script>
